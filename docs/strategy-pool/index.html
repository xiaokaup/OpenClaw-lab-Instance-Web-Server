<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>策略池 · 实时数据</title>
<style>
:root{--bg:#080b11;--surface:#111620;--surface2:#161b26;--border:#212836;--fg:#e1e4eb;--muted:#6e7687;--accent:#6366f1;--accent2:#8b5cf6;--green:#22c55e;--yellow:#eab308;--red:#ef4444;--orange:#f97316;--cyan:#06b6d4;--blue:#60a5fa}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:14px/1.5 system-ui,-apple-system,sans-serif;padding:16px;max-width:1600px;margin:0 auto}
a{color:var(--accent)}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px}
.top h1{font-size:16px;display:flex;align-items:center;gap:8px}
.top .sub{font-size:11px;color:var(--muted)}
.top .live{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--green)}
.live .dot{width:8px;height:8px;background:var(--green);border-radius:50%;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.banner{background:#3a1d1d;border:1px solid #5c2a2a;border-radius:8px;padding:10px 14px;font-size:12px;margin-bottom:12px;color:#fca5a5;white-space:pre-wrap}
.banner.warn{background:#3a2a1d;border-color:#5c4a2a;color:#fcd34d}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px;text-align:center}
.stat .val{font-size:20px;font-weight:700;line-height:1.2}
.stat .lbl{font-size:10px;color:var(--muted);margin-top:2px}
.stat.crit .val{color:var(--red)}
.stat.ok .val{color:var(--green)}
.stat.warn .val{color:var(--yellow)}
.tabs{display:flex;gap:8px;margin-bottom:14px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.tab{background:none;border:none;border-bottom:2px solid transparent;color:var(--muted);padding:10px 16px;font-size:13px;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:6px}
.tab:hover{color:var(--fg)}
.tab.active{color:var(--fg);border-bottom-color:var(--accent);font-weight:600}
.tab .tcount{font-size:10px;background:var(--surface2);color:var(--muted);border-radius:10px;padding:1px 8px}
.tab.active .tcount{background:var(--accent);color:#fff}
.sec-title{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:14px 0 8px}
.sec-title b{color:var(--fg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px;cursor:pointer;transition:all .15s;display:flex;flex-direction:column;gap:10px}
.card:hover{border-color:var(--accent);transform:translateY(-1px)}
.card .pkey{font-size:10px;color:var(--muted);font-family:ui-monospace,monospace}
.card .name{font-size:15px;font-weight:700;line-height:1.4}
.badges{display:flex;flex-wrap:wrap;gap:4px}
.badge{font-size:9px;padding:2px 7px;border-radius:10px;border:1px solid var(--border);color:var(--muted);white-space:nowrap}
.badge.active{background:#0d2b16;color:var(--green);border-color:var(--green)}
.badge.p0{background:#3a1d1d;color:var(--red);border-color:var(--red)}
.badge.p1{background:#3a2a1d;color:var(--orange);border-color:var(--orange)}
.badge.p2{background:#1a1f2e;color:var(--blue);border-color:var(--blue)}
.badge.cool{background:#1a1f2e;color:var(--cyan);border-color:var(--cyan)}
.kv{display:flex;flex-wrap:wrap;gap:8px;font-size:10px;color:var(--muted)}
.kv b{color:var(--fg);font-weight:600}
.kv .cell{background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:4px 8px}
.note{font-size:10px;color:var(--muted);line-height:1.5}
.note.red{color:var(--red)}
.note.yellow{color:var(--yellow)}
.empty{grid-column:1/-1;background:var(--surface);border:1px dashed var(--border);border-radius:10px;padding:40px;text-align:center;color:var(--muted)}
.empty .icon{font-size:40px;margin-bottom:8px}
.mono{font-family:ui-monospace,monospace;font-size:11px;color:var(--muted)}
.panelbox{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:12px}
.panelbox h3{font-size:13px;margin-bottom:8px}
table.mini{width:100%;border-collapse:collapse;font-size:11px}
table.mini th{color:var(--muted);text-align:left;padding:4px 8px;border-bottom:1px solid var(--border);font-weight:500}
table.mini td{padding:4px 8px;border-bottom:1px solid var(--border);vertical-align:top}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-start;justify-content:center;z-index:100;padding:30px;overflow-y:auto}
.modal-bg.open{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:12px;max-width:720px;width:100%;padding:20px;margin:auto}
.modal h2{font-size:15px;margin-bottom:10px;line-height:1.5}
.modal .field{margin-bottom:10px;font-size:12px}
.modal .field .k{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.5px;margin-bottom:2px}
.modal .field .v{white-space:pre-wrap;line-height:1.6}
.modal .close{float:right;background:var(--surface2);border:1px solid var(--border);color:var(--fg);border-radius:6px;padding:4px 10px;cursor:pointer;font-size:12px}
</style>
</head>
<body>
<div class="top">
  <div>
    <h1>🧠 策略池 · 实时数据</h1>

</div>

<div class="tab-panel" id="panel-chains">

<div class="tab-panel" id="panel-arms" style="display:none">

<div class="tab-panel" id="panel-hooks" style="display:none"><div id="hooks-body"></div></div>
<div class="tab-panel" id="panel-channels" style="display:none"><div id="channels-body"></div></div>
<div class="tab-panel" id="panel-mbti" style="display:none"><div id="mbti-body"></div></div>
<div class="tab-panel" id="panel-actions" style="display:none"><div id="actions-body"></div></div>
<div class="tab-panel" id="panel-feedback" style="display:none"><div id="feedback-body"></div></div>

<div class="modal-bg" id="modal-bg">
  <div class="modal" id="modal">

    <h2 id="m-title"></h2>
    <div class="kv" id="m-badges"></div>

let DATA = null;

function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function nf(v){return (v==null||v==='')?'—':v}
function fmtPct(x){return (x==null)?'—':(x*100).toFixed(1)+'%'}
function prioBadge(p){const m={P0:'p0',P1:'p1',P2:'p2'};return '<span class="badge '+(m[p]||'')+'">'+esc(p)+'</span>'}

function load(){
  Promise.resolve(__DATA__).then(d=>{
    if(d.error){document.getElementById('banner').innerHTML='<div class="banner">⚠️ '+esc(d.error)+'<br>'+esc(d.path||'')+'</div>';return}
    DATA = d;
    renderStats(d);
    renderChains(d.chains||[]);
    renderArms(d.arms||[]);
    renderHooks(d);
    renderChannels(d);
    renderMbti(d);
    renderActions(d);
    renderFeedback(d);
  }).catch(e=>{
    document.getElementById('banner').innerHTML='<div class="banner">⚠️ 加载失败：'+esc(e.message)+'</div>';
  });
}

function chainCard(c){
  const lk = c.links||{};
  const anchor = c.anchor||{};
  const sig = c.signal||{};
  const p = lk.persona||{};
  const m = lk.motif||{};
  const mt = lk.method||{};
  const ch = lk.channel||{};
  const pd = lk.product||{};
  const need = anchor.unmet_need || null;
  const flow = [
    {icon:'👤',label:'人设',v:p.persona_id,cls:''},
    {icon:'📄',label:'母题',v:m.value,cls:'muted'},
    {icon:'🎨',label:'方式',v:mt.value,cls:''},
    {icon:'📡',label:'渠道',v:ch.value,cls:''},
    {icon:'📦',label:'产品',v:pd.value,cls:''}
  ].map(x=>'<span class="cell"'+(x.v==null?' style="color:var(--muted);opacity:.6"':'')+'>'+x.icon+' '+esc(x.label)+': <b>'+(x.v?esc(x.v):'待填')+'</b></span>').join('');
  return `<div class="card" onclick="openChainModal('${esc(c.chain_id)}')">
    <div class="pkey">${esc(c.chain_id)} · ${esc(c.status||'')}</div>
    <div class="name">📡 ${esc(sig.title||'—')}</div>
    <div class="badges">${prioBadge(c.priority)}${c.budget!=null?'<span class="badge">💰 ¥'+nf(c.budget)+'</span>':''}</div>
    <div class="note ${need?'':'yellow'}">🎯 需求：${need?esc(need):'待析析填充（need_blind）'}</div>
    <div class="kv">${flow}</div>
    ${c.why?'<div class="note">💡 '+esc(c.why)+'</div>':''}
  </div>`;
}

function openChainModal(id){
  const c = (DATA.chains||[]).find(x=>x.chain_id===id);
  if(!c) return;
  document.getElementById('modal-bg').classList.add('open');
  document.getElementById('m-title').textContent = c.chain_id;
  document.getElementById('m-badges').innerHTML = prioBadge(c.priority)+(c.budget!=null?'<span class="badge">💰 ¥'+c.budget+'</span>':'');
  const lk = c.links||{};
  const anchor = c.anchor||{};
  const sig = c.signal||{};
  const rows = [];
  rows.push(['信号', sig.title||'—']);
  rows.push(['需求锚点', anchor.unmet_need || '待析析填充（need_blind）']);
  if(lk.persona) rows.push(['人设', lk.persona.persona_id+'（themes: '+((lk.persona.themes_ref||[]).map(t=>t.type+':'+t.value).join('·'))+'）']);
  if(lk.motif) rows.push(['母题', lk.motif.value||'待填']);
  if(lk.method) rows.push(['方式', lk.method.value||'待填']);
  if(lk.channel) rows.push(['渠道', lk.channel.value||'待填']);
  if(lk.product) rows.push(['产品', lk.product.value||'待填']);
  if(c.why) rows.push(['匹配理由', c.why]);
  if(c.status) rows.push(['状态', c.status]);
  document.getElementById('m-body').innerHTML = rows.map(r=>field(r[0],r[1])).join('');
}

  html += pa.length?('<div class="panelbox">'+pa.map(x=>'<div class="note" style="margin-bottom:6px">'+esc(x)+'</div>').join('')+'</div>'):'<div class="empty"><div class="icon">✅</div>暂无待办</div>';
  html += '<div class="sec-title"><b>🧬 ESC / 裁决项</b> · '+escs.length+' 项</div>';
  html += escs.length?('<div class="panelbox">'+escs.map(x=>'<div class="note '+(String(x).indexOf('🔴')>=0?'red':'')+'" style="margin-bottom:6px">'+esc(x)+'</div>').join('')+'</div>'):'<div class="empty"><div class="icon">✅</div>暂无 ESC</div>';
  document.getElementById('actions-body').innerHTML = html;
}

function renderFeedback(d){
  const fl = d.feedback_loop||{};
  const sig = d.signal_summary||{};
  const sh = d.strategy_health||{};
  let html = '';
  html += '<div class="panelbox"><h3>🔍 信号摘要</h3><div class="kv">';
  html += '<span class="cell">原始 <b>'+nf(sig.total_raw)+'</b></span>';
  html += '<span class="cell">匹配 <b>'+nf(sig.total_matched)+'</b></span>';
  html += '<span class="cell">命中率 <b>'+nf(sig.match_rate)+'</b></span>';
  html += '</div>';
  if(sig.top_signal_flagships) html += '<div class="note" style="margin-top:8px">📡 '+esc(sig.top_signal_flagships)+'</div>';
  if(sig.assessment) html += '<div class="note" style="margin-top:6px">'+esc(sig.assessment)+'</div>';
  html += '</div>';

  html += '<div class="panelbox"><h3>📊 策略健康</h3><div class="kv">';
  html += '<span class="cell">连续批 <b>'+nf(sh.consecutive_batches)+'</b></span>';
  html += '<span class="cell">方向对齐 <b>'+fmtPct(sh.direction_alignment)+'</b></span>';
  html += '<span class="cell">钩子多样 <b>'+nf(sh.hook_diversity)+'</b></span>';
  html += '<span class="cell">HHI <b>'+nf(sh.hhi)+'</b></span>';
  html += '</div>';
  if(sh.direction_alignment_note) html += '<div class="note" style="margin-top:8px">'+esc(sh.direction_alignment_note)+'</div>';
  html += '</div>';

  html += '<div class="sec-title"><b>🔄 反馈闭环（策略匹配执行历史）</b></div>';
  const rows = Object.entries(fl).filter(([k,v])=>k.indexOf('execution')>=0 && typeof v==='object');
  if(rows.length){
    html += '<table class="mini"><tr><th>批次</th><th>策略匹配</th><th>MBTI覆盖</th><th>钩子多样</th><th>ROI</th><th>dissent</th></tr>';
    rows.forEach(([k,v])=>{
      html += '<tr><td class="mono">'+esc(k)+'</td><td>'+esc(nf(v.strategy_match))+'</td><td>'+esc(nf(v.mbti_coverage))+'</td><td>'+esc(nf(v.hook_diversity))+'</td><td>'+esc(nf(v.cash_roi))+'</td><td>'+esc(nf(v.dissent_count!=null?v.dissent_count:'0'))+'</td></tr>';
    });
    html += '</table>';
  }
  if(fl.direction_verdict) html += '<div class="panelbox" style="margin-top:12px"><h3>方向裁决</h3><div class="note">'+esc(fl.direction_verdict)+'</div></div>';
  document.getElementById('feedback-body').innerHTML = html;
}

function field(k,v){return '<div class="field"><div class="k">'+esc(k)+'</div><div class="v">'+esc(v)+'</div></div>'}

function openArm(id){
  const a = (DATA.arms||[]).find(x=>String(x.arm_id)===String(id));
  if(!a) return;
  document.getElementById('modal-bg').classList.add('open');
  document.getElementById('m-title').textContent = '臂 #'+a.arm_id+' · '+(a.personality||'');
  document.getElementById('m-badges').innerHTML = prioBadge(a.priority)+(a.hook?'<span class="badge active">'+esc(a.hook)+'</span>':'')+(a.status?'<span class="badge">'+esc(a.status)+'</span>':'');
  const rows = [];
  if(a.personality) rows.push(['人格', a.personality]);
  if(a.hook) rows.push(['Hook', a.hook]);
  if(a.channel) rows.push(['渠道', a.channel]);
  if(a.budget!=null) rows.push(['预算', '¥'+a.budget]);
  if(a.priority) rows.push(['优先级', a.priority]);
  if(a.status) rows.push(['状态', a.status]);
  if(a.signal) rows.push(['信号', a.signal]);
  if(a.note) rows.push(['说明', a.note]);
  document.getElementById('m-body').innerHTML = rows.map(r=>field(r[0],r[1])).join('');
}

function closeModal(){document.getElementById('modal-bg').classList.remove('open')}
function switchTab(tab){
  ['chains','arms','hooks','channels','mbti','actions','feedback'].forEach(t=>{
    document.getElementById('tab-'+t).classList.toggle('active', tab===t);
    document.getElementById('panel-'+t).style.display = tab===t?'':'none';
  });
}
document.getElementById('modal-bg').addEventListener('click',e=>{if(e.target.id==='modal-bg')closeModal()});
['chains','arms','hooks','channels','mbti','actions','feedback'].forEach(t=>{
  document.getElementById('tab-'+t).addEventListener('click',()=>switchTab(t));
});
load();
</script>
