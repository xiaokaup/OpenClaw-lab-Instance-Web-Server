<html lang="zh-CN">

<meta charset="utf-8">

<title>用户池 · 实时数据</title>
<style>
:root{--bg:#080b11;--surface:#111620;--surface2:#161b26;--border:#212836;--fg:#e1e4eb;--muted:#6e7687;--accent:#6366f1;--accent2:#8b5cf6;--green:#22c55e;--yellow:#eab308;--red:#ef4444;--orange:#f97316;--cyan:#06b6d4;--blue:#60a5fa}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:14px/1.5 system-ui,-apple-system,sans-serif;padding:16px;max-width:1600px;margin:0 auto}
a{color:var(--accent)}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px}
.top h1{font-size:16px;display:flex;align-items:center;gap:8px}
.top .sub{font-size:11px;color:var(--muted)}
.top .live{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--green)}
.live .dot{width:8px;height:8px;background:var(--green);border-radius:50%;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.banner{background:#3a1d1d;border:1px solid #5c2a2a;border-radius:8px;padding:10px 14px;font-size:12px;margin-bottom:12px;color:#fca5a5;white-space:pre-wrap}
.banner.warn{background:#3a2a1d;border-color:#5c4a2a;color:#fcd34d}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px;text-align:center}
.stat .val{font-size:20px;font-weight:700;line-height:1.2}
.stat .lbl{font-size:10px;color:var(--muted);margin-top:2px}
.stat.crit .val{color:var(--red)}
.stat.ok .val{color:var(--green)}
.stat.warn .val{color:var(--yellow)}
.tabs{display:flex;gap:8px;margin-bottom:14px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.tab{background:none;border:none;border-bottom:2px solid transparent;color:var(--muted);padding:10px 16px;font-size:13px;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:6px}
.tab:hover{color:var(--fg)}
.tab.active{color:var(--fg);border-bottom-color:var(--accent);font-weight:600}
.tab .tcount{font-size:10px;background:var(--surface2);color:var(--muted);border-radius:10px;padding:1px 8px}
.tab.active .tcount{background:var(--accent);color:#fff}
.sec-title{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:14px 0 8px}
.sec-title b{color:var(--fg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px;cursor:pointer;transition:all .15s;display:flex;flex-direction:column;gap:10px}
.card:hover{border-color:var(--accent);transform:translateY(-1px)}
.card .pkey{font-size:10px;color:var(--muted);font-family:ui-monospace,monospace}
.card .name{font-size:15px;font-weight:700;line-height:1.4}
.card .big{font-size:20px;font-weight:700;color:var(--accent)}
.badges{display:flex;flex-wrap:wrap;gap:4px}
.badge{font-size:9px;padding:2px 7px;border-radius:10px;border:1px solid var(--border);color:var(--muted);white-space:nowrap}
.badge.active{background:#0d2b16;color:var(--green);border-color:var(--green)}
.badge.off{background:#3a1d1d;color:var(--red);border-color:var(--red)}
.badge.p0{background:#3a1d1d;color:var(--red);border-color:var(--red)}
.badge.p1{background:#3a2a1d;color:var(--orange);border-color:var(--orange)}
.badge.p2{background:#1a1f2e;color:var(--blue);border-color:var(--blue)}
.badge.cool{background:#1a1f2e;color:var(--cyan);border-color:var(--cyan)}
.kv{display:flex;flex-wrap:wrap;gap:8px;font-size:10px;color:var(--muted)}
.kv b{color:var(--fg);font-weight:600}
.kv .cell{background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:4px 8px}
.note{font-size:10px;color:var(--muted);line-height:1.5}
.note.red{color:var(--red)}
.note.yellow{color:var(--yellow)}
.empty{grid-column:1/-1;background:var(--surface);border:1px dashed var(--border);border-radius:10px;padding:40px;text-align:center;color:var(--muted)}
.empty .icon{font-size:40px;margin-bottom:8px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-start;justify-content:center;z-index:100;padding:30px;overflow-y:auto}
.modal-bg.open{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:12px;max-width:720px;width:100%;padding:20px;margin:auto}
.modal h2{font-size:15px;margin-bottom:10px;line-height:1.5}
.modal .field{margin-bottom:10px;font-size:12px}
.modal .field .k{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.5px;margin-bottom:2px}
.modal .field .v{white-space:pre-wrap;line-height:1.6}
.modal .close{float:right;background:var(--surface2);border:1px solid var(--border);color:var(--fg);border-radius:6px;padding:4px 10px;cursor:pointer;font-size:12px}
</style>
</head>

<div class="top">
  <div>

<div class="tab-panel" id="panel-segments"><div id="segments-body"></div></div>
<div class="tab-panel" id="panel-priority" style="display:none">

</div>
<div class="tab-panel" id="panel-recall" style="display:none">

<div class="tab-panel" id="panel-ops" style="display:none">

</div>
<div class="tab-panel" id="panel-hooks" style="display:none">

  <div class="empty" id="hooks-empty" style="display:none"><div class="icon">🧊</div>暂无冷却状态</div>
</div>

<div class="modal-bg" id="modal-bg">

    <button class="close" onclick="closeModal()">✕ 关闭</button>
    <h2 id="m-title"></h2>

</div>

let DATA = null;

function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function nf(v){return (v==null||v==='')?'—':v}
function prioBadge(p){const m={P0:'p0',P1:'p1',P2:'p2',highest:'p0',high:'p1',medium:'p2',low:'p2'};return '<span class="badge '+(m[p]||'')+'">'+esc(p)+'</span>'}

function load(){
  Promise.resolve(__DATA__).then(d=>{
    if(d.error){document.getElementById('banner').innerHTML='<div class="banner">⚠️ '+esc(d.error)+'<br>'+esc(d.path||'')+'</div>';return}
    DATA = d;
    renderStats(d);
    renderSegments(d);
    renderPriority(d.priority_targets||[]);
    renderRecall(d.recall_candidates||[]);
    renderOps(d.active_operations||[]);
    renderHooks(d.hook_cooldown_status||{});
  }).catch(e=>{
    document.getElementById('banner').innerHTML='<div class="banner">⚠️ 加载失败：'+esc(e.message)+'</div>';
  });
}

function renderStats(d){
  const st = d.segment_totals||{};
  const bs = d.budget_summary||{};
  document.getElementById('segments-count').textContent = '('+(d.segments_flat||[]).length+' 人)';
  document.getElementById('priority-count').textContent = '('+(d.priority_targets||[]).length+')';
  document.getElementById('recall-count').textContent = '('+(d.recall_candidates||[]).length+')';
  document.getElementById('ops-count').textContent = '('+(d.active_operations||[]).length+')';
  document.getElementById('hooks-count').textContent = '('+Object.keys(d.hook_cooldown_status||{}).length+')';
  const nps = d.nps_proxy;
  const trend = (d.nps_trend||[]);
  const trendStr = trend.length?('→'+trend[trend.length-1]):'';
  document.getElementById('stats').innerHTML = `
    <div class="stat"><div class="val">${nf(d.total_users)}</div><div class="lbl">总用户数</div></div>
    <div class="stat ok"><div class="val">${nf(st.active)}</div><div class="lbl">活跃分群</div></div>
    <div class="stat warn"><div class="val">${nf(st.cooling)}</div><div class="lbl">冷却中</div></div>
    <div class="stat"><div class="val">${nf(st.dormant)}</div><div class="lbl">休眠</div></div>
    <div class="stat"><div class="val">${nf(st.lost)}</div><div class="lbl">流失</div></div>
    <div class="stat ok"><div class="val">${nf(nps)}${trendStr}</div><div class="lbl">NPS（代理）</div></div>
    <div class="stat ${(d.fatigue_blacklist||[]).length?'crit':''}"><div class="val">${(d.fatigue_blacklist||[]).length}</div><div class="lbl">疲劳黑名单</div></div>
    <div class="stat ${(d.cooling_blacklist||[]).length?'crit':''}"><div class="val">${(d.cooling_blacklist||[]).length}</div><div class="lbl">冷却黑名单</div></div>
    <div class="stat"><div class="val" style="font-size:12px">¥${nf(bs.user_ops_remaining)}</div><div class="lbl">用户桶余额</div></div>
  `;
  document.getElementById('live-info').textContent = nf(d.total_users)+' 用户 · '+(d.operator||'');
  const b = document.getElementById('banner');
  const parts=[];
  if(d.system_status) parts.push(d.system_status);
  if((d.fatigue_blacklist||[]).length) parts.push('🔴 疲劳黑名单 '+d.fatigue_blacklist.length+' 人'+(d.fatigue_blacklist_reason?'：'+d.fatigue_blacklist_reason:''));
  if((d.cooling_blacklist||[]).length) parts.push('🟠 冷却黑名单 '+d.cooling_blacklist.length+' 人');
  if(parts.length) b.innerHTML='<div class="banner">'+parts.map(esc).join('\n')+'</div>'; else b.innerHTML='';
}

    const lst = segs[g]||[];
    const tot = (d.segment_totals||{})[g]||0;
    html += '<div class="sec-title"><b style="color:'+GROUP_COLOR[g]+'">'+GROUP_LABEL[g]+'</b> · '+lst.length+' 型 · '+tot+' 人</div>';
    if(!lst.length){ html += '<div class="empty" style="grid-column:1/-1"><div class="icon">👥</div>暂无</div>'; return; }
    html += '<div class="grid">'+lst.map(p=>segCard(p, g)).join('')+'</div>';
  });
  document.getElementById('segments-body').innerHTML = html;
}

function segCard(p, g){
  const elig = p.eligible===true;
  return `<div class="card" onclick="openSegModal('${esc(p.personality)}','${esc(g)}')">
    <div class="pkey">${esc(p.personality)} · ${esc(g)}</div>
    <div class="name">${esc(p.personality)}</div>
    <div class="big">${nf(p.count)} <span style="font-size:11px;color:var(--muted)">人</span></div>
    <div class="badges">
      <span class="badge ${elig?'active':'off'}">${elig?'● 可触达':'○ 不可触达'}</span>
      ${p.avg_trust!=null?'<span class="badge">信任 <b>'+nf(p.avg_trust)+'</b></span>':''}
    </div>
    ${p.note?'<div class="note">'+esc(p.note)+'</div>':''}
  </div>`;
}

function renderPriority(list){
  const grid = document.getElementById('priority-grid');
  document.getElementById('priority-empty').style.display = list.length?'none':'block';
  if(!list.length){grid.innerHTML='';return}
  grid.innerHTML = list.map(p=>{
    const meta=[];
    if(p.hook) meta.push('<span class="cell">🪝 <b>'+esc(p.hook)+'</b></span>');
    if(p.channel) meta.push('<span class="cell">📡 '+esc(p.channel)+'</span>');
    if(p.cost!=null) meta.push('<span class="cell">💰 ¥'+nf(p.cost)+'</span>');
    if(p.scheduled_batch) meta.push('<span class="cell">📅 '+esc(p.scheduled_batch)+'</span>');
    if(p.status) meta.push('<span class="cell">'+esc(p.status)+'</span>');
    return `<div class="card" onclick="openItemModal('${esc(p.personality||'')}','priority')">
      <div class="pkey">${esc(p.personality)}</div>
      <div class="name">${esc(p.personality)}</div>
      <div class="big">${nf(p.count)} <span style="font-size:11px;color:var(--muted)">人</span></div>
      <div class="badges">${prioBadge(p.priority)}${p.status==='ready'?'<span class="badge active">就绪</span>':p.status==='standby'?'<span class="badge cool">待命</span>':''}</div>
      ${meta.length?'<div class="kv">'+meta.join('')+'</div>':''}
      ${p.signal?'<div class="note">📡 '+esc(p.signal)+'</div>':''}
      ${p.reason?'<div class="note">'+esc(p.reason)+'</div>':''}
    </div>`;
  }).join('');
}

function renderRecall(list){
  const grid = document.getElementById('recall-grid');
  document.getElementById('recall-empty').style.display = list.length?'none':'block';
  if(!list.length){grid.innerHTML='';return}
  grid.innerHTML = list.map(p=>{
    const meta=[];
    if(p.avg_days_inactive!=null) meta.push('<span class="cell">🕐 '+nf(p.avg_days_inactive)+' 天未触</span>');
    if(p.hook) meta.push('<span class="cell">🪝 <b>'+esc(p.hook)+'</b></span>');
    return `<div class="card" onclick="openItemModal('${esc(p.segment||'')}','recall')">
      <div class="pkey">${esc(p.segment)}</div>
      <div class="name">${esc(p.segment)}</div>
      <div class="big">${nf(p.count)} <span style="font-size:11px;color:var(--muted)">人</span></div>
      <div class="badges">${prioBadge(p.priority)}</div>
      ${meta.length?'<div class="kv">'+meta.join('')+'</div>':''}
      ${p.expected_awakening?'<div class="note">✨ '+esc(p.expected_awakening)+'</div>':''}
      ${p.note?'<div class="note">'+esc(p.note)+'</div>':''}
    </div>`;
  }).join('');
}

function renderOps(list){
  const grid = document.getElementById('ops-grid');
  document.getElementById('ops-empty').style.display = list.length?'none':'block';
  if(!list.length){grid.innerHTML='';return}
  grid.innerHTML = list.map(p=>{
    const meta=[];
    if(p.type) meta.push('<span class="cell">'+esc(p.type)+'</span>');
    if(p.hook) meta.push('<span class="cell">🪝 <b>'+esc(p.hook)+'</b></span>');
    if(p.cost!=null) meta.push('<span class="cell">💰 ¥'+nf(p.cost)+'</span>');
    if(p.scheduled_batch) meta.push('<span class="cell">📅 '+esc(p.scheduled_batch)+'</span>');
    return `<div class="card" onclick="openItemModal('${esc(p.target||p.type||'')}','ops')">
      <div class="pkey">${esc(p.type)} · ${esc(p.status||'')}</div>
      <div class="name">${esc(p.target||p.method||'')}</div>
      <div class="badges">${prioBadge(p.priority)}${p.status?('<span class="badge '+(p.status.indexOf('ready')>=0||p.status.indexOf('queued')>=0?'active':p.status==='done'?'':'cool')+'">'+esc(p.status)+'</span>'):''}</div>
      ${meta.length?'<div class="kv">'+meta.join('')+'</div>':''}
      ${p.method?'<div class="note">'+esc(p.method)+'</div>':''}
      ${p.expected_effect?'<div class="note">✨ '+esc(p.expected_effect)+'</div>':''}
      ${p.note?'<div class="note yellow">'+esc(p.note)+'</div>':''}
    </div>`;
  }).join('');
}

function renderHooks(hooks){
  const grid = document.getElementById('hooks-grid');
  const keys = Object.keys(hooks);
  document.getElementById('hooks-empty').style.display = keys.length?'none':'block';
  if(!keys.length){grid.innerHTML='';return}
  grid.innerHTML = keys.map(k=>{
    const h = hooks[k]||{};
    const ok = String(h.status||'').indexOf('可用')>=0 || String(h.status||'').indexOf('恢复')>=0;
    return `<div class="card" style="cursor:default">
      <div class="pkey">${esc(k)}</div>
      <div class="name">🪝 ${esc(k)}</div>
      <div class="badges"><span class="badge ${ok?'active':'off'}">${esc(h.status||'—')}</span></div>
      <div class="kv">
        ${h.last_used?'<span class="cell">上次 '+esc(h.last_used)+'</span>':''}
        ${h.consecutive!=null?'<span class="cell">连续 '+nf(h.consecutive)+'/'+nf(h.max_allowed)+'</span>':''}
      </div>
      ${h.note?'<div class="note">'+esc(h.note)+'</div>':''}
    </div>`;
  }).join('');
}

function field(k,v){return '<div class="field"><div class="k">'+esc(k)+'</div><div class="v">'+esc(v)+'</div></div>'}

function openSegModal(personality, group){
  const seg = (DATA.segments||{})[group]||[];
  const p = seg.find(x=>x.personality===personality);
  if(!p) return;
  document.getElementById('modal-bg').classList.add('open');
  document.getElementById('m-title').textContent = personality+' · '+GROUP_LABEL[group];
  document.getElementById('m-badges').innerHTML = '<span class="badge '+(p.eligible?'active':'off')+'">'+(p.eligible?'可触达':'不可触达')+'</span>'+(p.avg_trust!=null?'<span class="badge">信任 '+p.avg_trust+'</span>':'');
  let html = field('人数', p.count+' 人');
  if(p.avg_trust!=null) html += field('平均信任', p.avg_trust);
  if(p.eligible!=null) html += field('可触达', p.eligible);
  if(p.note) html += field('说明', p.note);
  document.getElementById('m-body').innerHTML = html;
}

function openItemModal(key, kind){
  const map = {priority:'priority_targets', recall:'recall_candidates', ops:'active_operations'};
  const list = DATA[map[kind]]||[];
  let p;
  if(kind==='priority') p = list.find(x=>x.personality===key);
  else if(kind==='recall') p = list.find(x=>x.segment===key);
  else p = list.find(x=>(x.target||x.type)===key);
  if(!p) return;
  document.getElementById('modal-bg').classList.add('open');
  document.getElementById('m-title').textContent = key;
  document.getElementById('m-badges').innerHTML = prioBadge(p.priority)+(p.status?'<span class="badge">'+esc(p.status)+'</span>':'');
  const rows = [];
  if(p.count!=null) rows.push(['人数', p.count+' 人']);
  if(p.hook) rows.push(['Hook', p.hook]);
  if(p.channel) rows.push(['渠道', p.channel]);
  if(p.cost!=null) rows.push(['成本', '¥'+p.cost]);
  if(p.scheduled_batch) rows.push(['计划批次', p.scheduled_batch]);
  if(p.avg_days_inactive!=null) rows.push(['平均未触达', p.avg_days_inactive+' 天']);
  if(p.type) rows.push(['类型', p.type]);
  if(p.signal) rows.push(['信号', p.signal]);
  if(p.method) rows.push(['方法', p.method]);
  if(p.reason) rows.push(['原因', p.reason]);
  if(p.expected_awakening) rows.push(['预期唤醒', p.expected_awakening]);
  if(p.expected_effect) rows.push(['预期效果', p.expected_effect]);
  if(p.measurement) rows.push(['测量', p.measurement]);
  if(p.budget_source) rows.push(['预算来源', p.budget_source]);
  if(p.dependency) rows.push(['依赖', p.dependency]);
  if(p.source) rows.push(['来源', p.source]);
  if(p.note) rows.push(['说明', p.note]);
  document.getElementById('m-body').innerHTML = rows.map(r=>field(r[0],r[1])).join('');
}

function closeModal(){document.getElementById('modal-bg').classList.remove('open')}
function switchTab(tab){
  ['segments','priority','recall','ops','hooks'].forEach(t=>{
    document.getElementById('tab-'+t).classList.toggle('active', tab===t);
    document.getElementById('panel-'+t).style.display = tab===t?'':'none';
  });
}
document.getElementById('modal-bg').addEventListener('click',e=>{if(e.target.id==='modal-bg')closeModal()});
document.getElementById('tab-segments').addEventListener('click',()=>switchTab('segments'));
document.getElementById('tab-priority').addEventListener('click',()=>switchTab('priority'));
document.getElementById('tab-recall').addEventListener('click',()=>switchTab('recall'));
document.getElementById('tab-ops').addEventListener('click',()=>switchTab('ops'));
document.getElementById('tab-hooks').addEventListener('click',()=>switchTab('hooks'));
load();
</script>
</body>
</html>
