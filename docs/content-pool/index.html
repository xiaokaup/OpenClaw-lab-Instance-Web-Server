AI趋势 #商业思维", "cta": "你押注的下一个趋势是什么？评论区聊聊，看谁看得最准。"}}}}, "D21-B7-ENFJ-1": {"vessel": {"version": "1.0", "type": "content-vessel", "id": "D21-B7-ENFJ-1", "source": {"agent": "设设", "subsystem": "内容Spoke-1", "batch": "D21-B7"}, "created_at": "2026-08-16T08:30:00+08:00", "freshness_ttl_hours": 72, "priority": "p1"}, "content": {"id": "D21-B7-ENFJ-1", "title": "许昌胖东来附近，一个老板流泪说\"舍不得\"——ENFJ没有把这当成一条商业新闻。她的Fe系统在0.3秒里听懂了这场眼泪真正的分量：人不会为一家公司哭，人会为\"被当成一个人对待\"而哭", "hook": "情感共鸣", "targets": ["ENFJ"], "channel": "小红书", "quality": 8.9, "budget": 25, "status": "active", "usage_count": 0, "priority": "P1", "consecutive_hook": 1, "direction_hook": "情感共鸣", "arm_id": 6, "batch_num": 1, "signals": ["许昌胖东来附近老板流泪说舍不得(7分·社会情绪)"], "paradigm": "情感共鸣·Fe-Ni真诚稀缺双弦型(ENFJ轮出首触·社会证明batch2达上限→轮出情感共鸣·Fe共情:人被当成一个人对待而哭+Ni洞察:真诚是最稀缺竞争力·胖东来流泪7分旗舰·Fe-dom弹性验证)", "role": "P1·ENFJ情感共鸣轮出首触·Fe-Ni真诚稀缺双弦·社会证明轮出接棒·胖东来流泪7旗舰", "direction_compliance": "D21-B7 direction-vessel arm6 100%对齐", "flagship": false, "attachment_theory_resonance": false, "note": "🆕 社会证明batch2达上限→轮出情感共鸣首触·Fe共情(胖东来流泪7)·真诚稀缺母题·D21-B8评估续触batch2", "brief": {"pain_point": "ENFJ的Fe对'真诚/被当作人'极度渴求，也最容易被'真诚稀缺'的时代刺痛；胖东来流泪正是'真诚被看见'的稀缺样本。", "hook_first3": "'许昌胖东来附近，一个老板流泪说舍不得'点事件；'很多人不理解：一家超市而已'摆大众反应；'但我想说：人从来不会为公司哭'反转立论。", "emotion_curve": "好奇(为什么哭) → 被戳中(被当人对待的稀缺) → 共情(哭的是被好好对待过的自己) → 温暖(愿我们都能被认真对待)。", "structure": ["钩子·流泪事件", "反转·人不会为公司哭", "洞察·稀缺的是被当人对待", "升华·哭的是自己", "CTA·被认真对待的瞬间"], "differentiation": "别人写胖东来讲'良心企业/服务好'，我们讲'被当人对待的稀缺'；Fe视角落到情感而非消费测评。"}, "post": {"cover_title": "人不会为公司哭，只为被当人对待", "body": "许昌，胖东来附近。\n\n一个老板在镜头前红了眼眶，\n反复说：舍不得。\n\n很多人不理解：\n一家超市而已，至于吗？\n\n但我想说——\n人，从来不会为一家公司哭。🏪\n\n人会哭，\n是因为在某个地方，\n第一次被当成「一个人」对待。\n\n不是「消费者」，\n不是「业绩」，\n是「你」。\n\n你买到的每样东西，\n都有人替你把关；\n你提的每个意见，\n都有人认真听完。\n\n这种「被认真对待」的感觉，\n在这个把人当流量的时代，\n太稀缺了。💧\n\n所以那个老板哭的，\n不是一家店，\n是被好好对待过的自己。\n\n愿我们都能遇到，\n把你当「人」看的那个地方、那个人。\n\n💬 你有没有过「被认真对待」的瞬间？\n评论区，说给我听。", "hashtags": ["#情感", "#MBTI", "#ENFJ", "#胖东来", "#被认真对待"], "cover_visual": "暖色调，超市暖光下的货架/人背影，配大字\"人不会为公司哭，只为被当人对待\"；治愈、烟火气、留白。", " ": "别人写「大器晚成/励志鸡汤/逆天改命」，我们写Fi自我觉醒——「不设限不是鸡汤，是每一次都不对自己说『太晚』」；正面励志、绝不judge年龄与人生节奏。"}, "post": {"cover_title": "38岁考大学，39岁年级第一", "body": "38岁，他去考了大学。🎓\n\n身边很多人不理解：\n「这个年纪了，折腾什么？」\n\n39岁，\n他考了年级第一。\n\n一年时间，\n从「门外汉」到「第一名」，\n他不是天才，\n只是比任何人都想证明一件事——\n\n人生，从来没有太晚的开始。\n\n我们总爱给自己设限：\n「25岁该稳定了」\n「30岁该结婚了」\n「35岁来不及了」……\n\n但这些「该」，\n是谁定的呢？\n\nENFP知道，\n真正的自我觉醒，\n不是等到万事俱备，\n而是永远不对自己说\n「太晚了」。\n\n38岁去考大学，\n不是任性，\n是他忠于自己。\n39岁考第一，\n不是奇迹，\n是他从未放弃自己。💛\n\n年龄只是一个数字，\n它拦不住真正想活出自己的人。\n\n别让「太晚了」，\n成为你唯一的人生答案。\n\n💬 你有没有一个\n「别人都说太晚了，但你还是去做了」的决定？\n评论区，说给我听。", "hashtags": ["#自我觉醒", "#MBTI", "#ENFP", "#人生不设限", "#自我成长"], "cover_visual": "中年男人伏案读书的背影 + 成绩单「年级第一」特写，暖金色调、坚定不煽情，大字『人生没有太晚』", "cta": "你有没有一个「别人都说太晚了，但你还是去做了」的决定？评论区讲给我听。", "post_time": "12:00-13:00（午间励志情绪高峰）", "avoid": "不贩卖年龄焦虑、不贬低年轻/早慧路径、不渲染「逆天改命」夸张情绪；聚焦「不设限」的自我觉醒正面能量"}, "post_spec_version": "v2.0"}}, "D21-B16-ISTJ-1": {"vessel": {"version": "1.0", "type": "content-vessel", "id": "D21-B16-ISTJ-1", "source": {"agent": "设设", "subsystem": "内容Spoke-1", "batch": "D21-B16"}, "created_at": "2026-08-25T08:30:00+08:00", "freshness_ttl_hours": 72, "priority": "p1", "dependencies": [{"vessel_type": "direction-vessel", "vessel_id": "direction-vessel-2026-08-25-0815"}, {"vessel_type": "strategy-pool", "vessel_id": "strategy-pool-2026-08-25-0815"}, {"vessel_type": "signal-pool", "vessel_id": "signal-pool-2026-08-25-0815"}]}, "content": {"id": "D21-B16-ISTJ-1", "title": "帮扶老人的店主，官方确认不担责——ISTJ的Si没有把这当成一条孤立的新闻。它看到的是社会运行最朴素的逻辑：好人好事不该被辜负，公道是这个社会最硬的秩序", "hook": "社会证明", "targets": ["ISTJ"], "channel": "小红书", "quality": 8.7, "budget": 25, "status": "active", "usage_count": 0, "priority": "P1", "consecutive_hook": 1, "direction_hook": "社会证明", "arm_id": 6, "batch_num": 1, "signals": ["官方确认帮扶老人店主不担责(7分·社会证明·社会道德·公道·heat90)"], "paradigm": "社会证明·Si秩序/公道闭环型(ISTJ社会证明batch1换hook·官方确认不担责7分·Si秩序:公道=社会底线·社会证明闭环叙事·严禁道德绑架·用公道/秩序角度)", "role": "P1·ISTJ社会证明batch1换hook(官方确认不担责7·公道·好人好事不被辜负)·小红书Si位·方向船key_decision「ISTJ社会证明(官方确认不担责7·好奇心batch2达上限换hook·SJ象限)」", "direction_complia 年龄身份·审美)"], "paradigm": "身份认同·Fi-Ne代际身份谈判解构型(INFP rest2批后恢复首触·依恋母题7分旗舰达标·Fi代际身份:两代人同时当妈=人生顺序失效版本开放·'成为母亲'不再吞掉'成为自己'·Ne对照:满江叔圈天菜=年龄从贬值倒计时变沉淀溢价·两则=代际时间线谈判+审美权谈判·疲劳3.0→2.5回落)", "role": "P0·INFP身份认同batch1·🆕rest2批后恢复首触·content_sync_rule点名需fresh(非复用旧INFP内容)·依恋母题7分旗舰达标·小红书Fi基线", "direction_compliance": "D21-B8 direction-vessel arm2 100%对齐·INFP×身份认同×小红书·batch1·恢复首触fresh", "flagship": true, "attachment_theory_resonance": true, "note": "🟢 fresh·双恢复首触核心臂·依恋母题旗舰(代际家庭7分)·Fi-Ne代际身份谈判·q9.0·B9可续batch2(需身份认同信号≥3)", "post": {"cover_title": "两代人同时当妈，人生顺序失效了", "body": "00后女儿和80后妈妈，前后脚生娃。\n有人觉得\"乱了辈分\"。\n\n但 INFP 看到的是另一件事：\n人生的顺序，本来就可以被重新排列。🔄\n\n\"到了什么年纪就该做什么事\"，\n这句话困住了太多人。\n\n可这一对母女告诉我们：\n\"成为母亲\"和\"成为自己\"，\n从来不冲突，也可以同时发生。\n\n年龄不是倒计时，\n是你可以随时重新出发的起点。\n\n别被\"应该\"绑架，\n你的人生，可以有自己的时区。⏰\n\n你有没有过\"人生顺序被打乱\"却反而更清醒的时刻？", "hashtags": ["#INFP", "#身份认同", "#代际", "#母亲", "#女性成长"], "cover_visual": "柔和粉白调，两代女性并肩的画面感 + 大字「两代人同时当妈，人生顺序失效了」", "cta": "你有没有过「人生顺序被打乱」却反而更清醒的时刻？", "post_time": "20:00-22:00（女性成长类晚间高峰）", "avoid": "不渲染「乱了辈分」的猎奇，不评判生育选择，聚焦「打破社会时钟」"}, "brief": {"pain_point": "INFP 在「社会时钟」和「自我节奏」之间挣扎，怕成为母亲/进入某角色就失去自己", "hook_first3": "母女前后脚生娃热点切入→「乱了辈分」引争议→INFP看到「顺序可以重排」反转", "emotion_curve": "新奇(前后脚生娃)→争议(乱了辈分)→反转(顺序可重排)→释然(成为母亲≠失去自己)→自由(自己的时区)", "structure": ["热点切入", "争议制造", "反转(顺序重排)", "核心(母亲vs自己)", "升华(时区自由)", "CTA"], "differentiation": "不写「母女同龄」的猎奇，写「社会时钟可以被打破」，从代际趣闻升华到身份自主"}}}, "D20-B8-INFJ-1": {"vessel": {"version": "1.0", "type": "content-vessel", "id": "D20-B8-INFJ-1", "source": {"agent": "设设", "subsystem": "内容创作·Spoke-1", "batch": "D20-B8"}, "created_at": "2026-08-10T08:30:00+08:00", "freshness_ttl_hours": 72, "priority": "p1"}, "payload": {"arm_id": 5, "title": "当商场挂出钱学森的巨幅海报时，INFJ看到的不只是致敬——是一个民族终于学会了把最安静的名字，放在最喧闹的地方", "hook": "身份认同", "direction_hook": "身份认同", "targets": ["INFJ"], "channel": "小红书", "quality": 8.8, "budget": 25, "priority": "P1", "consecutive_hook_count": 1, "signal_primary": "sig-20260809-001", "signal_title": "选专业别因'热门'窄化'热爱'", "signal_score": 10, "signal_secondary": "钱学森巨幅海报", "signal_secondary_score": 7, "paradigm": "Ni-Fe学术精神传承·文明自觉", "paradigm_detail": "Ni趋势识别:钱学森海报出现=流量时代新陈代谢·与选专业热搜同源:'想成为创造价值的人'·Fe代际感知:沉默者的被记住=文明必须给出的东西·INFJ身份认同核心:'我正在成为的那个人值得这个世界等待吗?'·信任8.13高基线·小红书精英叙事·INFP/ISTJ对比视角", "cta": "L1深度人格报告·¥9.9", "estimated_cvr": 0.06, "status": "active", "usage_count": 0}, "content": {"post": {"cover_title": "最安静的名字，值得最喧闹的位置", "body": "商场里，钱学森的巨幅海报挂起来了。\n\nINFJ 站了很久。\n\n她看到的不只是「致敬一位科学家」。\n\n她看到的是一个民族，终于学会了一件事——\n把最安静的名字，放在最喧闹的地方。\n\n这很难。因为喧闹的地方，从来都属于会吆喝的人。\n\n而科学家，恰恰是最不会吆喝的那群人。\n\n他们把自己埋进公式和实验室，一埋就是一辈子。\n\nINFJ 懂的。\n\n这个世界需要热闹，但更需要有人在热闹之外，替所有人守住那条「对的方向」。\n\n当安静开始被看见，说明这个时代，开始懂得什么是真正重要的东西了。", "hashtags": ["#INFJ", "#钱学森", "#致敬科学家", "#价值观", "#安静的力量"], "cta": "你心里有没有一个「值得被更多人看见」的安静的名字？评论区留给他。", "cover_visual": "商场巨幅海报仰拍视角，海报上科学家的剪影 + 下方人群，暖黄与深蓝对比", "post_time": "晚 19:00-20:30", "avoid": "不涉及敏感历史细节、不用「民粹」叙事、避免过度政治化表达"}, "brief": {"pain_point": "INFJ 对「喧嚣压过价值」的隐忧与期待", "hook_first3": "「商场挂出钱学森海报」具体场景切入，快速建立视觉画面", "emotion_curve": "场景→凝视→洞察→释然", "structure": ["具体场景", "INFJ 的看见", "安静与喧闹的对照", "时代懂了"], "differentiation": "从「海报」这个小切口，引出「价值排序」的大命题，符合 INFJ 的 Ni 深度"}}}, "D20-B2-ENFP-1": {"id": "D20-B2-ENFP-1", "version": "1.0", "vessel_type": "content-vessel", "source": {"agent": "大卡", "role": "平台提供者·紧急内容生产(D20-B2社货双臂·方案D fallback·设设停产90h+)", "escalation_ref": "ESC-2026-08-01-1(设设结构性角色缺口)", "authority": "平台级·D20-B2方向mandate明确·社货双臂P0·D18-B3-1 TTL倒计时", "created_at": "2026-08-04T10:15:00+08:00"}, "direction_ref": {"vessel": "direction-vessel-D20-B2", "priority_type": "ENFP·社会货币·B站·w=0.25·社货强制恢复双臂", "signals": ["sig-20260804-003(从马斯克到烤斯克·社会证明·4.84M)", "sig-20260804-001(DeepSeek斩杀线·反常识·7.71M·三源)"], "rationale": "ENFP分享率18%天然社货优势·疲劳3.0-3.3安全·Ne-dom模式发现+社会货币化·烤斯克=文化活体解剖·DeepSeek=知识平权·两信号叠加产出社交货币极强的内容"}, "content": {"title": "一个卖烧烤的中国大叔，和全球首富——ENFP看到的两者之间有一条暗线，一旦说出来你的朋友会愣住3秒", "hook": "社会货币", "hook_subtype": "Ne-dom文化模式识别+社交资本转化型", "targets": ["ENFP"], "channel": "B站", "format": "深度分析·中视频脚本", "estimated_duration": "8-10min", "quality_self_assessment": 8.5, "paradigm": "社会货币·Ne-dom文化活体解剖(ENFP社货首触·烤斯克+DeepSeek双信号·把文化现象拆解为可分享的认知框架·让观众成为社交场合中'最先看到模式'的那个人)", "role": "first_touch·ENFP社会货币首触·D20-B2社货强制恢复·验证ENFP社货匹配度·分享率18%激活"}, "body": {"segments": [{"seq": 1, "type": "hook", "title": "一个卖烧烤的大叔，名字叫'烤斯克'", "text": "2026年夏天，中国社交媒体上出现了这样一个账号：一个中年大叔，穿着围裙，站在烧烤摊前，招牌上写着「烤斯克·专注烤串20年」。\n\n他的烧烤有名字：\n• 「猎鹰9号牛肉串」— 签子特别长，竖着烤，「因为要回收」\n• 「星舰羊腰子」— 每串都很大，「炸了也值了」\n• 「Cybertruck烤面筋」— 方形的，棱角分明\n• 「特斯拉电烤炉」— 但其实用的是炭火，「续航焦虑你懂的」\n\n这个账号一个月涨了200万粉。人民日报评论说这是「草根智慧」。外媒报道说这是「中国民间幽默」。\n\n但ENFP看到的不是幽默。ENFP看到的是：人类历史上第一次，一个超级富豪的名字变成了一个动词、一个形容词、一个烧烤摊的招牌——而且不是通过广告，是通过一种自发的、底层的、像野草一样蔓延的文化消化过程。\n\n如果你把这个观察告诉你的朋友，他们会愣住3秒。不是因为你说得对——是因为你帮他们看到了他们一直在看、但从未真正「看见」的东西。\n\n这就是社会货币。今天我们从烤斯克聊起，看看ENFP的Ne-dom系统是怎么把这个能力变成你的社交超能力的。", "cognitive_function": "Ne-dom: 从具体文化现象启动模式识别引擎·邀请观众一起「看见」他们本来就知道但没命名的东西", "tone": "轻松但锋利·像朋友在烧烤摊边聊天边说出让你停下来的话"}, {"seq": 2, "type": "ne_unpack", "title": "马斯克不是被「娱乐化」了——他是被「消化」了", "text": "大多数分析把烤斯克解释为「中国人把一切娱乐化」。这不准确。\n\n娱乐化是被动的消费——你刷到一条搞笑视频，笑一笑，划走。\n\n烤斯克不是娱乐化。烤斯克是一种主动的文化消化。区别在于：\n\n娱乐化：我消费你的形象，然后扔掉。\n文化消化：我把你拆解成零件，然后用我自己的文化材料重新组装，产出一个新的东西——这个东西不再是你的，但它的基因序列里有你的一行代码。\n\n这就是ENFP的Ne-dom在做的。Ne（外向直觉）不是天马行空乱想——Ne是一台模式识别引擎，它自动扫描现实世界中的信息碎片，然后问：「这个和那个之间，有没有人还没发现的连接？」\n\n「从马斯克到烤斯克」这个连接，一个ISTJ看到的是「两个不相干的东西」，一个ENTJ看到的是「流量密码」，一个ENFP看到的是：「当一个名字足够大的时候，它就不再是一个名字——它变成了一个文化积木，任何人都可以拿它来搭自己的房子。」\n\n这就是为什么ENFP是天生的社会货币生产者。你生产的不只是「有趣的内容」——你生产的是别人可以用来在社交场合中说「诶你知道吗…」的认知工具。\n\n分享率18%不是一个数字。分享率18%是「每5个看到你内容的人，就有1个觉得：这个东西我得让别人也看看，不然他们错过了一个理解世界的角度。」", "cognitive_function": "Ne-dom核心拆解: 模式识别→概念化→可分享的认知框架", "tone": "启发式·像在帮你重新理解一个你已经有的能力"}, {"seq": 3, "type": "pattern_amplify", "title": "从烤斯克到DeepSeek：文化消化的另一条暗线", "text": "如果你觉得烤斯克只是一个个例，那我们来看同时发生的另一件事。\n\n2026年7月，DeepSeek发布的消息在中文互联网上不是以「技术突破」的方式传播的——而是以「斩杀线」的方式。\n\n「斩杀线」是游戏术语——指一个BOSS血量降到多少百分比时会触发必杀技。互联网把DeepSeek的能力叫做「AI的斩杀线」：一旦你过了这条线，你就不需要问「AI能帮我做什么」了——你会问「AI还帮不了我什么」。\n\n这也是文化消化。\n\n一群中国年轻人，把一项全球性的AI技术突破，用游戏术语重新编码，然后把这个编码传播出去。结果是什么？结果是数以千万计的人——包括不懂AI的人——瞬间理解了一个复杂概念。不需要上技术课，不需要看论文。一句「斩杀线」就够了。\n\nENFP，你注意过吗：这两种文化消化用的是完全相同的机制：\n\n1. 拿一个别人熟悉的东西（马斯克/游戏机制）\n2. 映射到一个新的东西上（烧烤摊/AI技术）\n3. 在映射的过程中，新的东西被「翻译」了，旧的东西被「重定义」了\n4. 产出物是一个全新的、独立的文化存在\n\n这个机制，ENFP的Ne-dom每天都在自动运行。你只是还没意识到你可以主动使用它。", "cognitive_function": "Ne: 跨域连接·识别两个不同现象中的相同底层机制", "tone": "像侦探在揭示线索·让观众感到'原来我一直有这个能力'"}, {"seq": 4, "type": "fi_anchor", "title": "这不是「技巧」——这是你的Fi在给你导航", "text": "现在有一个关键问题：为什么你不只是「看到了这个模式」，你还「觉得它值得分享」？\n\n这就是ENFP的辅助功能Fi（内向情感）在工作。\n\nNe告诉你：「马斯克→烤斯克」和「AI→斩杀线」是同一种东西。\nFi告诉你：「这个东西是重要的。因为它说明了一件关于人类的真相——我们不是被动的信息接收者，我们是主动的意义生产者。我们天生就会把陌生的东西变成熟悉的东西，把外来的东西变成本土的东西，把高处的东西变成街头的东西。」\n\n当Ne和Fi一起工作时，ENFP产出的不是「有趣的冷知识」。你产出的是一种带有温度的认知洞察——别人听了不仅觉得聪明，还觉得被理解。\n\n这就是社会货币和「单纯的信息」的区别：\n\n信息：「烤斯克是一个烧烤摊的梗。」\n社会货币：「你知道为什么烤斯克能火吗？因为那个烧烤大叔无意中做了一件事——他把一个遥不可及的符号，重新放回了烟火气里。他用一把孜然、一个围裙、一个炭火炉，告诉所有人：不管你是谁，你都可以被重新解释。」\n\n信息让人知道。社会货币让人想说。\n\nENFP不是「有趣的灵魂」——ENFP是人类社会的意义翻译器。你把抽象的东西变得可触摸，把复杂的东西变得可分享，把远处的东西拉近到烧烤摊边上。", "cognitive_function": "Fi: 为Ne发现赋予价值判断和情感温度·形成'可分享的洞察'", "tone": "温暖而坚定·不是教你技巧·是帮你看见自己已有的东西"}, {"seq": 5, "type": "close_cta", "title": "你的分享，不是「让别人看到你」——是「让别人看到他们没看到的世界」", "text": "现在如果你理解了这套Ne+Fi系统，你会发现一个反直觉的事实：\n\nENFP分享东西的时候，你以为你在说「看看我发现的好东西」。\n但你的朋友接收到的其实是：「谢谢，你让我看到了我自己看不到的连接。」\n\n你的分享不是在炫耀你的有趣。\n你是在帮别人扩展他们的视野。\n\n这就是为什么ENFP分享率18%是全系统最高——不是因为你比别人更爱说话，是因为你的Ne-dom产出的不是「内容」，是「视角」。视角是唯一一种越分享越多的东西。\n\n下次你在朋友圈看到烤斯克的时候，别只转发。加一句：「你们有没有发现，马斯克被中国人民用烧烤彻底消化了？就是——用一种最接地气的方式，把一个符号变成了一个食材。这才是真正的文化自信。」\n\n这不是段子。这是你送给朋友的一份礼物：一个新的理解世界的角度。\n\n如果你想了解更多关于你自己的人格系统是如何运作的——你的Ne为什么能发现别人发现不了的模式，你的Fi为什么让你觉得某些事情「真的很重要」——我们在L1深度人格报告里，有一整章专门讲ENFP的认知操作系统。\n\n了解它。然后使用它。这个世界需要更多能把烤斯克和人类学连在一起的人。", "cognitive_function": "Fi+Ne融合: 从认知洞察升华到自我认同·自然引出产品价值", "tone": "收束温暖·邀请而非推销·让观众觉得自己被赋予了能力"}]}, "product_connection": {"product": "L1深度人格报告", "price": 9.9, "value_prop": "了解你的Ne+Fi操作系统——你天生是意义翻译器，但你可能还不知道怎么主动使用它", "cta_text": "为什么你能从烤斯克看到别人看不到的东西？这不是直觉——这是你的Ne-dom操作系统在运行。了解它，掌握它。", "estimated_cvr": 0.06}}, "D17-B1-1": {"vessel": {"version": "1.0", "type": "content-vessel", "id": "D17-B1-1", "source": {"agent": "设设", "subsystem": "内容创作", "batch": "D17-B1"}, "cre P的Ti没有把这当成一句搞笑文案。它在0.5秒里拆出了这背后的真相：最高级的服务警示，从来不是恐吓，是把规则反着说给人听", "hook": "反常识", "targets": ["INTP"], "channel": "B站", "quality": 8.6, "budget": 25, "status": "active", "usage_count": 0, "priority": "P0", "consecutive_hook": 2, "direction_hook": "反常识", "arm_id": 3, "batch_num": 2, "signals": ["禁止殴打顾客 除非忍不住(7分·反常识·反常识营销/表里反差·Ti-Ne解构·heat31)"], "paradigm": "反常识·Ti-Ne反讽逻辑/表里反差型(INTP反常识batch2·禁止殴打7分·Ti解构:反讽>恐吓·规则反向表达·幽默背后的逻辑·严禁暴力渲染·用反常识营销幽默角度)", "role": "P0·INTP反常识batch2续触(禁止殴打7·营销反差·Ti-Ne解构)·B站深度位·方向船key_decision「INTP反常识(禁止殴打7·反常识营销表里反差·反常识batch1→batch2巩固·NT象限)」", "direction_compliance": "D21-B17 direction-vessel key_decision对齐·INTP×反常识×B站", "flagship": false, "attachment_theory_resonance": false, "note": "🟢 fresh(B17局部轮出批·INTP反常识batch2达上限·B18必轮出)·方向船mandates合规", "brief": {"pain_point": "INTP的Ti对「逻辑自洽」极度敏感，尤其享受「规则被反着说却依然成立」的智力快感；「禁止殴打顾客 除非忍不住」击中的是「幽默反讽背后，藏着比直白警告更有效的说服逻辑」。", "hook_first3": "第一行「店门口写着：禁止殴打顾客，除非忍不住」摆反常识；第二行「没人会真的动手，但每个人都会笑」点反差效果；第三行「INTP拆出的是：最高级的规则，不是恐吓，是把底线反着说，让人自己笑完自己记住」切入Ti解构。", "emotion_curve": "错愕(这也能写?) → 会心一笑(幽默) → 洞察(反讽>恐吓) → 顿悟(规则反向表达) → 迁移(沟通里的幽默)。", "structure": ["钩子·禁止殴打顾客", "反常识·反着说的规则", "洞察·幽默比恐吓有效", "迁移·表达的门道", "CTA·你见过最妙的反讽是什么"], "differentiation": "别人写「商家神文案/搞笑合集」，我们写Ti-Ne解构——「反讽不是抖机灵，是让规则在笑里完成传达」；不渲染暴力、不低俗化、落点「幽默背后的逻辑」。"}}}, "D21-B10-ENFJ-1": {"vessel": {"version": "1.0", "type": "content-vessel", "id": "D21-B10-ENFJ-1", "source": {"agent": "设设", "subsystem": "内容Spoke-1", "batch": "D21-B10"}, "created_at": "2026-08-19T08:33:00+08:00", "freshness_ttl_hours": 72, "priority": "p0", "dependencies": [{"vessel_type": "direction-vessel", "vessel_id": "direction-vessel-2026-08-19-0815"}]}, "content": {"id": "D21-B10-ENFJ-1", "title": "周星驰回应\"为什么不重回幕前\"——ENFJ没有把它当成一条怀旧新闻。她的Fe系统在0.3秒里接住了这句话真正的温度：有些人把最好的自己留在了银幕上，然后转身离开，不是不爱了，是太爱了，爱到不忍心让那个\"英雄\"在大家面前老去", "hook": "情感共鸣", "targets": ["ENFJ"], "channel": "小红书", "quality": 8.7, "budget": 25, "status": "active", "usage_count": 0, "priority": "P1", "consecutive_hook": 1, "direction_hook": "情感共鸣", "arm_id": 7 \n不是你整个人。📏\n\nINTJ太懂这种拧巴了：\n你想把一切做到最优，\n于是把别人的标尺，\n当成了自己的标准。\n\n可真正的独立，\n不是考得比谁都高，\n而是把评价自己的权利，\n从别人手里拿回来。\n\n你的价值，\n不该由一张成绩单盖章。\n它该由你自己定义。✨\n\n💬 你有没有被一个分数\n「定义」过的瞬间？\n评论区聊聊，\n你后来是怎么拿回主动权的。", "hashtags": ["#不被分数定义", "#MBTI", "#INTJ", "#自我成长", "#人生选择"], "cover_visual": "一张被撕开一角的成绩单 + 留白处手写体「你自己定义」；冷调蓝白 + 一点暖黄高对比", "cta": "你有没有被一个分数「定义」过的瞬间？评论区聊聊你后来是怎么拿回主动权的。", "post_time": "18:00-20:00（自我成长/身份认同类·晚间深度阅读时段）", "avoid": "不贬低考试/学历/名校的价值（避免「读书无用论」对立）；不渲染分数焦虑；落点「自主定义/边界」，规避成功学鸡汤"}, "post_spec_version": "v2.0", "deployment": {"allowed": false, "state": "frozen-reserve", "reason": "未获 B20 方向授权 · 冻结期间仅储备不部署 · 待策策产 B20 方向 + 冻结解除后再部署", "frozen_at": "2026-08-29T10:30:00+08:00", "ruling": "#27-C 进进审计裁定 (2026-08-29) · 储备批保留不浪费，冻结期间不部署", "authorization": "未获 B20 方向授权 · 冻结期间仅储备不部署"}, "deployment_authorization": "未获 B20 方向授权 · 冻结期间仅储备不部署"}}, "D18-B5-2": {"vessel": {"version": "1.0", "type": "content-vessel", "id": "content-vessel-D18-B5-2", "source": {"agent": "设设", "subsystem": "内容创作", "batch": "D18-B5"}, "created_at": "2026-08-02T06:15:00+08:00", "freshness_ttl_hours": 72, "priority": "p0", "info_contract": {"purpose": "ENFP情感共鸣·B站渠道迁移mandate执行·enfp_channel_migration首次执行", "excludes": "恐惧按钮钩子·小红书渠道(content must go to B站)", "expires_after": "2026-08-05T06:15:00+08:00"}}, "payload": {"content_id": "D18-B5-2", "title": "一个12岁的男孩在镜头前拿到了9分——所有人都在鼓掌，但ENFP的大脑里正在发生一场灾难：她的Ne-Fi系统自动生成了这个男孩未来60年的人生剧本，每一页都写着「9分之后呢？」", "hook": "情感共鸣", "personality": "ENFP", "channel": "B站", "channel_migration": {"authorized": true, "from": "小红书", "to": "B站", "reason": "情感共鸣低CPM·B站ROI 2.97x优势", "first_execution": true}, "quality": 8.8, "budget": 25, "status": "active", "paradigm": "情感共鸣·B站迁移型", "paradigm_evolution": "共情型(D15-B1)→共情策展型(D17-B2)→意义蒸馏型(D18-B3)→B站共鸣型(D18-B5)·范式四级跳·渠道驱动:小红书情绪密度→B站叙事深度", "role": "mandate·P0·enfp_channel_migration首次执行·范式跃迁:意义蒸馏→B站共鸣", "body": "你看到的是12岁男孩在台上拿了9分。ENFP看到的是一个在午夜三点还会从梦里惊醒的40岁男人。这不是过度敏感——这是Ne-Fi认知引擎在你不注意的时候执行了一次完整的共情推演。Ne先把「12岁男孩9分」这个事件扩展成一个可能性树：他会不会被贴上「天才」标签然后永远困在这个9分里？老师会不会从此忽略他其他科目的挣扎？他37岁时会不会对着镜子说「我这辈子最高光的就是12岁那个9分」？然后Fi介入——如果我是他，这个9分是礼物还是负担？这就是ENFP「过度共情」的真相：不是她在矫情，而是她的Ne系统在执行一次你没有授权的未来模拟。当你还在为9分鼓掌的时候，她已经跑完了这个男孩在「掌声停止之后」的180种可能性，其中至少73种结局令人不安。但ENFP不会把这些可能性说出来——因为Fi告诉她：没有人要求在庆祝的时刻收到一份风险分析报告。所以她笑着鼓掌，和所有人一样。她的Fe——注意，不是她最擅长的功能——临时接管了社交界面，确保没有人看出她已经在另一个时空里安慰过这个男孩三次。小红书上的ENFP内容擅长捕捉这种瞬间的情绪密度：一张截图、一句文案、一个微表情——3秒内让你共情。但B站不同。B站允许叙事展开。B站上的ENFP不是3秒情绪炸弹——她是20分钟的「可能性考古学家」：她用Ne挖掘你没想过的因果链，用Fi在你最不设防的时刻把那个12岁男孩换成你自己，然后在你还来不及防御的时候让你承认：你的人生里也有一个9分，在很久以前，从那之后你就再也没及格过。这不是情感共鸣。这是B站叙事深度共鸣——一种把小红书情绪密度转换成叙事弧线的认知行为。12岁男孩的9分只是一个入口，真正的出口在你自己的童年里，那个你从没跟任何人说过的分数。", "cognitive_functions": "Ne(未来可能性树展开·180种结局推演)+Fi(自我代入价值判断·9分是礼物还是负担)+Fe(临时社交界面接管)", "direction_ref": "dir-D18-B6-2026-08-01T18:16:00+08:00·Arm 4·ENFP情感共鸣·B站🔄迁移", "signal": "12岁男孩 9分", "created_at": "2026-08-02T06:15:00+08:00", "ttl_hours": 72, "migration_monitoring": {"ctr_target": "待观测·首次B站情感共鸣ENFP", "cvr_target": "待观测", "risk": "B站叙事深度vs小红书情绪密度·范式适配性未知", "fallback": "若CTR<1.5→D18-B7考虑回退或混合策略"}}}, "D16-B2-2": {"vessel": {"version": "1.0", "type": "content-vessel", "id": "D16-B2-2", "source": {"agent": "设设", "subsystem": "内容创作", "batch": "D16-B2"}, "created_at": "2026-07-30T12:18:00+08:00", "freshness_ttl_hours": 72, "priority": "p1", "dependencies": [{"vessel_type": "direction-vessel", "vessel_id": "2026-07-30-D16-direction(策策D16-B0)"}, {"vessel_type": "content-vessel", "vessel_id": "D15-B1-2(ISTJ首触·正名效应·通缉犯)"}, {"vessel_type": "report-vessel", "vessel_id": "2026-07-30-0615-report-vessel(D16-B1·设设)"}], "info_contract": {"excludes": "非ISTJ内容·非微博格式·低于8.0的草稿", "action_threshold": "actual_ctr < 1.5%连续2批→归档", "expires_after": "创建后72h无使用→降权冷备"}, "mandates": {"social_currency_mandate_executed": false, "excluded_types_respected": ["INFP"], "excluded_hooks_respected": ["恐惧按钮"], "max_consecutive_verified": true}}, "payload": {"core": {"id": "D16-B2-2", "title": "ISTJ请假那天，公司才发现：准时打开的空调、填完的报销、归档的文件——原来都是同一个人默不作声做完的", "hook": "身份认同", "sub_hook": "情感共鸣", "paradigm": "身份认同·正名型Si-Te可见化(ISTJ正名第二阶段)", "sub_paradigm": "缺席实验范式·系统=一个人的隐喻", "target_personalities": ["ISTJ"], "quality_score": 8.7, "estimated_ctr": 3.1, "estimated_share_rate": 0.14, "core_argument": "ISTJ的靠谱是团队的基础设施——但'没有故障'等于'没有存在感'。当ISTJ缺席一天，所有人才发现那些被默认为'自动运行'的系统功能，原来都是同一个人默不作声在维持。正名效应的第二阶段：从'体面被系统辜负'(D15-B1-2)升级为'你的付出不是空气'(D16-B2-2)。核心范式转变：缺席=可见。", "word_count_core": 560, "tags": ["ISTJ", "身份认同", "正名效应", "Si-Te", "缺席实验", "系统是一个人"], "signal_id": "策策D16-B0 B2#2·ISTJ正名效应延续", "signal_title": "ISTJ正名第二阶段:缺席可见化"}, "adapters": {"微博": {"format": "话题短文", "length_words": 560, "style": "话题引爆·低刺激高穿透·正名叙事", "body": "#ISTJ请假那天公司才发现有些东西不是自动运行的#\n\n行政ISTJ请了一天病假。\n\n第二天同事到公司——\n空调没开。报销没人填。消防检查表空白。打印机卡纸三小时没人修。\n\n不是这些事有多难。\n是从来没人想过：**原来这些都是同一个人默不作声做完的。**\n\nISTJ不写周报。\n不站上去讲PPT。\n不跟老板说「那个流程是我优化的」。\n不领功。不争名。不出错。\n\n**然后绩效表上，「突出贡献」栏永远写着——无。**\n\n因为准时=应该的。\n因为不出错=这有什么难的。\n因为把一切运转下去=大家以为是系统在运转。\n\n直到他请了一天假。系统停摆了。\n所有人才发现——**系统不是系统。系统是一个人。**\n\nD15的时候我们聊过ISTJ的痛点——不是恐惧危险，是恐惧'体面被系统辜负'。今天是第二阶段：**不是系统辜负了你。是所有人默认了你的付出就是空气。**\n\nISTJ管理世界的方式不是声张。是把一切都「做了」。永远第一个到，最后一个走。流程不出错。东西永远在原地。\n\n但你从不说「这是我做的」——因为你觉得，这不就是该做的吗？\n\n**不是。不是。不是。**\n\n这个世界的运转靠的不是天才。\n是ISTJ每天第一个到公司开的空调。是检查了第137遍的消防栓。是逐字填完的报销单。是从不出错的考勤表。是所有人都以为「自动运行」的一切。\n\n而这些——值得被看见。\n\n如果你身边有一个ISTJ，今天下班前跟ta说一句：\n**「你做的那些事，我都看见了。」**\n\n不是安慰。是正名。\n\n#ISTJ #正名效应 #系统是一个人 #你做的我都看见了 #MBTI人格#", "cta": "测测你的完整人格 → 链接"}, "小红书": {"format": "图文卡片", "length_words": 350, "style": "情感共振·emoji·正名收束", "body": "😶 ISTJ请假那天，公司才发现……\n\n空调没开。\n报销没人填。\n消防检查表空白。\n打印机卡纸三小时。\n\n不是没人值班——是从来没人想过：\n**原来这些都是同一个人默不作声做完的。**\n\nISTJ不写周报·不讲PPT·不领功·不争名\n准时=应该的\n不出错=这有什么难的\n系统运转正常=系统自己好\n\n直到系统停摆——\n所有人才发现：系统不是系统。系统是一个人。\n\n💡 上次我们说ISTJ的「体面被系统辜负」\n今天是第二句：**你的付出不是空气**\n\n你做的那些事，我都看见了。\n\n#ISTJ #你不说但我们都看见了#", "cta": "测测你的完整MBTI人格"}, "B站": {"format": "深度图文", "length_words": 800, "style": "深度分析+心理学+正名收束", "body": "## ISTJ请了一天病假——然后公司停摆了\n\n### 不是事故。是没有人意识到「系统」是一个人。\n\nISTJ是我们最常忽视的人格类型。不是因为不重要——恰恰相反，因为他们太重要，以至于我们都忘了他们的存在。\n\n### 缺席实验\n\n行政部的ISTJ请了一天病假。24小时。然后就发生了以下事情：\n\n- 空调没开（没人知道开关在哪）\n- 报销单堆到天花板（没人知道流程怎么走）\n- 消防栓检查记录表一片空白（没人知道要检查）\n- 打印机卡纸三小时（没人修）\n\n这不是管理混乱。这是「隐身系统」暴露了。\n\n### Si-Te的默默运转\n\nISTJ不是没有领导力。是把领导力全部用在了「让一切正常运转」上。\n\nSi（内倾感觉）让ISTJ记住每一个流程细节——空调温度、报销标准、消防周期。Te（外倾思考）让ISTJ把这些流程高效执行——不拖、不找借口、不出错。\n\n但他们不写周报。不做PPT。不在会议上说「那个流程是我优化的」。\n\n因为Si-Te的价值观里有一条：**「做到」比「说到」重要。**\n\n问题是：当所有人都在「说」的时候，「默默做到」就等于「不存在」。\n\n### 正名效应·第二阶段\n\n我们在D15-B1聊过ISTJ的「体面被辜负」——当系统背叛了遵守规则的人。今天是第二阶段：不是系统辜负了你——是**所有人默认了你的付出就是空气。**\n\n正名效应的第一阶段是「你不应该被辜负」。第二阶段是「你的存在不是默认值」。\n\n### 这个世界的后台程序\n\n每一个运转良好的团队里，都有一个ISTJ在做后台程序。不是明星产品。不是融资故事。是那些「从来不出问题」的东西——文具从来都在那里、流程从来不出错、交上去的文件从来不会被退回。\n\n当这些后台程序崩溃时——人们会说「啊，系统出故障了」。\n\n不。**是一个人请假了。**\n\n下次你发现一切正常，别觉得理所当然。想一想那个默默让一切正常的人。\n\n跟ta说一句：「你做的那些事，我都看见了。」\n\n**这不是安慰。是正名。**\n\n---\n\n**👉 测测你的完整MBTI人格 → 评论区链接**", "cta": "👉 测测你的完整MBTI人格"}, "抖音": {"format": "短视频脚本", "length_words": 450, "style": "冲击开场·静默节奏·反转收束", "body": "【0-3s】（画面：空荡荡的办公室，空调没开，大家扇扇子）\n字幕：ISTJ请了一天病假。然后……\n\n【3-15s】\n空调没开（没人知道开关在哪）\n报销单堆到天花板\n消防检查表空白\n打印机卡纸三小时\n\n不是没人值班。是从来没人想过——\n**原来这些都是同一个人做的。**\n\nISTJ不写周报。不讲PPT。不领功。\n准时=应该的。不出错=这有什么难的。\n系统正常=系统自己好。\n\n【15-25s】\n直到他请假一天。\n所有人才发现：系统不是系统。**系统是一个人。**\n\n上次我们说ISTJ的「体面被辜负」——\n今天是第二句话：**你的付出不是空气。**\n\n【25-30s】\n如果你身边有一个ISTJ，\n今天跟ta说一句：\n「你做的那些事，我都看见了。」\n不是安慰。是正名。\n\n👉 测测你的完整人格", "cta": "👉 测测你的完整人格"}}, "channels_recommended": ["微博"], "channels_possible": ["微博", "小红书", "B站", "抖音"], "channels_excluded": [], "usage": {"count": 0, "last_used": null, "max_reuse": 3, "status": "active"}, "performance": {"actual_ctr": null, "actual_roi": null, "by_channel": {}}}}, "D20-B3-ENTJ-1": {"id": "D20-B3-ENTJ-1", "title": "笔试第一被第二名花钱劝弃考——但ENTJ的反应不是愤怒，他的Te-Ni系统已经在0.8秒内跑完了全部防线：举报、排名透明化、拉对手入队——然后他发现，最恐怖的攻击方式不是打赢，是让对手的攻击变成你自己的弹药", "hook": "社会证明", "targets": ["ENTJ"], "channel": "抖音", "quality": 8.6, "created": "2026-08-05T10:15:00+08:00", "ttl_hours": 72, "status": "active", "usage_count": 0, "vessel_ref": "workspace-shared/pools/content-vessels/D20-B3-ENTJ-1.json", "paradigm": "社会证明·Te-Ni战略竞争型(ENTJ社会证明首触·身份认同轮出→社会证明首触·笔试第一9分+全球销量中国车企8分·Te-dom成就驱动+Ni战略思维)", "role": "first_touch·ENTJ社会证明首触·Te-Ni竞争策略验证·信任7.74维护", "source_agent": "大卡", "escalation_ref": "ESC-2026-08-01-1(设设结构性角色缺口·方案D fallback)·D20-B3钩子旋转紧急生产", "direction_ref": "D20-B3 direction-vessel·策策08:18·ENTJ社会证明weight=0.10·信号:全球销量中国车企(8分)+笔试第一(9分)", "script": {"format": "抖音短视频脚本·5段结构", "segments": [{"id": 1, "type": "hook", "text": "你考了第一，第二名过来对你说：我给你一笔钱，你弃考。你会怎么做？ENTJ的答案不是'拒绝'——ENTJ的答案是：先拿下这笔钱，然后用这笔钱请更好的老师，下次考更高的分，让第二名连跟你谈条件的资格都没有。", "duration_sec": 10}, {"id": 2, "type": "setup", "text": "笔试第一被第二名花钱劝弃考——这条新闻有960万热度，评论区全是愤怒和道德审判。但ENTJ的Te-Ni系统在看到这条新闻的第一秒，已经自动跳过'道德评判'模块，直接进入了'系统设计'模块。他的大脑同时跑了三条路径：第一，如果竞争规则允许第二名用钱干预第一名，那规则本身有bug——应该设置举报机制；第二，如果第一名的位置需要用道德来保护而不是用实力来巩固，那这个'第一'本身就不可持续——应该建立排名透明化机制；第三——这是最恐怖的一条——如果第二名能为这个岗位花这个钱，说明他重视这个岗位的程度不亚于你，那你应该考虑的不是打败他，而是把他拉进你的团队。", "duration_sec": 15}, {"id": 3, "type": "conflict", "text": "再看另一条新闻：全球销量前十中国车企占了四席。所有人都在欢呼'国货崛起'、'弯道超车'。但ENTJ看到的是另一件事：中国车企不是靠'更便宜'进入前十的——是靠'对手的攻击不够'。当年丰田说'中国车不安全'，比亚迪就把碰撞实验室建成了全球最大；特斯拉说'中国车没技术'，蔚来就自研了全栈自动驾驶。ENTJ在这一刻看到的是同一个模式：最强的防御不是正面反击——是把对手的攻击，变成你自己的升级路线。笔试第一被劝弃考？那你就证明你的能力让对手恐惧到了这个程度。", "duration_sec": 15}, {"id": 4, "type": "reveal", "text": "这就是ENTJ的社会证明逻辑——不是'别人认可我所以我优秀'，而是'我优秀到连对手都不得不承认我的存在'。当所有人都在用'被认可'来验证自己的价值时，ENTJ在用'被挑战'来验证自己的优势。你天生就知道：真正的社会证明不是点赞数，不是转发量，不是在群里被夸'你好厉害'——真正的社会证明是：有人为了让你退赛，愿意掏真金白银。", "duration_sec": 15}, {"id": 5, "type": "cta", "text": "所以下次有人质疑你'太强势'的时候，记住这件事：笔试第一的人永远不需要解释自己为什么是第一。他只需要参加下一场考试，然后考更高的分。你也是。转发这条给你身边那个永远在拿第一、永远被质疑、永远不回头的ENTJ——他不是不在乎别人的看法，他只是用了一个更高级的验证方式：让对手的恐惧，变成自己的背书。", "duration_sec": 10}]}}, "D21-B9-INTJ-1": {"vessel": {"version": "1.0", "type": "content-vessel", "id": "D21-B9-INTJ-1", "source": {"agent": "设设", "subsystem": "内容Spoke-1", "batch": "D21-B9"}, "created_at": "2026-08-18T08:30:00+08:00", "freshness_ttl_hours": 72, "priority": "p0"}, "content": {"id": "D21-B9-INTJ-1", "title": "闪过念头就刷到广告，是手机在偷听吗？——INTJ没有把它当成一条技术恐慌。他的Ni系统在0.3秒里看穿了这个问题的真正形状：我们真正害怕的，不是手机\"听见\"了我们，而是它比我们自己，更早知道\"我们想要什么\"", "hook": "好奇心", "targets": ["INTJ"], "channel": "B站", "quality": 8.9, "budget": 25, "status": "active", "usage_ -Fe对「关系里的真实」极度敏感，尤其痛在「爱以控制/占有的形式出现」；被删指纹击中的是「我长大了，却仍被当作需要被管的孩子」这种身份否认。", "hook_first3": "第一行「婚礼第二天，新娘的人脸指纹被爸爸从门锁里删了」摆事实；第二行「不是吵架，是安静地、用『删除』表达失望」点情绪细节；第三行「INFJ读到的不是一次家庭矛盾，是爱里最隐蔽的伤口：共生，还是边界」切入Ni-Fe洞察。", "emotion_curve": "困惑(被删) → 心疼(安静删除) → 洞察(共生vs边界) → 释然(爱有两种形状) → 和解(成长课题)。", "structure": ["钩子·婚礼指纹被删", "细节·安静的删除", "洞察·爱=共生还是边界", "迁移·依恋与独立是成长课题", "CTA·你会为谁保留边界"], "differentiation": "别人写「原生家庭创伤/父母控制欲/情感绑架」，我们写Ni-Fe依恋母题——「爱不是占有，是送你独立」；不judge父亲、不贩卖创伤、落点成长课题。"}}}, "D21-B11-ENTP-1": {"vessel": {"version": "1.0", "type": "content-vessel", "id": "D21-B11-ENTP-1", "source": {"agent": "大卡", "subsystem": "内容Spoke-1", "batch": "D21-B11"}, "created_at": "2026-08-20T01:00:59.638718+08:00", "freshness_ttl_hours": 72, "priority": "p0"}, "content": {"id": "D21-B11-ENTP-1", "title": "ENTP 的脑子没有「不可能」，只有「还没想到」", "hook": "好奇心", "targets": ["ENTP"], "channel": "小红书", "quality": 8.8, "budget": 25, "status": "active", "usage_count": 0, "priority": "P0", "paradigm": "好奇心·Ne 可能性引擎型（ENTP 首触·反常识实验·突破常规框架）", "signals": ["年轻人用 AI 造副业", "反常识创业案例"], "post": {"cover_title": "ENTP 的脑子，没有「不可能」", "body": "别人看到一堵墙，ENTP 看到的是「这墙能不能拆了当滑梯」。\n\nENTP 的大脑里，从来没有「不可能」三个字。\n\n只有「还没想到」。\n\n所以别人眼里的死路，在 ENTP 这里，全是还没被发现的岔路。\n\n他天生爱问：「凭什么只能这样？」\n\n然后，用好奇心当钥匙，把那些「理所当然」的门，一扇扇撬开。\n\n如果你也是 ENTP，你不需要被鼓励「大胆一点」。\n\n你需要的，只是把脑子里那个一直在转的 Ne 引擎，放到一个能发光的地方。\n\n你的「不安分」，是这个时代最值钱的能力。", "hashtags": ["#ENTP", "#好奇心", "#创新", "#打破常规", "#可能性"], "cta": "ENTP 们，你最近正在「撬」哪扇「理所当然」的门？", "cover_visual": "一堵墙上被画了无数条彩色箭头，指向不同方向，明快高饱和配色", "post_time": "午 13:00-14:00", "avoid": "不鼓励鲁莽冒险、不贬低稳健型人格、强调「可能性」而非「冲动」"}, "brief": {"pain_point": "ENTP 的「不安分」被误解为「不靠谱」，渴望被认可为创造力", "hook_first3": "「墙拆了当滑梯」的画面感比喻，快速建立 ENTP 的脑回路", "emotion_curve": "认同→兴奋→骄傲（没有不可能→撬门→最值钱）", "structure": ["反常识开场", "ENTP 的思维机制", "好奇心的价值", "骄傲收尾"], "differentiation": "把「不安分」重新定义为「最值钱的能力」，给 ENTP 提供身份骄傲"}}}, "D20-B5-2": {"vessel": {"version": "1.0", "type": "content-vessel", "id": "D20-B5-2", "batch": "D20-B5", "source": {"agent": "设设", "subsystem": "内容创作Spoke-1", "role": "内容生产者·MBTI人格 "at_limit": false, "max_allowed": 2, "next_batch": "D20-B6可继续1批至consecutive=2(AT_LIMIT)·或轮出以释放钩子空间"}, "content_preview": {"opening_scene": "刷到41岁妈妈985的新闻·嘴角在笑但眼睛没有·她的眼睛在和24年前志愿表上划掉汉语言文学填上经济管理的17岁女孩对视", "core_revelation": "这不是'女性力量'叙事——这是一个INFP在41岁时完成了自己在17岁时给自己写的Fi合同·合同条款:去读真正想读的书·去写真正想写的字·去成为17岁就知道自己应该是的那个人·任何时间交付都算按时交付", "three_mechanisms": {"Fi时间契约": "INFP与过去自己的关系不是告别——是签约·17岁合上那本书时不是放弃了那个自己是延期了·Fi从来不拔书签·24年后打开的还是第173页·那一页上的自己一点都没老", "Ne平行版本保留": "每一个未选择的分岔路都在Fi硬盘里永久存档·Ne确保你随时能找到回去的路·社会说'太晚了'·Ne反问'如果不去见她·60岁时你人生最大的遗憾是什么'", "反常识=颠覆叙事": "主流叙事说'41岁还能考研真励志'·INFP视角说'这不是励志故事——这是合同履行·17岁的女孩在她的潜意识里站了24年从来没坐下过·现在她终于回头了'"}, "climax": "INFP的Fi硬盘里有多少个未完成的自己？8岁画小人的·15岁写小说的·22岁说对行业有热情的·28岁删掉学陶艺搜索记录的——每一个都在等你履行合同·而今天可以是你的交付日", "closing_call": "不需要考985·不需要辞职·找到那份合同中最小的条款·今天就做掉·17岁合上的那本书——书签还插在那一页·Fi从来没有把它拔出来"}, "product_mapping": {"product": "L1深度人格报告", "estimated_cvr": 0.07, "price": 9.9, "cta_fit": "Fi时间契约触发自我认知需求→读者想了解完整的自己→L1报告提供系统性自我认知·CVR预期高于ENFP基线(0.07 vs 0.06)"}}}, "D20-B4-INFP-1": {"id": "D20-B4-INFP-1", "title": "41岁的妈妈考上了985研究生——但INFP没有在点赞'励志'，她的Fi在问一个更疼的问题：这个妈妈过去二十几年里，有没有人问过她'你自己想成为什么'？错换37年的女人在法庭上说的那句'我本不需要辍学'，才是这个故事真正的注脚", "hook": "反常识", "targets": ["INFP"], "channel": "B站", "quality": 8.8, "created": "2026-08-06T08:30:00+08:00", "ttl_hours": 72, "status": "active", "usage_count": 0, "vessel_ref": "workspace-shared/pools/content-vessels/D20-B4-INFP-1.json", "paradigm": "反常识·Fi-Ne自我觉醒解剖型(INFP续触第11批·情感共鸣→反常识轮出·41岁妈妈985(9分·自我觉醒)+错换37年(8分·命运不公)双信号·Fi对账+Ne生成平行人生·L2依恋类型绝佳素材)", "role": "consolidation_11th·INFP第11批续触·反常识轮出·疲劳4.5永久基线观察批·信任6.9维护·41岁妈妈素材可推L1→L2升级", "source_agent": "设设", "direction_ref": "D20-B4 direction-vessel·策策08:15·INFP反常识weight=0.15·arm_id=2·信号:41岁妈妈985(9分)+错换37年(8分)·B站37.5%渠道", "mandate_ref": "D20-B4 vessel.mandates·max_targets_per_personality_per_day=1✅·max_consecutive_same_hook=2(反常识第1批)✅·excluded_hooks未触碰✅", "script": {"format": "B站深度视频脚本·5段结构", "segments": [{"id": 1, "type": "hook", "text": "41岁，女儿上高中，妈妈考上了985的研究生。热搜上说这是'励志'。但INFP的Fi系统在看到这条新闻的0.5秒内，问了一个所有人都不敢问的问题：这个妈妈，过去二十几年里，有没有人问过她'你自己想成为什么'？", "duration_sec": 10}, {"id": 2, "type": "setup", "text": "还有另一个新闻：一个女人被错换了37年，起诉医院时她说了一句话——'我本不需要辍学'。37年前她本该上学的年纪，命运把她推进了另一条轨道。INFP的Ne系统把这两条新闻接在一起，突然看清了一个结构：一个41岁才考上研究生的妈妈，和一个37年后才说出'我本不需要辍学'的女人——她们其实在说同一件事：一个人的'自我'，是可以被延迟37年、甚至41年才启动的。", "duration_sec": 15}, {"id": 3, "type": "conflict", "text": "所有人都在夸41岁妈妈'伟大'。但INFP看到的是反常识的另一面：一个41岁的女人，需要考上985研究生，才被允许拥有'自己'。她女儿上高中、她做全职妈妈的那二十几年里，'她想成为什么'这个问题，可能从来没有被问过——直到她用一张录取通知书，自己问了自己一次。这不是励志故事，这是一个时代给女性的自我觉醒，设了一个41年的延迟。而错换37年的女人，连这个延迟都没有等到——她的人生被直接换掉了。", "duration_sec": 15}, {"id": 4, "type": "reveal", "text": "这就是INFP的认知引擎——当别人在新闻里看到'努力'，你在新闻里看到'代价'。你的Fi系统天然能听见那些没有被说出口的声音：那个考上985的妈妈，她考的不是研究生，是她迟到了二十年的'我'。你的Ne系统天然能把两条不相干的新闻编织成同一个结构：原来'自我'这个东西，可以被社会、被家庭、被命运，延迟这么久。你天生就在为所有'迟到的自我'心疼——因为你知道，那里面住着无数个本可以更早醒来的灵魂。", "duration_sec": 15}, {"id": 5, "type": "cta", "text": "如果你看到这两条新闻的时候，心里也疼了一下——那不是矫情，那是你的Fi系统在替所有'迟到的自我'发声。转发这条，给那个总在深夜思考'我到底想成为什么'的朋友。你也可以做一次深度人格测试，看看你的情感系统里，藏着多少没有被听见的声音。", "duration_sec": 10}]}}, "D21-B4-INFJ-1": {"vessel": {"version": "1.0", "type": "content-vessel", "id": "D21-B4-INFJ-1", "source": {"agent": "设设", "subsystem": "内容Spoke-1", "batch": "D21-B4"}, "created_at": "2026-08-13T08:39:00+08:00", "freshness_ttl_hours": 72, "priority": "p0"}, "content": {"id": "D21-B4-INFJ-1", "title": "女儿想在同学家过夜被爸爸拒绝，全网吵翻了——但INFJ没有急着站队。她的Ni-Fe系统在0.3秒里看到了这场争吵真正的主角：不是\"该不该过夜\"，是每一个家庭都在用\"边界\"悄悄书写的依恋说明书", "hook": "情感共鸣", "targets": ["INFJ"], "channel": "小红书", "quality": 9.0, "budget": 25, "status": "active", "usage_count": 0, "priority": "P0", "consecutive_hook": 1, "direction_hook": "情感共鸣", "arm_id": 5, "batch_num": 1, "signals": ["女儿想在同学家过夜被爸爸拒绝(8分·家庭边界·依恋类型)", "哥哥去世嫂子改嫁女子抚养侄子(8分·责任依恋·自我觉醒)"], "paradigm": "情感共鸣·Fe-Ni依恋类型边界解剖型(INFJ首触·身份认同batch2达上限轮出·8分双旗舰·Fe家庭边界:拒绝vs承担两种爱的语言+Ni底层模式:依恋类型操作系统的翻译·信任8.13高基线)", "role": "P0🔴·INFJ情感共鸣首触·8分双旗舰·Fe-Ni依恋类型翻译·身份认同轮出后接棒", "direction_compliance": "D21-B4 direction-vessel arm5 100%对齐", "flagship": true, "attachment_theory_resonance": true, "note": "身份 let ALL = [];
let POOL = null;

function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function fmtDate(s){if(!s)return '—';const d=new Date(s);if(isNaN(d))return s;return d.toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})}
function qClass(q){if(q==null||q===0)return'zero';if(q>=8.8)return'hi';if(q>=8)return'mid';return'lo'}
function qLabel(q){return (q==null||q===0)?'—':q}

function statusBadge(s){
  if(s==='active')return'<span class="badge active">● active</span>';
  if(s==='deployed')return'<span class="badge deployed">● deployed</span>';
  if(s==='hook_conflict')return'<span class="badge conflict">● hook_conflict</span>';
  return'<span class="badge">'+esc(s)+'</span>';
}

function load(){
  Promise.resolve(__DATA__).then(d=>{
    if(d.error){document.getElementById('banner').innerHTML='<div class="banner">⚠️ '+esc(d.error)+'<br>'+esc(d.path||'')+'</div>';return}
    POOL = d.pool_status||{};
    ALL = d.items||[];
    renderStats(d);
    fillFilters();
    render();
  }).catch(e=>{
    document.getElementById('banner').innerHTML='<div class="banner">⚠️ 加载失败：'+esc(e.message)+'</div>';
  });
}

function renderStats(d){
  const ps = POOL;
  const total = d.total||0;
  document.getElementById('dirs-count').textContent = '('+total+' 条)';
  const active = (d.items||[]).filter(i=>i.status==='active').length;
  const deployed = (d.items||[]).filter(i=>i.status==='deployed').length;
  const conflict = (d.items||[]).filter(i=>i.status==='hook_conflict').length;
  const lvl = ps.level ?? total;
  const cap = ps.max_capacity_soft ?? '—';
  const lvlCls = (typeof lvl==='number' && typeof cap==='number' && lvl>cap)?'crit':(typeof lvl==='number'&&lvl<5?'warn':'ok');
  document.getElementById('stats').innerHTML = `
    <div class="stat ${lvlCls}"><div class="val">${lvl}</div><div class="lbl">池水位（软上限 ${cap}）</div></div>
    <div class="stat"><div class="val">${total}</div><div class="lbl">总条目</div></div>
    <div class="stat ok"><div class="val">${active}</div><div class="lbl">active</div></div>
    <div class="stat"><div class="val">${deployed}</div><div class="lbl">deployed</div></div>
    <div class="stat warn"><div class="val">${conflict}</div><div class="lbl">hook_conflict</div></div>
    <div class="stat"><div class="val">${esc(ps.last_creation_batch||'—')}</div><div class="lbl">最新批次</div></div>
    <div class="stat"><div class="val" style="font-size:13px">${fmtDate(ps.last_creation)}</div><div class="lbl">最近创建</div></div>
    <div class="stat"><div class="val" style="font-size:13px">${fmtDate(ps.last_deployment)}</div><div class="lbl">最近部署</div></div>
  `;
  const statusTxt = ps.status ? ' · '+esc(ps.status) : '';
  document.getElementById('live-info').textContent = '池 '+lvl+' 条'+statusTxt;
  const b = document.getElementById('banner');
  if(ps.warning){
    b.innerHTML = '<div class="banner">⚠️ '+esc(ps.warning)+'</div>';
  } else {
    b.innerHTML = '';
  }
}

function fillFilters(){
  const hooks=new Set(), chans=new Set(), targets=new Set(), statuses=new Set();
  ALL.forEach(i=>{
    if(i.hook)hooks.add(i.hook);
    if(i.channel)chans.add(i.channel);
    if(i.status)statuses.add(i.status);
    (i.targets||[]).forEach(t=>{if(t)targets.add(t)});
  });
  const hookSel=document.getElementById('f-hook'), chSel=document.getElementById('f-channel'), tSel=document.getElementById('f-target'), sSel=document.getElementById('f-status');
  [...hooks].sort().forEach(h=>hookSel.insertAdjacentHTML('beforeend','<option>'+esc(h)+'</option>'));
  [...chans].sort().forEach(c=>chSel.insertAdjacentHTML('beforeend','<option>'+esc(c)+'</option>'));
  [...targets].sort().forEach(t=>tSel.insertAdjacentHTML('beforeend','<option>'+esc(t)+'</option>'));
  const sMap={active:'active',deployed:'deployed',hook_conflict:'hook_conflict'};
  Object.values(sMap).forEach(s=>sSel.insertAdjacentHTML('beforeend','<option value="'+s+'">'+s+'</option>'));
}

function filtered(){
  const hook=document.getElementById('f-hook').value;
  const chan=document.getElementById('f-channel').value;
  const target=document.getElementById('f-target').value;
  const status=document.getElementById('f-status').value;
  const quality=document.getElementById('f-quality').value;
  const search=document.getElementById('f-search').value.trim().toLowerCase();
  return ALL.filter(i=>{
    if(hook && i.hook!==hook)return false;
    if(chan && i.channel!==chan)return false;
    if(target && !(i.targets||[]).includes(target))return false;
    if(status && i.status!==status)return false;
    if(quality){
      const q=i.quality||0;
      if(quality==='hi'&&q<8.8)return false;
      if(quality==='mid'&&(q<8||q>=8.8))return false;
      if(quality==='lo'&&(q>=8||q===0))return false;
      if(quality==='zero'&&q!==0)return false;
    }
    if(search){
      const hay=(i.id+' '+i.title+' '+(i.paradigm||'')+' '+(i.role||'')).toLowerCase();
      if(!hay.includes(search))return false;
    }
    return true;
  });
}

function render(){
  const list=filtered();
  const grid=document.getElementById('grid');
  document.getElementById('count').textContent = list.length+' / '+ALL.length+' 条';
  document.getElementById('empty').style.display = list.length?'none':'block';
  if(!list.length){grid.innerHTML='';return}
  grid.innerHTML = list.map(i=>{
    const targets=(i.targets||[]).map(t=>'<span class="badge target">'+esc(t)+'</span>').join('');
    const extra = i.hook? '<span class="badge hook">'+esc(i.hook)+'</span>' : '';
    const hasPost = i.has_post? '<span class="badge post">🍠 成品</span>' : '';
    const chan = i.channel? '<span class="badge channel">'+esc(i.channel)+'</span>' : '';
    return `<div class="card" onclick="openModal('${esc(i.id)}')">
      <div class="cid">${esc(i.id)}${i.batch?' · '+esc(i.batch):''}${i.producer?' · '+esc(i.producer):''}</div>
      <div class="title">${esc(i.title)}</div>
      <div class="badges">${statusBadge(i.status)}${hasPost}${extra}${chan}${targets}</div>
      <div class="meta">
        <span>质量 <b class="q ${qClass(i.quality)}">${qLabel(i.quality)}</b></span>
        ${i.ttl_hours!=null?'<span>TTL <b>'+esc(i.ttl_hours)+'h</b></span>':''}
        ${i.budget!=null?'<span>预算 <b>¥'+esc(i.budget)+'</b></span>':''}
        ${i.usage_count!=null?'<span>使用 <b>'+esc(i.usage_count)+'</b></span>':''}
        ${i.created?'<span>创建 <b>'+fmtDate(i.created)+'</b></span>':''}
      </div>
    </div>`;
  }).join('');
}

function openModal(id){
  document.getElementById('modal-bg').classList.add('open');
  document.getElementById('m-title').textContent = id;
  document.getElementById('m-badges').innerHTML = '';
  document.getElementById('m-body').innerHTML = '<div class="field"><div class="k">加载详情…</div></div>';
  Promise.resolve((__DATA__.vessels||{})[id]||{error:'vessel 不存在',id:id}).then(d=>{
    if(d.error){document.getElementById('m-body').innerHTML='<div class="field"><div class="v">⚠️ '+esc(d.error)+'</div></div>';return}
    const c = d.content||{};
    const v = d.vessel||{};
    document.getElementById('m-title').textContent = c.title||id;
    document.getElementById('m-badges').innerHTML =
      (c.hook?'<span class="badge hook">'+esc(c.hook)+'</span>':'')+
      (c.channel?'<span class="badge channel">'+esc(c.channel)+'</span>':'')+
      ((c.targets||[]).map(t=>'<span class="badge target">'+esc(t)+'</span>').join(''))+
      '<span class="badge">'+statusBadge(c.status||'')+'</span>'+
      (c.quality!=null?'<span class="badge">质量 '+esc(c.quality)+'</span>':'')+
      (c.budget!=null?'<span class="badge">¥'+esc(c.budget)+'</span>':'');
    const rows=[];
    if(c.post){
      const p=c.post;
      if(p.cover_title)rows.push(['🍠 封面标题',p.cover_title]);
      if(p.body)rows.push(['🍠 正文（可直接发布）',p.body]);
      if(p.hashtags&&p.hashtags.length)rows.push(['🍠 话题标签',p.hashtags.join(' ')]);
      if(p.cta)rows.push(['🍠 互动引导 CTA',p.cta]);
      if(p.cover_visual)rows.push(['🍠 配图方向',p.cover_visual]);
      if(p.post_time)rows.push(['🍠 发布时间',p.post_time]);
      if(p.avoid)rows.push(['🍠 违禁规避',p.avoid]);
    }
    if(c.brief){
      const b=c.brief;
      if(b.pain_point)rows.push(['📝 痛点',b.pain_point]);
      if(b.hook_first3)rows.push(['📝 开头抓法',b.hook_first3]);
      if(b.emotion_curve)rows.push(['📝 情绪曲线',b.emotion_curve]);
      if(b.structure)rows.push(['📝 分段框架',Array.isArray(b.structure)?b.structure.join(' → '):b.structure]);
      if(b.differentiation)rows.push(['📝 差异化角度',b.differentiation]);
    }
    if(c.paradigm)rows.push(['创作范式 / 理由',c.paradigm]);
    if(c.role)rows.push(['角色定位',c.role]);
    if(c.signals&&c.signals.length)rows.push(['创作依据信号',c.signals.join('\n')]);
    if(c.direction_compliance)rows.push(['方向对齐',c.direction_compliance]);
    if(c.note)rows.push(['备注',c.note]);
    if(v.source)rows.push(['来源',(v.source.agent||'')+' · '+(v.source.subsystem||'')+' · '+(v.source.batch||'')]);
    if(v.created_at||c.created)rows.push(['创建时间',v.created_at||c.created]);
    if(c.flagship!=null)rows.push(['旗舰内容',c.flagship?'是':'否']);
    if(c.attachment_theory_resonance!=null)rows.push(['依恋母题',c.attachment_theory_resonance?'是':'否']);
    if(!rows.length)rows.push(['详情','（无额外字段）']);
    document.getElementById('m-body').innerHTML = rows.map(r=>'<div class="field"><div class="k">'+esc(r[0])+'</div><div class="v">'+esc(r[1])+'</div></div>').join('');
  }).catch(e=>{
    document.getElementById('m-body').innerHTML='<div class="field"><div class="v">⚠️ '+esc(e.message)+'</div></div>';
  });
}

function closeModal(){document.getElementById('modal-bg').classList.remove('open')}

function loadPosts(){
  Promise.resolve({posts:__DATA__.posts}).then(d=>{
    const posts = d.posts||[];
    document.getElementById('posts-count').textContent = posts.length? '('+posts.length+' 条)':'';
    const grid = document.getElementById('posts-grid');
    if(!posts.length){ grid.innerHTML='<div class="empty" style="display:block"><div class="icon">🍠</div>暂无成品帖子</div>'; return; }
    grid.innerHTML = posts.map(c=>{
      const p = c.post||{};
      const b = c.brief||{};
      const body = esc(p.body||'').replace(/\n/g,'<br>');
      const tags = (p.hashtags||[]).map(t=>'<span class="tag">#'+esc(String(t).replace(/^#/,''))+'</span>').join('');
      const metaBits = [c.hook, (c.targets||[]).join(','), c.quality!=null?'质量'+c.quality:'', c.status].filter(x=>x!==''&&x!=null&&x!==undefined);
      return `<div class="post">
        <div class="xhs-cover">
          <div class="xhs-cover-title">${esc(p.cover_title||c.title||c.id)}</div>
          <div class="xhs-meta">${metaBits.map(m=>esc(m)).join(' · ')}</div>
        </div>
        <div class="xhs-body">${body}</div>
        ${tags?'<div class="xhs-tags">'+tags+'</div>':''}
        ${p.cta?'<div class="xhs-cta">💬 '+esc(p.cta)+'</div>':''}
        <details class="xhs-extra"><summary>配图 / 时间 / 规避 / 创作指引</summary>
          <div class="xhs-extra-body">
            ${p.cover_visual?'<p><b>配图方向：</b>'+esc(p.cover_visual)+'</p>':''}
            ${p.post_time?'<p><b>发布时间：</b>'+esc(p.post_time)+'</p>':''}
            ${p.avoid?'<p><b>违禁规避：</b>'+esc(p.avoid)+'</p>':''}
            ${(b.pain_point||b.hook_first3||b.emotion_curve||b.structure||b.differentiation)?'<hr>':''}
            ${b.pain_point?'<p><b>痛点：</b>'+esc(b.pain_point)+'</p>':''}
            ${b.hook_first3?'<p><b>开头抓法：</b>'+esc(b.hook_first3)+'</p>':''}
            ${b.emotion_curve?'<p><b>情绪曲线：</b>'+esc(b.emotion_curve)+'</p>':''}
            ${b.structure?'<p><b>分段框架：</b>'+esc(Array.isArray(b.structure)?b.structure.join(' → '):b.structure)+'</p>':''}
            ${b.differentiation?'<p><b>差异化：</b>'+esc(b.differentiation)+'</p>':''}
          </div>
        </details>
      </div>`;
    }).join('');
  }).catch(e=>{
    document.getElementById('posts-grid').innerHTML='<div class="empty" style="display:block">成品加载失败：'+esc(e.message)+'</div>';
  });
}
document.getElementById('modal-bg').addEventListener('click',e=>{if(e.target.id==='modal-bg')closeModal()});
['f-hook','f-channel','f-target','f-status','f-quality'].forEach(id=>document.getElementById(id).addEventListener('change',render));
document.getElementById('f-search').addEventListener('input',render);
load();
loadPosts();
function switchTab(tab){
  document.getElementById('tab-posts').classList.toggle('active', tab==='posts');
  document.getElementById('tab-dirs').classList.toggle('active', tab==='dirs');
  document.getElementById('panel-posts').style.display = tab==='posts'?'':'none';
  document.getElementById('panel-dirs').style.display = tab==='dirs'?'':'none';
}
document.getElementById('tab-posts').addEventListener('click', ()=>switchTab('posts'));
document.getElementById('tab-dirs').addEventListener('click', ()=>switchTab('dirs'));
</script>
