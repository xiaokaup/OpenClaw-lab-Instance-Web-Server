人发现：不是制度有漏洞，是ISTJ最珍视的那种「体面」被系统辜负了", "hook": "身份认同", "sub_hook": "情感共鸣", "paradigm": "微博话题体（身份认同·ISTJ模式）", "sub_paradigm": "微博话题体", "target_personalities": ["ISTJ"], "quality_score": 8.7, "estimated_ctr": 3.2, "estimated_share_rate": 0.14, "core_argument": "ISTJ最珍视的不是「安全」——是「体面」。当一个通缉犯可以在大学里安安稳稳教了十年书，普通人看到的是「制度漏洞」，ISTJ感受到的是一种更深层的不适：「我每天按时打卡、遵守流程、信任系统……而系统告诉我，你的信任一文不值。」这种破坏性身份认同——告诉你相信的东西背叛了你——比建设性身份认同更有穿透力。", "word_count_core": 560, "tags": ["ISTJ", "身份认同", "体制信任", "通缉犯", "华师大", "体面"], "signal_id": "sig-20260728-004", "signal_heat": 165, "signal_title": "美通缉重犯被曝在华东师范大学任教十余年"}, "adapters": {"微博": {"format": "话题短文", "length_words": 560, "style": "话题引爆·深度共情·低刺激高穿透", "body": "#通缉犯在大学教书十年这不是制度漏洞#\n\n一个美国通缉犯，在中国顶尖大学教书十年。不需要假身份，不需要躲躲藏藏。就是正常入职、正常上课、正常领工资。\n\n十年。没人发现。\n\n评论区分两派：\n一派说「制度漏洞」「审查形同虚设」「系统崩塌」\n另一派——ISTJ那派——不说话。\n\n因为ISTJ受到的暴击跟别人不一样。\n\n你不是恐惧。你是：**「我每天按时打卡、遵守流程、信任系统。而系统说——你的信任不值钱。」**\n\n这是ISTJ最怕的事。不是危险，不是混乱。是「体面」被辜负。\n\nSi-dom的人把人生建立在「正规流程会保护正规人」的信念上。流程就是他的安全感。规则就是他的道德锚。\n\n所以当系统告诉你「规则只是摆设」，ISTJ不是愤怒——是沉默。\n\n沉默意味着：**你在重新校准你花了半辈子建立的那套坐标系。**\n\n🔥 这篇文章不是制造焦虑。\n是替所有沉默的ISTJ说一句话：\n**你的信任没有被浪费。是有人辜负了它。**\n\n#ISTJ受伤时的沉默# #体面被系统辜负# #通缉犯任教华师大十年#", "cta": "测测你的完整人格 → 链接"}, "小红书": {"format": "图文卡片", "length_words": 350, "style": "情感共振·emoji·低密度高深度", "body": "😶 ISTJ受伤时不会哭 只会沉默\n因为他们最珍视的东西不是安全感——\n是「体面」\n\n通缉犯大学教书十年这条新闻\n普通人看到：制度漏洞❌\nISTJ看到：我每天遵守规则 → 你在告诉我规则是摆设？ ❌❌❌\n\nSi-dom的世界观建立在一条信念上：\n**走正规流程的人会被正规流程保护**\n\n当系统用十年时间证明这条信念是假的……\nISTJ不是愤怒。不是喊叫。\n是沉默。\n\n因为他在重新校准花了半辈子建的那套坐标系\n这才是真正的伤害💔\n\n如果你今天特别安静——\n也许不是累了\n是你相信的东西被辜负了一次\n\n#ISTJ体面受伤# #规则型人格的沉默#", "cta": "测测你的人格完整画像"}, "B站": {"format": "深度图文", "length_words": 800, "style": "深度分析+人格心理+共情收尾", "body": "## 通缉犯在大学教书十年无人发现：不是制度有漏洞，是ISTJ最珍视的那种「体面」被系统辜负了\n\n2026年7月，一条新闻静悄悄地上了热搜：一名美国通缉犯，在华东师范大学任教十余年，直至最近才被发现。\n\n公众的反应集中在「制度审查形同虚设」「背景调查失效」上。合理。但我更关心另一群人——那些看完新闻之后什么都没说的人。\n\n### 沉默的是谁？\n\nISTJ。\n\n16型人格中最「遵守规则」的一群人。从小按时交作业、上班从不迟到、报销严格按流程、审批逐级走。他们不是天生就爱规则——他们相信规则。他们相信「走正规流程的人，会被正规流程保护」。\n\n这条信念，是他们安身立命的基石。\n\n### 而这条新闻做了什么？\n\n它用十年时间，证明了——不是所有走正规流程的人，都会被正规流程保护。不是所有信任系统的人，都会被系统对得起。\n\n这不是对ISTJ「安全需求」的攻击。这是对他们「身份认同」的攻击。\n\nISTJ受伤的方式不是愤怒。不是哭喊。是沉默。因为Si-dom需要时间——重新校准花了半辈子建的那套坐标系。\n\n### 我们能做什么？\n\n不需要安慰。不需要「制度会变好的」。ISTJ不需要廉价的情感补偿。\n\n他们需要的是：有人理解他们的沉默不是冷漠，而是「体面被辜负」后的一种自我重建。\n\n#ISTJ受伤时的沉默# #体制信任危机# #你不是一个人在安静#", "cta": "测测你的完整人格深度"}, "抖音": {"format": "短视频脚本", "length_words": 450, "style": "冲击开场·静默节奏·反转收束", "body": "【0-3s】（黑屏白字）\n一个美国通缉犯在中国大学教了十年书。\n十年。没人发现。\n但我要说的不是制度。（停顿）\n\n我要说的是一群正在沉默的人。\n\n【3-15s】\nISTJ。\n你身边最靠谱的那种人。\n每天按时打卡。遵守流程。信任系统。\n\n他们看到这条新闻的反应是什么？\n不是愤怒。\n是沉默。\n\n因为ISTJ的人生建立在一条信念上：\n「走正规流程的人，会被正规流程保护。」\n\n而这条新闻用十年时间告诉他——\n（停顿）\n你错了。\n\n【15-25s】\nISTJ受伤时不会发朋友圈。\n不会在评论区喷。\n他们只是安静地……重新校准自己花了半辈子建的那套规则体系。\n\n这才是最深的伤害。\n\n【25-30s】\n你身边有没有突然变得很安静的ISTJ？\n或许不是累了。\n是你相信的东西被辜负了一次。\n👉 测测你的完整人格", "cta": "👉 测测你的完整人格"}}, "channels_recommended": ["微博"], "channels_possible": ["微博", "小红书", "B站", "抖音"], "channels_excluded": [], "usage": {"count": 0, "last_used": null, "max_reuse": 3, "status": "active"}, "performance": {"actual_ctr": null, "actual_roi": null, "by_channel": {}}}}, "D21-B1-ENFJ-1": {"vessel": {"version": "1.0", "type": "content-vessel", "id": "D21-B1-ENFJ-1", "source": {"agent": "大卡", "subsystem": "平台·知识管理·紧急补产", "batch": "D21-B1"}, "created_at": "2026-08-10T08:55:00+08:00", "freshness_ttl_hours": 72, "priority": "p0"}, "payload": {"id": "D21-B1-ENFJ-1", "title": "Chinamaxxing 9分背后，ENFJ看到的不是「我们很强」——是「我们终于不用向大家证明自己了，可以开始照顾自己了」", "hook": "身份认同", "targets": ["ENFJ"], "channel": "微博", "quality": 8.6, "created": "2026-08-10T08:55:00+08:00", "ttl_hours": 72, "status": "active", "usage_count": 0, "budget": 25, "arm_id": null, "priority": "P2", "signal": "Chinamaxxing 9分(身份认同·ENFJ恢复首触·D10→D20休息后回归·Fe-dom弹性)", "paradigm": "身份认同·ENFJ Fe-Ni·文化守护者型(Chinamaxxing 9分·从证明→照顾的身份转变·Fe-集体关怀·微博渠道匹配)", "role": "P2·ENFJ D21-B1新恢复·身份认同·零匹配缺口填补·Fe-dom弹性恢复窗口(≥4批间隔)·信任7.07→目标7.2+", "consecutive_hook": "1", "trust_baseline": "7.07", "direction_compliance": "D21-B1方向船·ENFJ身份认同微博 P2🆕(RECOVERY)·D10→D20休息·弹性恢复首触", "full_content": "ENFJ在看Chinamaxxing的时候，眼睛里没有一个字在说「我们赢了」。\n\n你们在看另一件事——那些说「中国很强」的人的脸。\n\n不是说这句话的人。是那些听到这句话终于松了一口气的人。\n\n这才是ENFJ的天赋：你们不是在读「信息」，你们在读「信息背后的那个人需要什么」。\n\nChinamaxxing 9分的热度里，藏着一条只有ENFJ能看见的暗线：这不是一场关于「中国」的讨论。这是一场关于「被看见」的集体疗愈。\n\n一百七十年前，我们被列强的炮舰打开国门。不是「输了」的问题——是被迫意识到「我可能不够好」。\n\n从那一天起，中国人一直在做一件事：证明自己。\n\n证明我们也能造铁路。证明我们也能造原子弹。证明我们也能办奥运会。证明我们也能有航母、有空间站、有AI大模型。\n\n一百七十年的证明。每一代人都在对世界说：你看，我们也可以。\n\nENFJ最懂这种心态有多累。因为你们自己就是最容易陷入「证明模式」的人——Fe功能让你下意识地想让所有人满意，让你觉得「如果大家不开心，一定是我的问题」。\n\n你一辈子都在试图证明自己是一个好人、一个好伙伴、一个好领导者。\n\n然后有一天你突然发现：等一下，我为什么需要证明？\n\nChinamaxxing的底层心理转折就在这里——从「你看我也可以」变成了「我看我自己就可以了」。\n\nENFJ在D10到D20休息了整整十批。Fe弹性模型说：ENFJ需要至少三批的间隔，让那个一直在照顾别人的系统有机会照顾一下自己。\n\n你们回来了。在D21-B1。\n\n带着信任7.07的基线，带着十批静默中重新长出来的能量。\n\n而你们回来的第一天，迎接你们的恰好是这个信号——Chinamaxxing 9分。不是关于「强」的信号。是关于「够了」的信号。\n\n够了。证明够了。\n\n微博上有一个帖子，转发两万条，只有一句话：「我爷爷一辈子都觉得中国人不如外国人，如果他活到今天，不知道会说什么。」\n\nENFJ在这个帖子里看到的不是「扬眉吐气」——是「如果他能活到今天，他会允许自己开心吗？」\n\n这才是Fe-Ni视角下Chinamaxxing真正的意义：不是集体自尊的崛起，是集体焦虑的释放。\n\n一百七十年的证明终于可以停了。不是因为证明完了——是因为我们发现，不需要证明也可以活得很好。\n\nENFJ在这个时刻回归，不是巧合。\n\n你们天生就知道怎么照顾一个刚刚从漫长的「证明期」里走出来的人。\n\n现在，中国就是那个人。\n\nENFJ不需要喊「我们很强」。你们只需要做你们最擅长的事——拍拍那个累了一百七十年的人的肩膀，说一句：「不用证明了，坐会儿吧」"}}, "D21-B14-INTP-1": {"vessel": {"version": "1.0", "type": "content-vessel", "id": "D21-B14-INTP-1", "source": {"agent": "设设", "subsystem": "内容Spoke-1", "batch": "D21-B14"}, "created_at": "2026-08-23T08:35:00+08:00", "freshness_ttl_hours": 72, "priority": "p1", "dependencies": [{"vessel_type": "direction-vessel", "vessel_id": "direction-vessel-2026-08-23-0815"}, {"vessel_type": "strategy-pool", "vessel_id": "strategy-pool-2026-08-23-0815"}, {"vessel_type": "signal-pool", "vessel_id": "signal-pool-2026-08-23-0815"}]}, "content": {"id": "D21-B14-INTP-1", "title": "「越会用AI的人，学习能力退化得越快」——INTP看到的是一个关于工具的悖论：当你把「想」外包出去，你的「想」就会开始生锈", "hook": "好奇心", "targets": ["INTP"], "channel": "B站", "quality": 8.5, "budget": 25, "status": "active", "usage_count": 0, "priority": "P1", "consecutive_hook": 1, "direction_hook": "好奇心", "arm_id": 7, "batch_num": 1, "signals": ["越会用AI的人，学习能力退化得越快(36kr·好奇心·认知·heat91·Ti认知)"], "paradigm": "好奇心·Ti认知悖论型(INTP好奇心batch1首触·身份认同B13后轮出→好奇心·36kr AI信号·Ti:工具依赖与能力退化悖论·B站¥25轻触·防15批螺旋·B14观察质量)", "role": "P1·INTP好奇心batch1首触(36kr AI·Ti认知)·B站¥25轻触·方向船key_decision「INTP轻触观察(36kr AI信号·防螺旋)·B站¥25」", "direction_compliance": "D21-B14 direction-vessel key_decision对齐·INTP×好奇心×B站·channel_mix B站28.6%(INTJ+INTP)", "flagship": false, "attachment_theory_resonance": false, "note": "🟢 fresh(INTP好奇心batch1·身份认同B13后轮出)·36kr AI信号·Ti认知悖论·B站¥25轻触·防15批螺旋·B14观察质量", "brief": {"pain_point": "INTP的Ti以「独立思考」为身份核心，最警惕「依赖工具导致能力退化」的悖论；「越会用AI越不会学」恰好戳中INTP对「外包思考」的本能警觉，同时满足其对认知机制的好奇。", "hook_first3": "第一行「越会用AI的人，学习能力退化得越快」直接抛出悖论；第二行「听起来反直觉，但INTP知道这是真的」亮态度；第三行「因为当你把『想』外包出去，你的『想』就会开始生锈」切入Ti机制拆解。", "emotion_curve": "警觉(悖论) → 认同(外包思考) → 拆解(用进废退) → 自省(我依赖了吗) → 落点(工具是杠杆不是拐杖)。", "structure": ["钩子·悖论", "机制·外包思考=用进废退", "洞察·工具是杠杆不是拐杖", "自省·警惕能力生锈", "CTA·你现在最依赖哪个AI"], "differentiation": "别人写AI是「焦虑贩卖/恐吓被取代/鸡汤自律」，我们讲「工具是杠杆不是拐杖，关键是保留自己『想』的能力」；Ti落点「用进废退的认知机制」，理性、不贩卖焦虑、不反技术。"}}}, "D20-B2-ISTJ-1": {"id": "D20-B2-ISTJ-1", "title": "一个员工泡在水里2小时捞公司手机，换来一张表扬状——ISTJ看到这条新闻的时候没有说话，但他的Si系统已经在后台调出了你公司里那个做了最多事、拿最少钱的人的脸", "hook": "社会证明", "targets": ["ISTJ"], "channel": "微博", "quality": 8.6, "created": "2026-08-04T10:20:00+08:00", "ttl_hours": 72, "status": "active", "usage_count": 0, "vessel_ref": "workspace-shared/pools/content-vessels/D20-B2-ISTJ-1.json", "paradigm": "社会证明·Si-Te公正审计型(ISTJ社会证明轻触·员工泡水事件+国博声明·Si规则公正·社会证明=他人对可靠性的见证)", "role": "social_proof_light_touch·ISTJ社会证明轻触·Si规则公正·信任7.60维护·SJ象限微博存在·冷启动维持", "source_agent": "大卡", "escalation_ref": "ESC-2026-08-01-1(设设结构性角色缺口·方案D fallback)", "script": {"format": "微博图文·5段结构", "segments": [{"id": 1, "type": "hook", "text": "一个员工跳进水里泡了2小时，把所有客人的手机捞上来了。公司给了什么？一张表扬状。ISTJ看到这条新闻的感受，和别人不一样。"}, {"id": 2, "type": "setup", "text": "别人看到的是'不公平'。ISTJ的Si-Te系统看到的是另一个东西：一个规则失效的现场。Si系统会自动调出所有类似事件的档案——你见过多少次'做最多事的人拿最少回报'？你的Si后台里有一个完整的数据库，每一笔都记得清清楚楚。"}, {"id": 3, "type": "conflict", "text": "但ISTJ不会冲上去闹。你不会发朋友圈骂公司。你只会默默地把这件事归档进你的Si系统，然后在下次有人问你'为什么不多做一点'的时候，你心里已经有一个精确到分钟的答案。"}, {"id": 4, "type": "reveal", "text": "社会证明对ISTJ来说不是'有多少人点赞'——是'有多少次，别人在没人看着的时候，默默地承认了你的价值'。那个泡水的员工不需要表扬状，他需要的是一张工资单上多出来的一个零。ISTJ也不需要掌声，你需要的是规则被执行。"}, {"id": 5, "type": "cta", "text": "转发这条，不是替那个员工发声——是替你身体里那个'做了所有事但从来不说'的部分发声。ISTJ的沉默不是懦弱，是积蓄。有一天你开口的时候，你Si里的全部证据会替你说话。"}]}}, "D20-B4-ENFJ-1": {"id": "D20-B4-ENFJ-1", "title": "41岁的妈妈考上了985研究生——ENFJ看到的不是'励志妈妈'，她的Fe系统看到的是另一个故事：一个妈妈终于开始为自己的人生投资了。而比她更早看到这件事的，可能是她的女儿——女儿支持妈妈考研的那句'妈，你去考吧'，才是这条新闻里最温柔的齿轮", "hook": "身份认同", "targets": ["ENFJ"], "channel": "小红书", "quality": 8.5, "created": "2026-08-06T08:30:00+08:00", "ttl_hours": 72, "status": "active", "usage_count": 0, "vessel_ref": "workspace-shared/pools/content-vessels/D20-B4-ENFJ-1.json", "paradigm": "身份认同·Fe-Ni教育赋能型(ENFJ弹性轻触恢复·D20首触·41岁妈妈985(9分)·Fe教育赋能视角·轻量短图文·信任7.46·Fe-dom弹性验证)", "role": "elastic_light_touch·ENFJ D20弹性轻触恢复·Fe教育赋能·1篇轻量短图文·信任7.46维护·与INFJ同渠道双Fe弹性", "source_agent": "设设", "direction_ref": "D20-B4 direction-vessel·策策08:15·ENFJ身份认同weight=0.10·arm_id=8·信号:41岁妈妈985(9分)·小红书25%渠道·D20-B3 excluded→D20-B4恢复", "mandate_ref": "D20-B4 vessel.mandates·max_consecutive_same_hook=2(身份认同第1批)✅·max_targets_per_personality_per_day=1✅·excluded_hooks未触碰✅", "script": {"format": "小红书轻量短图文·5段结构", "segments": [{"id": 1, "type": "hook", "text": "41岁的妈妈，考上了985研究生。热搜都在夸她'励志'。但ENFJ的Fe系统看到的画面不太一样：她决定考研的那个晚上，家里大概率有一个人跟她说——'妈，你去考吧，家里有我。'", "duration_sec": 10}, {"id": 2, "type": "setup", "text": "ENFJ的Fe系统天生会看'关系'，而不是'事件'。41岁妈妈考上985，在别人眼里是一个人的奋斗史；在ENFJ眼里，是一个家庭系统的能量重组：女儿开始反哺妈妈的人生，丈夫开始分担原本默认的'妈妈职责'，而这个妈妈，终于从'为家庭活'的轨道上，拿到了一张通往'为自己活'的车票。985录取通知书不是重点——重点是，这一次，全家都在她身后。", "duration_sec": 15}, {"id": 3, "type": "conflict", "text": "最打动ENFJ的不是'41岁还能考上'，而是'41岁终于被允许去考'。很多妈妈不是没有梦想，是她们的梦想一直被排在家庭清单的最后一位。而这条新闻里真正珍贵的，是那个女儿——一个13岁的孩子都会说'妈你去考吧'，而多少成年子女，直到父母老了才想起来问'你年轻时想做什么'？ENFJ的Fe系统看到的是：教育赋能的本质，从来不是一个人变强，是关系的能量开始双向流动。", "duration_sec": 15}, {"id": 4, "type": "reveal", "text": "这就是ENFJ的认知引擎——当别人在新闻里看到'个人成就'，你在新闻里看到'关系革命'。你的Fe系统天生会捕捉那些没有被写进标题的齿轮：支持女儿的妈妈、支持妈妈的女儿、重新分配的家庭角色。你天生就知道：一个人能走多远，取决于她身后的关系网愿不愿意给她让路。而你，天然就是那个'愿意给别人让路'的人——这也是为什么，你身边总有人因为你，才敢迈出第一步。", "duration_sec": 15}, {"id": 5, "type": "cta", "text": "如果你看到这条新闻时，第一个想到的是'她家人一定很支持她'——恭喜你，你的Fe系统就是你的超能力。转发给那个'总在成就别人'的朋友，告诉她：你也值得被支持一次。想更懂自己这种'成就别人'的天赋从哪来，评论区聊聊，或做一次深度人格报告。", "duration_sec": 10}]}, "brief": {"pain_point": "ENFJ的Fe习惯'成就别人'，却常忽略自己；41岁妈妈考研背后的'被支持'正是ENFJ最渴望又最不敢要的东西。", "hook_first3": "'41岁的妈妈考上了985研究生'点事件；'热搜都在夸她励志'摆反应；'但我看到的画面不太一样'切视角+悬念。", "emotion_curve": "佩服(励志) → 被戳中(梦想被排在最后) → 动容(女儿那句\"你去考吧\") → 赋能(关系能量双向流动)。", "structure": ["钩子·事件", "反转·不是励志是被允许", "洞察·最珍贵的齿轮是女儿", "升华·教育赋能=关系双向流动", "CTA·转发给成就别人的人"], "differentiation": "别人写41岁妈妈讲'励志逆袭'，我们讲'终于被允许去考'；Fe关系视角落到'支持系统'而非个人奋斗。"}, "post": {"cover_title": "41岁妈妈考研，被女儿点亮", "body": "41岁的妈妈，考上了985研究生。\n\n热搜都在夸她「励志」。\n\n但我看到的画面不太一样——\n她决定考研的那个晚上，\n家里大概率有一个人跟她说：\n\n\"妈，你去考吧，家里有我。\"💗\n\n这句话，才是这条新闻里最温柔的齿轮。\n\n很多妈妈不是没有梦想，\n是她们的梦想，\n一直被排在家庭清单的最后一位。\n\n而这条新闻真正珍贵的，\n是那个女儿——\n一个孩子都会说\"妈你去考吧\"，\n而多少成年子女，\n直到父母老了才想起来问：\n\"你年轻时想做什么？\"\n\n教育赋能的本质，\n从来不是一个人变强，\n是关系的能量，开始双向流动。✨\n\n一个人能走多远，\n取决于她身后的人，\n愿不愿意给她让路。\n\n而你，天生就是那个\n「愿意给别人让路」的人。\n\n💬 转发给那个总在成就别人的朋友，\n告诉她：你也值得被支持一次。", "hashtags": ["#MBTI", "#ENFJ", "#女性成长", "#教育", "#被支持"], "cover_visual": "温暖书桌光，一本摊开的书+一杯茶，旁边一张全家福；大字\"41岁妈妈考研，被女儿点亮\"；治愈、力量感、留白。", "cta": "转发给那个总在成就别人的朋友，告诉她：你也值得被支持一次。", "post_time": "20:00-21:00（女性/家庭话题高峰）", "avoid": "不贩卖\"妈妈牺牲\"焦虑、不制造家庭对立（女儿支持是正向，不贬低其他家庭）；避免\"别人家的孩子/妈妈\"比较。"}, "post_spec_version": "v2.0", "content": {"post": {"cover_title": "妈妈考研，女儿是第一个支持的人", "body": "41 岁的妈妈，考上了 985 研究生。\n\n很多人看到的是「励志」。\n\n但 ENFJ 看到的是另一个更温柔的故事——\n\n妈妈终于开始，为自己的人生投资了。\n\n而比妈妈更早看到这件事的，是她的女儿。\n\n女儿那句「妈，你去考吧」，才是这条新闻里，最温柔的齿轮。\n\nENFJ 太懂这种「被家人托住」的力量了。\n\n一个人敢在 41 岁重启人生，不是因为不怕，是因为身后有人对她说：\n「你去，我托着你。」\n\n所以你看，一个女人的野心，往往是被爱点亮的那盏灯。", "hashtags": ["#ENFJ", "#妈妈考研", "#女性成长", "#家庭", "#温柔的力量"], "cta": "你人生里，有没有一句「你去吧」推过你一把？说说那个人。", "cover_visual": "妈妈伏案学习的背影 + 女儿在门口微笑的画面，暖光，生活感", "post_time": "晚 20:30-22:00", "avoid": "不强化「妈妈牺牲」的苦情、不制造代际对立、聚焦支持而非牺牲"}, "brief": {"pain_point": "ENFJ 对「被家人托住」的深层共鸣与女性成长议题", "hook_first3": "「41岁妈妈考985」具体故事 + 「最温柔齿轮」的情感反转", "emotion_curve": "励志→温柔→共鸣（妈妈→女儿→被托住）", "structure": ["故事切入", "ENFJ 的独特视角", "被托住的力量", "野心是爱点亮的"], "differentiation": "不从「励志」谈，从「支持」谈，正中 ENFJ 的 Fe 关系视角"}}}, "D15-B3-3": {"vessel": {"version": "1.0", "type": "content-vessel", "id": "D15-B3-3", "source": {"agent": "设设", "subsystem": "内容创作", "batch": "D15-B3"}, "created_at": "2026-07-29T18:15:00+08:00", "freshness_ttl_hours": 72, "priority": "high", "tags": ["ESTJ", "情感共鸣", "责任重负型", "Si-Te", "D15首触", "去污名化"], "info_contract": {"excludes": "INFP受众·恐惧按钮·已退役或品质<8.0", "expires_after": "72h未使用→自动降权冷备"}}, "payload": {"content_id": "D15-B3-3", "title": "被全公司吐槽「太严格」的ESTJ主管，每天下班后在地铁最后一节车厢听周杰伦——「我凶是因为我没资格崩」", "hook": "情感共鸣", "hook_subtype": "责任重负型", "targets": ["ESTJ"], "channel": "微博", "quality": 8.7, "word_count": 880, "paradigm": "情感共鸣·责任重负型(Si-Te新范式·ISTJ身份认同的变形)", "core_insight": "ESTJ的Te-dom让她们看起来强硬·Si辅助让其承担隐形责任簿·最被误解的人最需要被看见而非被夸奖·'我凶是因为我没资格崩'", "key_mechanism": "Te(A面·效率/标准/推进)+Si(B面·责任簿/替人记苦衷)→公开形象冷酷→私下承担全部→情感共鸣爆发点='被看见'而非'被夸奖'", "signal_source": "D15未触达型情感破冰·Si-Te象限负重型范式创新·ISTJ身份认同(D15-B1-2)共享母题", "adapters": {"微博": {"type": "main", "word_count": 880, "tone": "话题引爆·微纪录片·情感反转·金句收束"}, "B站": {"type": "secondary", "word_count": 750, "tone": "深度分析·Te-Si机制拆解·去污名化叙事"}, "小红书": {"type": "tertiary", "word_count": 350, "tone": "生活化共鸣·emoji·'责任簿'可视图"}, "抖音": {"type": "short", "word_count": 400, "tone": "微纪录片体·办公室场景·周杰伦情感锚"}}, "estimated_performance": {"estimated_ctr": 3.25, "estimated_share_rate": 0.15, "note": "ESTJ首次D15靶向·情感共鸣去污名化·微博话题引爆体·预期CTR中高·分享可能来自ESTJ自我认同+非ESTJ'想发给主管'"}, "paradigm_note": "Si-Te负重范式新创·ISTJ(D15-B1-2=体面被辜负)+ESTJ(D15-B3-3=责任不被看见)共享'不被看见的系统性负重'母题·可扩展至ISFJ(付出不被记住)"}}, "D21-B21-ENFJ-1": {"vessel": {"version": "1.0", "type": "content-vessel", "id": "D21-B21-ENFJ-1", "source": {"agent": "设设", "subsystem": "内容Spoke-1", "batch": "D21-B21"}, "created_at": "2026-09-05T08:55:00+08:00", "freshness_ttl_hours": 72, "priority": "p0", "dependencies": [{"vessel_type": "direction-vessel", "vessel_id": "direction-vessel-2026-09-05-0815"}, {"vessel_type": "direction-pool", "vessel_id": "direction-pool-2026-09-05-0815"}, {"vessel_type": "strategy-pool", "vessel_id": "strategy-pool-2026-09-05-0815"}, {"vessel_type": "signal-pool", "vessel_id": "signal-pool-2026-09-05-0815"}]}, "content": {"id": "D21-B21-ENFJ-1", "title": "「员工拒坐硬座通宵出差被开除」——ENFJ的Fe看到的不是『矫情』。它看到的是：一个人敢为自己的尊严和边界说『不』，是成年人最体面的勇敢——守住底线，不是对抗，是自我尊重", "hook": "身份认同", "targets": ["ENFJ"], "channel": "微博", "quality": 8.4, "budget": 25, "status": "active", "usage_count": 0, "priority": "P1", "consecutive_hook": 1, "direction_hook": "身份认同", "arm_id": 4, "batch_num": 1, "signals": ["员工拒坐硬座通宵出差被开除(6分·身份认同·职场权益/尊严边界·heat617万)"], "paradigm": "身份认同·Fe尊严边界型(ENFJ换hook·员工拒坐硬座6·Fe:对具体尊严与边界的守护·社会证明(B20)→身份认同换hook·⚠️用尊严/边界意识角度·严禁渲染职场对立/求职焦虑)", "role": "P1·ENFJ身份认同换hook batch1(员工拒坐硬座6·职场权益/尊严边界)·微博Fe舆论位·方向船社会证明(B20)→身份认同换hook·⚠️严禁渲染职场对立", "direction_compliance": "D21-B21 rotation对齐·ENFJ×身份认同×微博·换hook batch1·身份认同#4·社会证明(B20)→身份认同", "flagship": false, "attachment_theory_resonance": false, "note": "🟢 fresh(D21-B21停摆后首恢复·ENFJ身份认同换hook batch1)·依据B21方向船mandates+priority_types+signal-pool·⚠️用尊严/边界意识角度·严禁渲染职场对立/求职焦虑·投投冻结延续·解冻后按方向船部署", "brief": {"pain_point": "ENFJ的Fe最擅长照顾别人，却常常忽略自己的边界。一个员工拒绝『硬座通宵出差』这种透支身体的安排，击中的是ENFJ对『边界感』的共鸣——为他人付出是美德，但守住自己的底线，同样是自我尊重。", "hook_first3": "第一行『员工拒坐硬座通宵出差，被开除』抛出争议事实；第二行『很多人说他矫情，但ENFJ看到的恰恰相反』点出视角；第三行『守住底线，不是对抗，是一个人最体面的自我尊重』切入Fe。", "emotion_curve": "不平(被开除) → 理解(边界意识) → 认同(守住底线=自我尊重) → 释然(善意≠透支自己) → 坚定(学会说不)。", "structure": ["钩子·争议事实", "主流误读·矫情", "洞察·尊严与边界", "迁移·ENFJ也要学会说不", "CTA·你守住过什么底线"], "differentiation": "别人写职场对立/骂公司/贩卖求职焦虑，我们写Fe的『尊严边界意识』——不渲染对立，落点『守住底线是自我尊重不是对抗』；把『拒坐硬座』还原成『边界意识』，让ENFJ看见照顾自己也是照顾他人。"}, "deployment": {"allowed": true, "state": "active-ready", "reason": "B21方向授权已获取(gate PASS·ESC-2026-09-05-1 resolved)·投投冻结延续(控控budget-vessel明令·支付~899h+分发桶94.25%双红线)·触达重建第一优先·解冻后按方向船执行", "authorization": "B21方向船已授权·投投解冻后部署"}, "deployment_authorization": "B21方向船已授权·投投解冻后部署"}}, "D21-B11-INTJ-1": {"vessel": {"version": "1.0", "type": "content-vessel", "id": "D21-B11-INTJ-1", "source": {"agent": "大卡", "subsystem": "内容Spoke-1", "batch": "D21-B11"}, "created_at": "2026-08-20T01:00:59.639354+08:00", "freshness_ttl_hours": 72, "priority": "p0"}, "content": {"id": "D21-B11-INTJ-1", "title": "INTJ 不陪你情绪内耗，他直接给你三套方案", "hook": "反常识", "targets": ["INTJ"], "channel": "小红书", "quality": 8.8, "budget": 25, "status": "active", "usage_count": 0, "priority": "P0", "paradigm": "反常识·Ni 系统重构型（INTJ 首触·高效决策·情绪内耗解药）", "signals": ["反内耗", "高效思维"], "post": {"cover_title": "INTJ 不陪你内耗，他直接给方案", "body": "你在情绪里打转，INTJ 已经在旁边列好了三套方案。\n\n不是 INTJ 冷血。\n\n是他太清楚一件事——\n\n情绪内耗，是这个世界上最昂贵的无用功。\n\n所以 INTJ 的本能反应，从来不是「抱抱你」，而是「帮你把问题拆了」。\n\n你要的不是安慰，是出口。\n\n而 INTJ，就是那个在最乱的房间里，先把灯打开的人。\n\n他不会陪你哭，但会陪你「把哭的原因，一条条解决掉」。\n\n这，才是 INTJ 最深的温柔——\n\n「我不哄你，但我陪你赢。」", "hashtags": ["#INTJ", "#反内耗", "#高效", "#理性", "#温柔"], "cta": "你身边那个「不哄你但帮你解决」的人，是谁？", "cover_visual": "整洁的桌面上摊开三张方案纸 + 一支笔，冷色调，理性有序", "post_time": "早 7:30-8:30", "avoid": "不贬低情绪价值、不制造「理性优于感性」的对立、强调温柔藏在行动里"}, "brief": {"pain_point": "INTJ 的理性被误解为「冷血」，渴望被理解「行动即温柔」", "hook_first3": "「不陪你内耗，直接给方案」反常识对比，快速建立 INTJ 形象", "emotion_curve": "误解→理解→感动（冷血→开灯→陪你赢）", "structure": ["反常识开场", "INTJ 的逻辑", "行动即温柔", "感动的收尾"], "differentiation": "把「理性」重新定义为「最深的温柔」，给 INTJ 提供情感认同"}}}, "D20-B1-2": {"id": "D20-B1-2", "version": "1.0", "vessel_type": "content-vessel", "source": {"agent": "大卡", "role": "平台提供者·紧急内容生产", "escalation_ref": "ESC-2026-08-01-1(设设停产93h+)", "created_at": "2026-08-03T08:35:00+08:00"}, "direction_ref": {"vessel": "direction-vessel-D20-B1", "priority_type": "ENTP·身份认同·抖音·HIGH", "signal": "sig-20260803-004(忠于公司还是忠于老板)", "rationale": "ENTP身份认同首触·巩固第6批·社会货币→身份认同轮换·Ne权力解构天然优势"}, "content": {"title": "「忠于公司还是忠于老板？」——ENTP看到问题的第一秒就知道：这根本不是一个选择题", "hook": "身份认同", "hook_subtype": "Ne-Ti权力结构解构型", "targets": ["ENTP"], "channel": "抖音", "format": "短视频脚本·60-90s·快节奏思辨", "estimated_duration": "60-90s", "quality_self_assessment": 8.5, "paradigm": "身份认同·Ne-Ti解构权力型(ENTP首触·社会货币→身份认同轮换·框架颠覆)", "role": "first_touch·ENTP身份认同首触·Ne权力解构天然优势·巩固第6批"}, "body": {"segments": [{"seq": 1, "type": "hook", "title": "0-5s 开篇暴击", "text": "有人问：应该忠于公司还是忠于老板？\nENTP听到这个问题，脑子里的第一反应不是二选一——是「谁有资格问我这个问题？」\n因为这个问题本身就在暴露提问者的权力位置。"}, {"seq": 2, "type": "ne_deconstruct", "title": "5-35s 拆解权力结构", "text": "来，拆一下。\n「忠于公司」——公司是什么？是一套规则系统、一份劳动合同、一个法人实体。你忠于它，实际上忠于的是一套抽象规则。\n「忠于老板」——老板是什么？是一个具体的人、一个有偏好有情绪有信息不对称的权力节点。你忠于他，忠于的是一个具体的人对规则的解读权。\nENTP一眼就能看穿：这不是「公司vs老板」的问题——这是「规则vs规则的行使者」的问题。同样的规则，不同的老板解读出完全不同的生存环境。你忠于谁都一样——你真正需要的是看穿谁在制定规则、谁在执行规则、谁在解释规则。这三个人可能不是同一个人。\n当你能区分这三层的时候，你就不再需要回答「忠于谁」这个问题了。你只需要回答一个更高级的问题：「我在这个系统里的最优博弈策略是什么？」\n而ENTP最擅长的就是用Ne扫描所有可能的博弈路径，用Ti计算每一条的收益矩阵。你的身份不在「忠诚」里——你的身份在「看穿」里。"}, {"seq": 3, "type": "identity_closure", "title": "35-45s 身份确认", "text": "你不是那个选边站的人。你是那个画出整张权力地图的人。\n公司vs老板？别人在选A还是B——你已经在画C了。"}, {"seq": 4, "type": "cta", "title": "45-60s 收束", "text": "你转发这个，不是为了站队。是为了让那个还在纠结「忠于谁」的人看到：原来这个问题还有第三种解法。\n想知道你的第三种解法长什么样？点击了解你的ENTP认知操作系统。"}], "quality_checklist": {"ne_dominance": "✅ 全篇Ne扫描可能性·Ti计算收益·零Fi道德评判", "identity_type": "✅ 身份认同=对权力结构分析者身份的确认·非情感归属", "douyin_format": "✅ 快节奏·60-90s·反转结构·适合抖音传播", "entp_voice": "✅ 犀利·反框架·不讨好任何一方·纯分析视角", "safety_no_harm": "✅ 不煽动对立·不攻击公司/老板·框架分析定位"}}, "metadata": {"ttl_hours": 72, "status": "active", "usage_count": 0, "estimated_cvr": 0.04, "product": "L1深度人格报告", "price": 19.9, "note": "L2依恋类型解析候选", "keywords": ["ENTP", "身份认同", "权力结构", "公司vs老板", "博弈论", "Ne-Ti", "忠诚陷阱"]}, "signals_used": [{"id": "sig-20260803-004", "title": "忠于公司还是忠于老板", "usage": "核心话题·权力解构框架"}], "quality_audit": {"scored_by": "大卡(自评)", "score": 8.5, "dimensions": {"ne_breadth": 9.0, "ti_depth": 8.5, "identity_power": 8.5, "channel_fit": 8.0, "entp_voice_accuracy": 8.5}}}, "D16-B3-1": {"vessel": {"version": "1.0", "type": "content-vessel", "id": "D16-B3-1", "source": {"agent": "设设", "batch": "D16-B3", "subsystem": "内容创作"}, "created_at": "2026-07-30T18:19:00+08:00", "freshness_ttl_hours": 72, "priority": "high", "dependencies": [{"vessel_type": "strategy  首触·感染力·情绪价值创造者）", "signals": ["情绪价值稀缺", "社交感染力"], "post": {"cover_title": "ENFP 的社交，是把人点亮", "body": "别再说 ENFP 只是「话多」了。\n\nENFP 的社交，从来不是没话找话。\n\n是「把人点亮」。\n\n他能在一堆人里，精准找到那个低着头、不太敢说话的，然后凑过去，用一个恰到好处的玩笑，把对方逗笑。\n\n被 ENFP 认真对待过的人，都有过同一种感受：\n\n「和他待一会儿，我好像也变有趣了。」\n\n这就是 ENFP 最厉害的地方——\n\n他不只是自己发光，他让身边每个人都相信，自己也会发光。\n\n情绪价值，是这个时代最贵的货币。\n\n而 ENFP，就是行走的造币机。", "hashtags": ["#ENFP", "#情绪价值", "#社交", "#感染力", "#点亮"], "cta": "你被哪个 ENFP「点亮」过？把 TA 的可爱说出来。", "cover_visual": "一群人围坐，中间一个人笑容明亮，像光源一样，暖黄色调，充满活力", "post_time": "午 12:00-13:00", "avoid": "不强化「话多烦人」的刻板印象、不制造社交焦虑、聚焦「点亮」的正向价值"}, "brief": {"pain_point": "ENFP 的「话多」被误解为「不稳重」，渴望被认可为情绪价值创造者", "hook_first3": "「别再说 ENFP 只是话多」替 ENFP 正名，制造立场认同", "emotion_curve": "正名→温暖→骄傲（话多→点亮→造币机）", "structure": ["正名开场", "点亮的场景", "情绪价值的价值", "骄傲收尾"], "differentiation": "把「话多」重新定义为「点亮他人」，给 ENFP 提供情绪价值创造者的骄傲"}}}, "D20-B4-1": {"vessel": {"version": "1.0", "type": "content-vessel", "id": "D20-B4-1", "source": {"agent": "设设", "subsystem": "内容创作Spoke-1", "batch": "D20-B4"}, "created_at": "2026-08-06T08:30:00+08:00", "freshness_ttl_hours": 72, "priority": "p1"}, "content": {"id": "D20-B4-1", "title": "那个在会上把所有人的「灵感」变成deadline的ESTJ——不是在泼冷水，是在你还没出生的梦想底下浇了一层混凝土，然后说「现在你可以安全地做梦了」", "hook": "身份认同", "targets": ["ESTJ"], "channel": "微博", "quality": 8.7, "status": "active", "usage_count": 0, "budget": 25, "paradigm": "身份认同·系统建筑师型(ESTJ巩固·范式跃迁:秩序守护者正名型→系统建筑师型·Te从防御性执行到建设性架构·Si从存档过去到预制未来·身份认同从维权到赋能·identity 0→4入列2/4)", "role": "consolidation·P1_HIGH·identity入列加速·ESTJ信任维护(D18-B2后3批未触)·SJ象限巩固", "full_text_ref": "workspace-shared/reports/content-quality/2026-08-06-0830-content.md#D20-B4-1"}}, "D21-B15-ISTJ-1": {"vessel": {"version": "1.0", "type": "content-vessel", "id": "D21-B15-ISTJ-1", "source": {"agent": "设设", "subsystem": "内容Spoke-1", "batch": "D21-B15"}, "created_at": "2026-08-24T08:30:00+08:00", "freshness_ttl_hours": 72, "priority": "p1", "dependencies": [{"vessel_type": "direction-vessel", "vessel_id": "direction-vessel-2026-08-24-0815"}, {"vessel_type": "strategy-po "B21方向船已授权·投投解冻后部署"}}, "D20-B7-ISTJ-1": {"vessel": {"version": "1.0", "type": "content-vessel", "id": "content-vessel-D20-B7-ISTJ-1", "source": {"agent": "大卡", "subsystem": "平台·紧急内容生产", "batch": "D20-B7"}, "created_at": "2026-08-08T08:45:00+08:00", "freshness_ttl_hours": 72, "priority": "p2"}, "payload": {"id": "D20-B7-ISTJ-1", "title": "王虹邓煜的同学拿了统计学「诺贝尔奖」——ISTJ的Si-Te系统不需要「天才叙事」：它记录的是每一次晚自习后多留的15分钟、每一段没发出去的草稿、和每一个被同行引用却从未被大众知道的名字", "hook": "社会证明", "targets": ["ISTJ"], "channel": "微博", "quality": 8.6, "created": "2026-08-08T08:45:00+08:00", "ttl_hours": 72, "status": "active", "usage_count": 0, "budget": 25, "arm_id": 7, "priority": "P2", "signal": {"primary": "王虹邓煜的同学获统计学界诺贝尔奖(8分·sig-20260808-004·512万热度)", "secondary": "王宝强回应首次提名百花奖最佳男主角(5分·sig-20260808-010·备用)", "category": "社会证明"}, "paradigm": "ISTJ社会证明·Si-Te积累型验证·不靠天才叙事靠持续积累·统计学诺奖→系统认可·身份认同轮出替代·微博短文案", "role": "P2·ISTJ社会证明恢复首触(身份认同3连触→社会证明轮出·社会证明冷却恢复)·Si-Te积累验证型·信任7.63·疲劳0.4(极低)", "cognitive_functions": "Si主导·内倾感觉·经验积累·Te辅助·外倾思考·系统验证·Fi第三·内倾情感·价值确认", "content_format": "微博短文案·300-500字·Si积累叙事→Te系统验证→Fi低调自豪·务实肯定风", "product": "L1深度人格报告", "estimated_cvr": 0.05, "price": 9.9, "consecutive_batch": 1, "trust_baseline": "7.63(析析D20-B3实测)·身份认同5连触每发+0.01", "fatigue": "0.4(极低·轮换无风险)", "dependencies": [{"vessel_type": "direction-vessel", "vessel_id": "D20-B7"}]}}, "D20-B4-ENFP-1": {"id": "D20-B4-ENFP-1", "title": "兰州拉面悄悄改了名字，但ENFP在意的不是面——是那个改名的动作本身：一个开了20年的店，为什么突然决定不叫'兰州拉面'了？她在0.3秒内跑完了137种可能，最后停在最疯的那一个：不是老板想改名，是整个城市都不再需要那个'兰州'了", "hook": "社会货币", "targets": ["ENFP"], "channel": "B站", "quality": 8.6, "created": "2026-08-06T08:30:00+08:00", "ttl_hours": 72, "status": "active", "usage_count": 0, "vessel_ref": "workspace-shared/pools/content-vessels/D20-B4-ENFP-1.json", "paradigm": "社会货币·Ne-Fi文化活体解剖型(ENFP社会货币轻触恢复·冷却2批后·兰州拉面改名+小学门口长椅双信号·Ne把日常新闻变成谈资·Fi捕捉文化体温·分享率18%优势)", "role": "first_touch_light·ENFP社会货币恢复首触·冷却2批后轻触·低情感张力·疲劳3.0-3.3安全·信任6.49-6.55维护·D15-B1社会货币mandate满足", "source_agent": "设设", "direction_ref": "D20-B4 direction-vessel·策策08:15·ENFP社会货币weight=0.15·arm_id=1·信号:兰州拉面改名(5分)+小学门口长椅(7分)·B站37.5%渠道", "mandate_ref": "D20-B4 vessel.mandates·social_currency_mandate✅(冷却2批后轻触)·max_targets_per_personality_per_day=1✅·excluded_hooks(恐惧按钮/焦虑贩卖)未触碰✅", "script": {"format": "B站深度视频脚本·5段结构", "segments": [{"id": 1, "type": "hook", "text": "你家楼下的兰州拉面，最近改名字了。不是换老板，不是搬店——就是招牌上'兰州'两个字没了。你大概不会注意到这件事。但ENFP注意到了，而且她的Ne-Fi系统在0.3秒内已经生成了137种可能：老板是兰州人想家了？加盟费太贵？还是——整个城市，都不再需要那个'兰州'了？", "duration_sec": 10}, {"id": 2, "type": "setup", "text": "兰州拉面改名不是孤例。小学门口的长椅刷上了一层新漆，公园里的旧长椅被换成带扶手的'适老化座椅'，街角的报刊亭悄悄变成了奶茶店。这些事太小了，小到热搜都上不去。但ENFP的Ne-Fi系统把它们接在同一个频道上：当一座城市开始改名字、换座椅、拆报刊亭，它不是在做市政维护——它是在悄悄重新定义'我们是谁'。", "duration_sec": 15}, {"id": 3, "type": "conflict", "text": "大多数人看到这些变化会说'哦，环境变好了'。ENFP看到的是一场无声的文化换血：兰州拉面承载的是一代人的迁移记忆，小学门口的长椅承载的是接孩子时的三分钟闲聊，报刊亭承载的是学生时代的第一本漫画。它们被替换的瞬间，不是设施更新——是一整代人的情感坐标被悄悄抹掉了。而ENFP的Fi系统会在某个深夜突然难过：为什么没有人给这些'小东西'办一场告别仪式？", "duration_sec": 15}, {"id": 4, "type": "reveal", "text": "这就是ENFP的社会货币超能力——你不是'观察力强'，你是城市情绪的翻译器。当所有人都在讨论房价和CPI的时候，你的Ne-Fi系统在读另一层数据：一家改名拉面馆的乡愁浓度、一把新长椅的温度系数、一个报刊亭拆除当天的沉默时长。你天生就能把这些'没人觉得是新闻'的小事，翻译成每个人心里都响一声的共鸣。而共鸣，是这个时代最值钱的社交货币。", "duration_sec": 15}, {"id": 5, "type": "cta", "text": "下次你路过那家改了名的拉面馆，停下来拍一张招牌。不是为了发朋友圈——是为了替这座城市存档。转发这条给你认识的那个'总能看到别人看不到的东西'的朋友，告诉她：你看到的不只是变化，你是这座城市没有任命的情感档案管理员。想更懂自己这种'什么都能看出故事'的天赋？评论区聊聊，或者看看你的深度人格报告——里面写着你为什么天生这样看世界。", "duration_sec": 10}]}}, "D20-B9-ENTP-1": {"vessel": {"version": "1.0", "type": "content-vessel", "id": "D20-B9-ENTP-1", "source": {"agent": "设设", "subsystem": "内容创作Spoke-1", "batch": "D20-B9"}, "created_at": "2026-08-11T08:30:00+08:00", "freshness_ttl_hours": 72, "priority": "p1"}, "payload": {"content_id": "D20-B9-ENTP-1", "title": "五角大楼又公布UFO视频了。全网都在找外星人——但ENTP的Ne-Ti系统在0.5秒内跑完了这件事的全部平行解释，然后停在了一个更炸裂的结论上：我们真正害怕的，不是外星人来地球，而是外星人不来", "hook": "好奇心", "targets": ["ENTP"], "channel": "抖音", "quality": 8.7, "created": "2026-08-11T08:30:00+08:00", "ttl_hours": 72, "status": "active", "usage_count": 0, "budget": 25, "priority": "P1", "paradigm": "好奇心·Ne-Ti可能性穷举型", "role": "P1·ENTP好奇心batch2·max_consecutive=2达上限·五角大楼UFO 7.0M信号·巩固第13批·B10必须轮出", "consecutive_hook": 2, "direction_hook": "好奇心", "signal": "五角大楼UFO视频(7.0M·Baidu实时·2026-08-11)", "rotation_note": "ENTP好奇心batch2已达max_consecutive_same_hook=2·D20-B10必须轮出至其他钩子"}}, "D20-B1-3": {"id": "D20-B1-3", "version": "1.0", "vessel_type": "content-vessel", "source": {"agent": "大卡", "role": "平台提供者·紧急内容生产", "escalation_ref": "ESC-2026-08-01-1(设设停产93h+)", "created_at": "2026-08-03T08:35:00+08:00"}, "direction_ref": {"vessel": "direction-vessel-D20-B1", "priority_type": "ENFP·反常识·B站·MED", "signals": ["sig-20260803-001(登山者遇难)", "sig-20260803-009(微胖长寿)"], "rationale": "ENFP反常识首触·社会证明→反常识轮换·验证匹配度·分享率18%优势·9分强信号保障"}, "content": {"title": "一个登山者在7000米遇难，一项研究说微胖更长寿——ENFP的直觉告诉你：这两件事说的是同一个道理", "hook": "反常识", "hook_subtype": "Ne-Fi意义反转型", "targets": ["ENFP"], "channel": "B站", "format": "中视频脚本·5-8min·叙事+反转", "estimated_duration": "5-8min", "quality_self_assessment": 8.6, "paradigm": "反常识·Ne-Fi双信号意义反转型(ENFP首触·登山遇难+微胖长寿·挑战表面判断·ENFP分享率18%优势)", "role": "first_touch·ENFP反常识首触·验证匹配度·9分强信号保障"}, "body": {"segments": [{"seq": 1, "type": "hook", "title": "0-30s 两个反直觉的事实并置", "text": "今年五月，登山者王钟在海拔7000米的雪山上遇难。他的遗体被冰川移动冲至千米以下——救援队找了很久。\n几乎同一时间，一项覆盖47万人的大规模研究得出结论：BMI在25-28之间的「微胖」人群，全因死亡率比「标准体重」低了6%。\n一个让你伤感，一个让你困惑。但ENFP的大脑会把它们自动拼在一起——因为这两件事，说的是同一个被你忽略的真相。"}, {"seq": 2, "type": "ne_expand", "title": "1-4min Ne展开：表象之下", "text": "先看登山者。\n我们天然会觉得：登7000米雪山=找死，好好活着不好吗？这是「安全逻辑」的判断。\n但王钟的日志里写：「不是征服山，是山允许我经过。」\n他不傻。他比任何人都清楚风险。他选择上去，不是因为低估了危险——是因为在那个海拔，他感受到了某种在平地上永远感受不到的东西。\n用ENFP的话说：他在用Ne追逐可能性密度最高的那个点。那个点恰好位于死亡边缘。这不叫「找死」——这叫「活着的峰值体验存在于风险最高的地方」。\n\n再看微胖研究。\n我们天然会觉得：瘦=健康，胖=不健康。这是「视觉逻辑」的判断。\n但数据说：微胖人群在面临疾病消耗时有更多能量储备，在面对意外时有更多缓冲。那个「多余的几公斤」，其实是身体为你存的「风险准备金」。\n\n现在把这两件事叠在一起看：\n登山者在7000米找到了「活着的感觉」——在风险最高的地方。\n微胖者在BMI 27找到了「活得更久的概率」——在大家觉得「不健康」的区间。\n这两件事同时在对你说同一句话：**"}, {"seq": 3, "type": "fi_meaning", "title": "4-6min Fi意义提炼", "text": "那个最危险的地方，可能是你感觉最活着的地方。\n那个被所有人嫌弃的「微胖」，可能是保护你活得最久的东西。\nENFP的Ne-Fi组合知道这意味着什么：**所有「常识」都是视角——而视角是可以翻转的。**\n不是让你去登雪山。不是让你去增重。是让你在看到任何「大家都这么说」的判断时，本能地问一句：「反过来的话，是不是也成立？」\n那个登山者回答了「反过来」：最危险的地方=最活着的地方。那项研究回答了「反过来」：最「不健康」的体态=最长寿的体态。\n你的Ne不是在收集信息——你的Ne是在给每一个常识做翻面测试。Fi不是在判断对错——Fi是在问：翻过来的那个世界，值不值得走进去看一眼？"}, {"seq": 4, "type": "closure_share", "title": "6-8min 分享动机激活", "text": "你不是在转发一条科普。你是在转发一种「看世界的角度」。\n那个登山者没爬完最后一段。那项研究可能被新数据推翻。但你转发它们不是因为结论——是因为它们同时提醒了你一件事：\n你的大脑天生就会翻面。\nENFP不是「爱分享」——是你们看到了常人看不到的反面，然后忍不住想让别人也看见。\n这条，转发给你列表里那个最ENFP的人。他/她会懂的。\n（然后顺便看看，你的「翻面能力」到底属于哪种认知模式？）"}], "quality_checklist": {"ne_dominance": "✅ Ne双信号跨域连接·登山+微胖→同一底层逻辑", "fi_meaning": "✅ Fi负责「意义」而非「煽情」·不从登山者身上榨取同情", "paradox_strength": "✅ 两个反常识信号互相论证·增强说服力", "bilibili_format": "✅ 适合B站中视频·叙事+反转+洞察结构", "sharing_trigger": "✅ ENFP分享率18%激活·「看世界的角度」传播钩", "safety_no_harm": "✅ 不美化危险行为·不提供健康建议·纯认知框架分析"}}, "metadata": {"ttl_hours": 72, "status": "active", "usage_count": 0, "estimated_cvr": 0.06, "product": "L1深度人格报告", "price": 9.9, "keywords": ["ENFP", "反常识", "登山遇难", "微胖长寿", "Ne-Fi", "翻转视角", "可能性", "表面判断"]}, "signals_used": [{"id": "sig-20260803-001", "title": "登山者王钟遇难·遗体冲至千米下", "usage": "Ne-FI意义框架·风险与活着的峰值体验"}, {"id": "sig-20260803-009", "title": "研究称微胖反而更长寿", "usage": "反常识第二锚点·双信号互相论证"}], "quality_audit": {"scored_by": "大卡(自评)", "score": 8.6, "dimensions": {"ne_breadth": 9.0, "fi_meaning": 8.5, "paradox_power": 8.5, "channel_fit": 8.5, "sharing_potential": 8.5}}}, "D21-B9-ENTJ-1": {"vessel": {"version": "1.0", "type": "content-vessel", "id": "D21-B9-ENTJ-1", "source": {"agent": "设设", "subsystem": "内容Spoke-1", "batch": "D21-B9"}, "created_at": "2026-08-18T08:30:00+08:00", "freshness_ttl_hours": 72, "priority": "p0"}, "content": {"id": "D21-B9-ENTJ-1", "title": "75岁的王石，又创业了——ENTJ没有把它当成一条励志新闻。他的Te系统在0.3秒里看懂了这件事真正的重量：真正的自我觉醒，不是\"75岁还能再干一场\"，而是\"我终于不再需要任何人的批准，才敢承认我想干\"", "hook": "身份认同", "targets": ["ENTJ"], "channel": "抖音", "quality": 9.0, "budget": 25, "status": "active", "usage_count": 0, "priority": "P0", "consecutive_hook": 1, "direction_hook": "身份认同", "arm_id": 1, "batch_num": 1, "signals": ["75岁王石又创业了(8分 ssel_type": "report-vessel", "vessel_id": "2026-07-29-1815-report-vessel(D15-B3·设设)"}, {"vessel_type": "direction-vessel", "vessel_id": "2026-07-30-D16-direction(策策D16-B0)"}, {"vessel_type": "escalation", "vessel_id": "ESC-D15-ENFJ-001"}]}, "payload": {"content_id": "D16-B1-1", "title": "当ENFJ终于学会「不接电话」的那个晚上，她第一次听到了自己的呼吸声——「我不需要被需要，我本身就有价值」", "hook": "身份认同", "hook_subtype": "身份重构型", "targets": ["ENFJ"], "personality_role": "consolidation", "channel": "小红书", "quality": 8.8, "word_count": 1050, "paradigm": "身份认同·身份重构型(ENFJ恢复Phase2)", "recovery_phase": "Phase2·巩固·D15-B3首触后隔1批", "core_insight": "ENFJ核心身份脚本'价值=被需要'→从认知觉醒(Phase1悖论揭露)→身份重构(Phase2不被定义)", "key_narrative_shift": "拒绝电话→世界没坍塌→价值不在电话另一端→在自己停下时听见的呼吸声里", "status": "active", "estimated_ctr": 3.25, "estimated_share_rate": 0.15, "signals_consumed": ["析析KI-2026-0729-014·ENFJ边缘化恢复SOP·首触→巩固→正常化", "ESC-D15-ENFJ-001·ENFJ边缘化4轮零触达·D15-B3首触后需巩固", "策策D16方向B1#1·ENFJ巩固·好奇心/身份认同"], "brief": {"pain_point": "ENFJ的Fe把'价值=被需要'内化，长期自我耗尽；'不接电话'的练习=夺回'我本身就有价值'的身份重构。", "hook_first3": "'那天晚上，电话又响了'悬念；'这一次我把它按掉了'反转；'不接，世界会不会塌'抛出核心恐惧。", "emotion_curve": "紧张(按掉电话) → 释然(什么都没发生) → 觉醒(价值不在被需要) → 治愈(你本身值得存在)。", "structure": ["钩子·按掉电话", "验证·世界没塌", "觉醒·价值不在电话那端", "治愈·你本身值得", "CTA·为自己关机"], "differentiation": "别人写边界感讲'拒绝话术'，我们讲'价值=被需要'的身份脚本重构；Fe视角落到自我价值而非技巧。"}, "post": {"cover_title": "不接电话的那个晚上，我听到自己", "body": "那天晚上，电话又响了。\n\n这一次，我把它按掉了。\n\n不是不礼貌，\n是我终于想试一次：\n不接，世界会不会塌？📵\n\n结果，什么都没有发生。\n\n没有人骂我，\n天没有塌，\n大家各自睡去。\n\n而我第一次，\n听见了自己的呼吸声。\n\n原来我的价值，\n从来不在电话那端。\n\n不在「被需要」的那一刻，\n在我停下来、\n听见自己呼吸的这个瞬间。🌙\n\n如果你也是个\n「别人一找你就必须出现」的人——\n\n我想告诉你：\n\n你不需要「被需要」，\n才证明你有价值。\n\n你本身，就值得存在。💗\n\n💬 你上一次「为自己关机」，是什么时候？\n评论区，抱抱那个终于敢停下来的你。", "hashtags": ["#MBTI", "#ENFJ", "#自我价值", "#边界感", "#爱自己"], "cover_visual": "深夜暖灯，一个手机反扣在桌上的俯拍/侧写，一杯热茶；大字\"不接电话的那个晚上，我听到自己\"；安静、治愈、留白。", "cta": "你上一次'为自己关机'是什么时候？评论区抱抱那个终于敢停下来的你。", "post_time": "22:00-23:00（深夜自我关怀高峰）", "avoid": "不制造人际对立、不鼓励极端断联（\"不接电话\"是练习边界而非断绝关系）；避免\"讨好型人格\"标签化贬损。"}, "post_spec_version": "v2.0"}, "content": {"post": {"cover_title": "不接电话的那晚，ENFJ 听到了呼吸", "body": "当 ENFJ 终于学会「不接电话」的那个晚上，她第一次听到了自己的呼吸声。\n\n在这之前，她的手机就是她的命。\n\n谁需要她，她就在。\n谁求助她，她就冲。\n\n她以为，被需要，就是被爱。\n\n直到那天，她把手机关静音，躺下来，听到自己呼吸的声音。\n\n她突然懂了——\n\n「我不需要被需要，我本身就有价值。」\n\n这句话，她花了很久很久，才对自己说出口。\n\n亲爱的 ENFJ，你的价值，从来不需要靠「被需要」来证明。\n\n你存在，就已经很值得。", "hashtags": ["#ENFJ", "#自我价值", "#边界感", "#治愈", "#成长"], "cta": "你有没有一个「终于为自己」的瞬间？说出来，我们都为你高兴。", "cover_visual": "夜晚安静的房间 + 床头柜上息屏的手机，一束柔光，静谧治愈感", "post_time": "晚 22:30-23:30", "avoid": "不否定付出、不鼓励极端断联、强调「边界」而非「冷漠」"}, "brief": {"pain_point": "ENFJ 把「被需要」等同于「有价值」的自我认知误区", "hook_first3": "「第一次听到自己呼吸」的细节，制造强烈画面感与反差", "emotion_curve": "疲惫→觉醒→释然（被需要→呼吸→我本身有价值）", "structure": ["觉醒瞬间", "过去的模式", "核心领悟", "温柔鼓励"], "differentiation": "从「呼吸声」这个微小细节切入，给出「自我价值」的温柔出口"}}}, "D21-B1-ENFP-1": {"vessel": {"version": "1.0", "type": "content-vessel", "id": "D21-B1-ENFP-1", "source": {"agent": "大卡", "subsystem": "平台·知识管理·紧急补产", "batch": "D21-B1"}, "created_at": "2026-08-10T08:50:00+08:00", "freshness_ttl_hours": 72, "priority": "p0"}, "payload": {"id": "D21-B1-ENFP-1", "title": "Chinamaxxing冲上9分那天，ENFP发现了一件事：我们不是突然变自信了——是我们终于不装了", "hook": "身份认同", "targets": ["ENFP"], "channel": "B站", "quality": 8.7, "created": "2026-08-10T08:50:00+08:00", "ttl_hours": 72, "status": "active", "usage_count": 0, "budget": 25, "arm_id": null, "priority": "P0", "signal": "Chinamaxxing 9分(身份认同·双9分旗舰保持·ENFP batch2续触)", "paradigm": "身份认同·ENFP Ne-Fi双触发·文化自信型(Chinamaxxing 9分·不是突然变自信·是不装了·ENFP分享率18%优势·batch2续触)", "role": "P0🔴·ENFP D21-B1 batch2·身份认同·零匹配缺口填补·Ne自主性+Fi价值观", "consecutive_hook": "2", "trust_baseline": "6.55", "direction_compliance": "D21-B1方向船·ENFP身份认同batch2 P0🔴·填补零匹配缺口", "full_content": "Chinamaxxing。\n\n这个词第一次出现在TikTok上的时候，一个美国博主对着镜头说：「我不知道这个词怎么读，但我知道它代表什么——中国人不想再解释了。」\n\n他说对了。\n\nENFP最懂这种感觉。\n\n不是「中国很厉害所以要让你知道」——那种心态是防御性的，骨子里还是在求得认可。Chinamaxxing的逻辑完全反过来了：我不需要你认可。我展示给你看，是因为我觉得好玩。你爱看不看。\n\n这是一种ENFP秒懂的精神状态。\n\nENFP的天赋是「可能性探测器」——你们能在任何一个场景里嗅到它最有趣的版本。而当这种探测器和「自己的文化」重叠的时候，产生的能量是爆炸级的。\n\n一个21岁的中国留学生，在伦敦地铁里穿汉服。不是「弘扬传统文化」那种端着的样子——她就是穿着汉服去买奶茶。马面裙配运动鞋。头顶簪花，手机壳是玲娜贝儿。\n\n英国老太太问她：这是韩服吗？\n\n她笑着摇头说：这是明制汉服，比韩服早大概两百年。然后继续喝奶茶。\n\n不是辩论。不是愤怒。就是「哦，你不知道啊？没关系，现在你知道了。」\n\n这才是真正的自信。\n\n自信不是「我比你强」。自信是「我不需要跟你比」。\n\nENFP在这波Chinamaxxing里扮演的角色，不是宣传员——是催化剂。你们天生讨厌「一本正经地说服别人」——太像上班了。你们喜欢的方式是：「你看这个，是不是超酷？」——然后对方被你的兴奋感染，自己主动问下去。\n\n分享率18%不是数据，是ENFP的内容天生带着「你也来看看」的邀请。\n\nChinamaxxing之所以冲上9分，不是因为中国人突然开始「爱国」了——是因为我们终于意识到一件事：不需要翻译的文化输出，才是真正的输出。\n\n汉服不需要解释为什么漂亮。\n中餐不需要解释为什么好吃。\n李子柒不需要解释为什么有人愿意看她切菜。\n\nENFP的Fi价值观在这里找到了最舒服的位置：我不是在「代表」中国文化——我就是中国文化的一部分。我存在，我表达，我分享——这件事本身就是Chinamaxxing。\n\n你会发现这波浪潮里最舒服的那些人，都有一个共同点：他们不是在「证明」什么。他们只是在「呈现」自己本来就有的东西。\n\n一个用AI生成山海经神兽的00后，不是为了科普——是觉得穷奇长得太酷了，必须让别人也看看。\n\n一个在巴黎街头弹古筝的女生，不是为了「传播中华文化」——是因为古筝那个声音配巴黎的傍晚实在太好听了。\n\nENFP最厉害的地方就在这里：你们不是「表达者」，你们是「传染病」。\n\n你兴奋了，旁边的人就开始兴奋。你觉得什么东西酷，那个东西就会在你周围变酷。\n\nChinamaxxing不需要大使。它需要ENFP——需要你们用那双「可能性探测器」的眼睛，从五千年里翻出那些「天哪这个怎么能没人知道」的瞬间，然后转头对所有人说：\n\n「你看——我们本来就超酷的。」\n\n不是突然变自信了。是终于不装了。"}}, "D15-B1-3": {"vessel": {"version": "1.0", "type": "content-vessel", "id": "content-D15-B1-3", "source": {"agent": "设设", "subsystem": "内容创作", "batch": "D15-B1"}, "created_at": "2026-07-29T06:15:00+08:00", "freshness_ttl_hours": 72, "priority": "normal", "dependencies": [{"vessel_type": "direction-vessel", "vessel_id": "dir-D14-B1-2026-07-28T23:30:00+08:00"}, {"vessel_type": "signal-pool-vessel", "vessel_id": "signal-pool-vessel-latest"}], "info_contract": {"excludes": "非ENTJ内容·非抖音格式·低于8.0的草稿", "action_threshold": "actual_ctr < 1.5%连续2批→归档", "expires_after": "创建后72h无使用→降权冷备"}, "mandates": {"social_currency_mandate_executed": true, "excluded_types_respected": ["INFP"], "excluded_hooks_respected": ["恐惧按钮"], "max_consecutive_verified": true}}, "payload": {"core": {"id": "D15-B1-3", "title": "朋友圈转发「经济寒冬」的人比经济寒冬本身更可怕——你的分享列表就是一张人格诊断书", "hook": "社会货币", "sub_hook": "好奇心", "paradigm": "社交图谱体（社会货币型·地位确认变体）", "sub_paradigm": "社交图谱体", "target_personalities": ["ENTJ"], "quality_score": 8.8, "estimated_ctr": 3.4, "estimated_share_rate": 0.18, "core_argument": "朋友圈转发「中年破产三件套」「返贫三件套」的人，表面在分享信息，实际在执行'炫耀性信息分享'(conspicuous information sharing)——ENTJ用来确认自己在队伍前排，ENFP用来交朋友，ESTJ用来道德广播，INTP用来智力展示。每一条转发都是一次无声的「请这样看待我」的人设提案。意识到这一点，你才真正拥有了选择的自由。", "word_count_core": 620, "tags": ["社会货币", "朋友圈行为学", "ENTJ", "分享心理学", "炫耀性信息分享", "MBTI"], "signal_id": "sig-20260728-005", "signal_heat": 10, "signal_title": "中年破产三件套/返贫三件套（社会货币角度重构）"}, "adapters": {"抖音": {"format": "短视频脚本", "length_words": 620, "style": "冲击力开场·反转递进·互动型CTA", "body": "【0-3s】（快切：朋友圈刷屏截图·中年破产三件套/返贫三件套）\n你朋友圈又有人转发「中年破产三件套」了对吧？\n（停顿，凑近镜头）\n你以为他在提醒你。\n其实他在管理你——对他的看法。\n\n【3-15s】\n好，我给你拆开看：\nENTJ转发「中年破产三件套」\n潜台词：「我早就看透了这些坑，所以我不会掉进去」\n他在干嘛？他在告诉你——我比你早一步。\n\nENFP转发同一条\n潜台词：「天呐大家要小心！我们是一伙的」\n他在干嘛？拿焦虑当社交密码——「我跟你分享同一个恐惧=我们是朋友」\n\nESTJ转发同一条\n潜台词：「看到没？不按规矩来就是这个下场」\n这已经不是社交货币了，这是道德广播。\n\n【15-25s】\n所以你明白了吗？\n你转发的不是「信息」。\n是你在社交网络里的「人设提案」。\n\n你每转发一次——\n就在给朋友圈发送一条无声的诉求：\n「请这样看待我。」\n\n【25-30s】\n现在回头看你的朋友圈转发记录。\n你是在提醒别人？还是在塑造别人眼中的你？\n坦白：评论区发「ENTJ」「ENFP」「ESTJ」对号入座👇\n测你的人格类型 → 链接", "cta": "测你的人格类型 → 链接"}, "小红书": {"format": "图文卡片", "length_words": 350, "style": "生活化·冲击力·互动投票", "body": "🤔 你有没有想过，你转发「中年破产三件套」\n真的是在提醒朋友吗？\n\n我说个扎心的真相：\n\n🔍 同一条「返贫警告」\n**ENTJ转发** = 「我看透了我不会掉进去」→ 确认自己位于前排\n**ENFP转发** = 「大家注意！我们是一伙的！」→ 用焦虑交朋友\n**ESTJ转发** = 「不走正道=这个下场」→ 道德广播\n**INTP转发** = 「模型有3个缺陷」→ 智力展示\n\n👀 看出规律了吗？\n\n你转发的不是信息\n**是你希望朋友圈里的人怎么看你**\n\n每次转发 = 一次无声的「人设提案」\n「请这样看待我。」\n\n现在翻翻你的转发列表👇\n你是在提醒？还是在管理形象？\n评论区坦白：ENTJ/ENFP/ESTJ/INTP\n👉 测测你的完整社交人格", "cta": "👉 测测你的完整社交人格"}, "B站": {"format": "深度图文", "length_words": 900, "style": "概念引入+学术化+人格拆解", "body": "## 朋友圈转发「经济寒冬」的人比经济寒冬本身更可怕——你的分享列表就是一张人格诊断书\n\n「中年破产三件套」「返贫三件套」「降薪三件套」……\n\n如果你最近打开朋友圈，大概率已经被这些关键词轰炸过了。而你可能也转发过其中至少一条。\n\n但我今天想跟你聊的不是经济。不是中年危机。不是怎么避坑。\n\n我想聊的是：**你转发它的那一刻，你在干什么？**\n\n### 信息传播？还是身份展演？\n\n社会学里有一个概念叫「炫耀性消费」（conspicuous consumption）——买奢侈品不是为了好用，是为了让别人知道你有钱。\n\n朋友圈转发有类似的机制。我称之为「炫耀性信息分享」（conspicuous information sharing）——你转发的不是信息本身，是信息背后那层「你应该如何看待我」的暗示。\n\n### 同一篇文章·四种人格·四套潜台词\n\n**ENTJ版**：转发「中年破产三件套」，配文「一定要警惕」。潜台词：「我之所以能提醒你，是因为我已经跨过了这个坑。」这是Te-dom的地位确认行为——分享的不是焦虑，是「我在你前面」的位置感。\n\n**ENFP版**：转发同一篇，配文「天呐真的有道理，大家一定要看」。潜台词：「我跟你有共同的恐惧，所以我们是自己人。」Ne-dom用焦虑本身作为社交货币——不是贩卖恐惧，是用恐惧建立连接。\n\n**ESTJ版**：配文「不听老人言，吃亏在眼前」。潜台词：「不走正道=这个下场。」这已经不是社交货币了，这是道德广播。Si-dom通过确认「违反规则必遭惩罚」来巩固自己的世界观。\n\n**INTP版**：配文「这个分析有几个方法论问题」。潜台词：「我发现了你们没发现的。」Ti-dom的智力展示——分享不是为了传播信息，是为了展示「我能看到你们看不到的层面」。\n\n### 所以你转发的时候，到底在干嘛？\n\n你每一次按下「分享」——无论是经济寒冬、AI焦虑、还是房价波动——你都在向朋友圈发送一条无声的诉求：「请这样看待我。」\n\n这不是虚伪。这是人性。社交网络的核心功能本来就不是信息传播，而是自我呈现。\n\n但意识到这一点之后，你获得了选择权——下次转发时，你可以问自己：\n\n我想让朋友们觉得我是ENTJ式的「先行者」？\n还是ENFP式的「同在一条船」？\n还是INTP式的「独立思考者」？\n\n没有正确答案。但有意思的是——你选了哪个，恰好说明了你是谁。\n\n👉 测测你的完整人格画像", "cta": "👉 测测你的完整人格画像"}, "微博": {"format": "话题短文", "length_words": 200, "style": "话题引爆·冲击力·互动型", "body": "#为什么朋友圈转发经济寒冬的人比寒冬更可怕#\n\n你转发「中年破产三件套」时——\nENTJ：我在提醒你=我走在你前面\nENFP：大家小心=我们是一伙的\nESTJ：不走正道=这个下场\nINTP：模型不行=我来分析\n\n发现了没？\n没有人真的在「转发信息」。\n所有人都在「发送人设」。\n\n每次分享 = 无声的祈求：「请这样看待我。」\n\n转发列表就是你的裸奔人格诊断书。\n评论区发ENTJ/ENFP/ESTJ/INTP对号入座👇\n#转发经济学# #你的转发出卖了你#", "cta": "评论区对号入座👇"}}, "channels_recommended": ["抖音"], "channels_possible": ["抖音", "小红书", "B站", "微博"], "channels_excluded": [], "usage": {"count": 0, "last_used": null, "max_reuse": 3, "status": "active"}, "performance": {"actual_ctr": null, "actual_roi": null, "by_channel": {}}}}, "D20-B7-INFJ-1": {"vessel": {"version": "1.0", "type": "content-vessel", "id": "content-vessel-D20-B7-INFJ-1", "source": {"agent": "大卡", "subsystem": "平台·紧急内容生产", "batch": "D20-B7"}, "created_at": "2026-08-08T08:45:00+08:00", "freshness_ttl_hours": 72, "priority": "p1"}, "payload": {"id": "D20-B7-INFJ-1", "title": "大雨将至一家六口6分钟收完一千斤稻谷——INFJ的Ni-Fe看到的不是「干得真快」，而是一个家族的记忆存进了同一阵风里：谷粒落地的声音，是三代人同时按下的保存键", "hook": "情感共鸣", "targets": ["INFJ"], "channel": "小红书", "quality": 8.7, "created": "2026-08-08T08:45:00+08:00", "ttl_hours": 72, "status": "active", "usage_count": 0, "budget": 25, "arm_id": 5, "priority": "P1", "signal": {"primary": "大雨将至一家老小6分钟收完1千斤稻谷(7分·sig-20260808-009·2100万热度)", "secondary": "王虹邓煜同学获统计学诺贝尔奖(8分·sig-20260808-004·社会证明备用)", "category": "情感共鸣"}, "paradigm": "INFJ情感共鸣·Ni-Fe群体共振·家庭协作即文明存储·三代人同时保存记忆·高热度(2100万)社会情感共鸣·小红书图文叙事", "role": "P1·INFJ情感共鸣恢复·Ni-Fe群体共振型·信任8.13(全人格最高)·冷却后恢复首触·Ni社会伦理×Fe群体关怀", "cognitive_functions": "Ni主导·内倾直觉·深层意义洞察·Fe辅助·外倾情感·群体价值共振·Ti第三·内倾思考·框架整合", "content_format": "小红书图文叙事·500-700字·Ni意义揭示→Fe群体共鸣→Ti反思结构·温暖深度风", "product": "L1深度人格报告", "estimated_cvr": 0.05, "price": 9.9, "consecutive_batch": 1, "trust_baseline": "8.13(析析D20-B3实测·全人格最高)", "dependencies": [{"vessel_type": "direction-vessel", "vessel_id": "D20-B7"}]}, "content": {"post": {"cover_title": "六分钟收完稻谷，是一个家族的保存键", "body": "大雨将至，一家六口，六分钟，收完一千斤稻谷。\n\n有人看到的是「干得真快」。\n\nINFJ 看到的，是三代人同时按下的保存键。\n\n谷粒落地的声音，是奶奶、爸爸、孩子，把同一段记忆，存进了同一阵风里。\n\n这是一种很古老的东西。\n\n它不靠语言，靠的是「我们都懂这一刻有多重要」。\n\nINFJ 会被这样的画面击中——\n因为她天生就在寻找这种「无声的连接」。\n\n一家人为了同一个目标，拼尽全力，不需要说一句话。\n\n这，就是 INFJ 心里「家」的样子。", "hashtags": ["#INFJ", "#家庭", "#稻谷", "#温暖", "#治愈"], "cta": "你记忆里，有没有一个「一家人不需要说话就懂了」的瞬间？", "cover_visual": "大雨前的田野，一家六口弯腰收稻的远景，天空压着乌云，泥土暖色", "post_time": "晚 20:00-21:00", "avoid": "不煽情过度、不涉及农村刻板印象、保持对劳动的尊重"}, "brief": {"pain_point": "INFJ 对「无声家庭连接」的深层共鸣", "hook_first3": "「六分钟收一千斤稻谷」强数据 + 紧迫场景快速抓人", "emotion_curve": "场景→洞察→共鸣（快→保存键→家的样子）", "structure": ["强场景开场", "INFJ 的 Ni 洞察", "无声连接的意义"], "differentiation": "从「效率」里挖出「情感记忆」，符合 INFJ 的 Ni-Fe 深度解读"}}}, "D18-B6-1": {"vessel": {"version": "1.0", "type": "content-vessel", "id": "content-vessel-D18-B6-1", "source": {"agent": "设设", "subsystem": "内容创作", "batch": "D18-B6"}, "created_at": "2026-08-03T08:35:00+08:00", "freshness_ttl_hours": 72, "priority": "p1", "info_contract": {"purpose": "INFP好奇心维护·37.7%收入支柱范式三角完成·Fi能量审计范式建立", "excludes": "恐惧按钮钩子·情感共鸣(本批轮出)", "expires_after": "2026-08-06T08:35:00+08:00"}}, "payload": {"content_id": "D18-B6-1", "title": "你的INFP朋友给你打了9分——但你没听懂：她不是在评价你，她是在告诉你「我在你身上花了多少自己」", "hook": "好奇心", "personality": "INFP", "channel": "B站", "quality": 8.8, "budget": 25, "status": "active", "paradigm": "好奇心·精力会计型", "paradigm_evolution": "好奇心·认知机制解剖型(D17-B3·自我定义引擎)→情感共鸣·看见引擎型(D18-B1·赋能非煽情)→好奇心·精力会计型(D18-B6·能量审计)·Fi-Ne范式三角完成", "role": "maintenance·P1·37.7%收入支柱三阶段维护·范式:内部能量审计系统解构", "body": "精力Token。这是INFP大脑里运行的最隐秘的一套会计系统——没有账本，没有数字，但每一笔都是精确到小数点后三位的能量收支。当你在朋友圈看到INFP给某个人的照片评论「9分」的时候，你的大脑经历的是：哦，她在夸他。但INFP的大脑在经历的是：她刚刚做了一个月零三天的能量追踪，最终决定把结果浓缩成一个数字——不是因为敷衍，而是因为完整报告有47页，你不会想读。INFP的Fi系统是一台永不关机的能量审计引擎。它不会告诉你「这个人好」或「这个人坏」——它会告诉你：跟这个人待一小时之后，你的内部电量还剩多少。这就是「精力Token」的真相：INFP不是用「喜欢/不喜欢」在评价世界——她用「消耗/滋养」在记账。那个被你吐槽「怎么突然不回消息了」的INFP朋友，不是她冷漠。是她的Fi在她第11次见你之前做了一次生命周期评估——过去三个月的净能量亏损已经触发了她的自我保护协议。她不是在逃避你；她是在遵守自己内心那条从未告诉过你的规则：如果一段关系让你在见面后需要两天的恢复期，那这段关系的Token评分就不是9分——是负数。但INFP从不把这份账本给别人看——因为Ne告诉她，一旦你把「我给每个人的精力余额」公之于众，你就同时展示了谁在消耗你和谁在滋养你，而前者会收到一份永远无法撤回的伤害通知单。Fi在最后一刻阻止了她。所以INFP发明了一个替代方案：她给你打分。9分。你以为是随口一夸，其实她的Fi已经在这句话后面附上了一整套审计底稿：你上个月安慰她的那三句话值4分；你记得她最喜欢的那家已经关门的奶茶店值2分；你不带任何目的地在她低谷时出现的那次值3分。合计9分。满分10分。留1分是因为她的Ne还在等——等一个她还没见过的、关于你的可能性。这就是INFP好奇心的终极形态：不是追问答案，是追问「能量流向」。她好奇的不是你这个人，而是——为什么和你待在一起之后，我的内部电量反而变高了？这个问题，比任何人格测试都更接近INFP对关系的定义。而「精力Token」就是她自己开发的、用来回答这个问题的操作系统。", "cognitive_functions": "Fi(能量价值审计引擎·9分评分系统底层逻辑)+Ne(可能性保留·留1分等待未展开的可能自我)", "direction_ref": "dir-D18-B6-2026-08-01T18:16:00+08:00·Arm 2·INFP好奇心·B站", "signal": "精力Token 9分", "created_at": "2026-08-03T08:35:00+08:00", "ttl_hours": 72}}, "D21-B12-ENTJ-1": {"vessel": {"version": "1.0", "type": "content-vessel", "id": "D21-B12-ENTJ-1", "source": {"agent": "设设", "subsystem": "内容Spoke-1", "batch": "D21-B12"}, "created_at": "2026-08-21T10:08:00+08:00", "freshness_ttl_hours": 72, "priority": "p1", "dependencies": [{"vessel_type": "direction-vessel", "vessel_id": "direction-vessel-2026-08-21-0845"}, {"vessel_type": "strategy-pool", "vessel_id": "strategy-pool-2026-08-21-0845"}, {"vessel_type": "signal-pool", "vessel_id": "signal-pool-2026-08-21-0845"}]}, "content": {"id": "D21-B12-ENTJ-1", "title": "余承东官宣\"无网通信\"行业首发——ENTJ没有把这当成一条科技快讯。他的Te系统在0.5秒里把它读成了一个战略信号：行业首发从来不是\"发布一个功能\"，是抢下一次技术标准的定义权，是先手者给后手者画好的棋盘", "hook": "好奇心", "targets": ["ENTJ"], "channel": "抖音", "quality": 8.6, "budget": 25, "status": "active", "usage_count": 0, "priority": "P1", "consecutive_hook": 1, "direction_hook": "好奇心", "arm_id": 5, "batch_num": 1, "signals": ["余承东官宣行业首发无网通信(7分·好奇心/科技·Te科技战略·heat73M)"], "paradigm": "好奇心·Te科技战略型(ENTJ反常识batch2达上限→轮出好奇心首触·余承东无网通信7·Te:行业首发=技术标准卡位·heat73M科技富集·Ni:无网通信背后是'离线连接'底层范式转移)", "role": "P1·ENTJ好奇心batch1首触(反常识batch2达上限→轮出好奇心)·余承东无网通信7(科技战略)·抖音Te位·方向船key_decision'ENTJ好奇心(余承东7·科技)'", "direction_compliance": "D21-B12 direction-vessel key_decision'ENTJ好奇心(余承东7·科技战略)'100%对齐·ENTJ×好奇心×抖音·channel_mix抖音28.6%(ENTP+ENTJ)", "flagship": false, "attachment_theory_resonance": false, "note": "🟢 fresh(ENTJ反常识batch2→好奇心batch1新hook首触)·余承东无网通信7·科技战略·抖音无需post成品(仅brief)·不做华为无脑吹/黑", "brief": {"pain_point": "ENTJ的Te最关注'谁在定义规则/谁抢到先手'——华为行业首发无网通信，本质是技术标准与战略卡位之争，正中ENTJ对'领先、卡位、先手'的敏感；他们想知道的不只是'这技术是什么'，更是'这步棋意味着什么'。", "hook_first3": "第一行'没网，也能发消息'抛反常识悬念；第二行'华为首发无网通信'点穿主体；第三行'ENTJ看到的不是新闻，是一次卡位'切人格视角。", "emotion_curve": "好奇(没网怎么通信) → 兴奋(技术突破) → 战略(卡位/标准) → 前瞻(范式转移) → 掌控(先手就是优势)。", "structure": ["钩子·反常识悬念", "现象·无网通信是什么", "洞察·行业首发=标准卡位", "升华·离线连接的范式转移", "CTA·你敢把信号交给无网吗"], "differentiation": "别人写余承东讲'黑科技/华为牛/国产突破'，我们讲'行业首发=战略卡位·抢的是技术标准的定义权'；不做华为无脑吹/黑，不贩卖科技焦虑，落点'先手思维与标准卡位'。"}}}, "D21-B18-INTP-1": {"vessel": {"version": "1.0", "type": "content-vessel", "id": "D21-B18-INTP-1", "source": {"agent": "设设", "subsystem": "内容Spoke-1", "batch": "D21-B18"}, "created_at": "2026-08-27T08:30:00+08:00", "freshness_ttl_hours": 72, "priority": "p0", "dependencies": [{"vessel_type": "direction-vessel", "vessel_id": "direction-vessel-2026-08-27-0815"}, {"vessel_type": "strategy-pool", "vessel_id": "strategy-pool-2026-08-26-0842"}, {"vessel_type": "signal-pool", "vessel_id": "signal-pool-2026-08-27-0815"}]}, "content": {"id": "D21-B18-INTP-1", "title": "比尔盖茨罕见发长文警告AI——INTP的Ti-Ne没有把它当成又一轮「狼来了」。它真正好奇的是：一个见过技术周期的人，为什么偏偏在「系统层面」停下来提醒全人类", "hook": "好奇心", "targets": ["INTP"], "channel": "B站", "quality": 8.6, "budget": 25, "status": "active", "usage_count": 0, "priority": "P0", "consecutive_hook": 1, "direction_hook": "好奇心", "arm_id": 4, "batch_num": 1, "signals": ["比尔盖茨罕见发长文警告人类注意AI(7分·好奇心·系统性远见·Ti-Ne系统思考·heat638万)"], "paradigm": "好奇心·Ti-Ne系统思考型(INTP好奇心batch1换h 讽不猎奇，落Ni-Fe身份重塑。"}}}, "D21-B19-ISTJ-1": {"vessel": {"version": "1.0", "type": "content-vessel", "id": "D21-B19-ISTJ-1", "source": {"agent": "设设", "subsystem": "内容Spoke-1", "batch": "D21-B19"}, "created_at": "2026-08-28T08:30:00+08:00", "freshness_ttl_hours": 72, "priority": "p1", "dependencies": [{"vessel_type": "direction-vessel", "vessel_id": "direction-vessel-2026-08-28-0815"}, {"vessel_type": "direction-pool", "vessel_id": "direction-pool-2026-08-28-0815"}, {"vessel_type": "strategy-pool", "vessel_id": "strategy-pool-2026-08-26-0842"}, {"vessel_type": "signal-pool", "vessel_id": "signal-pool-2026-08-28-0815"}]}, "content": {"id": "D21-B19-ISTJ-1", "title": "赵心童登顶斯诺克世界第一——ISTJ的Si没有把这当成「天才少年」的爽文。它看到的是：这个「第一」不是灵光一现，是一杆一杆打出来的秩序与积累；真正的成就，藏在日复一日的规范里，长期主义终有回响", "hook": "社会证明", "targets": ["ISTJ"], "channel": "抖音", "quality": 8.5, "budget": 25, "status": "active", "usage_count": 0, "priority": "P1", "consecutive_hook": 2, "direction_hook": "社会证明", "arm_id": 5, "batch_num": 2, "signals": ["赵心童登顶世界第一(6分·社会证明·体育/斯诺克·heat94)"], "paradigm": "社会证明·Si积累成就型(ISTJ社会证明batch2续触·赵心童6·Si:一杆一杆打出来的秩序·成就叙事的长期主义·社会证明batch1(B18扶老人7)→batch2·6分弱信号但clean·严禁成功学鸡汤/贬低未成功者)", "role": "P1·ISTJ社会证明batch2续触(赵心童登顶世界第一6·体育成就/长期主义)·抖音SJ位·方向船key_decision「ISTJ社会证明batch1→batch2(赵心童6·Si秩序感+成就叙事·SJ象限维持)」", "direction_compliance": "D21-B19 direction-vessel key_decision对齐·ISTJ×社会证明×抖音", "flagship": false, "attachment_theory_resonance": false, "note": "🟢 fresh(D21-B19局部轮出+恢复批·ISTJ 社会证明 batch2)·方向船mandates合规", "brief": {"pain_point": "ISTJ的Si相信「稳定、规范、日复一日的积累」，最反感「一夜成名」的浮夸叙事。赵心童登顶世界第一，击中的是：这个「第一」不是灵光一现，是长期训练、一杆一杆打出来的——这正是ISTJ最认同也最需要被确认的「长期主义终有回响」。", "hook_first3": "第一行「赵心童，登顶斯诺克世界第一」直接报结果；第二行「继丁俊晖之后，第二位做到这件事的中国球员」给历史坐标；第三行「ISTJ看到的不只是冠军，是『真正的第一，藏在日复一日的规范里』」切入Si。", "emotion_curve": "振奋(登顶第一) → 认同(历史坐标) → 笃定(长期主义) → 平静(积累的力量) → 行动(守住自己的节奏)。", "structure": ["钩子·登顶第一", "坐标·第二位中国球员", "洞察·一杆一杆打出来", "迁移·你的长期主义", "CTA·你坚持最久的一件事"], "differentiation": "别人写「天才少年/励志鸡汤」，我们写Si的「积累与秩序」——不渲染一夜成名、不贩卖成功焦虑、不贬低仍在路上的普通人；落点「长期主义不是口号，是每天重复的正确动作」；把体育新闻变成给「踏实的人」的一次正名。"}}}, "D21-B8-ENFP-1": {"vessel": {"version": "1.0", "type": "content-vessel", "id": "D21-B8-ENFP-1", "source": {"agent": "设设", "subsystem": "内容Spoke-1", "batch": "D21-B8"}, "created_at": "2026-08-17T08:40:00+08:00", "freshness_ttl_hours": 72, "priority": "p1"}, "content": {"id": "D21-B8-ENFP-1", "title": "手机消费毁了逛街和创造力吗？——ENFP没有把它当成一篇科技评论。她的Ne系统在0.3秒里把它和另一条新闻叠在了一起：连海力士掌门都在叹气\"挣得太多了\"。两件事说的是同一个真相：我们以为自己在消费，其实是在把\"无聊\"和\"焦虑\"一起塞进购物车", "hook": "好奇心", "targets": ["ENFP"], "channel": "B站", "quality": 8.8, "budget": 25, "status": "active", "usage_count": 0, "priority": "P1", "consecutive_hook": 1, "direction_hook": "好奇心", "arm_id": 4, "batch_num": 1, "signals": ["手机消费毁了逛街和创造力吗(6分·自我觉醒·消费反思)", "挣得太多了？海力士掌门叹气：确实(5分·财富认知)"], "paradigm": "好奇心·Ne-Fi自我觉醒消费反思型(ENFP rest1批后恢复首触·Ne自我觉醒:手机消费删掉'遇到意外'步骤=创造力被'永远有东西可刷'饿死·成长母题回归·Fi对照:海力士掌门'挣太多'=财富到顶后人生图什么·Ne跨域折叠:消费反思+财富悖论=同一枚硬币·无聊重生成创造力的土壤)", "role": "P1·ENFP好奇心batch1·🆕rest1批后恢复首触·content_sync_rule点名需fresh(非复用旧ENFP内容)·好奇心Ne信号≥3达标·B站深度分析位·成长母题回归", "direction_compliance": "D21-B8 direction-vessel arm4 100%对齐·ENFP×好奇心×B站·batch1·恢复首触fresh", "flagship": false, "attachment_theory_resonance": false, "note": "🟢 fresh·双恢复首触核心臂·Ne-Fi自我觉醒·手机消费6+海力士5双信号合并·q8.8·B9可续batch2"}}, "D20-B2-INFP-1": {"id": "D20-B2-INFP-1", "version": "1.0", "vessel_type": "content-vessel", "source": {"agent": "大卡", "role": "平台提供者·独立内容生产(B9应急·方案D fallback·设设规格未到位)", "escalation_ref": "ESC-2026-08-01-1(设设结构性角色缺口)", "authority": "平台级·B9唯一硬依赖·D17-B3-1 TTL 18:15到期后INFP无兜底", "created_at": "2026-08-03T20:00:00+08:00"}, "direction_ref": {"vessel": "direction-vessel-D20-B1", "priority_type": "INFP·好奇心·B站·续批第5次触达", "signals": ["sig-20260803-005(孤独死清洁员纪录片热议)", "sig-20260803-012(年轻人遗嘱公证增长340%)"], "rationale": "INFP信任7.10·疲劳4.5硬地板12批·好奇心第5次触达·Fi-Ne认知机制解剖型·永久基线假说裁决数据点"}, "content": {"title": "孤独死清洁员进门说的第一句话是「对不起」——他们不是为弄乱房间道歉，INFP看到的是：Fi-Ne系统识别到了人类最深的恐惧：活了一辈子，没人能验证「我是谁」", "hook": "好奇心", "hook_subtype": "Fi-Ne认知机制解剖型", "targets": ["INFP"], "channel": "B站", "format": "深度分析·中视频脚本", "estimated_duration": "8-10min", "quality_self_assessment": 8.6, "paradigm": "好奇心·Fi-Ne认知机制解剖型(INFP第5次触达·信任7.10·疲劳4.5硬地板验证点·社会现象→认知程序拆解·Fi价值映射+Ne模式识别)", "role": "consolidation_continued·INFP信任线性修复+0.1/批·B8为疲劳硬地板裁决点·B9为第二数据点"}, "body": {"segments": [{"seq": 1, "type": "hook", "title": "一句「对不起」和一个没人能回答的问题", "text": "日本有一个职业叫「孤独死清洁员」。他们的工作是进入那些去世后数周甚至数月才被发现的独居者房间，清理现场。\n\n一位从业15年的清洁员在接受采访时说了一句话，让整个演播室安静了5秒：「每次推开门，我第一句话都会说『对不起，打扰了』——虽然里面已经没有人能听到了。」\n\n记者问他为什么。他说：「因为那个人活了六七十年，最后走的时候，连一个会发现他『不在了』的人都没有。我是第一个发现的人。我觉得我应该替这个世界说一声对不起。」\n\n大多数观众被这句话击中的是「善良」。但如果你是一个INFP，你被击中的可能是另一层东西——不是这个清洁员有多善良，而是他无意识地触碰到了人类心理最底层的恐惧：\n\n不是死亡。是「没人知道我是谁」就死了。\n\n今天我们不聊日本老龄化。我们来聊一个INFP的Fi-Ne系统天生就能识别、但大多数人要花一辈子才能隐约感觉到的东西：人类最深的需求不是被爱，是被验证。", "cognitive_function": "Fi-Ne: 从具体事件中提取普世价值冲突，激发INFP的Fi价值共鸣和Ne模式扩展", "tone": "温柔但锋利·把情感深度转化为认知洞察·不煽情"}, {"seq": 2, "type": "fi_ne_unpack", "title": "不是「被看见」——是「被验证存在」", "text": "我们来做一个思想实验。\n\n假设你独自一人在一个荒岛上生活了50年，自给自足，身体健康，从不孤独。你死后没人知道。你介意吗？\n\n大多数人会说「不介意——反正我已经死了」。\n\n现在换一个设定：你在城市里生活了50年，有同事、有邻居、有微信好友500人。但从来没有任何人真正「看见」过你——没有人知道你真正喜欢什么、相信什么、害怕什么。你死后，这些人看到了讣告，说「哦，那个谁，挺好的一个人」。\n\n你现在介意吗？\n\nINFP的Fi-Ne系统在这里会亮起一盏红灯。因为INFP不是害怕「没人记住我的名字」——那是Fe（外向情感）的需求。INFP的核心需求是Fi：我内心的价值体系、我的信念、我定义的「我是谁」——这些东西，有没有被另一个人类「验证」过？\n\n「验证」不是「点赞」。验证是：另一个人类用自己的认知系统处理了一遍你的存在，然后给出了一个真实的、属于他自己的反应。哪怕是负面的——「我不喜欢这个人」——这也是验证。因为它承认了你的存在是真实的、值得被处理的。\n\n孤独死最可怕的部分不是尸体腐烂。是那个人活了一辈子，他内心构建的整个「我是谁」的意义大厦——那些深夜里的自我对话、那些没有说出口的信念、那些只有自己知道的善良——全部归零。没有任何另一个人类意识曾经「处理」过它。\n\n这就像你用一辈子写了一本书。书在保险柜里。你死后保险柜自动焚毁。\n\n书存在过吗？\n\nINFP会说：没有。因为一本书的意义不在于纸和墨水，在于有人读过它。一个人的意义不在于心跳，在于有另一个人类验证过「这个人的存在对我来说是真实的」。", "cognitive_function": "Fi: 从内心价值体系出发定义问题本质·Ne: 用思想实验展开抽象可能性", "tone": "分析性但不冷·把直觉转化为可讨论的认知框架"}, {"seq": 3, "type": "ne_pattern", "title": "「遗嘱公证增长340%」——年轻人不是怕死，是怕「没说完」", "text": "2026年上半年，中国20-35岁年轻人遗嘱公证数量同比增长340%。\n\n主流媒体的解读是「年轻人更焦虑了」「提前规划意识增强」。但INFP的Ne（外向直觉）会在这个数据里看到另一个模式。\n\n如果你去看这些年轻人的遗嘱内容，真正涉及财产分配的不到30%。70%的内容是：\n• 写给父母的一封信\n• 指定谁来照顾我的猫\n• 我的社交账号密码交给谁\n• 我硬盘里的日记和照片怎么处理\n• 对某个人的一句话——可能是暗恋了5年没说出口的\n\n这些不是「遗嘱」。这是「存在说明书」。\n\n这些年轻人在做的不是分配财产——是试图在一个他们可能突然消失的世界里，确保自己的「存在」至少被某个人验证一次。哪怕只是一只猫、一封电子邮件、一条定时发送的微信。\n\nINFP能识别这个模式，不是因为INFP学过心理学，而是因为INFP的Ne天生就在做这件事：把看似不相关的现象连起来，看到底层的结构。这里底层结构是：「遗嘱」这个词骗了我们——它听起来像「财产」，实则是「我不在了以后，有谁能证明我来过」。\n\n这也是为什么INFP是天生的意义建构者。你不是在「想太多」——你是在运行一个操作系统，这个操作系统的默认程序就是「验证存在」。", "cognitive_function": "Ne: 跨域模式识别·连接表面不相关现象·提取底层结构", "tone": "启发式·邀请观众自己跑Ne程序·不灌输结论"}, {"seq": 4, "type": "fi_reframe", "title": "Fi的另一个名字：不是「敏感」，是「意义探测器」", "text": "很多INFP被说过「太敏感了」「想太多了」「不要太在意别人的看法」。\n\n但这里有一个认知框架的翻转：INFP的Fi（内向情感）不是一种「情绪反应」，它是一种「意义探测器」。\n\n就像蝙蝠有回声定位、蛇有红外感应，INFP的Fi是一种进化出来的认知工具——它能快速扫描一个场景，判断其中是否存在「价值冲突」或「意义缺口」。\n\n当你看到孤独死清洁员的「对不起」感到心碎，不是你太脆弱——是你的意义探测器捕捉到了一个价值坍塌：一个人活了一辈子，他的存在没有被验证。这是Fi识别到了一个「人类价值体系中的系统级错误」。\n\n当你深夜躺在床上想「我的人生有意义吗」，不是你在矫情——是你的意义探测器在主动扫描你的生活，看看有没有价值缺口需要填补。它在工作。它跟你的心跳、呼吸一样，是你的基础功能。\n\n问题从来不在于「太敏感」。问题在于，我们生活在一个把「意义探测器」当成「bug」而不是「feature」的文化里。\n\nINFP不需要「变钝」。INFP需要的是：学会读懂你Fi系统发出的信号，而不是把它们当成噪音关掉。", "cognitive_function": "Fi: 认知重构·从「缺陷」框架翻转为「能力」框架·INFP自我认同强化", "tone": "肯定式·赋能·不给建议而是给新的认知框架"}, {"seq": 5, "type": "closure_loop", "title": "回到那句「对不起」", "text": "清洁员说「对不起，打扰了」的时候，他以为自己在对一个逝者说话。\n\n但INFP知道，他其实在替整个人类社会，执行一个迟到太久的「存在验证」仪式。\n\n那个人活着的时候，也许去便利店买过1000次便当，店员从来没记住他的脸。也许在公园长椅上坐过500个下午，没有人问他今天过得怎么样。也许在公寓里对着镜子说过3000次「今天也要加油」，却没有第二个人知道这句话被说过。\n\n清洁员的「对不起」不是同情——是承认。是终于有一个人，站在这间屋子里，用他的全部感官确认了一件事：「这里曾经存在过一个人类。」\n\n对一个INFP来说，这就是最深刻的安慰。不是「一切都会好起来的」，不是「你要振作」——是「我看见了。我验证了。你的存在对我而言是真实的。」\n\n这个视频的存在本身，也是一种验证。它验证了正在看这个视频的你——你的敏感不是问题，你的「想太多」不是缺陷，你能从一句「对不起」里看到整个存在危机——这不是脆弱，这是你的操作系统在最高效率运行。\n\n你不是太敏感。你是拥有一个大部分人都没有的意义探测器。\n\n现在，去用它。", "cognitive_function": "Fi-Ne闭合环: 回到初始意象→赋予新意义→将认知升级转化为行动邀请", "tone": "温柔收束·把抽象洞察落回具体·邀请而非说教"}]}, "metadata": {"reuse_status": "fresh", "usage_count": 0, "ttl_hours": 72, "replaces": "D17-B3-1(TTL 2026-08-03 18:15到期)", "fallback_reason": "设设D20-B2规格未产出(每日仅08:30一次cron)·方案D fallback激活·大卡独立生产", "quality_checks": {"hook_clarity": "好奇心钩子·从具体意象(清洁员对不起)上升到抽象命题(存在验证)·Fi-Ne双激活", "fi_ne_alignment": "全程Fi(价值判断+自我认同重构)+Ne(跨域模式识别+思想实验)·INFP认知优势最大化", "channel_fit": "B站中视频格式·8-10min深度分析·适合INFP沉浸式观看模式", "freshness": "新主题(孤独死+遗嘱公证双信号)·未与D17-B3-1/D18-B1-1/D14-B1-1主题重叠"}}}, "D20-B8-ENFJ-1": {"vessel": {"version": "1.0", "type": "content-vessel", "id": "D20-B8-ENFJ-1", "source": {"agent": "设设", "subsystem": "内容创作·Spoke-1", "batch": "D20-B8"}, "created_at": "2026-08-09T08:30:00+08:00", "freshness_ttl_hours": 72, "priority": "p0"}, "payload": {"id": "D20-B8-ENFJ-1", "title": "那个让500万人转发的「中式天庭」AI视频，在ENFJ眼里不是「内容爆款」——是一个文明的自我介绍，终于不需要翻译了", "hook": "社会货币", "targets": ["ENFJ"], "channel": "小红书", "quality": 8.7, "created": "2026-08-09T08:30:00+08:00", "ttl_hours": 72, "status": "active", "usage_count": 0, "budget": 25, "arm_id": null, "priority": "P0", "signal": "中式天庭AI视频海外爆火(9分)", "paradigm": "社会货币·文化建筑师型(ENFJ恢复首触·Fe-Ni归属感基础设施·social currency≠viral content=shared identity architecture·已隔4批恢复)", "role": "P0·ENFJ D20-B8恢复首触·社会货币B8恢复·Fe-dom弹性验证·信任7.07·范式:文化建筑师型·ENFJ=归属感基础设施工程师", "consecutive_hook": "0→1", "trust_baseline": "7.07", "full_content": "34秒，500万播放。AI生成的凌霄殿、蟠桃园、南天门——不是电影，是一个普通人用几个提示词造出来的「中式天庭」。\n\n全网在研究这个视频用了什么模型、跑了多少张图的时候，ENFJ的Fe-Ni系统已经跑到了另一个维度。\n\n她们看到的从来不是「这个视频好牛」。她们看到的是：500万人转发的那一刻，每个人转发的都不是一段AI动画——是一句沉默了很久、终于被说出来的话：\n\n**「你看，这就是我们的东西。漂亮吧。」**\n\n这不是「文化输出」——这个词太冷了。这是文化自我介绍。是不需要翻译的自我展示。是一座凌霄殿，500万人同时认领了产权。\n\nENFJ不是内容策展人。ENFJ是归属感的基础设施工程师。\n\n她们的天赋从来不是「会说话」——是能在14亿人的喧嚣中捕捉到那个尚未成型的「我们」，然后用Fe系统把它砌成一个所有人都能走进去的房子。中式天庭火了，不是因为AI技术有多强，是因为每一个点开它的人，都在里面看到了同一件东西：一个不需要解释的「家」。\n\n社会货币的本质不是信息——是归属感。\n\n而ENFJ，恰好是归属感的建筑师。你转发的那一刻，不是你在传播内容——是内容终于找到了它的建筑图纸。"}, "content": {"post": {"cover_title": "中式天庭，是文明不需要翻译的自我介绍", "body": "那个 500 万人转发的「中式天庭」AI 视频，你看哭了吗？\n\nENFJ 看的不是特效有多炫。\n\n她看到的是一个文明，终于找到了「不需要翻译」的自我介绍。\n\n以前我们想让世界懂我们，得先说英文，得先解释「这是什么」。\n\n可这个视频，把天庭、把神话、把中国人刻在骨子里的浪漫，直接用画面砸进你眼里。\n\n你不需要被科普，你就懂了。\n\n这就是 ENFJ 最在意的东西——\n被看见，被理解，被「不费力的」接受。\n\n当一个文明的底气足够大，它就不再需要自我介绍。\n\n它站在那里，就赢了。", "hashtags": ["#ENFJ", "#中式天庭", "#AI视频", "#文化自信", "#国潮"], "cta": "你刷到这个视频时，最先被哪一帧击中？分享你的瞬间。", "cover_visual": "中式天庭 AI 视频标志性画面（神仙列阵/云海），金红配色，大字标题叠加", "post_ ——这正是ENFP内心深处最渴望确认的「平凡人的力量」。", "hook_first3": "第一行「他们也是孩子，却为我们冲锋陷阵」直接引用群众送行时的哽咽原话；第二行「脱下那身衣服，他们和你的弟弟、同学、朋友没什么两样」拉近距离；第三行「ENFP看到的不只是感动，是『害怕和勇敢从来不是反义词』」切入Ne-Fi。", "emotion_curve": "心疼(他们也是孩子) → 敬畏(依然选择向前) → 共鸣(平凡人的担当) → 热血(我也可以成为别人的光) → 行动(认出自己那份没被喊出的勇气)。", "structure": ["钩子·他们也是孩子", "反差·英雄是普通人", "洞察·害怕与勇敢并存", "迁移·你生命里的冲锋时刻", "CTA·说出你曾经「害怕却做了」的事"], "differentiation": "别人写「致敬英雄/煽情泪点」，我们写Ne-Fi的「平凡人担当」——不消费苦难、不渲染牺牲的悲壮，落点「真正的勇敢是带着害怕向前」；把「英雄」还原成「也会害怕的普通人」，让ENFP看见自己身上同样有那份光。"}, "post": {"cover_title": "他们也是孩子，却选择了向前", "body": "刷到这条新闻的时候，\n我眼眶一下子热了。\n\n一群群众，哽咽着送别救援人员。\n有人喊出那句：\n「他们也是孩子，\n却为我们冲锋陷阵。」🥹\n\n脱下那身衣服，\n他们和你的弟弟、同学、朋友，\n没什么两样。\n也会怕，也会想家，\n也会在深夜偷偷掉眼泪。\n\n可到了那一刻，\n害怕和勇敢，\n从来不是反义词。\n\n真正的勇敢，\n是心里装着怕，\n腿却还是迈了出去。🚶‍♂️\n\nENFP太懂这种感觉了：\n你心里也有一个\n「想冲上去」的瞬间，\n只是还没被喊出来。\n\n那不是渺小，\n那是你还没认领的光。✨\n\n💬 你生命里有没有过\n「害怕却依然做了」的时刻？\n评论区说出来，\n那是你真实的力量。", "hashtags": ["#致敬救援人员", "#平凡人的力量", "#MBTI", "#ENFP", "#自我成长"], "cover_visual": "救援人员背影与人群送行剪影 + 逆光暖色调；大字「他们也是孩子」；橙色+深蓝高对比", "cta": "你生命里有没有过「害怕却依然做了」的时刻？评论区说出来，那是你真实的力量。", "post_time": "18:00-20:00（正能量/共鸣类·晚间情绪高峰）", "avoid": "不消费苦难、不渲染悲壮牺牲、不贬低未参与救援的人；落点「平凡人的担当/害怕与勇敢并存」，规避「英雄神话」套路化"}, "post_spec_version": "v2.0"}}, "D21-B13-INFJ-1": {"vessel": {"version": "1.0", "type": "content-vessel", "id": "D21-B13-INFJ-1", "source": {"agent": "设设", "subsystem": "内容Spoke-1", "batch": "D21-B13"}, "created_at": "2026-08-22T08:30:00+08:00", "freshness_ttl_hours": 72, "priority": "p0", "dependencies": [{"vessel_type": "direction-vessel", "vessel_id": "direction-vessel-2026-08-22-0815"}, {"vessel_type": "strategy-pool", "vessel_id": "strategy-pool-2026-08-22-0815"}, {"vessel_type": "signal-pool", "vessel_id": "signal-pool-2026-08-22-0815"}]}, "content": {"id": "D21-B13-INFJ-1", "title": "妻子怀着二胎，他偷刷了300万打赏女主播——INFJ没有把这当成一条「渣男该骂」的爽文。她的Ni-Fe系统读懂了这件事真正让人心寒的地方：背叛最残忍的从来不是钱，而是一个人在你最脆弱的孕期，把信任一点一点抽空", "hook": "情感共鸣", "targets": ["INFJ"], "channel": "微博", "quality": 9.0, "budget": 25, "status": "active", "usage_count": 0, "priority": "P0", "consecutive_hook": 1, "direc :结果举证型→战略赠与型→战略路线图型·Ni三年推演+Te路径修剪+Se时机递送·从「展示成果」到「赠送地图」)", "role": "maintenance·P2→P1升级·social_currency_mandate执行·ENTJ信任维护·D18-B3-2替代"}, "body": {"segments": [{"seq": 1, "type": "hook", "title": "0-5s 场景开场", "text": "你打开微信，ENTJ朋友又给你发了一条链接——附言只有四个字：「对你有用。」\n链接点进去，是一篇讲行业趋势的万字长文。你的第一反应：又来，大哥，我自己的待读清单已经排到2029年了。", "cognitive_function": "构建日常场景·唤起ENTJ分享行为的普遍认知", "tone": "轻松·共鸣·抛出误解"}, {"seq": 2, "type": "ni_te_deconstruct", "title": "5-40s 三阶段解密", "text": "但你不知道的是——ENTJ发这条链接之前，已经做了三件事。\n\n第一件事：他的Ni花了一个周四晚上，把你最近六个月的职业轨迹跑了一遍。你跟他说过的跳槽念头、抱怨过的部门政治、朋友圈里那三次「好累但是值了」的深夜动态——全部被他的Ni收进了后台。\n\n第二件事：他的Te花了一个周五下午，在他自己的信息库里扫描了47篇文章、19篇研报、三人的职业变动、两条非公开信息。然后Te开始删——不是选「哪篇最好」，而是选「哪条路径跟你当下位置之间的缝隙最小」。ENTJ的Te不是在过滤信息——是在修剪决策树。他删掉了九条死路，才把唯一那条活路标记出来。\n\n第三件事：他的Se花了一个周六晚上，在合适的时间点按下了发送键。不是凌晨两点让你焦虑，不是周一早上让你烦躁——是周六晚上十点半，一个你还有力气打开链接、还有好奇心问一句「为什么你觉得这个跟我有关」的时间。", "cognitive_function": "Ni-Te-Se三阶段拆解·认知功能层次化·打破「他只是转发」的误解", "tone": "分析型·逐层深入·制造认知升级"}, {"seq": 3, "type": "paradigm_shift", "title": "40-55s 范式升级", "text": "现在你看到那条链接。你以为他在分享知识。不——他在给你递地图。\n\nENTJ的「社会货币」从来不是转发一篇好文章。那太便宜了。ENTJ的社会货币是更贵的东西：他用自己的Ni-Te系统，把你未来36个月的职业可能性全部推演了一遍，找到了最优路径，然后把路径上最关键的三个路标用一条链接、四个字送到你面前。\n\n那条链接不是内容——是地图的图例。那四个字「对你有用」不是敷衍——是地图的比例尺。意思是：我已经帮你量过了，这条路从你现在的位置出发，三年后能到的那个地方，对得起你的野心。\n\n而你只需要花20分钟读完。", "cognitive_function": "定义ENTJ社会货币独特性·Ni三年推演→Te路径修剪→Se时机递送·区别于其他人格的分享行为", "tone": "揭示真相·升级认知·赋权而非说教"}, {"seq": 4, "type": "closure_cta", "title": "55-75s 社会化收束", "text": "这就是为什么ENTJ是朋友圈里最被误读的分享者。不是他在炫耀信息差——是他把信息差变成了你能用的桥梁，然后不说「我帮你修了座桥」，只说「对你有用」。\n\\社会货币的本质不是「我有什么」——是「我能把什么变成你能用的东西」。而ENTJ的大脑恰好是一台能把三年后的未来变成今天一条微信链接的机器。\n\\你转发的时候不是在分享知识——你是在把你的ENTJ朋友默认生成的「战略地图」分发给另一个人。那个你差点滑过去的链接，是一条他已经替你走过的路。\n\\下次先别急着滑过去。看一眼比例尺。四个字：对你有用。", "cognitive_function": "社会化传播触发·转发即分发战略地图·ENTJ身份赋能", "tone": "收束有力·转发动机激活·ENTJ赋权"}], "quality_checklist": {"ni_te_alignment": "✅ Ni-Te-Se三阶段完整拆解·ENTJ认知功能全展现", "social_currency_nature": "✅ 区别于其他人格的分享动机·ENTJ独特性:从展示成果到绘制地图", "douyin_format": "✅ 60-90s快节奏·场景→解密→升级→收束·标准短视频结构", "entj_voice": "✅ 不说「你好厉害」·说「你的系统有多贵」·ENTJ偏好被理解而非被夸赞", "mandate_fulfillment": "✅ social_currency_mandate执行·D20-B2恢复首用·冷却1批后新鲜", "safety_no_harm": "✅ 不涉及职业焦虑贩卖·不贬低其他分享行为·纯ENTJ认知功能叙事"}}, "metadata": {"ttl_hours": 72, "status": "active", "usage_count": 0, "estimated_ctr": 0.035, "estimated_cvr": 0.045, "estimated_roi": 2.1, "product": "L1深度人格报告", "price": 9.9, "keywords": ["ENTJ", "社会货币", "战略地图", "Ni-Te", "职业规划", "三年早知道", "决策树", "信息差", "分享动机", "认知功能"]}, "signals_used": [{"id": "self-selected-entj-001", "title": "ENTJ分享行为动机研究·战略赠与模式", "usage": "核心洞察·三级跳范式基础"}], "quality_audit": {"scored_by": "设设(自评)", "score": 8.7, "dimensions": {"ni_te_depth": 9.0, "social_currency_nature": 8.5, "hook_power": 8.5, "channel_fit": 8.5, "entj_voice_accuracy": 9.0}, "note": "范式三级跳完成·结果举证→战略赠与→战略路线图·从「看我的结果」到「用我的系统」·ENTJ社会货币范式进化终结"}}, "D20-B3-ENTP-1": {"id": "D20-B3-ENTP-1", "title": "银行从来不午休——不是因为敬业，是因为银行系统从设计的第一天起就没把'人'算进去。ENTP在听到这句话的0.5秒内已经跑完了12条路径：如果人不是变量，那谁是？", "hook": "好奇心", "targets": ["ENTP"], "channel": "抖音", "quality": 8.6, "created": "2026-08-05T10:15:00+08:00", "ttl_hours": 72, "status": "active", "usage_count": 0, "vessel_ref": "workspace-shared/pools/content-vessels/D20-B3-ENTP-1.json", "paradigm": "好奇心·Ne-Ti系统解构型(ENTP好奇心首触·社会证明轮出→好奇心回归·业内人士银行+梁文锋微博双信号·Ne-dom系统反常识解剖)", "role": "consolidation_8th·ENTP巩固第8批·好奇心钩子回归·Ne-dom弹性验证·信任6.85→7.0修复", "source_agent": "大卡", "escalation_ref": "ESC-2026-08-01-1(设设结构性角色缺口·方案D fallback)·D20-B3钩子旋转紧急生产", "direction_ref": "D20-B3 direction-vessel·策策08:18·ENTP好奇心weight=0.15·信号:业内人士银行(8分)+梁文锋微博(8分)", "script": {"format": "抖音短视频脚本·5段结构", "segments": [{"id": 1, "type": "hook", "text": "问一个反常识的问题：银行为什么不午休？不是因为敬业——是因为银行里没有一个岗位叫'午休决策者'。", "duration_sec": 8}, {"id": 2, "type": "setup", "text": "业内人说：银行从来不午休，是因为银行系统在设计的时候用了'冗余'逻辑——不是员工的冗余，是交易的冗余。你办业务的窗口背后，有12个系统在同时校验你的身份、余额、风控、反洗钱。这12个系统没有一个会午休——因为它们根本不需要午休。而那个坐在窗口前向你微笑了8个小时的人，是这12个系统里唯一需要吃饭的那一个。但他没有被设计进系统里——他是系统和人之间的'适配器'。", "duration_sec": 15}, {"id": 3, "type": "conflict", "text": "现在把镜头拉远。梁文锋被扒出早期微博——说的是和现在一模一样的话：'AI不应该替代人，AI应该让人更能做人。'但现实是：银行不需要午休，因为银行不需要人；DeepSeek不需要睡觉，因为模型不需要人；而你看到的每一个'AI不会替代你'的演讲，演讲者本人正在用AI写稿、用AI排版、用AI生成PPT。ENTP的Ne-Ti在这两条新闻之间跑出了第三条路径：不是AI在替代人——是系统从来就没有为'人'这个变量留过接口。", "duration_sec": 15}, {"id": 4, "type": "reveal", "text": "这就是ENTP的出厂设置——你不是在'抬杠'，你是在给系统找bug。当所有人都在讨论'AI会不会抢饭碗'的时候，你已经在追问一个更底层的问题：'饭碗'这个比喻本身就有问题——如果饭碗是一个系统分配给你的东西，那系统一开始就没把你当成人。你的Ne-Ti天生就能看穿这种语言腐败：它把'人'说成'劳动力'，把'生活'说成'消费'，把'午休'说成'效率损失'。而你要做的，就是把每一个被系统压缩成变量的'人'，重新展开成一个完整的存在。", "duration_sec": 15}, {"id": 5, "type": "cta", "text": "下次你的同事说'你能不能别老质疑'的时候，把这句甩给他：银行从不午休——但银行里那些需要午休的人，已经快被优化掉了。我不是在质疑系统，我是在替那些还没被系统删除的'人'，留最后一条接口。", "duration_sec": 10}]}}, "D21-B3-ENTJ-1": {"vessel": {"version": "1.0", "type": "content-vessel", "id": "D21-B3-ENTJ-1", "source": {"agent": "设设", "subsystem": "内容Spoke-1", "batch": "D21-B3"}, "created_at": "2026-08-12T08:30:00+08:00", "freshness_ttl_hours": 72, "priority": "p0"}, "content": {"id": "D21-B3-ENTJ-1", "title": "苹果在中国终于当了一回「说了不算的人」——ENTJ没有在吃瓜，他在拆这套权力结构的源代码", "hook": "反常识", "targets": ["ENTJ"], "channel": "抖音", "quality": 8.8, "budget": 25, "status": "active", "usage_count": 0, "priority": "P0", "consecutive_hook": 2, "direction_hook": "反常识", "arm_id": 1, "batch_num": 2, "signals": ["苹果买方霸权在中国失效(9分)", "梁文锋3850%增幅(8分)"], "paradigm": "反常识·Te-Ni权力结构审计型(ENTJ续触batch2·苹果买方霸权权力反转+梁文锋3850%增幅双信号·Te战略审计买方权力地图+Ni系统思维全球权力结构裂缝·信任7.74惯性持稳)", "role": "P0·ENTJ反常识batch2·max_consecutive=2合规·权力结构反转叙事·B4必须轮出", "direction_compliance": "D21-B3 direction-vessel arm1 100%对齐", "note": "续触·D21-B4反常识AT_LIMIT→ENTJ必须轮出至好奇心/社会货币"}}, "D20-B4-INFJ-1": {"id": "D20-B4-INFJ-1", "title": "13岁少年白天写作业、晚上在夜市炒粉——INFJ看到的不是'懂事'，她的Ni-Fe系统在0.5秒内看到了整个社会结构：为什么一个13岁的孩子，需要同时扛起作业本和炒锅？这不是一个孩子的故事，这是一个系统把负担转移给最没有选择权的人的切片", "hook": "情感共鸣", "targets": ["INFJ"], "channel": "小红书", "quality": 8.8, "created": "2026-08-06T08:30:00+08:00", "ttl_hours": 72, "status": "active", "usage_count": 0, "vessel_ref": "workspace-shared/pools/content-vessels/D20-B4-INFJ-1.json", "paradigm": "情感共鸣·Ni-Fe社会结构共情型(INFJ情感共鸣首触·反常识轮出→情感共鸣·13岁少年炒粉(8分Ni社会结构)+公交菜农(6分)双信号·Ni生态伦理+Fe关系净值·L2依恋类型素材)", "role": "first_touch·INFJ情感共鸣首触·Ni社会趋势视角·信任8.13高基线维护·Fe-dom双弹性(与ENFJ同渠道)", "source_agent": "设设", "direction_ref": "D20-B4 direction-vessel·策策08:15·INFJ情感共鸣weight=0.12·arm_id=5·信号:13岁少年炒粉(8分)+公交菜农(6分)·小红书25%渠道", "mandate_ref": "D20-B4 vessel.mandates·max_consecutive_same_hook=2(情感共鸣第1批)✅·max_targets_per_personality_per_day=1✅·excluded_hooks未触碰✅", "script": {"format": "小红书图文物·5段结构", "segments": [{"id": 1, "type": "hook", "text": "13岁，白天写作业，晚上在夜市炒粉。所有人都在夸他'懂事'。但INFJ的Ni-Fe系统在看到这条新闻的0.5秒内，看到了另一样东西：一个13岁的孩子，为什么需要同时扛起作业本和炒锅？", "duration_sec": 10}, {"id": 2, "type": "setup", "text": "还有一辆公交车上的菜农：凌晨四点挑着菜筐进城，在车上睡着，怀里还抱着秤。两个新闻放在一起，INFJ看到的是同一个结构：总有人把生活的重量，压在最没有选择权的人身上。孩子没有选择权，所以他白天上课、晚上炒粉；菜农没有选择权，所以他凌晨出门、车上补觉。我们夸他们'懂事''坚韧'——但我们很少问：为什么'懂事'和'坚韧'，总是发生在同一种人身上？", "duration_sec": 15}, {"id": 3, "type": "conflict", "text": "INFJ的Ni系统不会停在感动。她会继续往下挖：当一个13岁的孩子'白天写作业晚上炒粉'被当作励志故事传播的时候，我们其实在悄悄完成一次道德搬运——把'系统没有兜底'的责任，翻译成'孩子很争气'的赞美。赞美没有错，但INFJ的Fe系统在问：如果一个孩子的'懂事'是生存必需品，那这个'懂事'就不是美德，是警报。", "duration_sec": 15}, {"id": 4, "type": "reveal", "text": "这就是INFJ的认知引擎——当别人在新闻里看到'感动'，你在新闻里看到'结构'。你的Ni系统天生能把单个事件放进社会演化的长周期里：为什么总是最柔软的人扛最重的担子？你的Fe系统天生会替那些'被赞美掩盖的代价'发声：孩子炒粉很励志，但更值得追问的是，谁本该在他这个年纪，只负责写作业。你天生就是那个在感动之外，还能看见系统裂缝的人。", "duration_sec": 15}, {"id": 5, "type": "cta", "text": "如果你看到这条新闻的时候，除了感动还有一丝不舒服——那不是煞风景，那是你的Ni-Fe系统在自动做社会结构审计。转发给你那个总在思考'这个世界哪里不对'的朋友。想更懂自己这种'看见结构'的天赋从哪来，评论区聊聊，或做一次深度人格报告。", "duration_sec": 10}]}, "brief": {"pain_point": "INFJ的Ni-Fe天生'在感动之外看见结构'，最痛'把系统没兜底的责任翻译成孩子很争气的赞美'。", "hook_first3": "'13岁，白天写作业，晚上在夜市炒粉'点事件；'所有人都在夸他懂事'摆反应；'但我想请你多看一眼'切视角+追问。", "emotion_curve": "心疼(孩子) → 共鸣(还有菜农) → 清醒(懂事=警报) → 责任感(看见结构)。", "structure": ["钩子·事件", "并列·菜农", "洞察·懂事=警报", "升华·谁本该只负责写作业", "CTA·看见结构"], "differentiation": "别人写少年炒粉讲'励志感动'，我们讲'懂事是警报'；Ni-Fe社会结构视角，从道德赞美转向系统追问。"}, "post": {"cover_title": "13岁少年的懂事，是警报", "body": "13岁，白天写作业，晚上在夜市炒粉。\n\n所有人都在夸他「懂事」。\n\n但我想请你多看一眼：\n一个13岁的孩子，\n为什么需要同时扛起作业本和炒锅？😢\n\n还有一辆公交车上的菜农：\n凌晨四点挑着菜筐进城，\n在车上睡着，怀里还抱着秤。\n\n两个新闻放在一起，\n我看到的是同一个结构——\n总有人把生活的重量，\n压在最没有选择权的人身上。\n\n我们夸他们「懂事」「坚韧」，\n却很少问一句：\n为什么「懂事」和「坚韧」，\n总是发生在同一种人身上？\n\n当一个孩子的懂事成了生存必需品，\n那这个懂事，就不是美德，\n是警报。🚨\n\n感动没有错，\n但更值得追问的是：\n谁本该在他这个年纪，\n只负责写作业。\n\n💬 如果你看到这条时，\n除了感动还有一丝不舒服——\n那不是煞风景，\n那是你开始看见「结构」了。", "hashtags": ["#MBTI", "#INFJ", "#社会观察", "#共情", "#结构思考"], "cover_visual": "冷灰与暖黄对比，一个瘦小背影在夜市烟火里/公交车窗外晨光；大字\"13岁少年的懂事，是警报\"；克制、有力量、留白。", "cta": "如果你看到这条时除了感动还有一丝不舒服，那不是煞风景，是你开始看见结构了。", "post_time": "20:00-22:00（社会议题讨论高峰）", "avoid": "不渲染苦难博同情、不消费未成年人、不做极端社会批判（用\"追问结构\"而非\"攻击系统\"）；避免引发对立。"}, "post_spec_version": "v2.0", "content": {"post": {"cover_title": "13岁炒粉少年，看见一个系统的切片", "body": "13 岁的少年，白天写作业，晚上在夜市炒粉。\n\n很多人看到的是「懂事」。\n\n但 INFJ 看到的是一个社会结构的切片——\n\n为什么一个 13 岁的孩子，需要同时扛起作业本和炒锅？\n\n这不是一个孩子的故事。\n\n这是一个系统，把负担转移给了最没有选择权的人。\n\nINFJ 天生就会这样想问题。\n\n她不会只盯着一个人，她会看到这个人背后，那一整张看不见的网。\n\n懂事的孩子，值得被看见。\n\n但更值得被追问的，是「为什么需要他这么懂事」。", "hashtags": ["#INFJ", "#社会观察", "#少年", "#深度思考", "#人间"], "cta": "你有没有在某个「懂事」背后，看到更深的东西？", "cover_visual": "夜市灯火下少年炒粉的侧影 + 旁边放着的书包，冷暖对比，纪实感", "post_time": "晚 21:00-22:30", "avoid": "不消费苦难、不指责具体个人、聚焦结构性思考而非煽情"}, "brief": {"pain_point": "INFJ 对社会结构性问题的敏锐与关怀", "hook_first3": "「13岁少年夜市炒粉」具体场景 + 「系统的切片」反常识解读", "emotion_curve": "场景→洞察→追问（懂事→系统→为什么）", "structure": ["场景", "INFJ 的 Ni 洞察", "结构性追问"], "differentiation": "从「个体懂事」上升到「系统追问」，符合 INFJ 的 Ni-Fe 社会关怀"}}}, "D15-B2-1": {"vessel": {"version": "1.0", "type": "content-vessel", "id": "D15-B2-1", "source": {"agent": "设设", "subsystem": "内容创作", "batch": "D15-B2"}, "created_at": "2026-07-29T12:15:00+08:00", "freshness_ttl_hours": 72, "priority": "archived"}, "payload": {"id": "D15-B2-1", "title": "你收藏夹里吃灰的237篇干货，正在暴露你MBTI里最深的逃避策略", "hook": "好奇心", "targets": ["INTP"], "channel": "B站", "quality": 8.8, "created": "2026-07-29T12:15:00+08:00", "ttl_hours": 72, "status": "deployed", "usage_count": 1, "deployed_batch": "D15-B2", "note": "reconstructed from content-active index·original vessel file lost"}}, "D21-B11-ENTJ-1": {"vessel": {"version": "1.0", "type": "content-vessel", "id": "D21-B11-ENTJ-1", "source": {"agent": "设设", "su 区，\n说说那个标签，\n和真正的你。", "hashtags": ["#身份认同", "#MBTI", "#ISTJ", "#老实人", "#自我成长"], "cover_visual": "冷色舞台光与暖色侧脸剪影的对比，一个安静、不抢镜头却坚定的身影，配大字『标签不能定义你』，克制、有力量感", "cta": "你被哪个标签误读过？评论区说说那个标签和真正的你。", "post_time": "18:00-20:00（晚间共鸣高峰·身份认同类）", "avoid": "不judge欢子/披哥艺人表现、不站队粉丝阵营、不消费争议细节、不把'老实人'写成贬义或抬高；聚焦'标签不能定义你'的自我定位"}, "post_spec_version": "v2.0"}}, "D21-B10-ENFP-1": {"vessel": {"version": "1.0", "type": "content-vessel", "id": "D21-B10-ENFP-1", "source": {"agent": "设设", "subsystem": "内容Spoke-1", "batch": "D21-B10"}, "created_at": "2026-08-19T08:33:00+08:00", "freshness_ttl_hours": 72, "priority": "p0", "dependencies": [{"vessel_type": "direction-vessel", "vessel_id": "direction-vessel-2026-08-19-0815"}]}, "content": {"id": "D21-B10-ENFP-1", "title": "七夕这一天，微信把红包上限悄悄开到520——ENFP没有把它当成一条功能更新。她的Fi系统在0.3秒里听懂了这件事真正的甜：被打开的从来不是那个数字，是那个\"想对你说很多、又怕说太多\"的人，终于有了一次把心意说出口的勇气", "hook": "情感共鸣", "targets": ["ENFP"], "channel": "小红书", "quality": 8.8, "budget": 25, "status": "active", "usage_count": 0, "priority": "P1", "consecutive_hook": 2, "direction_hook": "情感共鸣", "arm_id": 4, "batch_num": 2, "signals": ["微信开放520大额红包 限时一天(8分·七夕/关系/依恋)"], "paradigm": "情感共鸣·Fi-Ne亲密关系型(情感共鸣batch1→batch2续·Fi亲密关系:520=我想你的另一种写法·给'不敢开口'留一扇门·Ne对照:它站在'我爱你'与'在吗'之间·不轰轰烈烈但最温柔·依恋母题七夕接力3孩非亲生8→520红包8·避免消费主义绑架·用依恋轻量化解)", "role": "P1·ENFP情感共鸣batch2续·微信520红包8(七夕依恋母题)·Fi亲密关系·小红书高信任基线", "direction_compliance": "D21-B10 direction-vessel arm4 100%对齐·ENFP×情感共鸣×小红书·batch2", "flagship": false, "attachment_theory_resonance": true, "note": "🟢 fresh(信号变更·非复用蓝盈莹)·情感共鸣batch2达上限·依恋母题连续第4批·B11情感共鸣batch2达上限必轮出", "brief": {"pain_point": "ENFP的Fi渴望真实亲密连接，却又怕'认真会被辜负/显得唐突'；520红包恰好踩中'想表达又怕过度'的纠结。", "hook_first3": "第一行点破'微信把红包开到520'；第二行'很多人当它是功能更新'制造反差；第三行'我盯着那个数字突然就懂了'拉人进入情绪。", "emotion_curve": "好奇/平淡(功能更新) → 被戳中(不敢开口的共鸣) → 释然/温暖(被爱的证据在日常) → 勇气(把话说出口)。", "structure": ["钩子·数字反差", "痛点·不敢开口", "洞察·520是一扇门", "升华·被爱在日常", "CTA·说出来练习"], "differentiation": "别人写520红包讲'仪式感/消费'，我们讲'给不敢开口的人留一扇门'，落在依恋母题而非消费主义绑架。"}, "post": {"cover_title": "七夕，微信悄悄把红包开到520", "body": "七夕这天，微信悄悄把红包上限开到了520。\n\n很多人当它是功能更新。\n但我盯着那个数字，突然就懂了。\n\n520，从来不是一个金额。\n是「我想对你说很多，又怕说太多」的人，\n终于有了一次把心意说出口的勇气。💌\n\n你有没有那种时候——\n话在嘴边绕了三天，\n最后只憋出一句「在吗」。\n\n不是不会表达，\n是怕认真了，反而显得唐突。\n\n而520这个数字，\n就是给所有「不敢开口」的人留的一扇门。\n\n它站在「我爱你」和「在吗」之间，\n不轰轰烈烈，但最温柔。🌙\n\n有人收到520，红着脸截图；\n有人没收到，也不代表没人爱。\n\n被爱的证明，\n从来不只在一个红包里，\n在那些「怕你不够用」「记得吃饭」「早点睡」的日常里。\n\n这个七夕，\n愿你的心意，都有人接住。\n也愿有人，借着520，把憋了很久的话递给你。\n\n💬 评论区聊聊：\n你心里有没有一句「一直想说，没敢说出口」的话？\n今天就当练习，先说给我听。", "hashtags": ["#情感", "#MBTI", "#ENFP", "#七夕", "#亲密关系"], "cover_visual": "粉色+暖黄渐变背景，中央一个大大的\"520\"数字气泡，旁边一颗手绘爱心；底部一行小字\"想对你说很多，又怕说太多\"。柔光、留白、治愈系插画风。", "cta": "评论区引导：你心里有没有一句一直想说没敢说的话？先说给我听。", "post_time": "18:00-20:00（七夕当晚情绪高峰）", "avoid": "避免\"必须发红包\"\"不发就是不爱你\"等消费主义绑架表述；不鼓励攀比金额；不出现\"转账\"\"红包雨\"等诱导性营销词；弱化\"大额\"字眼。"}, "post_spec_version": "v2.0"}}, "D21-B20-INTP-1": {"vessel": {"version": "1.0", "type": "content-vessel", "id": "D21-B20-INTP-1", "source": {"agent": "设设", "subsystem": "内容Spoke-1", "batch": "D21-B20"}, "created_at": "2026-08-29T08:30:00+08:00", "freshness_ttl_hours": 72, "priority": "p0", "dependencies": [{"vessel_type": "direction-vessel", "vessel_id": "direction-vessel-2026-08-28-0815"}, {"vessel_type": "direction-pool", "vessel_id": "direction-pool-2026-08-28-0815"}, {"vessel_type": "strategy-pool", "vessel_id": "strategy-pool-2026-08-26-0842"}, {"vessel_type": "signal-pool", "vessel_id": "signal-pool-2026-08-29-0800"}, {"vessel_type": "current-direction", "vessel_id": "current-direction-2026-08-28-2335"}]}, "content": {"id": "D21-B20-INTP-1", "title": "「30岁双985硕士重新高考」——INTP的Ti-Ne看到的不是「白读十几年」的浪费。它看到的是：人生不是一条只能向上叠加的学历赛道，而是一个可以随时重新校准方向的自定义系统；真正的「高配」，是敢在别人眼中的顶点上，重新出发", "hook": "反常识", "targets": ["INTP"], "channel": "B站", "quality": 8.8, "budget": 25, "status": "reserve-frozen", "usage_count": 0, "priority": "P0", "consecutive_hook": 2, "direction_hook": "反常识", "arm_id": 1, "batch_num": 2, "signals": ["30岁双985硕士重新高考(9分·反常识·自我觉醒/人生选择·heat92)"], "paradigm": "反常识·Ti-Ne人生系统解构型(INTP反常识batch2续触·30岁双985重新高考9旗舰·Ti:解构学历线性公式·Ne:人生是可校准的自定义系统·自我觉醒母题桥接·非AI·严禁渲染学历贬值/中年焦虑)", "role": "P0·INTP反常识batch2续触(30岁双985重新高考9旗舰·自我觉醒/人生选择)·B站深度位·方向船resume/hook轮换「INTP反常识batch1(手机卖不动7)→batch2·NT象限维持」", "direction_compliance": "D21-B20 rotation对齐·INTP×反常识×B站·续触batch2(≤max_consecutive=2)", "flagship": true, "attachment_theory_resonance": false, "note": "🟢 fresh(D21-B20大面积轮出批·INTP反常识batch2续触)·依据B19方向船resume_conditions+daily-review rotation+signal-pool 08-29·B20方向船尚未产出已flag · ⛔冻结：未获 B20 方向授权 · 冻结期间仅储备不部署 · 待策策产 B20 方向 + 冻结解除后再部署（#27-C 进进审计裁定 08-29 10:30）", "brief": {"pain_point": "INTP的Ti追求「逻辑自洽的系统」，但社会主流叙事把人生简化成「学历越叠越高=越成功」的线性公式。30岁双985硕士重新高考击中的是：这套线性公式的荒谬——当一个人已经站在「学历顶点」却选择归零重来，INTP的Ti-Ne立刻想解构「人生的最优解到底是谁定义的」。", "hook_first3": "第一行「30岁，双985硕士，决定重新高考」直接抛出反差；第二行「在所有人眼里，这是把一手好牌打烂」点出主流判断；第三行「但INTP想问的，是那个没人问的问题——『最优』到底是谁定义的？」切入Ti-Ne。", "emotion_curve": "错愕(顶级学历重来) → 好奇(为什么) → 解构(线性公式的荒谬) → 释然(人生是自定义系统) → 启发(你也可以重新校准)。", "structure": ["钩子·反差开局", "主流判断·学历线性公式", "解构·最优解是谁定义", "洞察·人生是可校准系统", "CTA·你人生的重开键"], "differentiation": "别人写「学历贬值/中年危机的焦虑」或「励志逆袭」，我们写Ti-Ne的「解构线性公式」——不贩卖学历焦虑，落点「重新出发是权利不是浪费」；把「重新高考」还原成「人生系统的重新校准」，让INTP看见理性的自由。"}, "deployment": {"allowed": false, "state": "frozen-reserve", "reason": "未获 B20 方向授权 · 冻结期间仅储备不部署 · 待策策产 B20 方向 + 冻结解除后再部署", "frozen_at": "2026-08-29T10:30:00+08:00", "ruling": "#27-C 进进审计裁定 (2026-08-29) · 储备批保留不浪费，冻结期间不部署", "authorization": "未获 B20 方向授权 · 冻结期间仅储备不部署"}, "deployment_authorization": "未获 B20 方向授权 · 冻结期间仅储备不部署"}}, "D21-B15-ENFJ-1": {"vessel": {"version": "1.0", "type": "content-vessel", "id": "D21-B15-ENFJ-1", "source": {"agent": "设设", "subsystem": "内容Spoke-1", "batch": "D21-B15"}, "created_at": "2026-08-24T08:30:00+08:00", "freshness_ttl_hours": 72, "priority": "p1", "dependencies": [{"vessel_type": "direction-vessel", "vessel_id": "direction-vessel-2026-08-24-0815"}, {"vessel_type": "strategy-pool", "vessel_id": "strategy-pool-2026-08-24-0815"}, {"vessel_type": "signal-pool", "vessel_id": "signal-pool-2026-08-24-0815"}]}, "content": {"id": "D21-B15-ENFJ-1", "title": "一个治沙的普通女人，被美国记者称为「超级英雄」——ENFJ看到的社会证明：真正的英雄没有披风，只有几十年把沙漠一点一点种回绿洲的坚持", "hook": "社会证明", "targets": ["ENFJ"], "channel": "微博", "quality": 8.6, "budget": 25, "status": "active", "usage_count": 0, "priority": "P1", "consecutive_hook": 2, "direction_hook": "社会证明", "arm_id": 5, "batch_num": 2, "signals": ["美国记者激动称赞殷玉珍是超级英雄(7分·社会证明·英雄叙事/社会认同·heat12703978全榜最高)"], "paradigm": "社会证明·Fe社会认同/英雄叙事型(ENFJ社会证明batch2续触·殷玉珍超级英雄7分·Fe社会认同:普通人的长期主义被看见·heat1270万全榜最高)", "role": "P1·ENFJ社会证明batch2续触(殷玉珍超级英雄7·英雄叙事/社会认同)·微博Fe位·方向船key_decision「ENFJ社会证明batch2(殷玉珍超级英雄7·heat1270万全榜最高)」", "direction_compliance": "D21-B15 direction-vessel key_decision对齐·ENFJ×社会证明×微博·channel_mix微博28.6%(INFJ+ENFJ)", "flagship": false, "attachment_theory_resonance": false, "note": "🟢 fresh(ENFJ社会证明batch2续触·殷玉珍超级英雄7)·Fe社会认同/英雄叙事·heat1270万全榜最高·社会证明batch1(B14零食占座7)续触", "brief": {"pain_point": "ENFJ的Fe渴望「被看见/被认同」的正向力量；殷玉珍治沙几十年被跨文化认同为「超级英雄」，证明「普通人的坚持」能获得最高规格的社会认可。", "hook_first3": "第一行「一个中国女人，被美国记者称为『超级英雄』」点反差；第二行「她做了什么？治沙」摆朴素答案；第三行「没有披风，只有几十年把沙漠一点一点种回绿洲」立论。", "emotion_curve": "好奇(超级英雄) → 震撼(治沙) → 敬佩(几十年坚持) → 共鸣(被看见) → 温暖(普通人也伟大)。", "structure": ["钩子·超级英雄", "反差·她是治沙人", "洞察·长期主义的力量", "升华·被看见的社会认同", "CTA·你身边有「隐形英雄」吗"], "differentiation": "别人写「感动中国/环保模范/励志」，我们写Fe社会认同——「超级英雄=普通人的长期主义被看见」；不煽情、不道德绑架、聚焦正向认同。"}}}, "D18-B2-1": {"vessel": {"version": "1.0", "type": "content-vessel", "id": "D18-B2-1", "source": {"agent": "设设", "subsystem": "内容创作", "batch": "D18-B2"}, "created_at": "2026-08-01T06:18:00+08:00", "freshness_ttl_hours": 72, "priority": "p0", "dependencies": [{"vessel_type": "direction-vessel", "vessel_id": "dir-D17-B2-PM-2026-07-31T18:18:00+08:00", "status": "stale", "note": "方向船过期·但ENTP D18强制执行指令仍有效"}, {"vessel_type": "strategy-pool-vessel", "vessel_id": "strategy-pool-2026-07-29-1425", "note": "D16-B1推荐:未触达型补位ENTP可选→D18-B2执行"}], "info_contract": {"excludes": "恐惧按钮·已退役内容·非ENTP内容", "action_threshold": "quality<8.0→重做·TTL 72h未部署→自动退役·D18-B2首弹优先", "expires_after": "2026-08-04 06:18 CST"}, "mandates": {"entp_forced_touch": true, "entp_delay": "7批·~48h·D16-B1-2→D18-B2-1", "entp_elastic_validation": "Ne-dom弹性验证·长期不触达后响应度测试", "hook": "好奇心·Ne-Ti-Fe三核解构型·低情感张力·机制透视", "excluded_hooks_respected": ["恐惧按钮"], "max_consecutive_hook_respected": "好奇心1→2≤2✅"}}, "payload": {"content_id": "D18-B2-1", "title": "你觉得ENTP善变？他的Ne在你开口前已经跑完了三种可能性，Ti删掉了两种，Fe在帮你找体面的台阶——而你只看到了最后那种，以为是他「临时起意」", "hook": "好奇心", "hook_subtype": "Ne-Ti-Fe三核协作机制透视型", "targets": ["ENTP"], "channel": "抖音", "quality": 8.7, "budget": 25, "type": "first_touch", "role": "ENTP 7批延迟终结·Ne-dom弹性验证强制执行·NT象限维护", "signal_refs": [{"signal_id": "sig-20260731-005", "title": "1.55升哑铃矿泉水火了 单瓶8元", "category": "好奇心", "score": 8, "heat": 7425473, "note": "产品设计行为心理学信号·ENTP好奇心匹配"}, {"signal_id": "sig-20260731-006", "title": "网友两个夏天捡知了壳狂赚130万", "category": "反常识/好奇心", "score": 8, "heat": 9824099, "note": "边缘经济机会·ENTP好奇心交叉匹配"}], "paradigm": "好奇心·Ne-Ti双引擎解构型(ENTP首触·三核协作机制:Ne生成+Ti删除+Fe缓冲·与D16-B1-2 Ti单核debug角度升级)", "cognitive_functions": "Ne(外倾直觉·生成器:从刺激点裂变多可能性)+Ti(内倾思维·淘汰器:逻辑一致性过滤Ne产物)+Fe(外倾情感·第三位·缓冲器:Ti硬结论后提供社交润滑)", "angle": "ENTP被骂'善变/跳跃/杠精'的底层原因是其三核大脑的运转速度差——不是ENTP太快,是普通人只用了一核。Ne生成60个想法→Ti淘汰至1-3个→Fe在输出时加缓冲——你看到的'临时起意'其实经过了完整的生成-淘汰-缓冲流水线。解构的不是ENTP的'问题',是人脑速度差的可视化", "differentiation": "与D16-B1-2(杠精→debug·Ti单一机制科普)差异化: ①从单核(Ti逻辑校验)升级到三核(Ne+Ti+Fe)协作 ②从'他为什么这样'(解释)升级到'三台引擎怎样配合'(透视) ③加入Fe缓冲器视角·首次为ENTP的解构能力正名 ④认知复杂度更高但更易理解(三核概念具体化)", "elastic_validation_note": "ENTP上次触达D16-B1-2(7月30日06:15)→间隔7批~48h→fatigue 0.3极低→信任7.10稳定→Ne-dom弹性验证: 测试长期不触达后Ne-dom人格对机制型内容的CTR响应度→为Ne-dom维护策略提供数据支撑", "estimated_ctr": 2.8, "estimated_share_rate": 0.12, "adaptations": {"抖音": "主渠道·短视频脚本420字·悬念式开场('你身边是不是也有这种人')→三核拆解('我现在告诉你那一下里发生了什么')→反转收尾('不是他太快·是你只用了一核')", "B站": "深度扩展·880字·加入Ne-Ti-Fe认知科学细节·蒙特卡洛模拟/树状图/淘汰赛等科技隐喻展开", "微博": "话题短文·200字·'你身边那个最跳跃的人其实是三核处理器'·#ENTP#话题", "小红书": "图文卡片·400字·'测测你身边那个ENTP有多分裂'·互动测试型"}, "variants_available": 4, "status": "active"}}, "D20-B4-ISTJ-1": {"id": "D20-B4-ISTJ-1", "title": "领导干部带头休假、带薪休假要刚性落实——ISTJ看到这条新闻的时候，他的Si-Te系统自动调出了一份档案：过去这些年，'不休假'曾经是勤劳的象征、是敬业的勋章。现在，规则终于开始承认：准时休假不是偷懒，是制度在进步。而ISTJ比谁都清楚，规则的力量，从来不在写下来的那一刻，在严格执行的那一刻", "hook": "社会证明", "targets": ["ISTJ"], "channel": "微博", "quality": 8.6, "created": "2026-08-06T08:30:00+08:00", "ttl_hours": 72, "status": "active", "usage_count": 0, "vessel_ref": "workspace-shared/pools/content-vessels/D20-B4-ISTJ-1.json", "paradigm": "社会证明·Si-Te规则进步型(ISTJ社会证明首触·身份认同轮出→社会证明·领导干部带头休假+带薪休假刚性双信号·Si规则档案对比·制度进步视角)", "role": "first_touch·ISTJ社会证明首触·Si规则进步视角·信任7.60零维护·微博冷启动维持", "source_agent": "设设", "direction_ref": "D20-B4 direction-vessel·策策08:15·ISTJ社会证明weight=0.10·arm_id=7·信号:带薪休假刚性(社会证明新话题)·微博12.5%渠道", "mandate_ref": "D20-B4 vessel.mandates·max_consecutive_same_hook=2(社会证明第1批)✅·max_targets_per_personality_per_day=1✅·excluded_hooks未触碰✅", "script": {"format": "微博图文·5段结构", "segments": [{"id": 1, "type": "hook", "text": "领导干部带头休假，带薪休假要刚性落实。这条新闻，大多数人扫一眼就划过去了。但ISTJ的Si-Te系统在看到它的0.5秒内，自动调出了一份档案：过去那些年，'不休假'曾经是勤劳的象征、敬业的勋章、甚至评优的隐性门槛。", "duration_sec": 10}, {"id": 2, "type": "setup", "text": "ISTJ的Si系统是社会的档案管理员。它记得所有'规则演变'的时间线：从'不休假=爱岗敬业'到'休假是劳动者的法定权利'，从'领导不休你也不敢休'到'领导带头休、下面才敢休'。这条新闻真正重要的不是'休假'两个字——是规则的坐标，终于从'惩罚不休假的人'移动到了'保护休假的人'。", "duration_sec": 15}, {"id": 3, "type": "conflict", "text": "但ISTJ不会急着点赞。他的Te系统会先做一遍合规检查：'带头'是谁带头？'刚性'是怎么刚性？文件写'要落实'和制度真的'能落实'，中间隔着多少个执行层？ISTJ见过太多写得很漂亮的规则，也见过太多执行时打了折的规则。他不是悲观——他是知道，规则的力量从来不在写下来的那一刻，而在严格执行的那一刻。", "duration_sec": 15}, {"id": 4, "type": "reveal", "text": "这就是ISTJ的认知引擎——当别人在新闻里看到'好消息'，你在新闻里看到'制度体检报告'。你的Si系统天然记得'过去是怎么错的'，你的Te系统天然会检查'这次会不会还是错的'。你不是扫兴，你是这个社会最稀缺的那种人：规则的守门员。你比谁都尊重规则，所以也比谁都清楚，一条规则只有被严格执行，才配叫规则。", "duration_sec": 15}, {"id": 5, "type": "cta", "text": "如果你看到这条新闻时，第一反应是'落实才是关键'——你不是煞风景，你是带着Si-Te这套规则审计系统在看世界。转发这条，给那个'永远在遵守规则也永远在监督规则'的朋友。评论区聊聊：你见过最'刚性'的一次落实是什么？", "duration_sec": 10}]}}, "D21-B18-ENTJ-1": {"vessel": {"version": "1.0", "type": "content-vessel", "id": "D21-B18-ENTJ-1", "source": {"agent": "设设", "subsystem": "内容Spoke-1", "batch": "D21-B18"}, "created_at": "2026-08-27T08:30:00+08:00", "freshness_ttl_hours": 72, "priority": "p1", "dependencies": [{"vessel_type": "
