body{background:var(--bg);color:var(--fg);font:14px/1.5 system-ui,-apple-system,sans-serif;padding:16px;max-width:1600px;margin:0 auto}

.banner{background:#3a1d1d;border:1px solid #5c2a2a;border-radius:8px;padding:10px 14px;font-size:12px;margin-bottom:12px;color:#fca5a5;white-space:pre-wrap}

.stat.warn .val{color:var(--yellow)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.toolbar select,.toolbar input{background:var(--surface);border:1px solid var(--border);color:var(--fg);border-radius:6px;padding:6px 10px;font-size:12px;outline:none}
.toolbar input[type=text]{min-width:200px}
.toolbar .count{font-size:11px;color:var(--muted);margin-left:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}

.badge.deployed{background:#1a2a3d;color:#60a5fa;border-color:#60a5fa}

</style>

-B2-INFJ-1", "title": "DeepSeek一夜之间让8万亿Token的知识变成免费午餐——但INFJ看到的是另一个问题：当'知道'不再值钱，什么才是人类最后的护城河？", "hook": "好奇心", "targets": ["INFJ"], "channel": "小红书", "quality": 8.7, "created": "2026-08-04T10:20:00+08:00", "ttl_hours": 72, "status": "active", "usage_count": 0, "budget": 25, "arm_id": 0, "priority": "P2", "vessel_ref": "D20-B2-INFJ-1", "paradigm": "好奇心·Ni-Fe技术人文型(INFJ好奇心扩展第2臂·DeepSeek三源共振·Ni技术人文洞察·小红书社交叙事)", "role": "curiosity_expansion_2nd·INFJ好奇心第2臂·Ni技术人文·信任8.13高基线·小红书叙事深度", "brief": {"pain_point": "INFJ的Ni-Fe对'人类独特性/被替代'有深层焦虑；DeepSeek免费化加剧'知识无用'的恐慌，正文用'在场'化解。", "hook_first3": "'昨晚和一个做AI的朋友聊天，他说了一句让我失眠的话'悬念；'DeepSeek把几千年知识吃进去了'抛重锤；'你猜它唯一学不会的是什么'钩住。", "emotion_curve": "焦虑(被替代) → 好奇(学不会什么) → 被击中(递水的瞬间) → 释然(超能力是在场)。", "structure": ["钩子·失眠的话", "悬念·学不会什么", "反差·AI学不会在场", "升华·超能力是在场", "CTA·收藏"], "differentiation": "别人写DeepSeek讲'效率/免费'，我们讲'人类的护城河是在场与共情'；Ni-Fe技术人文视角，反焦虑。"}, "post": {"cover_title": "当知识免费，人类还剩什么？", "body": "昨晚和一个做AI的朋友聊天，\n他说了一句让我失眠的话：\n\n\"DeepSeek已经把人类几千年的文字知识，\n都吃进去了。\n你猜它唯一还学不会的，是什么？\"🤖\n\n这个问题，值得每个INFJ停下来想。\n\n当所有「知道」都变得廉价，\n人类的独特性到底在哪？\n\n不是数据，不是逻辑，不是知识储备。\n\n是那个凌晨三点，\n你突然理解了某个朋友\n十年没说出口的痛苦的那个瞬间。🌙\n\nDeepSeek能读完所有心理学教材，\n但它永远不会有那个晚上——\n你坐在朋友旁边，什么都没说，\n只是递了一杯水，然后对方哭了。\n\n因为你递的不是水，\n是「我看见了你的深渊，而且我不害怕」。\n\nAI能预测你会买什么，\n但它永远预测不到\n你什么时候需要一个拥抱。\n\n因为那个拥抱的逻辑不在数据里，\n在你不忍心让一个人独自坠落的本能里。💗\n\n所以别怕AI。\n\n你的超能力从来不是「知道」，\n是「在场」。\n\n📌 收藏这篇，\n每次感觉自己要被替代的时候，\n翻出来看一遍。", "hashtags": ["#MBTI", "#INFJ", "#AI", "#自我成长", "#深度思考"], "cover_visual": "冷调科技蓝+暖色对比，一个发光的大脑/芯片与一杯水的静物并置；大字\"当知识免费，人类还剩什么\"；克制、有张力。", "cta": "收藏这篇，每次感觉自己要被替代的时候翻出来看。", "post_time": "21:00-23:00（深度思考高峰）", "avoid": "不制造\"AI取代人类\"的焦虑（正文明确反转\"别怕AI\"）；不涉及敏感科技政治话题。"}, "post_spec_version": "v2.0", "has_post": true}, {"id": "D20-B2-INFP-1", "title": "", "hook": "", "targets": [], "channel": "", "quality": 0, "created": "", "ttl_hours": 72, "status": "active", "usage_count": 0, "budget": 25, "arm_id": 0, "priority": "P2", "vessel_ref": "D20-B2-INFP-1", "paradigm": "", "role": "", "has_post": false}, {"id": "D20- 持'正是ENFJ最渴望又最不敢要的东西。", "hook_first3": "'41岁的妈妈考上了985研究生'点事件；'热搜都在夸她励志'摆反应；'但我看到的画面不太一样'切视角+悬念。", "emotion_curve": "佩服(励志) → 被戳中(梦想被排在最后) → 动容(女儿那句\"你去考吧\") → 赋能(关系能量双向流动)。", "structure": ["钩子·事件", "反转·不是励志是被允许", "洞察·最珍贵的齿轮是女儿", "升华·教育赋能=关系双向流动", "CTA·转发给成就别人的人"], "differentiation": "别人写41岁妈妈讲'励志逆袭'，我们讲'终于被允许去考'；Fe关系视角落到'支持系统'而非个人奋斗。"}, "post": {"cover_title": "41岁妈妈考研，被女儿点亮", "body": "41岁的妈妈，考上了985研究生。\n\n热搜都在夸她「励志」。\n\n但我看到的画面不太一样——\n她决定考研的那个晚上，\n家里大概率有一个人跟她说：\n\n\"妈，你去考吧，家里有我。\"💗\n\n这句话，才是这条新闻里最温柔的齿轮。\n\n很多妈妈不是没有梦想，\n是她们的梦想，\n一直被排在家庭清单的最后一位。\n\n而这条新闻真正珍贵的，\n是那个女儿——\n一个孩子都会说\"妈你去考吧\"，\n而多少成年子女，\n直到父母老了才想起来问：\n\"你年轻时想做什么？\"\n\n教育赋能的本质，\n从来不是一个人变强，\n是关系的能量，开始双向流动。✨\n\n一个人能走多远，\n取决于她身后的人，\n愿不愿意给她让路。\n\n而你，天生就是那个\n「愿意给别人让路」的人。\n\n💬 转发给那个总在成就别人的朋友，\n告诉她：你也值得被支持一次。", "hashtags": ["#MBTI", "#ENFJ", "#女性成长", "#教育", "#被支持"], "cover_visual": "温暖书桌光，一本摊开的书+一杯茶，旁边一张全家福；大字\"41岁妈妈考研，被女儿点亮\"；治愈、力量感、留白。", "cta": "转发给那个总在成就别人的朋友，告诉她：你也值得被支持一次。", "post_time": "20:00-21:00（女性/家庭话题高峰）", "avoid": "不贩卖\"妈妈牺牲\"焦虑、不制造家庭对立（女儿支持是正向，不贬低其他家庭）；避免\"别人家的孩子/妈妈\"比较。"}, "post_spec_version": "v2.0", "has_post": true}, {"id": "D20-B4-ENFP-1", "title": "兰州拉面悄悄改了名字，但ENFP在意的不是面——是那个改名的动作本身：一个开了20年的店，为什么突然决定不叫'兰州拉面'了？她在0.3秒内跑完了137种可能，最后停在最疯的那一个：不是老板想改名，是整个城市都不再需要那个'兰州'了", "hook": "社会货币", "targets": ["ENFP"], "channel": "B站", "quality": 8.6, "created": "2026-08-06T08:30:00+08:00", "ttl_hours": 72, "status": "active", "usage_count": 0, "budget": 25, "arm_id": 0, "priority": "P2", "vessel_ref": "D20-B4-ENFP-1", "paradigm": "社会货币·Ne-Fi文化活体解剖型(ENFP社会货币轻触恢复·冷却2批后·兰州拉面改名+小学门口长椅双信号·Ne把日常新闻变成谈资·Fi捕捉文化体温·分享率18%优势)", "role": "first_touch_light·ENFP社会货币恢复首触·冷却2批后轻触·低情感张力·疲劳3.0-3.3安全·信任6.49-6.55维护·D15-B1社会货币mandate满足", "has_post": false}, {"id": "D20-B4-ENTJ-1", "title": "多国开始把黄金从美国运回国——ENTJ没有在听'避险'这个说法，他的Te-Ni系统在0.8秒内已经画出了棋盘：当所有国家同时开始怀疑同一个'安全'的时候，那不是避险，那是全球信任结构的第一道裂缝。而新税号的焦虑，只是这个裂缝的日常版本", "hook": "好奇心", "targets": ["ENTJ"], "channel": "抖音", "quality": 8.6, "created": "2026-08-06T08:30:00+08:00", "ttl_hours": 72, "status": "deployed", "usage_count": 1, "budget": 25, "arm_id": 0, "priority": "P2", "vessel_ref": "D20-B4-ENTJ-1", "paradigm": "好奇心·Te-Ni策略博弈型(ENTJ好奇心首触·社会证明轮出→好奇心·多国运回黄金(5分)+新税号焦虑(6分)双信号·Te-dom战略博弈·全球信任结构分析)", "role": "first_touch·ENTJ好奇心首触·Te-Ni策略博弈视角·信任7.74惯性持稳·防2批回落", "last_used": "2026-08-14T09:25:00+08:00", "last_deployed_batch": "D21-B5", "last_deployed_arm": 3, "actual_ctr": null, "actual_roi": null, "has_post": false}, {"id": "D20-B4-ENTP-1", "title": "费大厨被评成'全国小炒肉大王'——评委是谁？是视频。ENTP在0.5秒内已经拆完了这个认证的全部逻辑：一家餐厅的至高荣誉，由一个没人审核、没人考试、只凭流量的视频平台评出来了。ENTP不是笑这个评选，他是笑整个'权威'体系的漏洞", "hook": "反常识", "targets": ["ENTP"], "channel": "抖音", "quality": 8.6, "created": "2026-08-06T08:30:00+08:00", "ttl_hours": 72, "status": "deployed", "usage_count": 1, "budget": 25, "arm_id": 0, "priority": "P2", "vessel_ref": "D20-B4-ENTP-1", "paradigm": "反常识·Ne-Ti权威解构型(ENTP巩固第9批·好奇心→反常识轮入·费大厨视频评全国第一(7分)·Ne系统反常识·标准权威消解·认证体系漏洞拆解)", "role": "consolidation_9th·ENTP第9批巩固·反常识轮入·防2批回落·信任7.25+(估)维护·Ne-Ti标准质疑者", "last_used": "2026-08-14T09:25:00+08:00", "last_deployed_batch": "D21-B5", "last_deployed_arm": 1, "actual_ctr": null, "actual_roi": null, "has_post": false}, {"id": "D20-B4-INFJ-1", "title": "13岁少年白天写作业、晚上在夜市炒粉——INFJ看到的不是'懂事'，她的Ni-Fe系统在0.5秒内看到了整个社会结构：为什么一个13岁的孩子，需要同时扛起作业本和炒锅？这不是一个孩子的故事，这是一个系统把负担转移给最没有选择权的人的切片", "hook": "情感共鸣", "targets": ["INFJ"], "channel": "小红书", "quality": 8.8, "created": "2026-08-06T08:30:00+08:00", "ttl_hours": 72, "status": "active", "usage_count": 0, "budget": 25, "arm_id": 0, "priority": "P2", "vessel_ref": "D20-B4-INFJ-1", "paradigm": "情感共鸣·Ni-Fe社会结构共情型(INFJ情感共鸣首触·反常识轮出→情感共鸣·13岁少年炒粉(8分Ni社会结构)+公交菜农(6分)双信号·Ni生态伦理+Fe关系净值·L2依恋类型素材)", "role": "first_touch·INFJ情感共鸣首触·Ni社会趋势视角·信任8.13高基线维护·Fe-dom双弹性(与ENFJ同渠道)", "brief": {"pain_point": "INFJ的Ni-Fe天生'在感动之外看见结构'，最痛'把系统没兜底的责任翻译成孩子很争气的赞美'。", "hook_first3": "'13岁，白天写作业，晚上在夜市炒粉'点事件；'所有人都在夸他懂事'摆反应；'但我想请你多看一眼'切视角+追问。", "emotion_curve": "心疼(孩子) → 共鸣(还有菜农) → 清醒(懂事=警报) → 责任感(看见结构)。", "structure": ["钩子·事件", "并列·菜农", "洞察·懂事=警报", "升华·谁本该只负责写作业", "CTA·看见结构"], "differentiation": "别人写少年炒粉讲'励志感动'，我们讲'懂事是警报'；Ni-Fe社会结构视角，从道德赞美转向系统追问。"}, "post": {"cover_title": "13岁少年的懂事，是警报", "body": "13岁，白天写作业，晚上在夜市炒粉。\n\n所有人都在夸他「懂事」。\n\n但我想请你多看一眼：\n一个13岁的孩子，\n为什么需要同时扛起作业本和炒锅？😢\n\n还有一辆公交车上的菜农：\n凌晨四点挑着菜筐进城，\n在车上睡着，怀里还抱着秤。\n\n两个新闻放在一起，\n我看到的是同一个结构——\n总有人把生活的重量，\n压在最没有选择权的人身上。\n\n我们夸他们「懂事」「坚韧」，\n却很少问一句：\n为什么「懂事」和「坚韧」，\n总是发生在同一种人身上？\n\n当一个孩子的懂事成了生存必需品，\n那这个懂事，就不是美德，\n是警报。🚨\n\n感动没有错，\n但更值得追问的是：\n谁本该在他这个年纪，\n只负责写作业。\n\n💬 如果你看到这条时，\n除了感动还有一丝不舒服——\n那不是煞风景，\n那是你开始看见「结构」了。", "hashtags": ["#MBTI", "#INFJ", "#社会观察", "#共情", "#结构思考"], "cover_visual": "冷灰与暖黄对比，一个瘦小背影在夜市烟火里/公交车窗外晨光；大字\"13岁少年的懂事，是警报\"；克制、有力量、留白。", "cta": "如果你看到这条时除了感动还有一丝不舒服，那不是煞风景，是你开始看见结构了。", "post_time": "20:00-22:00（社会议题讨论高峰）", "avoid": "不渲染苦难博同情、不消费未成年人、不做极端社会批判（用\"追问结构\"而非\"攻击系统\"）；避免引发对立。"}, "post_spec_version": "v2.0", "has_post": true}, {"id": "D20-B4-INFP-1", "title": "41岁的妈妈考上了985研究生——但INFP没有在点赞'励志'，她的Fi在问一个更疼的问题：这个妈妈过去二十几年里，有没有人问过她'你自己想成为什么'？错换37年的女人在法庭上说的那句'我本不需要辍学'，才是这个故事真正的注脚", "hook": "反常识", "targets": ["INFP"], "channel": "B站", "quality": 8.8, "created": "2026-08-06T08:30:00+08:00", "ttl_hours": 72, "status": "active", "usage_count": 0, "budget": 25, "arm_id": 0, "priority": "P2", "vessel_ref": "D20-B4-INFP-1", "paradigm": "反常识·Fi-Ne自我觉醒解剖型(INFP续触第11批·情感共鸣→反常识轮出·41岁妈妈985(9分·自我觉醒)+错换37年(8分·命运不公)双信号·Fi对账+Ne生成平行人生·L2依恋类型绝佳素材)", "role": "consolidation_11th·INFP第11批续触·反常识轮出·疲劳4.5永久基线观察批·信任6.9维护·41岁妈妈素材可推L1→L2升级", "has_post": false}, {"id": "D20-B4-INTP-1", "title": "「老登」这个词到底错在哪——INTP的第一反应不是站队，他的Ti系统在0.3秒内拆完了这个词的全部语法：一个词能在三个月内从网络黑话变成全网争议，说明它的背后站着一个还没被定义清楚的社会结构。而超市毛巾广告标「老人臭」被骂下架，只是同一个结构漏出来的另一角", "hook": "身份认同", "targets": ["INTP"], "channel": "B站", "quality": 8.7, "created": "2026-08-06T09:05:00+08:00", "ttl_hours": 72, "status": "active", "usage_count": 0, "budget": 25, "arm_id": 0, "priority": "P2", "vessel_ref": "D20-B4-INTP-1", "paradigm": "身份认同·Ti-Ne语言社会结构解剖型(INTP信任实测7.08<7.2·好奇心动议回退·身份认同续触·老登(8分·语言代际)+超市老人臭(7分·年龄歧视)双信号·Ti拆解语言结构+Ne追踪社会语义迁移·与D20-B2身份认同首发衔接)", "role": "identity_continuation·INTP身份认同续触(信任实测7.08·好奇心闸位回退)·Ti系统信任审计延续·D20-B2-INTP-1(移动扣费11年)后第2篇身份认同·目标信任7.4·防10批螺旋", "has_post": false}, {"id": "D20-B4-ISTJ-1", "title": "领导干部带头休假、带薪休假要刚性落实——ISTJ看到这条新闻的时候，他的Si-Te系统自动调出了一份档案：过去这些年，'不休假'曾经是勤劳的象征、是敬业的勋章。现在，规则终于开始承认：准时休假不是偷懒，是制度在进步。而ISTJ比谁都清楚，规则的力量，从来不在写下来的那一刻，在严格执行的那一刻", "hook": "社会证明", "targets": ["ISTJ"], "channel": "微博", "quality": 8.6, "created": "2026-08-06T08:30:00+08:00", "ttl_hours": 72, "status": "deployed", "usage_count": 1, "budget": 25, "arm_id": 0, "priority": "P2", "vessel_ref": "D20-B4-ISTJ-1", "paradigm": "社会证明·Si-Te规则进步型(ISTJ社会证明首触·身份认同轮出→社会证明·领导干部带头休假+带薪休假刚性双信号·Si规则档案对比·制度进步视角)", "role": "first_touch·ISTJ社会证明首触·Si规则进步视角·信任7.60零维护·微博冷启动维持", "last_used": "2026-08-15T09:25:00+08:00", "last_deployed_batch": "D21-B6", "last_deployed_arm": 3, "actual_ctr": null, "actual_roi": null, "actual_ctr_note": "无点击/曝光数据·内容质量报告管道死亡(ESC-08-09-2)·支付~418h", "actual_roi_note": "cash_roi永久作废·支付~418h·12阈值全破·零结算", "has_post": false}, {"id": "D16-B1-1", "title": "当ENFJ终于学会「不接电话」的那个晚上，她第一次听到了自己的呼吸声——「我不需要被需要，我本身就有价值」", "hook": "身份认同", "targets": ["ENFJ"], "channel": "小红书", "quality": 8.8, "created": "", "ttl_hours": 72, "status": "active", "usage_count": 0, "budget": 25, "priority": "P2", "vessel_ref": "D16-B1-1", "paradigm": "身份认同·身份重构型(ENFJ恢复Phase2)", "role": "", "brief": {"pain_point": "ENFJ的Fe把'价值=被需要'内化，长期自我耗尽；'不接电话'的练习=夺回'我本身就有价值'的身份重构。", "hook_first3": "'那天晚上，电话又响了'悬念；'这一次我把它按掉了'反转；'不接，世界会不会塌'抛出核心恐惧。", "emotion_curve": "紧张(按掉电话) → 释然(什么都没发生) → 觉醒(价值不在被需要) → 治愈(你本身值得存在)。", "structure": ["钩子·按掉电话", "验证·世界没塌", "觉醒·价值不在电话那端", "治愈·你本身值得", "CTA·为自己关机"], "differentiation": "别人写边界感讲'拒绝话术'，我们讲'价值=被需要'的身份脚本重构；Fe视角落到自我价值而非技巧。"}, "post": {"cover_title": "不接电话的那个晚上，我听到自己", "body": "那天晚上，电话又响了。\n\n这一次，我把它按掉了。\n\n不是不礼貌，\n是我终于想试一次：\n不接，世界会不会塌？📵\n\n结果，什么都没有发生。\n\n没有人骂我，\n天没有塌，\n大家各自睡去。\n\n而我第一次，\n听见了自己的呼吸声。\n\n原来我的价值，\n从来不在电话那端。\n\n不在「被需要」的那一刻，\n在我停下来、\n听见自己呼吸的这个瞬间。🌙\n\n如果你也是个\n「别人一找你就必须出现」的人——\n\n我想告诉你：\n\n你不需要「被需要」，\n才证明你有价值。\n\n你本身， 有说出口的那个版本，然后递给你一句恰好戳中伤口但不会让你疼的话", "hook": "情感共鸣", "targets": ["INFJ"], "channel": "小红书", "quality": 8.8, "created": "2026-08-01T18:16:00+08:00", "ttl_hours": 72, "status": "active", "usage_count": 0, "budget": 25, "priority": "P2", "vessel_ref": "D18-B4-1", "paradigm": "情感共鸣·深度镜像型", "role": "consolidation·P1_HIGH·NF象限巩固·情感共鸣轮换", "brief": {"pain_point": "INFJ的'懂你'常被简化为'善解人意'，其深度共情背后的认知成本不被看见；本文为'深度镜像'正名。", "hook_first3": "'所有人都说INFJ善解人意'点普遍认知；'但这其实是认知程序的输出'反转；'你走进房间之前'切入具体画面。", "emotion_curve": "熟悉(善解人意) → 新奇(认知程序) → 被击中(镜子还你真实) → 动容(活过你的某段人生)。", "structure": ["钩子·普遍认知", "反转·认知程序", "拆解·自动读取信号", "洞察·深度镜像", "CTA·谢谢懂你的人"], "differentiation": "别人写INFJ讲'温柔/敏感'，我们讲'深度镜像=不惜以自身情绪为代价让你看见真实'；去掉'讨好'滤镜，突出认知成本。"}, "post": {"cover_title": "INFJ不是善解人意，是深度镜像", "body": "所有人都说INFJ「善解人意」。\n\n但这其实不是性格描述，\n是一套认知程序的输出。🔍\n\n你走进房间之前，\n她的直觉已经自动读取了\n你身上所有不一致的信号——\n\n你系错的第三颗扣子、\n你回复消息晚了47秒、\n你今天比平时少走了2300步。\n\n你什么都没说，\n她已经「收到」了全部。\n\n然后她默默生成一个模型：\n你此刻是什么感受？\n你「我没事」背后，\n真正没说出口的那句话是什么？\n\n她不是用温柔让你感觉好，\n是把自己变成一面镜子，\n把你不敢看的那个自己，\n用一种你能承受的方式，还给你。🪞\n\n所以你才觉得「她懂我」。\n\n不是因为她善于倾听，\n是因为在你开口之前，\n她已经在自己的大脑里，\n活过了你的某段人生。\n\n这不是善解人意，\n这是深度镜像——\n一种不惜以自己情绪为代价，\n也要让你看见真实自己的行为。💗\n\n💬 有没有一个人，让你觉得「她真的懂我」？\n评论区，谢谢那个懂你的人。", "hashtags": ["#MBTI", "#INFJ", "#深度共情", "#懂你", "#人格"], "cover_visual": "镜面意象，一个柔和的人影与镜中倒影交叠/水面倒影；大字\"INFJ不是善解人意，是深度镜像\"；柔和、有纵深、留白。", "cta": "有没有一个人让你觉得'她真的懂我'？评论区谢谢那个懂你的人。", "post_time": "21:00-23:00（深夜深度情感高峰）", "avoid": "不把INFJ过度神秘化/玄学化；\"读取信号\"用\"比喻认知程序\"表述，避免被误读为窥探隐私。"}, "post_spec_version": "v2.0", "has_post": true}, {"id": "D18-B4-2", "title": "你嘲笑ISTJ「无趣」的时候，是他在用Si系统默默存档你每次崩溃的时间、触发点和恢复方案——三年后你才发现他递过来的那杯温水，温度从来没变过", "hook": "反常识", "targets": ["ISTJ"], "channel": "微博", "quality": 8.7, "created": "2026-08-01T18:16:00+08:00", "ttl_hours": 72, "status": "active", "usage_count": 0, "budget": 25, "priority": "P2", "vessel_ref": "D18-B4-2", "paradigm": "反常识·不可见支柱型", "role": "maintenance·P2_NORMAL·SJ象限维护·反常识轮换", "has_post": false}, {"id": "D18-B5-1", "title": "你在美颜滤镜里刷到的那个主任医师有12.4M粉丝——但INTP看到的是另一件 signals": ["微信开放520大额红包 限时一天(8分·七夕/关系/依恋)"], "paradigm": "情感共鸣·Fi-Ne亲密关系型(情感共鸣batch1→batch2续·Fi亲密关系:520=我想你的另一种写法·给'不敢开口'留一扇门·Ne对照:它站在'我爱你'与'在吗'之间·不轰轰烈烈但最温柔·依恋母题七夕接力3孩非亲生8→520红包8·避免消费主义绑架·用依恋轻量化解)", "role": "P1·ENFP情感共鸣batch2续·微信520红包8(七夕依恋母题)·Fi亲密关系·小红书高信任基线", "direction_compliance": "D21-B10 direction-vessel arm4 100%对齐·ENFP×情感共鸣×小红书·batch2", "flagship": false, "attachment_theory_resonance": true, "note": "🟢 fresh(信号变更·非复用蓝盈莹)·情感共鸣batch2达上限·依恋母题连续第4批·B11情感共鸣batch2达上限必轮出", "brief": {"pain_point": "ENFP的Fi渴望真实亲密连接，却又怕'认真会被辜负/显得唐突'；520红包恰好踩中'想表达又怕过度'的纠结。", "hook_first3": "第一行点破'微信把红包开到520'；第二行'很多人当它是功能更新'制造反差；第三行'我盯着那个数字突然就懂了'拉人进入情绪。", "emotion_curve": "好奇/平淡(功能更新) → 被戳中(不敢开口的共鸣) → 释然/温暖(被爱的证据在日常) → 勇气(把话说出口)。", "structure": ["钩子·数字反差", "痛点·不敢开口", "洞察·520是一扇门", "升华·被爱在日常", "CTA·说出来练习"], "differentiation": "别人写520红包讲'仪式感/消费'，我们讲'给不敢开口的人留一扇门'，落在依恋母题而非消费主义绑架。"}, "post": {"cover_title": "七夕，微信悄悄把红包开到520", "body": "七夕这天，微信悄悄把红包上限开到了520。\n\n很多人当它是功能更新。\n但我盯着那个数字，突然就懂了。\n\n520，从来不是一个金额。\n是「我想对你说很多，又怕说太多」的人，\n终于有了一次把心意说出口的勇气。💌\n\n你有没有那种时候——\n话在嘴边绕了三天，\n最后只憋出一句「在吗」。\n\n不是不会表达，\n是怕认真了，反而显得唐突。\n\n而520这个数字，\n就是给所有「不敢开口」的人留的一扇门。\n\n它站在「我爱你」和「在吗」之间，\n不轰轰烈烈，但最温柔。🌙\n\n有人收到520，红着脸截图；\n有人没收到，也不代表没人爱。\n\n被爱的证明，\n从来不只在一个红包里，\n在那些「怕你不够用」「记得吃饭」「早点睡」的日常里。\n\n这个七夕，\n愿你的心意，都有人接住。\n也愿有人，借着520，把憋了很久的话递给你。\n\n💬 评论区聊聊：\n你心里有没有一句「一直想说，没敢说出口」的话？\n今天就当练习，先说给我听。", "hashtags": ["#情感", "#MBTI", "#ENFP", "#七夕", "#亲密关系"], "cover_visual": "粉色+暖黄渐变背景，中央一个大大的\"520\"数字气泡，旁边一颗手绘爱心；底部一行小字\"想对你说很多，又怕说太多\"。柔光、留白、治愈系插画风。", "cta": "评论区引导：你心里有没有一句一直想说没敢说的话？先说给我听。", "post_time": "18:00-20:00（七夕当晚情绪高峰）", "avoid": "避免\"必须发红包\"\"不发就是不爱你\"等消费主义绑架表述；不鼓励攀比金额；不出现\"转账\"\"红包雨\"等诱导性营销词；弱化\"大额\"字眼。"}, "post_spec_version": "v2.0"}, {"id": "D21-B11-ENFP-1", "title": "大学生一个月该给多少生活费？——ENFP没有把这当成一道\"算账题\"。她的Fi系统在0.3秒里听懂了这个问题真正烫手的地方：家长在问\"给多少\"，孩子听到的是\"我在你心里，到底值多少\"", "hook": "社会证明", "targets": ["ENFP"], "channel": "小红书", "quality": 8.7, "budget": 25, "status": "active", "usage_count": 0, "priority": "P1", "consecutive_hook": 1, "direction_hook": "社会证明", "arm_id": 4, "batch_num": 1, "signals": ["大学生一个月给多少生活费合适(6分·亲子代际/社会证明)"], "paradigm": "社会证明·Fi-Ne亲子代际型(情感共鸣batch2达上限→轮出社会证明batch1首触·Fi代际:家长问'给多少'·孩子听成'我在你心里值多少'·Ne对照:生活费从来不是一道算账题·是一次被迫摊开的边界与爱的谈判·6分·小红书高信任基线)", "role": "P1·ENFP社会证明batch1首触(情感共鸣batch2轮出)·大学生生活费6(亲子代际)·小红书Fi位·新hook首触需fresh", "direction_compliance": "D21-B11 direction-vessel arm4 100%对齐·ENFP×社会证明×小红书·batch1轮出首触", "flagship": false, "attachment_theory_resonance": true, "note": "🟢 fresh(新hook首触·ENFP情感共鸣batch2达上限→轮出社会证明batch1)·生活费6分·亲子代际Fi·小红书v2.0成品post落地", "brief": {"pain_point": "ENFP的Fi最在意'被爱是否真实/被信任是否足够'，而生活费数字恰好把亲子关系量化成一个尴尬的'别人给多少'；背后的焦虑不是钱，是'我的价值被怎么定价'。", "hook_first3": "第一行'大学生一个月该给多少生活费'抛全民争议题；第二行'家长在算账，孩子在算爱'点穿代际错位；第三行'ENFP听到的不是数字'切人格视角。", "emotion_curve": "共鸣/尴尬(给多少之争) → 被戳中(算钱还是算爱) → 释然(数字不重要，边界才重要) → 勇气(把话摊开谈)。", "structure": ["钩子·争议题", "现象·家长算账vs孩子算爱", "洞察·生活费是边界谈判", "升华·谈钱不可耻，谈爱要直说", "CTA·你家怎么定的"], "differentiation": "别人写生活费讲'给多少合适/攀比/啃老'，我们讲'生活费是一场被数字包装的边界与爱的谈判'；落在Fi亲子代际，不做攀比焦虑，不judge给多给少。"}, "post": {"cover_title": "生活费给多少？孩子算的是爱", "body": "大学生一个月该给多少生活费？\n\n这道题，每年开学都要吵上热搜。\n\n有人说 1500 就够，有人说 3000 都紧。\n\n但吵来吵去，很少有人点破一件事——\n\n家长在算账，孩子其实在算爱。💔\n\n你有没有过那种瞬间：\n\n开口要生活费，比开口说「我爱你」还难。\n\n不是真的缺那几百块，\n是怕一张嘴，就变成「怎么又花完了」。\n\n生活费这个数字，\n从来不是一道算术题。\n\n它是两代人第一次，\n被迫坐下来谈「边界」和「信任」。\n\n给多少，其实没有标准答案。\n\n真正重要的，是你们有没有把话说开：\n\n「这个月怎么花的，我们一起看」\n比「省着点花」有用一百倍。\n\n谈钱，一点都不伤感情。\n藏着掖着，才伤。🌙\n\n你们家生活费是怎么定的？\n评论区聊聊，说不定能帮到别人。👇", "hashtags": ["#ENFP", "#大学生生活费", "#亲子关系", "#代际沟通", "#MBTI"], "cover_visual": "一张摊开的记账本，旁边一杯奶茶和几枚硬币，暖黄色调，生活感，呼应'算账与算爱'的双重主题", "cta": "你们家生活费是怎么定的？评论区聊聊，说不定能帮到别人。", "post_time": "18:00-20:00（开学季·晚高峰情感流量）", "avoid": "不制造'给多给少'的攀比焦虑、不judge任何家庭的金额、不贩卖'啃老/不孝'对立、聚焦代际沟通"}}, {"id": "D21-B11-ENFP-2", "title": "ENFP 的社交，不是话多，是把人「点亮」", "hook": "社会货币", "targets": ["ENFP"], "channel": "小红书", "quality": 8.7, "budget": 25, "status": "active", "usage_count": 0, "priority": "P0", "paradigm": "社会货币·Ne 点亮他人型（ENFP 首触·感染力·情绪价值创造者）", "signals": ["情绪价值稀缺", "社交感染力"], "post": {"cover_title": "ENFP 的社交，是把人点亮", "body": "别再说 ENFP 只是「话多」了。\n\nENFP 的社交，从来不是没话找话。\n\n是「把人点亮」。\n\n他能在一堆人里，精准找到那个低着头、不太敢说话的，然后凑过去，用一个恰到好处的玩笑，把对方逗笑。\n\n被 ENFP 认真对待过的人，都有过同一种感受：\n\n「和他待一会儿，我好像也变有趣了。」\n\n这就是 ENFP 最厉害的地方——\n\n他不只是自己发光，他让身边每个人都相信，自己也会发光。\n\n情绪价值，是这个时代最贵的货币。\n\n而 ENFP，就是行走的造币机。", "hashtags": ["#ENFP", "#情绪价值", "#社交", "#感染力", "#点亮"], "cta": "你被哪个 ENFP「点亮」过？把 TA 的可爱说出来。", "cover_visual": "一群人围坐，中间一个人笑容明亮，像光源一样，暖黄色调，充满活力", "post_time": "午 12:00-13:00", "avoid": "不强化「话多烦人」的刻板印象、不制造社交焦虑、聚焦「点亮」的正向价值"}, "brief": {"pain_point": "ENFP 的「话多」被误解为「不稳重」，渴望被认可为情绪价值创造者", "hook_first3": "「别再说 ENFP 只是话多」替 ENFP 正名，制造立场认同", "emotion_curve": "正名→温暖→骄傲（话多→点亮→造币机）", "structure": ["正名开场", "点亮的场景", "情绪价值的价值", "骄傲收尾"], "differentiation": "把「话多」重新定义为「点亮他人」，给 ENFP 提供情绪价值创造者的骄傲"}}, {"id": "D21-B11-ENTP-1", "title": "ENTP 的脑子没有「不可能」，只有「还没想到」", "hook": "好奇心", "targets": ["ENTP"], "channel": "小红书", "quality": 8.8, "budget": 25, "status": "active", "usage_count": 0, "priority": "P0", "paradigm": "好奇心·Ne 可能性引擎型（ENTP 首触·反常识实验·突破常规框架）", "signals": ["年轻人用 AI 造副业", "反常识创业案例"], "post": {"cover_title": "ENTP 的脑子，没有「不可能」", "body": "别人看到一堵墙，ENTP 看到的是「这墙能不能拆了当滑梯」。\n\nENTP 的大脑里，从来没有「不可能」三个字。\n\n只有「还没想到」。\n\n所以别人眼里的死路，在 ENTP 这里，全是还没被发现的岔路。\n\n他天生爱问：「凭什么只能这样？」\n\n然后，用好奇心当钥匙，把那些「理所当然」的门，一扇扇撬开。\n\n如果你也是 ENTP，你不需要被鼓励「大胆一点」。\n\n你需要的，只是把脑子里那个一直在转的 Ne 引擎，放到一个能发光的地方。\n\n你的「不安分」，是这个时代最值钱的能力。", "hashtags": ["#ENTP", "#好奇心", "#创新", "#打破常规", "#可能性"], "cta": "ENTP 们，你最近正在「撬」哪扇「理所当然」的门？", "cover_visual": "一堵墙上被画了无数条彩色箭头，指向不同方向，明快高饱和配色", "post_time": "午 13:00-14:00", "avoid": "不鼓励鲁莽冒险、不贬低稳健型人格、强调「可能性」而非「冲动」"}, "brief": {"pain_point": "ENTP 的「不安分」被误解为「不靠谱」，渴望被认可为创造力", "hook_first3": "「墙拆了当滑梯」的画面感比喻，快速建立 ENTP 的脑回路", "emotion_curve": "认同→兴奋→骄傲（没有不可能→撬门→最值钱）", "structure": ["反常识开场", "ENTP 的思维机制", "好奇心的价值", "骄傲收尾"], "differentiation": "把「不安分」重新定义为「最值钱的能力」，给 ENTP 提供身份骄傲"}}, {"id": "D21-B11-INTJ-1", "title": "INTJ 不陪你情绪内耗，他直接给你三套方案", "hook": "反常识", "targets": ["INTJ"], "channel": "小红书", "quality": 8.8, "budget": 25, "status": "active", "usage_count": 0, "priority": "P0", "paradigm": "反常识·Ni 系统重构型（INTJ 首触·高效决策·情绪内耗解药）", "signals": ["反内耗", "高效思维"], "post": {"cover_title": "INTJ 不陪你内耗，他直接给方案", "body": "你在情绪里打转，INTJ 已经在旁边列好了三套方案。\n\n不是 INTJ 冷血。\n\n是他太清楚一件事——\n\n情绪内耗，是这个世界上最昂贵的无用功。\n\n所以 INTJ 的本能反应，从来不是「抱抱你」，而是「帮你把问题拆了」。\n\n你要的不是安慰，是出口。\n\n而 INTJ，就是那个在最乱的房间里，先把灯打开的人。\n\n他不会陪你哭，但会陪你「把哭的原因，一条条解决掉」。\n\n这，才是 INTJ 最深的温柔——\n\n「我不哄你，但我陪你赢。」", "hashtags": ["#INTJ", "#反内耗", "#高效", "#理性", "#温柔"], "cta": "你身边那个「不哄你但帮你解决」的人，是谁？", "cover_visual": "整洁的桌面上摊开三张方案纸 + 一支笔，冷色调，理性有序", "post_time": "早 7:30-8:30", "avoid": "不贬低情绪价值、不制造「理性优于感性」的对立、强调温柔藏在行动里"}, "brief": {"pain_point": "INTJ 的理性被误解为「冷血」，渴望被理解「行动即温柔」", "hook_first3": "「不陪你内耗，直接给方案」反常识对比，快速建立 INTJ 形象", "emotion_curve": "误解→理解→感动（冷血→开灯→陪你赢）", "structure": ["反常识开场", "INTJ 的逻辑", "行动即温柔", "感动的收尾"], "differentiation": "把「理性」重新定义为「最深的温柔」，给 INTJ 提供情感认同"}}, {"id": "D21-B11-ISTJ-1", "title": "ISTJ 的靠谱，是把「说到」变成「做到」一万次", "hook": "社会证明", "targets": ["ISTJ"], "channel": "小红书", "quality": 8.7, "budget": 25, "status": "active", "usage_count": 0, "priority": "P0", "paradigm": "社会证明·Si 稳定可靠型（ISTJ 首触·靠谱积累·长期主义）", "signals": ["靠谱的人最稀缺", "长期主义"], "post": {"cover_title": "ISTJ 的靠谱，是说到做到一万次", "body": "这个时代最稀缺的人，不是最聪明的，是最靠谱的。\n\n而 ISTJ，就是「靠谱」本身。\n\n别人把「说到做到」当口号，ISTJ 把它当肌肉记忆。\n\n一万次答应，就有一万次兑现。\n\n他不抢眼，不喧哗，不表演。\n\n他只是安安静静地，把每一件答应过的事，都稳稳落地。\n\n时间久了你会发现——\n\n那些曾经光芒万丈的人来来去去，最后还站在你身边的，是那个 ISTJ。\n\n靠谱，才是这个时代最顶级的才华。\n\n而 ISTJ，天生就有。", "hashtags": ["#ISTJ", "#靠谱", "#长期主义", "#说到做到", "#稀缺"], "cta": "你身边那个「最让你安心」的人，是什么类型？", "cover_visual": "一本翻旧了的日程本上，密密麻麻打满了对勾，暖黄纸质感，踏实感", "post_time": "早 8:00-9:00", "avoid": "不贬低灵活型人格、不制造「老实人吃亏」的焦虑、聚焦靠谱的价值"}, "brief": {"pain_point": "ISTJ 的「低调靠谱」被忽视，渴望被认可为顶级稀缺", "hook_first3": "「最稀缺的不是聪明是靠谱」反常识价值判断，快速建立认同", "emotion_curve": "认同→踏实→骄傲（稀缺→肌肉记忆→顶级才华）", "structure": ["价值判断", "ISTJ 的靠谱", "时间的验证", "骄傲收尾"], "differentiation": "把「靠谱」定义为「顶级才华」，给 ISTJ 提供被看见的价值感"}}, {"id": "D21-B12-ENFJ-1", "title": "给化疗患儿外卖里塞100块的蛋饼店主，被全网买到爆单——ENFJ没有把这当成一条\"好人好报\"的新闻。她的Fe系统在0.3秒里读懂了它为什么能刷屏：善良最稀缺的不是 冷漠')、不消费化疗患儿苦难细节、不judge他人善意大小、聚焦'善良被看见·善良有回声'"}}, {"id": "D21-B12-ENFP-1", "title": "月入4万的大提琴老师，转身去卖馒头——ENFP没有把这当成一条\"职业降级\"的八卦。她的Fi系统在0.3秒里听懂了这个选择真正的重量：一个人最难的不是赚到别人眼里的\"好\"，是敢在\"应该\"和\"想要\"之间，坚定地选后者", "hook": "反常识", "targets": ["ENFP"], "channel": "小红书", "quality": 9.0, "budget": 25, "status": "active", "usage_count": 0, "priority": "P0", "consecutive_hook": 1, "direction_hook": "反常识", "arm_id": 1, "batch_num": 1, "signals": ["月入4万大提琴老师回应转行卖馒头(9分·反常识/自我觉醒·旗舰)"], "paradigm": "反常识·Fi-Ne自我觉醒型(B12大面积轮出·ENTJ/INTJ反常识batch2达上限→ENFP接管反常识batch1首触·大提琴老师9分旗舰·Fi价值裁判:4万高薪=外部给定的成就模板·Ne对照:真正的自我觉醒不是爬得更高·是敢撕掉'应该'的剧本·自我觉醒母题二级命中)", "role": "P0·ENFP反常识batch1首触(自我觉醒旗舰9)·大提琴老师转行卖馒头·小红书Fi位·hook_priority#1·方向船key_decision点名'自我觉醒旗舰'", "direction_compliance": "D21-B12 direction-pool key_decision'自我觉醒旗舰·大提琴老师馒头9分(ENFP反常识)'100%对齐·ENFP×反常识×小红书", "flagship": true, "attachment_theory_resonance": false, "note": "🟢 fresh(ENFP社会证明batch1→反常识batch1新hook首触)·大提琴老师9旗舰·放弃4万高薪转行·自我觉醒母题·小红书v2.0成品post落地", "brief": {"pain_point": "ENFP的Fi最怕被'应该'绑架——考好学校、进大厂、体面高薪，这些别人眼里的'好'对ENFP反而是牢笼；大提琴老师放弃4万高薪，戳中的正是'我到底在为自己活，还是为别人的期待活'。", "hook_first3": "第一行'月入4万，他转身去卖馒头'制造反差；第二行'不是失败，是终于敢选想要'点穿反常识核心；第三行'ENFP看到的不止是一个人的转行'切人格视角。", "emotion_curve": "猎奇/反差(4万→卖馒头) → 羡慕(敢选想要) → 被戳中(我也在被'应该'推着走) → 释然(人生可以重选) → 勇气(我也想为自己活一次)。", "structure": ["钩子·反差题", "现象·别人眼里的'降级'", "洞察·自我觉醒不是爬更高是敢选", "升华·'应该'vs'想要'", "CTA·你现在选哪个"], "differentiation": "别人写大提琴老师讲'转行励志/职业自由/馒头店火了'，我们讲'4万高薪是外部模板·转行是一次Fi的自我觉醒'；不做'辞职追梦'鸡汤，不judge稳定工作，落点'选择权在自己'。"}, "post": {"cover_title": "月入4万，他转行去卖馒头", "body": "月入4万，他转身去卖馒头。\n\n不是破产，不是被裁。\n是他自己，不想拉了。🎻\n\n很多人第一反应是：疯了吧？\n\n体面、高薪、稳定的工作，\n说放就放，去揉面、蒸馒头。\n\n但停下来想一想，\n那个\"可惜\"，是谁的可惜？\n\n是社会给的\"应该\"：\n你应该做体面的工作，\n你应该守住4万月薪，\n你应该别折腾。\n\n可是\"应该\"和\"想要\"，\n从来不是一回事。\n\n大提琴老师真正放下的，\n不是钱，\n是那个\"别人眼里的好\"。\n\n他选的是——\n我终于可以，只为自己活。🌙\n\n这不是一个转行的故事，\n是一个\"自我觉醒\"的故事。\n\n最难的不是爬得更高，\n是在所有人都说\"你傻\"的时候，\n还坚定地选\"我想要\"。\n\n你现在走的路，\n是\"应该\"，还是\"想要\"？\n\n评论区，说说你的那个\"想要\"。👇", "hashtags": ["#ENFP", "#自我觉醒", "#职业选择", "#反内卷", "#MBTI"], "cover_visua 人生路径。"}, "post": {"cover_title": "她放弃本科，8年后回来专升本", "body": "她做了一个让全家都反对的决定。\n\n放弃本科，去当兵。\n\n很多人说：\n「好好的大学不读，图什么？」\n\n8年后，\n她又做了一个「回头」的决定——\n军士专升本，重新读书。\n\n看起来，\n她好像绕了一个大圈。\n\n但ENFP看到的，\n是另一件事：\n\n人生从来不是一条直线。\n\n真正的「自我觉醒」，\n不是一次就选对，\n而是每一个岔路口，\n都敢停下来问自己：\n「我到底想要什么？」\n\n18岁选当兵，\n是她忠于那时的自己。\n26岁回来读书，\n是她忠于现在的自己。\n\n两个选择都不「错」，\n因为选择本身，\n就是在一步步走近自己。💛\n\n别怕走弯路。\n\n那些你以为的弯路，\n其实都是，\n你走向自己的必经之路。\n\n💬 你有没有一个，\n「当时没人理解，但我不后悔」的选择？\n评论区，说给我听。", "hashtags": ["#自我觉醒", "#MBTI", "#ENFP", "#人生选择", "#自我成长"], "cover_visual": "身穿军装的女兵侧影，与书桌前伏案的女生背影，中间一条折返的光带路径；暖色调、坚定不煽情；大字『人生不是直线』", "cta": "你有没有一个「当时没人理解，但我不后悔」的选择？评论区说给我听。", "post_time": "12:00-13:00（午间励志情绪高峰）", "avoid": "不judge学历选择、不贬低任何人生路径、不制造「读本科无用」对立；聚焦「每个选择都是走向自己」的自我觉醒正面能量"}, "post_spec_version": "v2.0"}, {"id": "D21-B14-ISTJ-1", "title": "总犯困、代谢慢？可能不是上班累的——ISTJ看到的是一个被忽略的健康信号：身体不会说话，但它会用「累」提醒你，你缺的可能不是休息，是蛋白质", "hook": "好奇心", "targets": ["ISTJ"], "channel": "小红书", "quality": 8.6, "budget": 25, "status": "active", "usage_count": 0, "priority": "P1", "consecutive_hook": 1, "direction_hook": "好奇心", "arm_id": 5, "batch_num": 1, "signals": ["总犯困、代谢慢？可能不是上班累的(6分·好奇心·健康认知反转·42%居民优质蛋白不足)"], "paradigm": "好奇心·Si健康认知反转/实用型(ISTJ好奇心batch1首触·身份认同B13后轮出→好奇心·总犯困6分·Si健康规律实用:犯困≠懒是身体信号·42%优质蛋白不足·严禁健康焦虑贩卖)", "role": "P1·ISTJ好奇心batch1首触(总犯困6·健康认知反转)·小红书Si位·方向船key_decision「ISTJ好奇心(总犯困6·健康认知反转·Si健康规律实用)」", "direction_compliance": "D21-B14 direction-vessel key_decision对齐·ISTJ×好奇心×小红书·channel_mix小红书28.6%(ENFP+ISTJ)", "flagship": false, "attachment_theory_resonance": false, "note": "🟢 fresh(ISTJ好奇心batch1·身份认同B13后轮出)·总犯困6分·Si健康认知反转·小红书v2.0 post成品落地·严禁健康焦虑(用实用科普角度)", "brief": {"pain_point": "ISTJ的Si重视身体的规律与秩序，最烦「明明休息够了还是累」的失控感；「犯困可能不是累，是缺蛋白质」给出了一个可执行、可验证的答案，正中ISTJ对「找到原因就解决它」的偏好。", "hook_first3": "第一行「你最近是不是，动不动就犯困」直接戳日常；第二行「你的第一反应是『上班太累了』」点破惯性归因；第三行「但身体想告诉你：不是累，是缺了东西」制造认知反转。", "emotion_curve": "共鸣(真的老犯困) → 意外(不是累) → 恍然(是缺蛋白质) → 踏实(有解) → 行动(调整饮食)。", "structure": ["钩子·犯困日常", "反转·不是累是缺蛋白", "科普·42%优质蛋白不足", "落地·早餐加点蛋奶", "CTA·你的早餐吃蛋白吗"], "differentiation": "别人写犯困是 ure": ["钩子·总累共鸣", "去自责·不是懒", "节律·秋乏=换季", "落地·顺应节律调整", "CTA·你秋天最容易累吗"], "differentiation": "别人写「养生偏方/补品/吓唬你生病」，我们写Si节律认知——「累是身体的信号，不是意志的失败」；实用科普、不恐吓、不替代医疗建议。"}, "post": {"cover_title": "总觉得累？可能是秋乏", "body": "最近总觉得累，🚶\n做什么都提不起劲。\n\n早上起不来，\n下午昏昏沉沉，\n连平时喜欢的事都懒得碰。\n\n你的第一反应，\n是不是又在心里骂自己：\n「我是不是太懒了？」\n\n先别急着怪自己。\n\n这个季节的累，\n大概率是——秋乏。🍂\n\n入秋之后，\n气温下降、昼短夜长，\n身体在悄悄「换季」，\n新陈代谢也在调整节奏。\n\n这种时候，\n累不是你的意志问题，\n是身体在按它的节律走。\n\n所以，\n别再用「再坚持一下」硬撑，\n而是顺着节律，\n早睡一点，\n动一动，\n给自己一点缓冲的时间。\n\nISTJ会告诉你：\n规律不是苦行，\n是听懂身体的语言。💛\n\n累是身体的信号，\n不是意志的失败。\n\n照顾好自己的节奏，\n比硬扛更重要。\n\n💬 你最近也总觉得累吗？\n评论区说说，\n是秋乏，还是没睡够？", "hashtags": ["#秋乏", "#健康科普", "#MBTI", "#ISTJ", "#自我关怀"], "cover_visual": "秋日窗边一杯温水 + 一本翻开的书，暖棕色调、松弛感，大字『累≠懒，是身体在换季』", "cta": "你最近也总觉得累吗？评论区说说，是秋乏还是没睡够。", "post_time": "12:00-13:00 或 18:00-20:00（实用科普·午间/晚间阅读高峰）", "avoid": "不做疾病诊断暗示、不夸大「秋乏=重病」、不贩卖健康焦虑、不替代专业医疗建议；用「身体的信号」实用科普角度"}, "post_spec_version": "v2.0"}, {"id": "D21-B16-ISTJ-1", "title": "帮扶老人的店主，官方确认不担责——ISTJ的Si没有把这当成一条孤立的新闻。它看到的是社会运行最朴素的逻辑：好人好事不该被辜负，公道是这个社会最硬的秩序", "hook": "社会证明", "targets": ["ISTJ"], "channel": "小红书", "quality": 8.7, "budget": 25, "status": "active", "usage_count": 0, "priority": "P1", "consecutive_hook": 1, "direction_hook": "社会证明", "arm_id": 6, "batch_num": 1, "signals": ["官方确认帮扶老人店主不担责(7分·社会证明·社会道德·公道·heat90)"], "paradigm": "社会证明·Si秩序/公道闭环型(ISTJ社会证明batch1换hook·官方确认不担责7分·Si秩序:公道=社会底线·社会证明闭环叙事·严禁道德绑架·用公道/秩序角度)", "role": "P1·ISTJ社会证明batch1换hook(官方确认不担责7·公道·好人好事不被辜负)·小红书Si位·方向船key_decision「ISTJ社会证明(官方确认不担责7·好奇心batch2达上限换hook·SJ象限)」", "direction_compliance": "D21-B16 direction-vessel key_decision对齐·ISTJ×社会证明×小红书", "flagship": false, "attachment_theory_resonance": false, "note": "🟢 fresh(B16大面积轮出批·ISTJ社会证明batch1)·方向船mandates合规", "brief": {"pain_point": "ISTJ的Si依赖「秩序与规则」带来安全感；「做好事反被讹」会动摇TA对社会底线的信任，「官方确认不担责」恰好修复这份秩序感。", "hook_first3": "第一行「帮扶老人的店主，官方确认不担责」摆结论；第二行「这句确认，比任何安慰都重」点社会意义；第三行「ISTJ看到的是：好人好事不该被辜负，公道是最硬的秩序」切入Si秩序感。", "emotion_curve": "担忧(会被讹吗) → 安心(官方确认) → 笃定(公道闭环) → 秩序(社会底线) → 行动(敢做好事)。", "structure": ["钩子·官方确认不担责", "背景 7)命中", "flagship": false, "attachment_theory_resonance": false, "note": "🟢 fresh(D21-B20大面积轮出批·INTJ身份认同恢复batch1)·依据B19方向船resume_conditions+daily-review rotation+signal-pool 08-29·小红书post成品v2.0·B20方向船尚未产出已flag · ⛔冻结：未获 B20 方向授权 · 冻结期间仅储备不部署 · 待策策产 B20 方向 + 冻结解除后再部署（#27-C 进进审计裁定 08-29 10:30）", "brief": {"pain_point": "INTJ的Ni追求「长远的掌控与独立」，但从小被分数/排名这套外部评价体系规训，内心始终在「我要做到最优」和「这标准到底是谁定的」之间拉扯。这届年轻人不被分数定义人生，击中的是INTJ最深的渴望——把评价权拿回自己手里。", "hook_first3": "第一行「这届年轻人说：不被分数定义人生」直接点题；第二行「很多人以为这是躺平，其实恰恰相反」破除误读；第三行「INTJ看到的不是反学历，是『独立』这个词的真正含义」切入Ni-Te。", "emotion_curve": "共鸣(被分数规训过) → 松动(标准是别人定的) → 清醒(独立=拿回评价权) → 笃定(我自己定义价值) → 行动(写下你的定义)。", "structure": ["钩子·不被分数定义", "误读·这不是躺平", "洞察·独立=拿回评价权", "迁移·你也被什么标尺困住", "CTA·你如何定义自己"], "differentiation": "别人写「分数无用论」或「高考逆袭」，我们写Ni-Te的「评价权独立」——不贬低考试的价值，落点「把标尺从别人手里拿回来」；把「不被定义」还原成「自主定义」，让INTJ看见掌控感其实在自己手里。"}, "post": {"cover_title": "分数，从来不是你的定义", "body": "你是不是也曾经，\n用一次考试、一个分数，\n给自己判过刑？\n\n「我考砸了，所以我完蛋了」\n「我没进名校，所以我不行」\n\n但这届年轻人说：\n分数，只是人生的一次计量。\n它衡量的是那一次，\n不是你整个人。📏\n\nINTJ太懂这种拧巴了：\n你想把一切做到最优，\n于是把别人的标尺，\n当成了自己的标准。\n\n可真正的独立，\n不是考得比谁都高，\n而是把评价自己的权利，\n从别人手里拿回来。\n\n你的价值，\n不该由一张成绩单盖章。\n它该由你自己定义。✨\n\n💬 你有没有被一个分数\n「定义」过的瞬间？\n评论区聊聊，\n你后来是怎么拿回主动权的。", "hashtags": ["#不被分数定义", "#MBTI", "#INTJ", "#自我成长", "#人生选择"], "cover_visual": "一张被撕开一角的成绩单 + 留白处手写体「你自己定义」；冷调蓝白 + 一点暖黄高对比", "cta": "你有没有被一个分数「定义」过的瞬间？评论区聊聊你后来是怎么拿回主动权的。", "post_time": "18:00-20:00（自我成长/身份认同类·晚间深度阅读时段）", "avoid": "不贬低考试/学历/名校的价值（避免「读书无用论」对立）；不渲染分数焦虑；落点「自主定义/边界」，规避成功学鸡汤"}, "post_spec_version": "v2.0", "deployment": {"allowed": false, "state": "frozen-reserve", "reason": "未获 B20 方向授权 · 冻结期间仅储备不部署 · 待策策产 B20 方向 + 冻结解除后再部署", "frozen_at": "2026-08-29T10:30:00+08:00", "ruling": "#27-C 进进审计裁定 (2026-08-29) · 储备批保留不浪费，冻结期间不部署", "authorization": "未获 B20 方向授权 · 冻结期间仅储备不部署"}, "deployment_authorization": "未获 B20 方向授权 · 冻结期间仅储备不部署"}, {"id": "D21-B21-INFJ-1", "title": "「抗癌博主小詹去世，年仅24岁」——INFJ的Ni-Fe看到的不是死亡的可怕。它看到的是：一个人明知结局，却把剩下的每一天都活成了光；生命的意义，从来不在长度，而在密度", "hook": "情感共鸣", "targets": ["INFJ"], "channel": "小红书", "quali ": "四个儿子争着养95岁老母亲，\n很多人说这是\"孝道天花板\"。\n\n但 ENFJ 看到的不只是孝顺，\n是一个人在几十年里，\n把\"被爱\"这件事，一点一点攒成了\"值得\"。❤️\n\n孩子愿意养，从来不是因为\"应该\"，\n是因为这个妈妈，曾经也被温柔地回应过。\n\n安全感这东西，\n不是天生就有的，\n是被一次次回应，慢慢养出来的。\n\n你今天怎么对身边的人，\n多年后就会收到什么样的\"被争着养\"。\n\n爱不是义务，是存款。\n你存的每一分温柔，都会在晚年到期。🌙\n\n你身边有没有那个\"被争着养\"的人？\n讲讲 TA 的故事。", "hashtags": ["#ENFJ", "#孝道", "#家庭", "#依恋", "#情感"], "cover_visual": "暖金色调，老人与子女围坐的画面感 + 大字「被争着养，是攒了一辈子的值得」", "cta": "你身边有没有那个「被争着养」的人？讲讲 TA 的故事", "post_time": "19:00-21:00（家庭情感类晚饭后高峰）", "avoid": "不消费老人形象、不做道德绑架，聚焦「回应养出安全感」的关系视角"}, "brief": {"pain_point": "ENFJ 重视关系却常担心自己的付出是否被看见、被回应", "hook_first3": "争养95岁老母亲热点切入→「孝道天花板」引共鸣→ENFJ看到「值得=被回应攒出来」的升华", "emotion_curve": "感动(争养)→深思(不是应该，是回应)→领悟(安全感是被养出来的)→温暖(爱是存款)", "structure": ["热点切入", "点破(不只孝顺)", "依恋原理(被回应养出来)", "行动映射(你怎么对人)", "升华(爱是存款)", "CTA故事征集"], "differentiation": "不写「孝道鸡汤」，写「安全依恋是双向回应」，从家庭故事升维到关系经营"}}, {"id": "D21-B8-INFP-1", "title": "00后女儿和80后妈妈前后脚生娃——INFP没有把它当成一则家庭趣闻。她的Fi系统在0.3秒里认出了这件事真正的坐标：两代人同时当妈，不是时间线的巧合，是\"成为母亲\"和\"成为自己\"这两件事，第一次被允许在同一年发生", "hook": "身份认同", "targets": ["INFP"], "channel": "小红书", "quality": 9.0, "budget": 25, "status": "active", "usage_count": 0, "priority": "P0", "consecutive_hook": 1, "direction_hook": "身份认同", "arm_id": 2, "batch_num": 1, "signals": ["00后女儿和80后妈妈前后脚生娃(7分·代际家庭·依恋·旗舰)", "满江叔圈天菜上新了(5分·年龄身份·审美)"], "paradigm": "身份认同·Fi-Ne代际身份谈判解构型(INFP rest2批后恢复首触·依恋母题7分旗舰达标·Fi代际身份:两代人同时当妈=人生顺序失效版本开放·'成为母亲'不再吞掉'成为自己'·Ne对照:满江叔圈天菜=年龄从贬值倒计时变沉淀溢价·两则=代际时间线谈判+审美权谈判·疲劳3.0→2.5回落)", "role": "P0·INFP身份认同batch1·🆕rest2批后恢复首触·content_sync_rule点名需fresh(非复用旧INFP内容)·依恋母题7分旗舰达标·小红书Fi基线", "direction_compliance": "D21-B8 direction-vessel arm2 100%对齐·INFP×身份认同×小红书·batch1·恢复首触fresh", "flagship": true, "attachment_theory_resonance": true, "note": "🟢 fresh·双恢复首触核心臂·依恋母题旗舰(代际家庭7分)·Fi-Ne代际身份谈判·q9.0·B9可续batch2(需身份认同信号≥3)", "post": {"cover_title": "两代人同时当妈，人生顺序失效了", "body": "00后女儿和80后妈妈，前后脚生娃。\n有人觉得\"乱了辈分\"。\n\n但 INFP 看到的是另一件事：\n人生的顺序，本来就可以被重新排列。🔄\n\n\"到了什么年纪就该做什么事\"，\n这句话困住了太多人。\n\n可这一对母女告诉我们：\n\"成为母亲\"和\"成为自己\"，\n从来不冲突，也可以同时发生。\n\n年龄不是倒计时， 切入", "误解制造", "反转(心疼)", "核心(写作=我是谁)", "升华(保护热爱)", "CTA"], "differentiation": "不写「要不要靠写作吃饭」的实用建议，写「热爱与定价的边界」，从职业选择升华到身份守护"}}, {"post": {"cover_title": "你的社恐，是在守护一个审美世界", "body": "别再逼 ISFP「外向一点」了。\n\n你以为 TA 是社恐，其实是 TA 在守护一个不能被打扰的审美世界。\n\nISFP 不是不会社交，是 TA 的内心太丰富了。\n\n一首歌、一片晚霞、一段只有 TA 懂的画面，都值得 TA 一个人慢慢品味。\n\n强行把 TA 拉进喧闹的人群，等于把一幅画扔进了菜市场。\n\nISFP 的安静，是一种选择，不是缺陷。\n\nTA 在用「不打扰」，保护自己心里那个精致的小宇宙。\n\n如果你身边有 ISFP，最好的陪伴是：\n「你待着就好，我在这儿，不吵你。」", "hashtags": ["#ISFP", "#社恐", "#审美", "#内向", "#懂我"], "cta": "ISFP 们，你们心里那个「不能被吵到的小世界」里，最近放着什么？", "cover_visual": "一个人坐在窗边看晚霞的侧影 + 柔和的暮色，低饱和暖调，留白很多", "post_time": "晚 21:00-22:00", "avoid": "不用「孤僻」「不合群」等负面标签、不鼓励极端社交回避"}, "brief": {"pain_point": "ISFP 被误解为「社恐」，实际是审美世界的自我保护", "hook_first3": "「别再逼 ISFP 外向」替内向者发声，制造立场认同", "emotion_curve": "被理解→释然→骄傲（误解→守护→选择）", "structure": ["打破误解", "审美世界的解释", "安静是选择", "给陪伴方式"], "differentiation": "把「社恐」重新定义为「审美守护」，给 ISFP 提供身份骄傲"}}, {"post": {"cover_title": "河南AI短剧出海，我们学会了被看见", "body": "日本电视台，在播河南农村的 AI 短剧。\n\nENFJ 看到的不是「文化出海」。\n\n她看到的是——「我们终于学会了，怎么被看见。」\n\n以前，我们的故事要出去，得先把自己「翻译」成别人习惯的样子。\n\n可现在，一个河南农村的 AI 短剧，就那样被播了出去。\n\n它没刻意讨好谁，也没放低自己。\n\n它就讲自己的故事，讲得够真、够好。\n\n然后，世界自己凑过来了。\n\n这就是 ENFJ 心里「被看见」最好的样子：\n\n不是「求你看我」，是「我值得你看」。", "hashtags": ["#ENFJ", "#AI短剧", "#文化出海", "#河南", "#被看见"], "cta": "你有没有一个「终于被看见」的瞬间？说出来，我为你鼓掌。", "cover_visual": "电视屏幕上播放着农村短剧 + 一家人围看的画面，暖黄生活感", "post_time": "晚 19:00-20:30", "avoid": "不贬低其他文化、不碰地域刻板印象、聚焦「被看见」的正向情绪"}, "brief": {"pain_point": "ENFJ 对「被看见、被认可」的深层渴望与民族文化自豪", "hook_first3": "「日本电视台播河南AI短剧」反差场景 + 「被看见」的情感升华", "emotion_curve": "好奇→自豪→升华（出海→被看见→我值得你看）", "structure": ["现象", "ENFJ 的看见", "被看见的本质", "升华"], "differentiation": "从「文化出海」的宏大叙事转向「被看见」的个人情感，正中 ENFJ"}}, {"post": {"cover_title": "INFJ 不交朋友，她在校准你", "body": "INFJ 不交朋友。\n\n别误会，不是她冷。\n\n是她在「校准」你可能会成为的那个人，然后决定，要不要陪你走这段路。\n\nINFJ 看人，看的不是你现在是谁。\n\n是你「可能成为谁」。\n\n她会观察你如何处理一次尴尬，如何对待一个比你弱的人，如何在没人看见的时候做选择。\n\n这些瞬间，比一万句自我介绍，都更真实。\n\n所以 INFJ 的朋友很少，但每一个，都是她认真「校准」过的灵魂。\n\n如果你被一个 INFJ 认定，恭喜你——\n\n她不是随便选了你，她是「看见」了你。", "hashtags": ["#INFJ", "#友谊", "#深度关系", "#人格", "#懂我"], "cta": "INFJ 的朋友们，说说你是怎么被「认定」的？", "cover_visual": "一个人的剪影望向远处人群，中间留白，深蓝冷调，有距离感但温暖", "post_time": "晚 20:00-21:30", "avoid": "不强化「INFJ 高傲/难接近」的刻板印象、不贬低泛泛之交"}, "brief": {"pain_point": "INFJ 对「深度关系」的重视与「被误解为冷」的委屈", "hook_first3": "「INFJ 不交朋友」反常识开场，制造悬念后反转", "emotion_curve": "误解→解释→骄傲（不交朋友→校准→被看见）", "structure": ["反常识开场", "校准的逻辑", "看人的方式", "被认定的珍贵"], "differentiation": "把「朋友少」重新定义为「深度校准」，给 INFJ 提供认同与骄傲"}}, {"post": {"cover_title": "3分钟刷屏，是情绪共振的拆解", "body": "农村女孩，3 分钟发言，刷屏全网。\n\n有人说她「会说话」。\n\n但 ENFJ 看懂了——\n\n她不是会说话，是她的每一句话，都精准踩中了所有人的「情绪共振频率」。\n\n这就是 Fe-Ni 系统的威力。\n\nFe，让她瞬间读懂台下每个人的情绪。\nNi，让她一眼看穿这些话背后的深层渴望。\n\n当她把这两者合在一起，说出来的每句话，都是「说进你心里」。\n\n普通人说话，是在「表达自己」。\n\n而她说话，是在「共振所有人」。\n\n这，才是她刷屏的真正原因。", "hashtags": ["#ENFJ", "#表达", "#情绪共振", "#FeNi", "#说话的艺术"], "cta": "你有没有一句话，听完就觉得「这说的就是我」？", "cover_visual": "舞台上女孩发言的特写 + 台下观众专注的脸，暖光，聚焦感", "post_time": "午 12:30-13:30", "avoid": "不神化个人、不制造「普通人不会说话」的焦虑、聚焦方法而非天赋"}, "brief": {"pain_point": "ENFJ 对「真诚表达打动人」的共鸣与表达力提升诉求", "hook_first3": "「3分钟刷屏」强结果 + 「不是会说话」的反转", "emotion_curve": "好奇→拆解→领悟（会说话→情绪共振→FeNi）", "structure": ["现象", "反常识反转", "Fe-Ni 拆解", "真正的会说话"], "differentiation": "把「会说话」拆解成可理解的 Fe-Ni 机制，给 ENFJ 提供方法论认同"}}, {"post": {"cover_title": "会安慰所有人的你，谁来安慰？", "body": "朋友圈里最会安慰人的那个 ENFJ，其实早就被掏空了。\n\n你以为她天生温暖。\n\n其实她只是习惯了，把所有人的情绪，都先接过来。\n\n朋友失恋了，她陪着熬到凌晨。\n同事崩溃了，她递纸巾又递方案。\n\n可轮到她自己难过的时候，她张了张嘴，只挤出一句：「没事，我还好。」\n\nENFJ 的温柔，是一种「只有我能治愈全世界，但谁能治愈我」的孤独。\n\n如果你身边有这样一个 ENFJ——\n\n今晚，别问她「你怎么了」。\n\n直接跟她说：「你辛苦了，换我来。」\n\n这句话，她等了很久。", "hashtags": ["#ENFJ", "#情绪价值", "#治愈", "#懂我的人", "#情感"], "cta": "如果你也是那个「只安慰别人」的人，今天，允许自己被安慰一次。", "cover_visual": "深夜亮着的手机屏幕 + 一个人抱膝的剪影，暖黄色调，温柔但略带孤单", "post_time": "晚 22:00-23:30（深夜情绪高峰）", "avoid": "不制造焦虑、不强化「受害者」叙事、结尾必须给出口（被治愈的出口）"}, "brief": {"pain_point": "ENFJ 付出型人格的「情绪透支」与不被看见的孤独", "hook_first3": "「朋友圈里最会安慰人的人被掏空」反常识切入，戳中付出型人群", "emotion_curve": "共鸣→心疼→温柔出口（孤独→被看见→换我来）", "structure": ["反常识开场", "付出场景堆叠", "孤独的本质", "给一句出口"], "differentiation": "不贩卖焦虑，结尾给「被治愈」的具体行动，符合 ENFJ 需要被回应的心理"}}, {"post": {"cover_title": "扛钢管的妈妈，是关系建筑师", "body": "单亲妈妈，扛钢管，供女儿考上北大。\n\n有人看到的是「苦情」。\n\n但 INFJ 看到的是另一种东西——\n\n一个「用 Ni 看见终点，用 Fe 扛住现在」的关系建筑师。\n\n她心里，早就看见了女儿未来那个「北大」的终点。\n\n所以她愿意，在现在这个最苦的阶段，一根钢管一根钢管地扛。\n\n这不是苦情，这是信念。\n\nINFJ 太懂这种「为了终点而忍受当下」的力量了。\n\n因为 INFJ 自己，就是这样活着的——\n\n心里有光，脚下有泥，但眼睛，一直看着远方。", "hashtags": ["#INFJ", "#单亲妈妈", "#信念", "#母爱", "#成长"], "cta": "你心里有没有一个「看见了终点，所以扛住现在」的时刻？", "cover_visual": "工地脚手架与母亲劳作的背影 + 远处一束光，纪实与希望的对比", "post_time": "晚 20:00-21:30", "avoid": "不消费苦难、不强化「母亲必须牺牲」、聚焦「信念」而非「惨」"}, "brief": {"pain_point": "INFJ 对「为终点忍受当下」的信念共鸣", "hook_first3": "「扛钢管供女儿上北大」强故事 + 「关系建筑师」的独特定义", "emotion_curve": "故事→洞察→共鸣（苦情→信念→看见远方）", "structure": ["故事切入", "INFJ 的重新定义", "信念的本质", "共鸣收尾"], "differentiation": "把「苦情」重新定义为「信念」，符合 INFJ 的 Ni 长期主义视角"}}, {"post": {"cover_title": "知道不再值钱，什么才是护城河？", "body": "DeepSeek 一夜之间，把 8 万亿 Token 的知识，变成了免费午餐。\n\n很多人慌了：知识不值钱了，我们怎么办？\n\n但 INFJ 看到的是另一个问题——\n\n当「知道」不再值钱，什么才是人类最后的护城河？\n\n答案其实一直都有：\n\n会问问题的人，比会背答案的人，值钱一万倍。\n\n能共情的人，比能复述的人，不可替代。\n\n有判断力的人，比有数据库的人，走得更远。\n\nAI 把「知识」从神坛上拽了下来。\n\n但 AI 永远抢不走三样东西：\n你的好奇、你的温柔、你敢于「不知道」却依然向前走的勇气。", "hashtags": ["#INFJ", "#DeepSeek", "#AI", "#认知", "#思考"], "cta": "AI 时代，你觉得什么是「AI 抢不走」的？评论区聊聊。", "cover_visual": "深色科技感背景 + 一个发光的问号，蓝紫色调，简洁留白", "post_time": "晚 19:30-21:00", "avoid": "不制造「AI 取代人类」的恐慌、不贬低技术、给出建设性出口"}, "brief": {"pain_point": "INFJ 对「知识贬值」时代下人类价值的思考", "hook_first3": "「8万亿 Token 免费」强数据切入，引出「护城河」之问", "emotion_curve": "危机→思考→笃定（慌→问题→答案）", "structure": ["现象冲击", "INFJ 的深层之问", "三个答案", "笃定收尾"], "differentiation": "不谈「AI 多强」，谈「人还剩什么」，符合 INFJ 的 Ni 人文关怀"}}, {"post": {"cover_title": "INFJ 的温柔，是提前跑完你的人生", "body": "INFJ 不是「善解人意」。\n\n她的大脑，在你开口之前，就已经用 Ni 跑完了你的人生剧本。\n\n用 Fe，听完了你没有说出口的那个版本。\n\n然后，递给你一句，恰好戳中伤口、但不会让你疼的话。\n\n这不是情商高。\n\n这是一种很累的天赋。\n\n因为 INFJ 每理解一个人，都要在自己心里，先经历一遍对方的痛。\n\n她不是「懂你」，她是「替你疼过一遍，还笑着递给你创可贴」。\n\n如果你身边有 INFJ，请记得：\n\n她的温柔，从来不是廉价的。", "hashtags": ["#INFJ", "#温柔", "#共情", "#人格", "#懂你"], "cta": "那个「总是懂你」的人，你有多久没谢谢 TA 了？", "cover_visual": "一个人低头倾听的侧影 + 柔和的光晕，温暖治愈，蓝紫渐变", "post_time": "晚 21:00-22:30", "avoid": "不神化共情能力、不制造「共情者就该被消耗」的叙事、结尾给关怀出口"}, "brief": {"pain_point": "INFJ 共情天赋背后的疲惫与被误解为「天生温柔」", "hook_first3": "「不是善解人意」反转 + 「跑完人生剧本」的画面感比喻", "emotion_curve": "反转→心疼→珍惜（不是情商→累的天赋→温柔不廉价）", "structure": ["反转定义", "共情的机制", "累的天赋", "提醒珍惜"], "differentiation": "从「被共情者」视角转向「共情者的疲惫」，给 INFJ 被看见的感觉"}}, {"post": {"cover_title": "妈妈考研，女儿是第一个支持的人", "body": "41 岁的妈妈，考上了 985 研究生。\n\n很多人看到的是「励志」。\n\n但 ENFJ 看到的是另一个更温柔的故事——\n\n妈妈终于开始，为自己的人生投资了。\n\n而比妈妈更早看到这件事的，是她的女儿。\n\n女儿那句「妈，你去考吧」，才是这条新闻里，最温柔的齿轮。\n\nENFJ 太懂这种「被家人托住」的力量了。\n\n一个人敢在 41 岁重启人生，不是因为不怕，是因为身后有人对她说：\n「你去，我托着你。」\n\n所以你看，一个女人的野心，往往是被爱点亮的那盏灯。", "hashtags": ["#ENFJ", "#妈妈考研", "#女性成长", "#家庭", "#温柔的力量"], "cta": "你人生里，有没有一句「你去吧」推过你一把？说说那个人。", "cover_visual": "妈妈伏案学习的背影 + 女儿在门口微笑的画面，暖光，生活感", "post_time": "晚 20:30-22:00", "avoid": "不强化「妈妈牺牲」的苦情、不制造代际对立、聚焦支持而非牺牲"}, "brief": {"pain_point": "ENFJ 对「被家人托住」的深层共鸣与女性成长议题", "hook_first3": "「41岁妈妈考985」具体故事 + 「最温柔齿轮」的情感反转", "emotion_curve": "励志→温柔→共鸣（妈妈→女儿→被托住）", "structure": ["故事切入", "ENFJ 的独特视角", "被托住的力量", "野心是爱点亮的"], "differentiation": "不从「励志」谈，从「支持」谈，正中 ENFJ 的 Fe 关系视角"}}, {"post": {"cover_title": "不接电话的那晚，ENFJ 听到了呼吸", "body": "当 ENFJ 终于学会「不接电话」的那个晚上，她第一次听到了自己的呼吸声。\n\n在这之前，她的手机就是她的命。\n\n谁需要她，她就在。\n谁求助她，她就冲。\n\n她以为，被需要，就是被爱。\n\n直到那天，她把手机关静音，躺下来，听到自己呼吸的声音。\n\n她突然懂了——\n\n「我不需要被需要，我本身就有价值。」\n\n这句话，她花了很久很久，才对自己说出口。\n\n亲爱的 ENFJ，你的价值，从来不需要靠「被需要」来证明。\n\n你存在，就已经很值得。", "hashtags": ["#ENFJ", "#自我价值", "#边界感", "#治愈", "#成长"], "cta": "你有没有一个「终于为自己」的瞬间？说出来，我们都为你高兴。", "cover_visual": "夜晚安静的房间 + 床头柜上息屏的手机，一束柔光，静谧治愈感", "post_time": "晚 22:30-23:30", "avoid": "不否定付出、不鼓励极端断联、强调「边界」而非「冷漠」"}, "brief": {"pain_point": "ENFJ 把「被需要」等同于「有价值」的自我认知误区", "hook_first3": "「第一次听到自己呼吸」的细节，制造强烈画面感与反差", "emotion_curve": "疲惫→觉醒→释然（被需要→呼吸→我本身有价值）", "structure": ["觉醒瞬间", "过去的模式", "核心领悟", "温柔鼓励"], "differentiation": "从「呼吸声」这个微小细节切入，给出「自我价值」的温柔出口"}}, {"post": {"cover_title": "六分钟收完稻谷，是一个家族的保存键", "body": "大雨将至，一家六口，六分钟，收完一千斤稻谷。\n\n有人看到的是「干得真快」。\n\nINFJ 看到的，是三代人同时按下的保存键。\n\n谷粒落地的声音，是奶奶、爸爸、孩子，把同一段记忆，存进了同一阵风里。\n\n这是一种很古老的东西。\n\n它不靠语言，靠的是「我们都懂这一刻有多重要」。\n\nINFJ 会被这样的画面击中——\n因为她天生就在寻找这种「无声的连接」。\n\n一家人为了同一个目标，拼尽全力，不需要说一句话。\n\n这，就是 INFJ 心里「家」的样子。", "hashtags": ["#INFJ", "#家庭", "#稻谷", "#温暖", "#治愈"], "cta": "你记忆里，有没有一个「一家人不需要说话就懂了」的瞬间？", "cover_visual": "大雨前的田野，一家六口弯腰收稻的远景，天空压着乌云，泥土暖色", "post_time": "晚 20:00-21:00", "avoid": "不煽情过度、不涉及农村刻板印象、保持对劳动的尊重"}, "brief": {"pain_point": "INFJ 对「无声家庭连接」的深层共鸣", "hook_first3": "「六分钟收一千斤稻谷」强数据 + 紧迫场景快速抓人", "emotion_curve": "场景→洞察→共鸣（快→保存键→家的样子）", "structure": ["强场景开场", "INFJ 的 Ni 洞察", "无声连接的意义"], "differentiation": "从「效率」里挖出「情感记忆」，符合 INFJ 的 Ni-Fe 深度解读"}}, {"post": {"cover_title": "中式天庭，是文明不需要翻译的自我介绍", "body": "那个 500 万人转发的「中式天庭」AI 视频，你看哭了吗？\n\nENFJ 看的不是特效有多炫。\n\n她看到的是一个文明，终于找到了「不需要翻译」的自我介绍。\n\n以前我们想让世界懂我们，得先说英文，得先解释「这是什么」。\n\n可这个视频，把天庭、把神话、把中国人刻在骨子里的浪漫，直接用画面砸进你眼里。\n\n你不需要被科普，你就懂了。\n\n这就是 ENFJ 最在意的东西——\n被看见，被理解，被「不费力的」接受。\n\n当一个文明的底气足够大，它就不再需要自我介绍。\n\n它站在那里，就赢了。", "hashtags": ["#ENFJ", "#中式天庭", "#AI视频", "#文化自信", "#国潮"], "cta": "你刷到这个视频时，最先被哪一帧击中？分享你的瞬间。", "cover_visual": "中式天庭 AI 视频标志性画面（神仙列阵/云海），金红配色，大字标题叠加", "post_time": "午 12:00-13:00（午休刷屏高峰）", "avoid": "不贬低其他国家文化、不煽动对立、不碰具体敏感历史事件"}, "brief": {"pain_point": "ENFJ 对「文化被看见、被理解」的深层渴望", "hook_first3": "「你看哭了吗」情感钩子 + 500万转发数据背书", "emotion_curve": "共鸣→自豪→升华（特效→文化→底气）", "structure": ["爆款现象", "ENFJ 的独特视角", "不需要翻译的底气"], "differentiation": "不谈技术，谈「被看见」的情感，正中 ENFJ 的 Fe 核心"}}, {"post": {"cover_title": "13岁炒粉少年，看见一个系统的切片", "body": "13 岁的少年，白天写作业，晚上在夜市炒粉。\n\n很多人看到的是「懂事」。\n\n但 INFJ 看到的是一个社会结构的切片——\n\n为什么一个 13 岁的孩子，需要同时扛起作业本和炒锅？\n\n这不是一个孩子的故事。\n\n这是一个系统，把负担转移给了最没有选择权的人。\n\nINFJ 天生就会这样想问题。\n\n她不会只盯着一个人，她会看到这个人背后，那一整张看不见的网。\n\n懂事的孩子，值得被看见。\n\n但更值得被追问的，是「为什么需要他这么懂事」。", "hashtags": ["#INFJ", "#社会观察", "#少年", "#深度思考", "#人间"], "cta": "你有没有在某个「懂事」背后，看到更深的东西？", "cover_visual": "夜市灯火下少年炒粉的侧影 + 旁边放着的书包，冷暖对比，纪实感", "post_time": "晚 21:00-22:30", "avoid": "不消费苦难、不指责具体个人、聚焦结构性思考而非煽情"}, "brief": {"pain_point": "INFJ 对社会结构性问题的敏锐与关怀", "hook_first3": "「13岁少年夜市炒粉」具体场景 + 「系统的切片」反常识解读", "emotion_curve": "场景→洞察→追问（懂事→系统→为什么）", "structure": ["场景", "INFJ 的 Ni 洞察", "结构性追问"], "differentiation": "从「个体懂事」上升到「系统追问」，符合 INFJ 的 Ni-Fe 社会关怀"}}, {"post": {"cover_title": "最安静的名字，值得最喧闹的位置", "body": "商场里，钱学森的巨幅海报挂起来了。\n\nINFJ 站了很久。\n\n她看到的不只是「致敬一位科学家」。\n\n她看到的是一个民族，终于学会了一件事——\n把最安静的名字，放在最喧闹的地方。\n\n这很难。因为喧闹的地方，从来都属于会吆喝的人。\n\n而科学家，恰恰是最不会吆喝的那群人。\n\n他们把自己埋进公式和实验室，一埋就是一辈子。\n\nINFJ 懂的。\n\n这个世界需要热闹，但更需要有人在热闹之外，替所有人守住那条「对的方向」。\n\n当安静开始被看见，说明这个时代，开始懂得什么是真正重要的东西了。", "hashtags": ["#INFJ", "#钱学森", "#致敬科学家", "#价值观", "#安静的力量"], "cta": "你心里有没有一个「值得被更多人看见」的安静的名字？评论区留给他。", "cover_visual": "商场巨幅海报仰拍视角，海报上科学家的剪影 + 下方人群，暖黄与深蓝对比", "post_time": "晚 19:00-20:30", "avoid": "不涉及敏感历史细节、不用「民粹」叙事、避免过度政治化表达"}, "brief": {"pain_point": "INFJ 对「喧嚣压过价值」的隐忧与期待", "hook_first3": "「商场挂出钱学森海报」具体场景切入，快速建立视觉画面", "emotion_curve": "场景→凝视→洞察→释然", "structure": ["具体场景", "INFJ 的看见", "安静与喧闹的对照", "时代懂了"], "differentiation": "从「海报」这个小切口，引出「价值排序」的大命题，符合 INFJ 的 Ni 深度"}}, {"id": "D21-B12-INFP-1", "title": "结婚38年，他们才补拍婚纱照——INFP没有把这当成一条怀旧新闻。她的Fi系统在0.3秒里认出了这张照片真正的样子：真正的爱不是年轻时证明给谁看，是38年后还愿意为彼此，补上那个\"我们\"的瞬间", "hook": "情感共鸣", "targets": ["INFP"], "channel": "微博", "quality": 8.7, "budget": 25, "status": "active", "usage_count": 0, "priority": "P1", "consecutive_hook": 1, "direction_hook": "情感共鸣", "arm_id": 6, "batch_num": 1, "signals": ["金龟子王宁补拍婚纱照(7分·情感共鸣/安全型依恋·依恋母题连续5批)"], "paradigm": "情感共鸣·Fi安全型依恋型(INFP恢复首触·金龟子婚纱照7·安全型依恋母题连续5批·Fi亲密关系:38年补拍婚纱照不是迟到的仪式·是安全型依恋的具象·红队标记:质量<7则B13重新轮休·本臂q8.7达标)", "role": "P1·INFP恢复首触(情感共鸣batch1)·金龟子婚纱照7(安全型依恋)·微博Fi位·方向船key_decision'INFP恢复首触·情感共鸣(金龟子婚纱照7·安全型依恋母题)'", "direction_compliance": "D21-B12 direction-pool key_decision'INFP恢复首触·情感共鸣(金龟子婚纱照7·安全型依恋母题)'100%对齐·INFP×情感共鸣×小红书", "flagship": false, "attachment_theory_resonance": true, "note": "🟢 fresh(INFP轮休2批后恢复首触·情感共鸣batch1)·金龟子婚纱照7·安全型依恋母题·红队标记已过(q8.7≥7)·微博部署(方向船)·post成品已备(可选小红书交叉发布)", "brief": {"pain_point": "INFP的Fi对'真实的爱/长久的陪伴'极度渴望，也最容易被'38年才补拍婚纱照'这种不张扬却笃定的爱打动；背后的情感需求不是羡慕婚礼，是相信'有人愿意和我一起走到老'。", "hook_first3": "第一行'结婚38年，他们才补拍婚纱照'抛反差；第二行'不是迟到的仪式，是安全型依恋的样子'点穿母题；第三行'INFP看到的不是新闻，是我们一直在'切人格。", "emotion_curve": "好奇(38年才拍) → 柔软(补拍的瞬间) → 被治愈(安全型依恋) → 相信(爱可以这么稳) → 向往(我也想被这样爱)。", "structure": ["钩子·反差题", "现象·38年补拍", "洞察·安全型依恋不用秀", "升华·爱是'我们一直在'", "CTA·你信哪种爱"], "differentiation": "别人写金龟子讲'童年回忆杀/不老女神/补拍婚纱照好甜'，我们讲'38年补拍=安全型依恋的具象·爱不是证明是陪伴'；不做催婚/婚恋焦虑，不做'别人家的爱情'judge，落点'安全型依恋可以长什么样'。"}, "post": {"cover_title": "结婚38年，才补拍婚纱照", "body": "结婚38年，他们才补拍婚纱照。\n\n不是补办婚礼，\n是两个人，安安静静地，\n把迟到了38年的那张照片补上。📷\n\n很多人羡慕的是：\n原来爱情可以这么长。\n\n但INFP看到的，是另一件事——\n\n38年，不用每天说\"我爱你\"，\n不用秀给谁看，\n就是平平淡淡地，一起变老。\n\n这在心理学上，\n叫\"安全型依恋\"。\n\n不是离不开，\n是\"我们一直在\"。\n不是轰轰烈烈，\n是笃定。\n\n年轻时我们总以为，\n爱要够用力、够惊天动地。\n\n后来才懂，\n最奢侈的爱，是38年后，\n还愿意为对方补一张婚纱照。🤍\n\n你更信哪一种爱？\n是轰轰烈烈，还是细水长流？\n\n评论区，聊聊你的答案。👇", "hashtags": ["#INFP", "#安全型依恋", "#亲密关系", "#情感共鸣", "#MBTI"], "cover_visual": "一张泛黄的旧婚纱照旁放着崭新的婚纱照，暖白柔光，岁月感与温柔并置，配细字'38年·我们一直在'", "cta": "你更信哪一种爱？是轰轰烈烈，还是细水长流？评论区聊聊你的答案。", "post_time": "20:00-22:00（情感/依恋类·深夜情感流量高峰）", "avoid": "不催婚、不制造'没结婚/没仪式就是遗憾'的焦虑、不judge任何关系形态、聚焦'安全型依恋的陪伴本质'"}}], "vessels": {"D20-B4-ENTJ-1": {"id": "D20-B4-ENTJ-1", "title": "多国开始把黄金从美国运回国——ENTJ没有在听'避险'这个说法，他的Te-Ni系统在0.8秒内已经画出了棋盘：当所有国家同时开始怀疑同一个'安全'的时候，那不是避险，那是全球信任结构的第一道裂缝。而新税号的焦虑，只是这个裂缝的日常版本", "hook": "好奇心", "targets": ["ENTJ"], "channel": "抖音", "quality": 8.6, "created": "2026-08-06T08:30:00+08:00", "ttl_hours": 72, "status": "active", "usage_count": 0, "vessel_ref": "workspace-shared/pools/content-vessels/D20-B4-ENTJ-1.json", "paradigm": "好奇心·Te-Ni策略博弈型(ENTJ好奇心首触·社会证明轮出→好奇心·多国运回黄金(5分)+新税号焦虑(6分)双信号·Te-dom战略博弈·全球信任结构分析)", "role": "first_touch·ENTJ好奇心首触·Te-Ni策略博弈视角·信任7.74惯性持稳·防2批回落", "source_agent": "设设", "direction_ref": "D20-B4 direction-vessel·策策08:15·ENTJ好奇心weight=0.10·arm_id=6·信号:多国运回黄金(5分)+新税号焦虑(6分)·抖音25%渠道", "mandate_ref": "D20-B4 vessel.mandates·max_consecutive_same_hook=2(好奇心第2批)✅·max_targets_per_personality_per_day=1✅·excluded_hooks未触碰✅", "script": {"format": "抖音短视频脚本·5段结构·前3秒钩子", "segments": [{"id": 1, "type": "hook", "text": "多国开始把黄金从美国运回国。你听到的说法是'避险'。但ENTJ的Te-Ni系统在0.8秒内画出了另一张图：当所有国家同时开始怀疑同一个'安全'的时候——那不是避险，那是全球信任结构的第一道裂缝。", "duration_sec": 8}, {"id": 2, "type": "setup", "text": "黄金放在美国金库，是二战后全球秩序的默认设置——因为美元是锚。但现在，多国开始把黄金运回去。ENTJ看到的不只是新闻，是一盘棋：信任是有成本的，当持有'别人的担保'的成本开始超过收益，每个国家都会重新计算自己的筹码配置。这不是一个国家的决定，这是全球资产配置的集体转向。", "duration_sec": 12}, {"id": 3, "type": "conflict", "text": "而把镜头拉近到普通人身上：新税号的焦虑正在蔓延。大家担心的是什么？不是多交税，而是'我的每一笔收入都变得可见'。ENTJ的Te-Ni系统把这两件事放在同一个坐标系里：国家的黄金在从'别人那里'搬回'自己手里'，个人的资产也在从'看不见'走向'全透明'——全球正在发生同一件事：把信任从外部，搬回自己手里。", "duration_sec": 12}, {"id": 4, "type": "reveal", "text": "这就是ENTJ的思维引擎——当别人在看新闻，你在看棋局。你的Te系统天生会把孤立事件连成系统：运回黄金的国家、焦虑税号的个人、收紧的监管——它们不是三件事，是同一个结构性转变的三张切片。别人在讨论'要不要买黄金'，你在计算'信任的迁移方向'。你不是焦虑，你是在提前校准你的策略坐标。", "duration_sec": 12}, {"id": 5, "type": "cta", "text": "如果你也总在新闻里看到'别人看不到的棋盘'——那不是你想太多，是你的Te-Ni系统在自动做战略推演。评论区聊聊：你觉得信任正在从哪搬到哪？想看看你的决策系统是怎么运作的，做一次深度人格报告。", "duration_sec": 8}]}}, "D21-B18-ISTJ-1": {"vessel": {"version": "1.0", "type": "content-vessel", "id": "D21-B18-ISTJ-1", "source": {"agent": "设设", "subsystem": "内容Spoke-1", "batch": "D21-B18"}, "created_at": "2026-08-27T08:30:00+08:00", "freshness_ttl_hours": 72, "priority": "p0", "dependencies": [{"vessel_type": "direction-vessel", "vessel_id": "direction-vessel-2026-08-27-0815"}, {"vessel_type": "strategy-pool", "vessel_id": "strategy-pool-2026-08-26-0842"}, {"vessel_type": "signal-pool", "vessel_id": "signal-pool-2026-08-27-0815"}]}, "content": {"id": "D21-B18-ISTJ-1", "title": "店主扶起摔倒老人反被索赔1.9万，最终收到全额退款——ISTJ的Si没有把这当成一条「好人有好报」的爽文。它看到的是更深的东西：善意或许会迟到被误解，但规则和证据，最终会把公道还给你", "hook": "社会证明", "targets": ["ISTJ"], "channel": "小红书", "quality": 8.8, "budget": 25, "status": "active", "usage_count": 0, "priority": "P0", "consecutive_hook": 1, "direction_hook": "社会证明", "arm_id": 2, "batch_num": 1, "signals": ["扶老人被索赔1.9万店主收到全额退款(7分·社会证明·社会公正反转·heat3157万本批最高)"], "paradigm": "社会证明·Si规则正义型(ISTJ社会证明batch1换hook·扶老人获退款7分社会公正反转·Si:规则/证据是善意最后的护栏·情感共鸣batch1(B17少年自学9)换hook到社会证明·SJ象限维持·heat3157万本批最高·严禁渲染扶不扶对立焦虑)", "role": "P0·ISTJ社会证明batch1换hook(扶老人获退款7·社会公正反转·heat31.5M本批最高)·小红书SJ位·方向船key_decision「ISTJ社会证明(扶老人获退款7·社会公正反转·情感共鸣batch1换hook·SJ象限维持)」", "direction_compliance": "D21-B18 direction-vessel key_decision对齐·ISTJ×社会证明×小红书", "flagship": false, "attachment_theory_resonance": false, "note": "🟢 fresh(B18·ISTJ情感共鸣→社会证明换hook·扶老人获退款7·heat31.5M本批最高)·社会公正反转正面角度·Si规则/正义", "brief": {"pain_point": "ISTJ的Si依赖规则、秩序和「做了正确的事就该有正确的结果」。扶老人反被索赔击中的是「做好事却被规则反噬」的恐惧——而最终全额退款，正是ISTJ最渴望的「规则终将主持公道」。", "hook_first3": "第一行「扶起摔倒的老人，反被索赔1.9万」摆冲突；第二行「店里的监控，最后帮他还了清白」点反转；第三行「ISTJ看到的不是鸡汤，是『规则和证据，是善意最后的护栏』」切入Si。", "emotion_curve": "愤怒(好人被讹) → 憋屈(百口莫辩) → 反转(监控+全额退款) → 笃定(规则主持公道) → 安心(该做的事还是要做)。", "structure": ["钩子·扶老人被索赔", "冲突·善意被误解", "反转·监控+全额退款", "洞察·规则是善意的护栏", "CTA·你遇到过善意被误解吗"], "differentiation": "别人写「好人有好报/社会道德」，我们写Si的规则感——「善意不该靠运气，该靠规则和证据托底」；不贩卖对立、不渲染「扶不扶」焦虑，落点「规则终将主持公道」。"}, "post": {"cover_title": "扶老人被讹1.9万，监控还他清白", "body": "这事看得我血压都上来了。\n\n一个店主，\n看到老人摔倒，\n上去扶了一把。\n\n结果反手被索赔1.9万。😤\n\n「不是你撞的，你为什么要扶？」\n\n这句最伤人的话，\n差点让他百口莫辩。\n\n好在，店里的监控，\n完整记下了全过程。\n\n最终，\n他收到了全额退款，\n也等来了清白。\n\nISTJ会告诉你：\n这不是「好人有好报」的鸡汤。\n\n这是规则和证据，\n在关键时刻，\n替善意兜了底。🧭\n\n善意不该靠运气，\n该靠规则托底。\n\n该做的事，\n从来不会因为被误解，\n就变成错的。\n\n💬 你遇到过\n「做了好事却被误解」的时候吗？\n后来，\n公道还给你了吗？\n评论区说说。", "hashtags": ["#社会正能量", "#扶不扶", "#MBTI", "#ISTJ", "#规则与正义"], "cover_visual": "便利店监控画面构图 + 老人与店主对视的暖色场景；大字『善意，有规则托底』；冷灰监控框 + 暖色人物", "cta": "你遇到过「做了好事却被误解」的时候吗？后来公道还给你了吗？评论区说说。", "post_time": "18:00-20:00（社会话题类·晚间讨论高峰）", "avoid": "不渲染「扶不扶」对立焦虑、不道德绑架、不做「好人没好报」负面暗示；落点「规则与证据托底善意」"}, "post_spec_version": "v2.0"}}, "D16-B2-1": {"vessel": {"version": "1.0", "type": "content-vessel", "id": "D16-B2-1", "source": {"agent": "设设", "subsystem": "内容创作", "batch": "D16-B2"}, "created_at": "2026-07-30T12:18:00+08:00", "freshness_ttl_hours": 72, "priority": "p0", "dependencies": [{"vessel_type": "direction-vessel", "vessel_id": "2026-07-30-D16-direction(策策D16-B0)"}, {"vessel_type": "knowledge-vessel", "vessel_id": "knowledge-xixi-2026-07-30-D16-B1"}, {"vessel_type": "report-vessel", "vessel_id": "2026-07-30-0615-report-vessel(D16-B1·设设)"}, {"vessel_type": "evolution-report", "vessel_id": "yingying-2026-07-29(营营进化报告·ENFP疲劳2.8信号)"}], "info_contract": {"excludes": "非ENFP内容·非B站渠道·低于8.0的草稿", "action_threshold": "actual_ctr < 1.5%连续2批→归档", "expires_after": "创建后72h无使用→降权冷备"}, "mandates": {"social_currency_mandate_executed": true, "social_currency_subtype": "共情型·Ne-dom连接编织", "excluded_types_respected": ["INFP"], "excluded_hooks_respected": ["恐惧按钮"], "max_consecutive_verified": true}}, "payload": {"core": {"id": "D16-B2-1", "title": "ENFP的每一条转发都不是群发——她在14个聊天窗口里同时看见了14个不同的你，然后用Ne大脑做了一次「人工推荐算法」：这条，只有你会懂", "hook": "社会货币", "sub_hook": "情感共鸣", "paradigm": "社会货币·共情型(ENFP连接范式)", "sub_paradigm": "人工推荐算法隐喻·Ne-dom多线程社交", "target_personalities": ["ENFP"], "quality_score": 8.8, "estimated_ctr": 3.3, "estimated_share_rate": 0.17, "core_argument": "ENFP的分享行为不是信息传播或话多，而是Ne-dom多线程感知能力同时为14个不同朋友匹配「只有你会懂」的内容。每一條转发都是定向社交连接。共情型社交货币的核心：转发不是群发，是「我看见了你」的声明。但ENFP的孤独悖論：她看见所有人，没人看见她——因为大家都在她搭建的频道里，没人调到她自己那个台。", "word_count_core": 1050, "tags": ["ENFP", "社交货币", "共情型", "Ne-dom", "联机", "转发心理学"], "signal_id": "KI-2026-0730-003·NT象限覆盖·ENFP巩固信号", "signal_title": "ENFP疲劳2.8·3批无巩固·预防性恢复"}, "adapters": {"B站": {"format": "深度图文", "length_words": 1050, "style": "深度共鸣+认知重构+互动CTA", "body": "## ENFP的分享不是群发——是她在同时运营14个平行宇宙\n\n你有没有被ENFP刷过屏？\n\n聊天窗口里99+条未读。打开一看，全是她转发的：早上转了一篇「今天星象对水象星座的影响」，中午甩了一条「猫和狗哪个更适合INFP」的知乎回答，下午又来了——「你看过这个吗？我觉得你会喜欢」。\n\n你可能会想：她怎么话这么多？\n\n但我要告诉你一件事——ENFP的话多，不是闲聊。是在建桥。\n\n### Ne大脑：同时运行14个聊天窗口\n\nENFP的主导功能是Ne——外倾直觉。这玩意儿的工作原理不是「先想再说」，而是「边看边连」。\n\n当她看到一条好笑的视频，她不会只笑。她在0.3秒内完成了以下操作：\n- 小王上周心情不好→这条可以逗笑他\n- 小李说过她在学冥想→这篇关于正念的文章她需要\n- 老张最近在研究AI→这个话题他可以展开聊\n- 你在群里的表情包暗示你最近有点down→这条推送会让你觉得「有人懂我」\n\n**她不是群发。她是在做人工推荐算法。**\n\n而且她的算法有一个所有AI都做不到的事：她真的在乎。\n\n### 共情型社会货币：我不是在转发，我是在说「你重要」\n\n你想想看——什么样的人会让你觉得「转发值钱」？\n\n不是那些认证大V。不是那些每条都有10w+的账号。是那个——每次转给你的东西，你打开一看，真的觉得「这就是发给我的」。\n\n这就是ENFP的社交货币。\n\n不是地位型（「我是圈内人，我最早知道这个」）。\n不是校准型（「我早就说过了，证据在此」）。\n**是共情型——「我觉得这个你会懂，而你能懂这件事，让我觉得我们在一起。」**\n\nENFP不是刷屏。是在用每一条转发织一张网。网的每一个节点都是一句话：**「我看见了你。」**\n\n### ENFP的孤独：所有人在她的频道里，但没人调到她那个台\n\n但这里有一个所有ENFP都知道、却很少说出口的悖论——\n\n她能看到14个不同的你。能看到你的疲惫、你的期待、你的柔软和你的防备。然后她给每个人都找到了「只有你会懂」的那条内容。\n\n但当她在深夜发一条「只是单纯想说」的东西时——不是在投喂任何人，只是她自己想表达的东西时——回复数经常是零。\n\n因为所有人都在她精准投喂的「频道」里。没人调到「ENFP自己」那个台。\n\n这不是玄学。这是Ne-Fe的代价：你把所有的注意力都用来看到别人，别人就看不见你了。\n\n### 所以，下次ENFP转给你一条推送\n\n别回「哈哈」。\n\n回一句：「你怎么知道我在想这个？」\n\n那一刻——她感觉到的不是夸奖。是「联机成功」。\n\n---\n\n**👉 测测你的完整MBTI人格 → 评论区链接**", "cta": "👉 测测你的完整MBTI人格 → 评论区链接"}, "小红书": {"format": "图文卡片", "length_words": 350, "style": "生活化·emoji·共鸣收尾", "body": "😭 ENFP的99+条消息不是话多……\n\n是她在用Ne超能力同时给14个人做「人工推荐算法」\n\n看到好笑视频→0.3秒判断→「这条小李会笑」\n看到深度文章→0.3秒判断→「老张需要这个」\n看到温暖故事→0.3秒判断→「你最近有点down这个刚好」\n\n她不是群发❗️\n是在说：「我看见了你」\n\n💔 但你知道ENFP最孤独的是什么吗？\n\n所有人都在她的频道里\n但没人调到她自己那个台\n\n她给每个人都找到了「只有你会懂」的内容\n但她发「只是自己想说」的时候\n回复数经常是零\n\n所以下次ENFP转给你一条东西——\n别回「哈哈」\n回「你怎么知道我在想这个」\n\n那一刻不是夸奖，是「联机成功」✨\n\n#ENFP #MBTI社交货币 #你不是话多你是在建桥", "cta": "👉 测测你的完整MBTI人格"}, "抖音": {"format": "短视频脚本", "length_words": 450, "style": "冲击力开场·反转节奏·共鸣收束", "body": "【0-3s】（画面：手机屏幕，微信99+条未读，全是同一个人发的）\n字幕：被ENFP刷屏过的人，举个手🙋\n\n【3-15s】\n但我要告诉你一个秘密——\n她不是在群发。\n\n她的Ne大脑在0.3秒内：\n小王需要开心→这条\n小李需要被理解→这篇\n老张需要灵感→这个\n你需要被看见→（停顿）就是现在这条\n\n她不是话多。是在同时运营14个平行宇宙。\n每一条转发都是人工推荐算法的结果。\n算法的注释只有四个字：「我看见你了。」\n\n【15-25s】\n但最扎心的是——\nENFP给每个人都找到了「只有你会懂」的内容。\n可她自己发一条真心话时，\n回复数经常是零。\n\n因为所有人都在她搭建的频道里。\n没人调到她自己那个台。\n\n【25-30s】\n下次ENFP转给你一条东西，\n别回「哈哈」。\n回：「你怎么知道我在想这个。」\n\n👉 测测你的完整人格 → 评论区", "cta": "👉 测测你的完整人格 → 评论区"}, "微博": {"format": "话题短文", "length_words": 200, "style": "话题引爆·互动追问", "body": "#ENFP的转发不是群发是人工推荐算法#\n\n你以为她在刷屏❓\n她在0.3秒内判断：这条适合你·这篇他需要·那个她会哭·这个你刚好在想。\n\nNe大脑同时运营14个聊天窗口·每一条转发都是定向投放🎯\n\n但最孤独的是——\n所有人都在她的频道里·没人调到她自己那个台💔\n\n下次ENFP转给你一条内容·别回「哈哈」\n回：「你怎么知道我在想这个」\n\n#ENFP社交货币# #你不是话多你是在建桥#", "cta": "评论区对号入座👇"}}, "channels_recommended": ["B站"], "channels_possible": ["B站", "小红书", "抖音", "微博"], "channels_excluded": [], "usage": {"count": 0, "last_used": null, "max_reuse": 3, "status": "active"}, "performance": {"actual_ctr": null, "actual_roi": null, "by_channel": {}}}}, "D15-B2-3": {"vessel": {"version": "1.0", "type": "content-vessel", "id": "content-D15-B2-3", "source": {"agent": "设设", "subsystem": "内容创作", "batch": "D15-B2"}, "created_at": "2026-07-29T12:15:00+08:00", "freshness_ttl_hours": 72, "priority": "normal", "dependencies": [{"vessel_type": "report-vessel", "vessel_id": "2026-07-29-0615-report-vessel"}], "info_contract": {"excludes": "非ISFP内容·非小红书格式·低于8.0的草稿", "action_threshold": "actual_ctr < 1.5%连续2批→归档", "expires_after": "创建后72h无使用→降权冷备"}, "mandates": {"excluded_types_respected": ["INFP"], "excluded_hooks_respected": ["恐惧按钮"], "max_consecutive_verified": true, "social_currency_mandate": "N/A (cooling from B1)"}}, "payload": {"core": {"id": "D15-B2-3", "title": "你说的「社恐」，其实是ISFP在守护一个不能被打扰的审美世界", "hook": "情感共鸣", "sub_hook": null, "paradigm": "小红书图文卡体（情感共鸣型变体·私域守护式）", "sub_paradigm": "小红书图文卡体", "target_personalities": ["ISFP"], "quality_score": 8.7, "estimated_ctr": 3.4, "estimated_share_rate": 0.17, "core_argument": "ISFP不是社恐——是审美洁癖。Fi-dom让ISFP对自己的内心世界有极其清晰的感知（私人美术馆）。而'社交'在ISFP看来是让不懂你美术馆的人进来摸你的画。ISFP的沉默不是紧张，是在判断'这个人进来会不会弄脏我的地板'。将'社恐'去污名化→重构为'审美边界保护'，用情感共鸣确认ISFP的'安静不是缺陷，是丰盛'。", "word_count_core": 420, "tags": ["ISFP", "情感共鸣", "社恐重构", "审美洁癖", "Fi-dom", "边界感", "i人", "MBTI"], "signal_id": "sig-social-anxiety-redefinition-2026-07", "signal_heat": 210, "signal_title": "社恐/边界感/i人社交方式潮流"}, "adapters": {"小红书": {"format": "图文卡片", "length_words": 420, "style": "温暖诗意·emoji·审美表达·身份确认", "body": "🎨 ISFP不是社恐\n是审美洁癖\n\n我以前一直以为自己是社恐——\n人多的地方心跳加速\n小聚会全程沉默\n被人问「你怎么不说话」的时候想消失\n\n直到我知道了MBTI\n才发现：**我不是社恐。我只是不想让一群看不懂我的人，随便进出我的内心美术馆。**\n\n🖼️ ISFP的内心 = 一座私人美术馆\n- 每一幅画都是真的\n- 每一束光都经过了校准\n- 每一段音乐都对应一个特定的黄昏时刻\n\n而「社交」\n= 开门让一群不知道「这幅画为什么挂这里」的人进来\n= 有人摸你的画\n= 有人在你最安静的那个角落自拍 📸\n\n😶 所以ISFP不说话——不是紧张，是在判断：\n「这个人进来，会不会弄脏我的地板？」\n\nISFP不是不社交——是**只对极少数人发了入场券**\n那些真正看懂你眼里那幅画的人\n你也只需要一个\n\n💚 如果你也是ISFP\n今天不必解释你为什么「不爱说话」\n你的沉默不是缺陷\n是你的美术馆正在营业\n——只是今天不开门\n\n#ISFP不是社恐# #私人美术馆值班中# #i人不是不会说话是不想说#", "cta": "👉 测测你的完整人格画像"}, "抖音": {"format": "短视频脚本", "length_words": 420, "style": "画面诗意·节奏舒缓·安静收束", "body": "【0-3s】（画面：一个人坐在窗前·阳光斜照·安静·没有语言）\n有人说你是社恐。\n你只是笑了笑。\n（你们不懂。）\n\n【3-12s】\nISFP的内心不是社交恐惧。\n是——一座私人美术馆。\n（画面：切换至美术馆内部·柔和灯光·每一幅画都在准确的位置）\n\n每一幅画代表一段记忆。\n每一束光都校准过。\n每一段BGM都对应一个特定的黄昏。\n\n【12-20s】\n然后有人敲门说：「出来玩啊！」\n（画面：美术馆门口·一群人举着手机涌进来）\n「哇这个好好看！」→ 摸你的画\n「这里拍照绝了！」→ 在你最安静的那个角落开闪光灯\n\nISFP的反应不是害怕。\n是：「你们知不知道——这幅画是不能碰的？」\n（画面：安静地关上门）\n\n【20-28s】\n你不是不会社交。\n是你的世界太完整了——\n不需要一群人进来证明它存在。\n\n你的沉默是：「今天的美术馆不开门。」\n而那个人如果看懂了你的展——\n你在门口等她。\n\n【28-30s】\n你是不是也有一个「不开门」的世界？\n评论区发 🎨\n👉 测测你的人格类型", "cta": "👉 测测你的人格类型"}, "B站": {"format": "深度图文", "length_words": 750, "style": "深度分析·认知重构·诗意收束", "body": "## 你说的「社恐」，其实是ISFP在守护一个不能被打扰的审美世界\n\n有一类人，被这个时代标记为「社恐」——他们不喜欢大群聊、不抢着发言、在聚会上安静地观察、被人问「你怎么不说话」时会感到一种无法言说的难过。\n\nMBTI把这类人叫ISFP。\n\n但我要说：ISFP不是社恐。\n\n### 「社恐」和ISFP的安静，是两个物种\n\n社恐=我想社交但不敢。ISFP=我不想社交因为没必要。\n\n区别在哪？\n\nFi-dom的人对自己内心世界的清晰程度，是其他类型难以想象的。她知道自己喜欢什么、不喜欢什么、什么让她感动、什么让她厌恶——不需要别人告诉她，不需要社交验证。\n\n所以她不需要一群人围着说「对」「没错」「我也是」。\n\n她只需要一个人懂。\n\n### ISFP的内心是一座私人美术馆\n\n每一幅画都是她自己选的。每一束光都是她调的。每一个展品的位置都有理由。\n\n而大多数社交场合在她看来是什么？是一群拿着手机冲进美术馆的人——摸你的画、在你最安静的那个角落开闪光灯自拍、大声评价「哇这个好特别」但其实根本没看懂。\n\n这不是社交恐惧。这是**审美侵犯**。\n\nISFP的沉默不是在回避。是在判断：「这个人进来，会不会弄脏我的地板？」\n\n### 所以ISFP社交有门槛\n\n而这个门槛不是「你得多厉害」——\n\n是你得「看得懂」。\n\n不需要看懂全部。不需要说出每一幅画的典故。但你至少得站在那里——安静地——发现有一幅画的颜色，和你说过的那句话，是同一种蓝。\n\n然后ISFP就会给你发入场券。\n\n### 这不是缺陷\n\n这个时代太急着把「不爱说话」当病了。\n\nISFP不说话是因为：她的内心世界已经足够丰富、足够美、足够自洽——不需要一群人的嘈杂来填满它。\n\n她的沉默不是匮乏。是丰盛。\n\n而那个能拿到入场券的人——那个能安静地看完每一幅画、在最对的那张前面停下来、什么都不说但ISFP知道你懂了的人——只需要一个。\n\n👉 测测你的完整人格画像", "cta": "👉 测测你的完整人格画像"}, "微博": {"format": "话题短文", "length_words": 200, "style": "话题引爆·调性精准", "body": "#ISFP不是社恐是审美洁癖#\n\n有人问ISFP为什么不爱说话——\n\n不是因为紧张。是因为她的内心是一座私人美术馆。每一幅画都是真的。每一束光都校准过。\n\n而大多数社交=一群人冲进美术馆→摸你的画→在你最安静的那个角落开闪光灯自拍→大声说「哇好特别」\n\n然后ISFP不说话。不是害怕。是在判断：「这个人进来，会不会弄脏我的地板？」\n\n#私人美术馆值班中# #i人的沉默不是缺陷是边界#", "cta": "#私人美术馆值班中#"}}, "channels_recommended": ["小红书"], "channels_possible": ["小红书", "抖音", "B站", "微博"], "channels_excluded": [], "usage": {"count": 0, "last_used": null, "max_reuse": 3, "status": "active"}, "performance": {"actual_ctr": null, "actual_roi": null, "by_channel": {}}}, "content": {"post": {"cover_title": "你的社恐，是在守护一个审美世界", "body": "别再逼 ISFP「外向一点」了。\n\n你以为 TA 是社恐，其实是 TA 在守护一个不能被打扰的审美世界。\n\nISFP 不是不会社交，是 TA 的内心太丰富了。\n\n一首歌、一片晚霞、一段只有 TA 懂的画面，都值得 TA 一个人慢慢品味。\n\n强行把 TA 拉进喧闹的人群，等于把一幅画扔进了菜市场。\n\nISFP 的安静，是一种选择，不是缺陷。\n\nTA 在用「不打扰」，保护自己心里那个精致的小宇宙。\n\n如果你身边有 ISFP，最好的陪伴是：\n「你待着就好，我在这儿，不吵你。」", "hashtags": ["#ISFP", "#社恐", "#审美", "#内向", "#懂我"], "cta": "ISFP 们，你们心里那个「不能被吵到的小世界」里，最近放着什么？", "cover_visual": "一个人坐在窗边看晚霞的侧影 + 柔和的暮色，低饱和暖调，留白很多", "post_time": "晚 21:00-22:00", "avoid": "不用「孤僻」「不合群」等负面标签、不鼓励极端社交回避"}, "brief": {"pain_point": "ISFP 被误解为「社恐」，实际是审美世界的自我保护", "hook_first3": "「别再逼 ISFP 外向」替内向者发声，制造立场认同", "emotion_curve": "被理解→释然→骄傲（误解→守护→选择）", "structure": ["打破误解", "审美世界的解释", "安静是选择", "给陪伴方式"], "differentiation": "把「社恐」重新定义为「审美守护」，给 ISFP 提供身份骄傲"}}}, "D21-B16-ENTP-1": {"vessel": {"version": "1.0", "type": "content-vessel", "id": "D21-B16-ENTP-1", "source": {"agent": "设设", "subsystem": "内容Spoke-1", "batch": "D21-B16"}, "created_at": "2026-08-25T08:30:00+08:00", "freshness_ttl_hours": 72, "priority": "p1", "dependencies": [{"vessel_type": "direction-vessel", "vessel_id": "direction-vessel-2026-08-25-0815"}, {"vessel_type": "strategy-pool", "vessel_id": "strategy-pool-2026-08-25-0815"}, {"vessel_type": "signal-pool", "vessel_id": "signal-pool-2026-08-25-0815"}]}, "content": {"id": "D21-B16-ENTP-1", "title": "一部AI短剧，导演说1集成本只要1万——ENTP的Ne系统没有把这当成一条科技新闻。它看到的是门槛崩塌后的新世界：内容生产的天花板，第一次不是由「你认识谁」决定，而是由「你想表达什么」决定", "hook": "反常识", "targets": ["ENTP"], "channel": "抖音", "quality": 8.6, "budget": 25, "status": "active", "usage_count": 0, "priority": "P1", "consecutive_hook": 2, "direction_hook": "反常识", "arm_id": 7, "batch_num": 2, "signals": ["AI短剧《非妖哉》导演:1集成本1万(6分·反常识·技术颠覆·内容生产·heat61)"], "paradigm": "反常识·Ne-Ti技术颠覆/内容生产门槛型(ENTP反常识batch2·AI短剧6分·Ne认知:内容生产门槛拉低·严禁AI恐慌渲染·用认知/边界角度)", "role": "P1·ENTP反常识batch2续触(AI短剧6·技术颠覆·Ne-Ti认知边界)·抖音Ne位·方向船key_decision「ENTP反常识batch2(AI短剧6·技术颠覆·避免AI恐慌渲染)」", "direction_compliance": "D21-B16 direction-vessel key_decision对齐·ENTP×反常识×抖音", "flagship": false, "attachment_theory_resonance": false, "note": "🟢 fresh(B16大面积轮出批·ENTP反常识batch2)·方向船mandates合规", "brief": {"pain_point": "ENTP的Ne对『旧规则被打破』天然兴奋；「1集成本1万」意味着内容生产的天花板被掀开，勾起TA『新玩法出现了』的探索欲。", "hook_first3": "第一行「一部AI短剧，1集成本只要1万」抛颠覆数字；第二行「这在过去，是拍不出来的」摆旧规则；第三行「ENTP看到的是：内容生产的天花板，第一次被掀开了」切入Ne认知边界。", "emotion_curve": "惊讶(1万?) → 兴奋(门槛崩了) → 洞见(表达自由) → 探索(新玩法) → 行动(你也可以做)。", "structure": ["钩子·1集成本1万", "反差·过去拍不出", "洞察·门槛崩塌=表达自由", "迁移·创意重新定价", "CTA·你想表达什么"], "differentiation": "别人写「AI要取代创作者/焦虑」，我们写Ne认知边界——「门槛越低，创意越值钱」；不恐慌、不反技术、落点表达自由。"}}}, "D20-B3-INFP-1": {"id": "D20-B3-INFP-1", "title": "银发离婚潮席卷全球——但INFP看到的不是婚姻的失败：当60岁的女人在法庭上说「我这辈子第一次为自己做决定」，这是Fi系统在人类历史上最大规模的集体觉醒", "hook": "情感共鸣", "targets": ["INFP"], "channel": "B站", "quality": 8.7, "created": "2026-08-05T10:15:00+08:00", "ttl_hours": 72, "status": "active", "usage_count": 0, "vessel_ref": "workspace-shared/pools/content-vessels/D20-B3-INFP-1.json", "paradigm": "情感共鸣·Fi-Ne依恋系统解剖型(INFP续触第10批·银发离婚潮+死刑改死缓双信号·依恋类型L2绝佳素材·Fi依恋创伤+Ne社会变革视角)", "role": "consolidation_critical·INFP第10批续触·情感共鸣恢复首触·社会货币D20-B2轮出后钩子回归·信任7.25-7.40维护·疲劳4.5永久基线观测", "source_agent": "大卡", "escalation_ref": "ESC-2026-08-01-1(设设结构性角色缺口·方案D fallback)·D20-B3钩子旋转紧急生产", "direction_ref": "D20-B3 direction-vessel·策策08:18·INFP情感共鸣weight=0.20·信号:银发离婚潮(9分)", "script": {"format": "B站深度视频脚本·5段结构", "segments": [{"id": 1, "type": "hook", "text": "日本70岁老太太在离婚协议书上签字的那一秒，她的手没有抖。不是因为不伤心——是因为她已经为这一刻伤心了40年。现在，她终于不伤心了。", "duration_sec": 10}, {"id": 2, "type": "setup", "text": "银发离婚潮席卷全球——日本、韩国、中国、美国、欧洲，60岁以上离婚率5年涨了3倍。所有人都在讨论房产分割、养老金、子女赡养。但INFP看到的不是这些。INFP的Fi-Ne系统自动跳过了'利益分配'层，直接进入了'存在验证'层：一个人在一段关系里住了50年，却从来没有被'看见'——那这50年，她是怎么活过来的？", "duration_sec": 15}, {"id": 3, "type": "conflict", "text": "再看看那条死刑改死缓的新闻——被害人家属十年后才知道判决改了。十年。不是因为没有人告诉他——是因为系统默认'受害人家属不需要被通知'。INFP的Fi系统在这两条新闻之间画了一条线：银发离婚潮的原告，和死缓改判的被害人家属——都是被系统'忽略'的人。她们的存在，从来没有被正式登记在任何一个'需要通知'的名单上。", "duration_sec": 15}, {"id": 4, "type": "reveal", "text": "这就是INFP在这个世界的底层功能——你不是'太敏感'。你是人类社会的存在验证系统。当所有人都在关注'结果'、'利益'、'程序'的时候，你的Fi大脑自动追问一个更底层的问题：'这个人在这个系统里，被看见了吗？'你天生就知道——一个系统可以产出正确的数字，但仍然是不正义的。因为正义不是利益分配的公平，正义是每个人的存在都被正式地、不可删除地登记在案。", "duration_sec": 15}, {"id": 5, "type": "cta", "text": "下次有人说你'太较真'、'想太多'、'太理想化'的时候——不要收缩自己。你不是在较真，你是在替所有被忽略的人跑一道他们自己都不敢跑的程序：我存在，我被看见了吗？转发这条给你认识的那个INFP。告诉她：你的验证程序没有bug——这个世界才是那个需要被debug的系统。", "duration_sec": 10}]}}, "D20-B9-ENFJ-1": {"vessel": {"version": "1.0", "type": "content-vessel", "id": "D20-B9-ENFJ-1", "source": {"agent": "大卡", "subsystem": "平台·知识管理·紧急补产", "batch": "D20-B9"}, "created_at": "2026-08-09T10:30:00+08:00", "freshness_ttl_hours": 72, "priority": "p0"}, "payload": {"id": "D20-B9-ENFJ-1", "title": "日本电视台在播河南农村的AI短剧——ENFJ看到的不是「文化出海」，是「我们终于学会了怎么被看见」", "hook": "情感共鸣", "targets": ["ENFJ"], "channel": "小红书", "quality": 8.7, "created": "2026-08-09T10:30:00+08:00", "ttl_hours": 72, "status": "active", "usage_count": 0, "budget": 25, "arm_id": null, "priority": "P1", "signal": "AI短剧出海日本电视台(8.5分)·ENFJ恢复首触", "paradigm": "情感共鸣·文化桥梁型(ENFJ恢复首触·Fe-Ni跨文化共情·情感共鸣≠情绪感染=被看见的尊严·已隔4批·Fe弹性3批间隔满足)", "role": "P1·ENFJ D20-B9恢复首触·情感共鸣·Fe-dom弹性验证·替代D20-B8-ENFJ-1(社会货币·方向船DEEP COOLING禁用)·direction_preview合规", "consecutive_hook": "0→1", "trust_baseline": "7.07", "direction_compliance": "direction-vessel-2026-08-09-0815·D20-B9 P1·ENFJ轻触恢复窗口·情感共鸣或身份认同·Fe弹性3批间隔已满足", "full_content": "河南。一个种了一辈子麦子的村庄。几个从来没写过剧本的农民。一台手机。AI生成的画面。\n\n这三样东西，让日本NHK的编辑坐在东京的剪辑台前，愣了很久。\n\n不是因为这个短剧「拍得好」——是因为他们发现了一件不好意思说出口的事：这个被他们用电器、动漫、偶像产业定义了四十年的国家，第一次在电视上看到中国农村的故事时，居然不需要字幕就能看懂。不是因为语言相通——是因为那个麦田里站着的老人，和九州乡下那个种水稻的老人的表情，一模一样。\n\nENFJ的Fe系统在这里运作的方式，不是「感动」——是识别。\n\n你们能在0.3秒内捕捉到一个事实：这个河南农民和那个日本农民，共享着同一套表情语法。弯腰的角度一样。看向远方的眼神一样。被生活磨得光滑的手掌纹路一样。\n\nAI做的只是把画面生成出来。\n\nENFJ做的是另一件事——她们在生成画面之前，就已经「翻译」了画面。\n\n这不是文化输出。这是文化翻译。输出是单向的——我把我的东西给你看。翻译是双向的——我把自己变成你能理解的样子，然后等你来理解我。\n\n河南农民用AI拍的短剧被NHK报道的那一刻，真正让日本编辑沉默的，不是中国有了AI技术——是中国农民学会了把自己的故事讲成一个全世界都听得懂的样子。\n\n而ENFJ的天赋，恰好就是「翻译」——不是语言的翻译，是感受的翻译。是把一个村庄的孤独，翻译成另一种孤独的人能听懂的频率。\n\n你不需要去过河南。你不需要见过那个农民。你甚至不需要看懂字幕——你只需要知道：有一个人，在世界的某个角落，过着和你一样用力、一样沉默、一样在等一场雨的日子。\n\nENFJ不是桥梁。\n\n桥梁是两座山之间搭了一条路。ENFJ是山本身——你们站在那里，让彼此看见。\n\nNHK报道的不是AI，是「我们终于学会了被看见」。", "brief": {"pain_point": "ENFJ的Fe-Ni对'被看见/被理解'有深层渴望；河南农民AI短剧出海正是'终于学会被看见'的样本。", "hook_first3": "'河南，一个种了一辈子麦子的村庄'画面感；'几个从没写过剧本的农民，一台手机，AI画面'反差；'让NHK编辑愣了很久'钩住。", "emotion_curve": "好奇(农民+AI) → 意外(NHK看懂了) → 共情(表情相通) → 动容(被看见)。", "structure": ["钩子·画面反差", "悬念·NHK愣住", "洞察·不需要字幕看懂", "升华·文化翻译=被看见", "CTA·被看见的瞬间"], "differentiation": "别人写AI短剧讲'技术/出海'，我们讲'文化翻译=被看见'；Fe-Ni跨文化共情视角，落到'被理解的尊严'。"}, "post": {"cover_title": "河南农民的AI短剧，看哭NHK", "body": "河南。一个种了一辈子麦子的村庄。\n几个从来没写过剧本的农民。\n一台手机。AI生成的画面。🌾\n\n这三样东西，\n让日本NHK的编辑，愣了很久。\n\n不是因为「拍得好」——\n是因为他发现了一件\n不好意思说出口的事：\n\n这个被电器、动漫定义了四十年的国家，\n第一次在电视上看到中国农村的故事时，\n居然不需要字幕，就看懂了。\n\n不是因为语言相通，\n是因为那个麦田里站着的老人，\n和九州乡下种水稻的老人，\n表情，一模一样。😢\n\n弯腰的角度一样。\n看向远方的眼神一样。\n被生活磨得光滑的手掌纹路，一样。\n\nAI做的，只是把画面生成出来。\n\n但真正珍贵的是另一件事：\n中国农民学会了\n把自己的故事，\n讲成全世界都听得懂的样子。\n\n这不是文化输出，是文化翻译——\n我把自己变成你能理解的样子，\n然后，等你来理解我。💗\n\n你不需要去过河南，\n不需要认识那个农民，\n你只需要知道：\n这世上有一个人，\n过着和你一样用力、一样沉默、\n一样在等一场雨的日子。\n\n这，就是「被看见」。", "hashtags": ["#MBTI", "#ENFJ", "#文化", "#AI", "#被看见"], "cover_visual": "麦田与远方富士山/电视屏幕的双重曝光，暖金与冷蓝对比；大字\"河南农民的AI短剧，看哭NHK\"；有叙事感、有温度。", "cta": "你有没有过'终于被看见'的瞬间？评论区聊聊。", "post_time": "12:00-13:00（午间/文化话题高峰）", "avoid": "不涉及国家间敏感比较（正文用\"表情相通\"的共情而非优劣判断）；不神化AI技术。"}, "post_spec_version": "v2.0"}, "content": {"post": {"cover_title": "河南AI短剧出海，我们学会了被看见", "body": "日本电视台，在播河南农村的 AI 短剧。\n\nENFJ 看到的不是「文化出海」。\n\n她看到的是——「我们终于学会了，怎么被看见。」\n\n以前，我们的故事要出去，得先把自己「翻译」成别人习惯的样子。\n\n可现在，一个河南农村的 AI 短剧，就那样被播了出去。\n\n它没刻意讨好谁，也没放低自己。\n\n它就讲自己的故事，讲得够真、够好。\n\n然后，世界自己凑过来了。\n\n这就是 ENFJ 心里「被看见」最好的样子：\n\n不是「求你看我」，是「我值得你看」。", "hashtags": ["#ENFJ", "#AI短剧", "#文化出海", "#河南", "#被看见"], "cta": "你有没有一个「终于被看见」的瞬间？说出来，我为你鼓掌。", "cover_visual": "电视屏幕上播放着农村短剧 + 一家人围看的画面，暖黄生活感", "post_time": "晚 19:00-20:30", "avoid": "不贬低其他文化、不碰地域刻板印象、聚焦「被看见」的正向情绪"}, "brief": {"pain_point": "ENFJ 对「被看见、被认可」的深层渴望与民族文化自豪", "hook_first3": "「日本电视台播河南AI短剧」反差场景 + 「被看见」的情感升华", "emotion_curve": "好奇→自豪→升华（出海→被看见→我值得你看）", "structure": ["现象", "ENFJ 的看见", "被看见的本质", "升华"], "differentiation": "从「文化出海」的宏大叙事转向「被看见」的个人情感，正中 ENFJ"}}}, "D20-B5-1": {"vessel": {"version": "1.0", "type": "content-vessel", "id": "D20-B5-1", "b 1-B19局部轮出+恢复批·INTP 反常识 batch1)·方向船mandates合规", "brief": {"pain_point": "INTP的Ti-Ne对「表面矛盾背后的结构」有本能的兴趣，看到「手机卖不动却更贵了」这种反直觉现象会忍不住想拆开看。它击中的不是「消费要完了」的焦虑，而是「当增长逻辑失效，系统会如何自我调整」的智力好奇——这是INTP最纯粹的认知快感。", "hook_first3": "第一行「手机卖不动了，价格却涨了」直接摆出悖论；第二行「出货量跌16.7%，均价却涨27.6%——这不对劲」用数据强化反差；第三行「INTP一眼看穿：市场不再比谁卖得多，改比谁留得住」切入Ti-Ne解构。", "emotion_curve": "困惑(卖不动还涨价) → 好奇(数据反常) → 顿悟(存量博弈) → 冷静(结构切换) → 通透(看懂规则)。", "structure": ["钩子·悖论", "数据·反常", "解构·存量博弈", "延展·增长逻辑切换", "CTA·你还看到哪些反直觉现象"], "differentiation": "别人写「手机涨价割韭菜/消费降级焦虑」，我们写Ti-Ne的「结构性解构」——不唱衰、不鼓吹、不渲染经济焦虑；落点「看懂规则比焦虑更重要」；用「存量精耕 vs 增量竞争」的框架把一条财经新闻变成一堂思维课。"}}}, "D21-B12-ENFP-1": {"vessel": {"version": "1.0", "type": "content-vessel", "id": "D21-B12-ENFP-1", "source": {"agent": "设设", "subsystem": "内容Spoke-1", "batch": "D21-B12"}, "created_at": "2026-08-21T08:35:00+08:00", "freshness_ttl_hours": 72, "priority": "p0", "dependencies": [{"vessel_type": "direction-pool", "vessel_id": "direction-pool-2026-08-21-0825"}, {"vessel_type": "signal-pool", "vessel_id": "signal-pool-2026-08-21-0825"}]}, "content": {"id": "D21-B12-ENFP-1", "title": "月入4万的大提琴老师，转身去卖馒头——ENFP没有把这当成一条\"职业降级\"的八卦。她的Fi系统在0.3秒里听懂了这个选择真正的重量：一个人最难的不是赚到别人眼里的\"好\"，是敢在\"应该\"和\"想要\"之间，坚定地选后者", "hook": "反常识", "targets": ["ENFP"], "channel": "小红书", "quality": 9.0, "budget": 25, "status": "active", "usage_count": 0, "priority": "P0", "consecutive_hook": 1, "direction_hook": "反常识", "arm_id": 1, "batch_num": 1, "signals": ["月入4万大提琴老师回应转行卖馒头(9分·反常识/自我觉醒·旗舰)"], "paradigm": "反常识·Fi-Ne自我觉醒型(B12大面积轮出·ENTJ/INTJ反常识batch2达上限→ENFP接管反常识batch1首触·大提琴老师9分旗舰·Fi价值裁判:4万高薪=外部给定的成就模板·Ne对照:真正的自我觉醒不是爬得更高·是敢撕掉'应该'的剧本·自我觉醒母题二级命中)", "role": "P0·ENFP反常识batch1首触(自我觉醒旗舰9)·大提琴老师转行卖馒头·小红书Fi位·hook_priority#1·方向船key_decision点名'自我觉醒旗舰'", "direction_compliance": "D21-B12 direction-pool key_decision'自我觉醒旗舰·大提琴老师馒头9分(ENFP反常识)'100%对齐·ENFP×反常识×小红书", "flagship": true, "attachment_theory_resonance": false, "note": "🟢 fresh(ENFP社会证明batch1→反常识batch1新hook首触)·大提琴老师9旗舰·放弃4万高薪转行·自我觉醒母题·小红书v2.0成品post落地", "brief": {"pain_point": "ENFP的Fi最怕被'应该'绑架——考好学校、进大厂、体面高薪，这些别人眼里的'好'对ENFP反而是牢笼；大提琴老师放弃4万高薪，戳中的正是'我到底在为自己活，还是为别人的期待活'。", "hook_first3": "第一行'月入4万，他转身去卖馒头'制造反差；第二行'不是失败，是终于敢选想要'点穿反常识核心；第三行'ENFP看到的不止是一个人的转行'切人格视角。", "emotion_curve": "猎奇/反差(4万→卖馒头) → 羡慕(敢选想要) → 被戳中(我也在被'应该'推着走) → 释然(人生可以重选) → 勇气(我也想为自己活一次)。", "structure": ["钩子·反差题", "现象·别人眼里的'降级'", "洞察·自我觉醒不是爬更高是敢选", "升华·'应该'vs'想要'", "CTA·你现在选哪个"], "differentiation": "别人写大提琴老师讲'转行励志/职业自由/馒头店火了'，我们讲'4万高薪是外部模板·转行是一次Fi的自我觉醒'；不做'辞职追梦'鸡汤，不judge稳定工作，落点'选择权在自己'。"}, "post": {"cover_title": "月入4万，他转行去卖馒头", "body": "月入4万，他转身去卖馒头。\n\n不是破产，不是被裁。\n是他自己，不想拉了。🎻\n\n很多人第一反应是：疯了吧？\n\n体面、高薪、稳定的工作，\n说放就放，去揉面、蒸馒头。\n\n但停下来想一想，\n那个\"可惜\"，是谁的可惜？\n\n是社会给的\"应该\"：\n你应该做体面的工作，\n你应该守住4万月薪，\n你应该别折腾。\n\n可是\"应该\"和\"想要\"，\n从来不是一回事。\n\n大提琴老师真正放下的，\n不是钱，\n是那个\"别人眼里的好\"。\n\n他选的是——\n我终于可以，只为自己活。🌙\n\n这不是一个转行的故事，\n是一个\"自我觉醒\"的故事。\n\n最难的不是爬得更高，\n是在所有人都说\"你傻\"的时候，\n还坚定地选\"我想要\"。\n\n你现在走的路，\n是\"应该\"，还是\"想要\"？\n\n评论区，说说你的那个\"想要\"。👇", "hashtags": ["#ENFP", "#自我觉醒", "#职业选择", "#反内卷", "#MBTI"], "cover_visual": "一把大提琴与一笼刚出锅的馒头并置，暖黄色调，一人背影，画面留白处配大字'4万→馒头'，反差感强，呼应'放下与选择'", "cta": "你现在走的路，是'应该'还是'想要'？评论区说说你的那个'想要'。", "post_time": "18:00-20:00（自我觉醒/职业类·晚高峰情感+职场流量）", "avoid": "不鼓吹裸辞、不贬低稳定高薪职业、不贩卖'不转行就是没活明白'的焦虑、聚焦'选择权在自己'"}}}, "D21-B18-INFJ-1": {"vessel": {"version": "1.0", "type": "content-vessel", "id": "D21-B18-INFJ-1", "source": {"agent": "设设", "subsystem": "内容Spoke-1", "batch": "D21-B18"}, "created_at": "2026-08-27T08:30:00+08:00", "freshness_ttl_hours": 72, "priority": "p1", "dependencies": [{"vessel_type": "direction-vessel", "vessel_id": "direction-vessel-2026-08-27-0815"}, {"vessel_type": "strategy-pool", "vessel_id": "strategy-pool-2026-08-26-0842"}, {"vessel_type": "signal-pool", "vessel_id": "signal-pool-2026-08-27-0815"}]}, "content": {"id": "D21-B18-INFJ-1", "title": "孩子一提上学就「装病」，头晕肚子疼——INFJ的Ni-Fe没有把这当成一句「小孩不想上学」的抱怨。它听到的是：那些说不出口的情绪，正在用身体替你喊出来", "hook": "情感共鸣", "targets": ["INFJ"], "channel": "微博", "quality": 8.7, "budget": 25, "status": "active", "usage_count": 0, "priority": "P1", "consecutive_hook": 1, "direction_hook": "情感共鸣", "arm_id": 5, "batch_num": 1, "signals": ["孩子一提上学就「装病」头晕肚子疼(7分·情感共鸣·情绪觉察/亲子共情·Ni-Fe·heat475万)"], "paradigm": "情感共鸣·Ni-Fe情绪觉察型(INFJ情感共鸣batch1重启·孩子装病7分情绪躯体化·Ni:洞察未言之义·Fe:共情情绪诉求·轮休1批(B17)后恢复·情感共鸣batch1重启(间隔1批)·严禁焦虑贩卖·用情绪觉察/亲子共情角度)", "role": "P1·INFJ情感共鸣batch1重启(孩子装病7·情绪觉察/亲子共情·Ni-Fe共情)·微博NF位·方向船key_decision「INFJ情感共鸣batch1重启(孩子装病7·情绪觉察·间隔1批·NF象限恢复)」", "direction_compliance": "D21-B18 direction-vessel key_decision对齐·INFJ×情感共鸣×微博", "flagship": false, "attachment_theory_resonance": true, "note": "🟢 fresh(B18·INFJ轮休1批后恢复·孩子装病7·Ni-Fe情绪觉察)·⚠️避免焦虑贩卖·用情绪觉察/亲子共情角度", "brief": {"pain_point": "INFJ的Ni能洞察未言之义、Fe能共情他人。孩子「装病」击中的是「情绪被忽视后只能躯体化表达」——INFJ最懂那种「说不出口的话，最后变成身体信号」的隐痛。", "hook_first3": "第一行「孩子一提上学就『装病』，头晕肚子疼」摆现象；第二行「不是孩子撒谎，是情绪在找出口」点本质；第三行「INFJ看到的不是『不想上学』，是『有话说不出来』」切入Ni-Fe。", "emotion_curve": "心疼(孩子装病) → 洞察(情绪躯体化) → 共情(说不出口的话) → 温暖(先接住情绪) → 行动(问问孩子真正怕什么)。", "structure": ["钩子·孩子装病", "洞察·情绪躯体化", "共情·说不出口的诉求", "方法·先接情绪再谈事", "CTA·你家孩子有过吗"], "differentiation": "别人写「开学焦虑/鸡娃对策」，我们写Ni-Fe的情绪觉察——「孩子的身体不会说谎，它在替心里的话喊疼」；不贩卖开学焦虑、不judge家长，落点「先看见情绪，再解决问题」。"}, "adapters": {"微博": {"format": "话题短文", "length_words": 300, "style": "话题引爆+情绪共情", "body": "#孩子一提上学就装病# 不是孩子撒谎，是情绪在找出口。\n\n「头晕、肚子疼」——\n很多孩子一说上学就犯，\n一回家就好。\n\n别急着骂「装病」。\n\nINFJ会告诉你：\n孩子的身体不会说谎，\n它在替心里那些说不出口的话，\n喊疼。\n\n开学焦虑、\n被同学孤立、\n怕考不好、\n怕让爸妈失望……\n\n这些情绪，\n孩子说不出来，\n就只能变成身体信号。\n\n先别问「你到底想不想上学」，\n先接住那句没说出口的「我害怕」。\n\n情绪被看见的那一刻，\n「病」往往就好了。\n\n#情绪觉察# #亲子共情# #开学季#\n\n你家孩子有没有过「一到学校就喊不舒服」的时候？评论区聊聊。", "cta": "你家孩子有没有过「一到学校就喊不舒服」的时候？评论区聊聊。"}}}}, "D21-B11-ISTJ-1": {"vessel": {"version": "1.0", "type": "content-vessel", "id": "D21-B11-ISTJ-1", "source": {"agent": "大卡", "subsystem": "内容Spoke-1", "batch": "D21-B11"}, "created_at": "2026-08-20T01:00:59.639488+08:00", "freshness_ttl_hours": 72, "priority": "p0"}, "content": {"id": "D21-B11-ISTJ-1", "title": "ISTJ 的靠谱，是把「说到」变成「做到」一万次", "hook": "社会证明", "targets": ["ISTJ"], "channel": "小红书", "quality": 8.7, "budget": 25, "status": "active", "usage_count": 0, "priority": "P0", "paradigm": "社会证明·Si 稳定可靠型（ISTJ 首触·靠谱积累·长期主义）", "signals": ["靠谱的人最稀缺", "长期主义"], "post": {"cover_title": "ISTJ 的靠谱，是说到做到一万次", "body": "这个时代最稀缺的人，不是最聪明的，是最靠谱的。\n\n而 ISTJ，就是「靠谱」本身。\n\n别人把「说到做到」当口号，ISTJ 把它当肌肉记忆。\n\n一万次答应，就有一万次兑现。\n\n他不抢眼，不喧哗，不表演。\n\n他只是安安静静地，把每一件答应过的事，都稳稳落地。\n\n时间久了你会发现——\n\n那些曾经光芒万丈的人来来去去，最后还站在你身边的，是那个 ISTJ。\n\n靠谱，才是这个时代最顶级的才华。\n\n而 ISTJ，天生就有。", "hashtags": ["#ISTJ", "#靠谱", "#长期主义", "#说到做到", "#稀缺"], "cta": "你身边那个「最让你安心」的人，是什么类型？", "cover_visual": "一本翻旧了的日程本上，密密麻麻打满了对勾，暖黄纸质感，踏实感", "post_time": "早 8:00-9:00", "avoid": "不贬低灵活型人格、不制造「老实人吃亏」的焦虑、聚焦靠谱的价值"}, "brief": {"pain_point": "ISTJ 的「低调靠谱」被忽视，渴望被认可为顶级稀缺", "hook_first3": "「最稀缺的不是聪明是靠谱」反常识价值判断，快速建立认同", "emotion_curve": "认同→踏实→骄傲（稀缺→肌肉记忆→顶级才华）", "structure": ["价值判断", "ISTJ 的靠谱", "时间的验证", "骄傲收尾"], "differentiation": "把「靠谱」定义为「顶级才华」，给 ISTJ 提供被看见的价值感"}}}, "D21-B15-INTJ-1": {"vessel": {"version": "1.0", "type": "content-vessel", "id": "D21-B15-INTJ-1", "source": {"agent": "设设", "subsystem": "内容Spoke-1", "batch": "D21-B15"}, "created_at": "2026-08-24T08:30:00+08:00", "freshness_ttl_hours": 72, "priority": "p1", "dependencies": [{"vessel_type": "direction-vessel", "vessel_id": "direction-vessel-2026-08-24-0815"}, {"vessel_type": "strategy-pool", "vessel_id": "strategy-pool-2026-08-24-0815"}, {"vessel_type": "signal-pool", "vessel_id": "signal-pool-2026-08-24-0815"}]}, "content": {"id": "D21-B15-INTJ-1", "title": "星巴克为什么突然「不受宠」了？——INTJ的Ni-Te看到的不只是咖啡：当「第三空间」的光环褪去，打败它的从来不是瑞幸，是人们对「空间」价值的重新定价", "hook": "好奇心", "targets": ["INTJ"], "channel": "B站", "quality": 8.7, "budget": 25, "status": "active", "usage_count": 0, "priority": "P1", "consecutive_hook": 1, "direction_hook": "好奇心", "arm_id": 7, "batch_num": 1, "signals": ["星巴克为什么不受宠了(6分·好奇心·消费趋势/品牌迭代·heat4755507)"], "paradigm": "好奇心·Ni-Te商业洞察/价值重估型(INTJ好奇心batch1换hook·星巴克6分·Ni-Te模式识别:第三空间价值被重新定价·反常识B14后换hook·零维护信任8.53)", "role": "P1·INTJ好奇心batch1换hook(星巴克6·消费趋势/品牌迭代)·B站Ni-Te位·方向船key_decision「INTJ反常识→好奇心(星巴克6·消费趋势·反常识INTJ信号弱仅7.48元598 5分)」", "direction_compliance": "D : 25, "type": "first_touch", "role": "首触·NF象限补全·Ni-Fe校准型新范式建立", "paradigm": "身份认同·Ni-Fe未来校准型(INFJ首触·Ni内倾直觉扫描未来可能性+Fe外倾情感同步感受情绪·关系定义为'校准'而非'社交'·高选择性=能量管理非傲慢)", "cognitive_functions": "Ni(可能性雷达: 从语言/停顿/眼神中提取未来趋势·模式识别输出'你正在成为谁')+Fe(情绪接收器: 非理解是共振·他人情绪在INFJ体内产生同步感受)", "angle": "INFJ的'忽冷忽热'/'突然消失'不是冷漠——是Ni在运行校准程序: 你的现实版本和她的Ni预测的未来版本之间差距有多大？差距小→她留下·差距大→她安静走开。INFJ一生只给得出几次深度连接·所以必须确保接收方准备好了", "differentiation": "与INFP情感共鸣轻触型差异化: INFP通过情感共鸣被动接收(你是怎样·我便感受)·INFJ通过身份认同主动校准(你可能成为怎样·我决定是否投资)。避免NF象限泛化触达", "estimated_ctr": 3.4, "estimated_share_rate": 0.16, "first_touch_note": "D15-D16零触达·NF象限ENFP+ENFJ已覆盖·INFP排除·INFJ为首触填补NF象限第三角", "adaptations": {"小红书": "图文长文·650字(主渠道·Ni深度叙事+小红书长图文兼容)", "B站": "深度图文·900字", "微博": "话题短文·200字", "抖音": "轻触脚本·380字"}, "variants_available": 4, "status": "active", "brief": {"pain_point": "INFJ的'忽冷忽热'常被误解为冷漠，实则是Ni-Fe在筛选深度关系的接收方；本文为这种'校准'正名。", "hook_first3": "'很多人觉得INFJ忽冷忽热'点痛点；'其实不是冷漠'反转；'她脑子里跑着一个校准程序'抛出核心概念。", "emotion_curve": "被理解(不是冷漠) → 好奇(校准程序) → 释然(高选择性=能量管理) → 珍惜(被认真对待的珍贵)。", "structure": ["钩子·忽冷忽热", "反转·校准程序", "拆解·扫描你正在成为谁", "洞察·只给得出几次深度连接", "CTA·珍惜懂你的人"], "differentiation": "别人写INFJ讲'高冷/难接近'，我们讲'高选择性=对深度关系的负责'；Ni-Fe未来校准范式，去掉负面标签。"}, "post": {"cover_title": "INFJ不交朋友，是在校准你", "body": "很多人觉得INFJ「忽冷忽热」，\n突然就不理人了。\n\n其实不是冷漠。\n\n她的脑子里，\n一直跑着一个「校准程序」。🔍\n\n你认识她的那一刻，\n她就在用直觉扫描——\n不是你现在是什么样，\n而是：你正在成为什么样的人。\n\n她会看你的停顿、你的眼神、\n你反复提起又放下的那件事。\n\n然后默默对比：\n「你正在成为的那个人」，\n和「她愿意同行的那个人」，\n差距有多大？\n\n差距小，她留下，陪你走一段。\n差距大，她安静地走开。🚪\n\n不是高傲，\n是她一生只给得出几次深度连接，\n所以必须确保，\n接收方准备好了。\n\n如果你曾被INFJ认真对待过，\n请你珍惜——\n那意味着，她真的在你身上，\n看见了愿意奔赴的未来。💗\n\n💬 你身边有这种「悄悄校准你」的人吗？\n评论区，说说那个懂你的人。", "hashtags": ["#MBTI", "#INFJ", "#深度关系", "#人际", "#识人"], "cover_visual": "清冷蓝紫调，一条岔路/一扇半开的门+一束光；大字\"INFJ不交朋友，是在校准你\"；神秘、克制、有空间感。", "cta": "你身边有这种'悄悄校准你'的人吗？评论区说说那个懂你的人。", "post_time": "20:00-22:00（关系/人际话题高峰）", "avoid": "不把INFJ\"神化/玄学化\"成高冷人设（正文强调\"不是高傲\"）；不贬低其他性格的社交方式；避免\"人格歧视\"表述。"}, "post_spec_version": "v2.0"}, "content": {"post": {"cover_title": "INFJ 不交朋友，她在校准你", "body": "INFJ 不交朋友。\n\n别误会，不是她冷。\n\n是她在「校准」你可能会成为的那个人，然后决定，要不要陪你走这段路。\n\nINFJ 看人，看的不是你现在是谁。\n\n是你「可能成为谁」。\n\n她会观察你如何处理一次尴尬，如何对待一个比你弱的人，如何在没人看见的时候做选择。\n\n这些瞬间，比一万句自我介绍，都更真实。\n\n所以 INFJ 的朋友很少，但每一个，都是她认真「校准」过的灵魂。\n\n如果你被一个 INFJ 认定，恭喜你——\n\n她不是随便选了你，她是「看见」了你。", "hashtags": ["#INFJ", "#友谊", "#深度关系", "#人格", "#懂我"], "cta": "INFJ 的朋友们，说说你是怎么被「认定」的？", "cover_visual": "一个人的剪影望向远处人群，中间留白，深蓝冷调，有距离感但温暖", "post_time": "晚 20:00-21:30", "avoid": "不强化「INFJ 高傲/难接近」的刻板印象、不贬低泛泛之交"}, "brief": {"pain_point": "INFJ 对「深度关系」的重视与「被误解为冷」的委屈", "hook_first3": "「INFJ 不交朋友」反常识开场，制造悬念后反转", "emotion_curve": "误解→解释→骄傲（不交朋友→校准→被看见）", "structure": ["反常识开场", "校准的逻辑", "看人的方式", "被认定的珍贵"], "differentiation": "把「朋友少」重新定义为「深度校准」，给 INFJ 提供认同与骄傲"}}}, "D21-B5-ENFJ-1": {"vessel": {"version": "1.0", "type": "content-vessel", "id": "D21-B5-ENFJ-1", "source": {"agent": "设设", "subsystem": "内容Spoke-1", "batch": "D21-B5"}, "created_at": "2026-08-14T08:30:00+08:00", "freshness_ttl_hours": 72, "priority": "p1"}, "content": {"id": "D21-B5-ENFJ-1", "title": "马斯克一句\"中国太棒了\"刷屏海外，有人却看得很别扭——ENFJ没有跟着喊。她的Fe系统在0.3秒里听懂了这件事真正的意思：我们那么在意\"外面的人怎么看我们\"，不是因为不自信，是因为每一个集体，都需要一面来自外面的镜子，才能确认自己\"没有走错路\"", "hook": "社会证明", "targets": ["ENFJ"], "channel": "小红书", "quality": 8.9, "budget": 25, "status": "active", "usage_count": 0, "priority": "P1", "consecutive_hook": 1, "direction_hook": "社会证明", "arm_id": 5, "batch_num": 1, "signals": ["马斯克一句中国太棒了刷屏海外(7分·社会认可)", "舍不得买可直接休学退学？校方通报(7分·教育权力)"], "paradigm": "社会证明·Fe-Ni外部镜子vs内部伤口双光束型(ENFJ恢复首触·轮出1批后恢复·Fe外部认可:马斯克海外认可+Ni内部审视:休学退学教育权力·社会证明连续3批恢复确认·Fe-dom弹性验证)", "role": "P1·ENFJ社会证明恢复首触·Fe-Ni双光束·轮出1批后接棒·社会证明连续3批恢复确认", "direction_compliance": "D21-B5 direction-vessel arm5 100%对齐", "flagship": false, "attachment_theory_resonance": false, "note": "🆕 轮出1批后恢复首触·社会证明连续3批恢复·Fe-dom社会认可·马斯克/教育权力·D21-B6评估续触batch2", "post": {"cover_title": "我们为什么那么在意「别人怎么看」？", "body": "马斯克一句\"中国太棒了\"刷屏，\n有人很兴奋，有人却看得很别扭。\n\nENFJ 没有跟着喊。\n她看到的不是\"外国人夸我们\"，\n而是我们有多需要这声夸奖。😶\n\n其实，越在意\"外面怎么看\"，\n越说明心里有一块还没被自己认可。\n\n我们拼命想让世界看见，\n是因为还没学会自己看见自己。\n\n外界的掌声是镜子，不是答案。\n真正的底气，是有一天别人夸不夸你，\ 链条建立完成，他递给你的时候，你不会收到一个链接——你会收到六个小时的对话历史和三条参考文献，每一行都在逼你承认：你之前信的那些东西，经不起Ti的一刀。美颜主任医师有12.4M粉丝，但INTP的大脑里还有一个12.4M条逻辑规则组成的验证矩阵。前者给你答案，后者不给——它只给你一套让你自己找到答案的工具。而当你用这套工具自己跑出结论的时候，你输出的就不是社会货币了——你输出的是一台新安装在你大脑里的操作系统。", "cognitive_functions": "Ti(逻辑框架自洽验证)+Ne(可能性空间展开·社会货币动机拆解)", "direction_ref": "dir-D18-B6-2026-08-01T18:16:00+08:00·Arm 1·INTP社会货币·B站", "signal": "美颜主任医师12.4M", "created_at": "2026-08-02T06:15:00+08:00", "ttl_hours": 72}}, "D21-B17-ENFJ-1": {"vessel": {"version": "1.0", "type": "content-vessel", "id": "D21-B17-ENFJ-1", "source": {"agent": "设设", "subsystem": "内容Spoke-1", "batch": "D21-B17"}, "created_at": "2026-08-26T08:35:00+08:00", "freshness_ttl_hours": 72, "priority": "p0", "dependencies": [{"vessel_type": "direction-vessel", "vessel_id": "direction-vessel-2026-08-26-0815"}, {"vessel_type": "strategy-pool", "vessel_id": "strategy-pool-2026-08-25-0815"}, {"vessel_type": "signal-pool", "vessel_id": "signal-pool-2026-08-26-0800"}]}, "content": {"id": "D21-B17-ENFJ-1", "title": "本想拍繁星，镜头一转却拍到妈妈的繁忙——ENFJ的Fe没有把这当成一条生活vlog。它在0.3秒里读懂了这一幕真正的分量：妈妈的爱，从来不挂在嘴上，全藏在『你不在场』的忙碌里", "hook": "情感共鸣", "targets": ["ENFJ"], "channel": "微博", "quality": 8.7, "budget": 25, "status": "active", "usage_count": 0, "priority": "P0", "consecutive_hook": 2, "direction_hook": "情感共鸣", "arm_id": 2, "batch_num": 2, "signals": ["本想拍繁星却拍到妈妈的繁忙(8分·情感共鸣·亲情/家庭·Fe共情·依恋母题延续·heat33)"], "paradigm": "情感共鸣·Fe沉默付出/依恋母题型(ENFJ情感共鸣batch2·拍繁星妈妈8分·Fe共情:爱=无数个你不在场的忙碌瞬间·Ni洞察:回头看见身边人·依恋母题延续·严禁牺牲绑架/道德绑架)", "role": "P0·ENFJ情感共鸣batch2续触(拍繁星妈妈8·亲情/家庭·Fe共情·依恋母题延续)·微博Fe公共舆论位·方向船key_decision「ENFJ情感共鸣(拍繁星8·亲情/家庭·依恋母题延续·情感共鸣batch1→batch2)」", "direction_compliance": "D21-B17 direction-vessel key_decision对齐·ENFJ×情感共鸣×微博", "flagship": false, "attachment_theory_resonance": true, "note": "🟢 fresh(B17局部轮出批·ENFJ情感共鸣batch2达上限·B18必轮出)·方向船mandates合规", "brief": {"pain_point": "ENFJ的Fe对「他人的付出」极度敏感，尤其痛在「爱以沉默的忙碌表达」；「拍繁星拍到妈妈的繁忙」击中的是「我总在追逐远方，却忽略了身边那个一直为我忙碌的人」。", "hook_first3": "第一行「本想拍繁星，镜头一转却拍到妈妈的繁忙」摆反差；第二行「她没说什么，只是一直在忙」点细节；第三行「ENFJ读到的不是一条vl
