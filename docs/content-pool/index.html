let ALL = [];
let POOL = null;

function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function fmtDate(s){if(!s)return '—';const d=new Date(s);if(isNaN(d))return s;return d.toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})}
function qClass(q){if(q==null||q===0)return'zero';if(q>=8.8)return'hi';if(q>=8)return'mid';return'lo'}
function qLabel(q){return (q==null||q===0)?'—':q}

function statusBadge(s){
  if(s==='active')return'<span class="badge active">● active</span>';
  if(s==='deployed')return'<span class="badge deployed">● deployed</span>';
  if(s==='hook_conflict')return'<span class="badge conflict">● hook_conflict</span>';
  return'<span class="badge">'+esc(s)+'</span>';
}

function load(){
  Promise.resolve(__DATA__).then(d=>{
    if(d.error){document.getElementById('banner').innerHTML='<div class="banner">⚠️ '+esc(d.error)+'<br>'+esc(d.path||'')+'</div>';return}
    POOL = d.pool_status||{};
    ALL = d.items||[];
    renderStats(d);
    fillFilters();
    render();
  }).catch(e=>{
    document.getElementById('banner').innerHTML='<div class="banner">⚠️ 加载失败：'+esc(e.message)+'</div>';
  });
}

function renderStats(d){
  const ps = POOL;
  const total = d.total||0;
  document.getElementById('dirs-count').textContent = '('+total+' 条)';
  const active = (d.items||[]).filter(i=>i.status==='active').length;
  const deployed = (d.items||[]).filter(i=>i.status==='deployed').length;
  const conflict = (d.items||[]).filter(i=>i.status==='hook_conflict').length;
  const lvl = ps.level ?? total;
  const cap = ps.max_capacity_soft ?? '—';
  const lvlCls = (typeof lvl==='number' && typeof cap==='number' && lvl>cap)?'crit':(typeof lvl==='number'&&lvl<5?'warn':'ok');
  document.getElementById('stats').innerHTML = `
    <div class="stat ${lvlCls}"><div class="val">${lvl}</div><div class="lbl">池水位（软上限 ${cap}）</div></div>
    <div class="stat"><div class="val">${total}</div><div class="lbl">总条目</div></div>
    <div class="stat ok"><div class="val">${active}</div><div class="lbl">active</div></div>
    <div class="stat"><div class="val">${deployed}</div><div class="lbl">deployed</div></div>
    <div class="stat warn"><div class="val">${conflict}</div><div class="lbl">hook_conflict</div></div>
    <div class="stat"><div class="val">${esc(ps.last_creation_batch||'—')}</div><div class="lbl">最新批次</div></div>
    <div class="stat"><div class="val" style="font-size:13px">${fmtDate(ps.last_creation)}</div><div class="lbl">最近创建</div></div>
    <div class="stat"><div class="val" style="font-size:13px">${fmtDate(ps.last_deployment)}</div><div class="lbl">最近部署</div></div>
  `;
  const statusTxt = ps.status ? ' · '+esc(ps.status) : '';
  document.getElementById('live-info').textContent = '池 '+lvl+' 条'+statusTxt;
  const b = document.getElementById('banner');
  if(ps.warning){
    b.innerHTML = '<div class="banner">⚠️ '+esc(ps.warning)+'</div>';
  } else {
    b.innerHTML = '';
  }
}

function fillFilters(){
  const hooks=new Set(), chans=new Set(), targets=new Set(), statuses=new Set();
  ALL.forEach(i=>{
    if(i.hook)hooks.add(i.hook);
    if(i.channel)chans.add(i.channel);
    if(i.status)statuses.add(i.status);
    (i.targets||[]).forEach(t=>{if(t)targets.add(t)});
  });
  const hookSel=document.getElementById('f-hook'), chSel=document.getElementById('f-channel'), tSel=document.getElementById('f-target'), sSel=document.getElementById('f-status');
  [...hooks].sort().forEach(h=>hookSel.insertAdjacentHTML('beforeend','<option>'+esc(h)+'</option>'));
  [...chans].sort().forEach(c=>chSel.insertAdjacentHTML('beforeend','<option>'+esc(c)+'</option>'));
  [...targets].sort().forEach(t=>tSel.insertAdjacentHTML('beforeend','<option>'+esc(t)+'</option>'));
  const sMap={active:'active',deployed:'deployed',hook_conflict:'hook_conflict'};
  Object.values(sMap).forEach(s=>sSel.insertAdjacentHTML('beforeend','<option value="'+s+'">'+s+'</option>'));
}

function filtered(){
  const hook=document.getElementById('f-hook').value;
  const chan=document.getElementById('f-channel').value;
  const target=document.getElementById('f-target').value;
  const status=document.getElementById('f-status').value;
  const quality=document.getElementById('f-quality').value;
  const search=document.getElementById('f-search').value.trim().toLowerCase();
  return ALL.filter(i=>{
    if(hook && i.hook!==hook)return false;
    if(chan && i.channel!==chan)return false;
    if(target && !(i.targets||[]).includes(target))return false;
    if(status && i.status!==status)return false;
    if(quality){
      const q=i.quality||0;
      if(quality==='hi'&&q<8.8)return false;
      if(quality==='mid'&&(q<8||q>=8.8))return false;
      if(quality==='lo'&&(q>=8||q===0))return false;
      if(quality==='zero'&&q!==0)return false;
    }
    if(search){
      const hay=(i.id+' '+i.title+' '+(i.paradigm||'')+' '+(i.role||'')).toLowerCase();
      if(!hay.includes(search))return false;
    }
    return true;
  });
}

function render(){
  const list=filtered();
  const grid=document.getElementById('grid');
  document.getElementById('count').textContent = list.length+' / '+ALL.length+' 条';
  document.getElementById('empty').style.display = list.length?'none':'block';
  if(!list.length){grid.innerHTML='';return}
  grid.innerHTML = list.map(i=>{
    const targets=(i.targets||[]).map(t=>'<span class="badge target">'+esc(t)+'</span>').join('');
    const extra = i.hook? '<span class="badge hook">'+esc(i.hook)+'</span>' : '';
    const hasPost = i.has_post? '<span class="badge post">🍠 成品</span>' : '';
    const chan = i.channel? '<span class="badge channel">'+esc(i.channel)+'</span>' : '';
    return `<div class="card" onclick="openModal('${esc(i.id)}')">
      <div class="cid">${esc(i.id)}${i.batch?' · '+esc(i.batch):''}${i.producer?' · '+esc(i.producer):''}</div>
      <div class="title">${esc(i.title)}</div>
      <div class="badges">${statusBadge(i.status)}${hasPost}${extra}${chan}${targets}</div>
      <div class="meta">
        <span>质量 <b class="q ${qClass(i.quality)}">${qLabel(i.quality)}</b></span>
        ${i.ttl_hours!=null?'<span>TTL <b>'+esc(i.ttl_hours)+'h</b></span>':''}
        ${i.budget!=null?'<span>预算 <b>¥'+esc(i.budget)+'</b></span>':''}
        ${i.usage_count!=null?'<span>使用 <b>'+esc(i.usage_count)+'</b></span>':''}
        ${i.created?'<span>创建 <b>'+fmtDate(i.created)+'</b></span>':''}
      </div>
    </div>`;
  }).join('');
}

function openModal(id){
  document.getElementById('modal-bg').classList.add('open');
  document.getElementById('m-title').textContent = id;
  document.getElementById('m-badges').innerHTML = '';
  document.getElementById('m-body').innerHTML = '<div class="field"><div class="k">加载详情…</div></div>';
  Promise.resolve((__DATA__.vessels||{})[id]||{error:'vessel 不存在',id:id}).then(d=>{
    if(d.error){document.getElementById('m-body').innerHTML='<div class="field"><div class="v">⚠️ '+esc(d.error)+'</div></div>';return}
    const c = d.content||{};

    document.getElementById('m-title').textContent = c.title||id;
    document.getElementById('m-badges').innerHTML =
      (c.hook?'<span class="badge hook">'+esc(c.hook)+'</span>':'')+

      '<span class="badge">'+statusBadge(c.status||'')+'</span>'+
      (c.quality!=null?'<span class="badge">质量 '+esc(c.quality)+'</span>':'')+

    const rows=[];
    if(c.post){
      const p=c.post;
      if(p.cover_title)rows.push(['🍠 封面标题',p.cover_title]);
      if(p.body)rows.push(['🍠 正文（可直接发布）',p.body]);
      if(p.hashtags&&p.hashtags.length)rows.push(['🍠 话题标签',p.hashtags.join(' ')]);
      if(p.cta)rows.push(['🍠 互动引导 CTA',p.cta]);
      if(p.cover_visual)rows.push(['🍠 配图方向',p.cover_visual]);
      if(p.post_time)rows.push(['🍠 发布时间',p.post_time]);
      if(p.avoid)rows.push(['🍠 违禁规避',p.avoid]);
    }
    if(c.brief){
      const b=c.brief;
      if(b.pain_point)rows.push(['📝 痛点',b.pain_point]);
      if(b.hook_first3)rows.push(['📝 开头抓法',b.hook_first3]);
      if(b.emotion_curve)rows.push(['📝 情绪曲线',b.emotion_curve]);
      if(b.structure)rows.push(['📝 分段框架',Array.isArray(b.structure)?b.structure.join(' → '):b.structure]);
      if(b.differentiation)rows.push(['📝 差异化角度',b.differentiation]);
    }
    if(c.paradigm)rows.push(['创作范式 / 理由',c.paradigm]);
    if(c.role)rows.push(['角色定位',c.role]);
    if(c.signals&&c.signals.length)rows.push(['创作依据信号',c.signals.join('\n')]);
    if(c.direction_compliance)rows.push(['方向对齐',c.direction_compliance]);
    if(c.note)rows.push(['备注',c.note]);
    if(v.source)rows.push(['来源',(v.source.agent||'')+' · '+(v.source.subsystem||'')+' · '+(v.source.batch||'')]);
    if(v.created_at||c.created)rows.push(['创建时间',v.created_at||c.created]);
    if(c.flagship!=null)rows.push(['旗舰内容',c.flagship?'是':'否']);
    if(c.attachment_theory_resonance!=null)rows.push(['依恋母题',c.attachment_theory_resonance?'是':'否']);
    if(!rows.length)rows.push(['详情','（无额外字段）']);
    document.getElementById('m-body').innerHTML = rows.map(r=>'<div class="field"><div class="k">'+esc(r[0])+'</div><div class="v">'+esc(r[1])+'</div></div>').join('');
  }).catch(e=>{
    document.getElementById('m-body').innerHTML='<div class="field"><div class="v">⚠️ '+esc(e.message)+'</div></div>';
  });

    grid.innerHTML = posts.map(c=>{
      const p = c.post||{};
      const b = c.brief||{};
      const body = esc(p.body||'').replace(/\n/g,'<br>');
      const tags = (p.hashtags||[]).map(t=>'<span class="tag">#'+esc(String(t).replace(/^#/,''))+'</span>').join('');
      const metaBits = [c.hook, (c.targets||[]).join(','), c.quality!=null?'质量'+c.quality:'', c.status].filter(x=>x!==''&&x!=null&&x!==undefined);
      return `<div class="post">
        <div class="xhs-cover">
          <div class="xhs-cover-title">${esc(p.cover_title||c.title||c.id)}</div>
          <div class="xhs-meta">${metaBits.map(m=>esc(m)).join(' · ')}</div>
        </div>
        <div class="xhs-body">${body}</div>
        ${tags?'<div class="xhs-tags">'+tags+'</div>':''}
        ${p.cta?'<div class="xhs-cta">💬 '+esc(p.cta)+'</div>':''}
        <details class="xhs-extra"><summary>配图 / 时间 / 规避 / 创作指引</summary>
          <div class="xhs-extra-body">
            ${p.cover_visual?'<p><b>配图方向：</b>'+esc(p.cover_visual)+'</p>':''}
            ${p.post_time?'<p><b>发布时间：</b>'+esc(p.post_time)+'</p>':''}
            ${p.avoid?'<p><b>违禁规避：</b>'+esc(p.avoid)+'</p>':''}
            ${(b.pain_point||b.hook_first3||b.emotion_curve||b.structure||b.differentiation)?'<hr>':''}
            ${b.pain_point?'<p><b>痛点：</b>'+esc(b.pain_point)+'</p>':''}
            ${b.hook_first3?'<p><b>开头抓法：</b>'+esc(b.hook_first3)+'</p>':''}
            ${b.emotion_curve?'<p><b>情绪曲线：</b>'+esc(b.emotion_curve)+'</p>':''}
            ${b.structure?'<p><b>分段框架：</b>'+esc(Array.isArray(b.structure)?b.structure.join(' → '):b.structure)+'</p>':''}
            ${b.differentiation?'<p><b>差异化：</b>'+esc(b.differentiation)+'</p>':''}
          </div>
        </details>
      </div>`;
    }).join('');
  }).catch(e=>{
    document.getElementById('posts-grid').innerHTML='<div class="empty" style="display:block">成品加载失败：'+esc(e.message)+'</div>';
  });
}
document.getElementById('modal-bg').addEventListener('click',e=>{if(e.target.id==='modal-bg')closeModal()});
['f-hook','f-channel','f-target','f-status','f-quality'].forEach(id=>document.getElementById(id).addEventListener('change',render));
document.getElementById('f-search').addEventListener('input',render);
load();
loadPosts();
function switchTab(tab){
  document.getElementById('tab-posts').classList.toggle('active', tab==='posts');
  document.getElementById('tab-dirs').classList.toggle('active', tab==='dirs');
  document.getElementById('panel-posts').style.display = tab==='posts'?'':'none';
  document.getElementById('panel-dirs').style.display = tab==='dirs'?'':'none';
}
document.getElementById('tab-posts').addEventListener('click', ()=>switchTab('posts'));
document.getElementById('tab-dirs').addEventListener('click', ()=>switchTab('dirs'));
</script>
</body>
</html>
