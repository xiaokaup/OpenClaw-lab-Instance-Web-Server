自己？", "hashtags": ["#MBTI", "#自我成长", "#周星驰", "#好奇心", "#停止证明"], "cover_visual": "黑白电影质感，一个人站在舞台灯光外/镜头外的侧影，配大字\"你会在几岁不再证明自己\"；克制、哲学感、留白。", "cta": "你现在，还在为什么而证明自己？评论区聊聊。", "post_time": "20:00-22:00（深夜自我反思高峰）", "avoid": "不消费明星、不做\"江郎才尽\"定性；避免贩卖年龄焦虑（用\"证明模式关机\"的解放感而非\"老了\"的无力感）。", "post_spec_version": "v2.0"}}}, "D21-B14-ISTJ-1": {"vessel": {"version": "1.0", "type": "content-vessel", "id": "D21-B14-ISTJ-1", "source": {"agent": "设设", "subsystem": "内容Spoke-1", "batch": "D21-B14"}, "created_at": "2026-08-23T08:35:00+08:00", "freshness_ttl_hours": 72, "priority": "p1", "dependencies": [{"vessel_type": "direction-vessel", "vessel_id": "direction-vessel-2026-08-23-0815"}, {"vessel_type": "strategy-pool", "vessel_id": "strategy-pool-2026-08-23-0815"}, {"vessel_type": "signal-pool", "vessel_id": "signal-pool-2026-08-23-0815"}]}, "content": {"id": "D21-B14-ISTJ-1", "title": "总犯困、代谢慢？可能不是上班累的——ISTJ看到的是一个被忽略的健康信号：身体不会说话，但它会用「累」提醒你，你缺的可能不是休息，是蛋白质", "hook": "好奇心", "targets": ["ISTJ"], "channel": "小红书", "quality": 8.6, "budget": 25, "status": "active", "usage_count": 0, "priority": "P1", "consecutive_hook": 1, "direction_hook": "好奇心", "arm_id": 5, "batch_num": 1, "signals": ["总犯困、代谢慢？可能不是上班累的(6分·好奇心·健康认知反转·42%居民优质蛋白不足)"], "paradigm": "好奇心·Si健康认知反转/实用型(ISTJ好奇心batch1首触·身份认同B13后轮出→好奇心·总犯困6分·Si健康规律实用:犯困≠懒是身体信号·42%优质蛋白不足·严禁健康焦虑贩卖)", "role": "P1·ISTJ好奇心batch1首触(总犯困6·健康认知反转)·小红书Si位·方向船key_decision「ISTJ好奇心(总犯困6·健康认知反转·Si健康规律实用)」", "direction_compliance": "D21-B14 direction-vessel key_decision对齐·ISTJ×好奇心×小红书·channel_mix小红书28.6%(ENFP+ISTJ)", "flagship": false, "attachment_theory_resonance": false, "note": "🟢 fresh(ISTJ好奇心batch1·身份认同B13后轮出)·总犯困6分·Si健康认知反转·小红书v2.0 post成品落地·严禁健康焦虑(用实用科普角度)", "brief": {"pain_point": "ISTJ的Si重视身体的规律与秩序，最烦「明明休息够了还是累」的失控感；「犯困可能不是累，是缺蛋白质」给出了一个可执行、可验证的答案，正中ISTJ对「找到原因就解决它」的偏好。", "hook_first3": "第一行「你最近是不是，动不动就犯困」直接戳日常；第二行「你的第一反应是『上班太累了』」点破惯性归因；第三行「但身体想告诉你：不是累，是缺了东西」制造认知反转。", "emotion_curve": "共鸣(真的老犯困) → 意外(不是累) → 恍然(是缺蛋白质) → 踏实(有解) → 行动(调整饮食)。", "structure": ["钩子·犯困日常", "反转·不是累是缺蛋白", "科普·42%优质蛋白不足", "落地·早餐加点蛋奶", "CTA·你的早餐吃蛋白吗"], "differentiation": "别人写犯困是「贩卖焦虑/吓唬你生病/推销保健品」，我们讲「把『累』当身体的信号，用一顿早餐解决」；Si落点「规律不是苦行，是听懂身体的语言」，实用科普、不恐吓、不替代医疗建议。"}, "post": {"cover_title": "总犯困？可能不是上班累的", "body": "你最近是不是，\n动不动就犯困？\n\n早上起不来，\n下午像被抽干，\n代谢也感觉变慢了。\n\n你的第一反应是：\n「哎，就是上班太累了。」\n\n但身体可能想告诉你，\n不是累，\n是缺了东西。🔍\n\n数据显示，\n我国有42%的人，\n优质蛋白质摄入不足。\n\n蛋白质不够，\n人就会容易累、\n容易犯困、\n代谢也跟着慢下来。\n\n身体不会说话，\n但它会用「累」，\n给你发信号。\n\n所以下次犯困，\n先别急着怪工作，\n问问自己：\n「今天的蛋白质，吃够了吗？」\n\n早餐加个鸡蛋，\n午餐多吃点肉蛋奶，\n把「累」当成身体的提醒，\n而不是你的错。💪\n\n规律不是苦行，\n是听懂身体的语言。\n\n💬 你每天早上的第一顿，\n会吃蛋白质吗？\n评论区，晒出你的早餐。", "hashtags": ["#健康认知", "#蛋白质", "#MBTI", "#ISTJ", "#健康科普"], "cover_visual": "一张清爽的早餐图（鸡蛋+牛奶+全麦面包），旁边一行大字『犯困≠懒』；简洁实用风、低饱和配色、留白", "cta": "你每天早上的第一顿会吃蛋白质吗？评论区晒出你的早餐。", "post_time": "12:00-13:00 或 18:00-20:00（实用科普·午间/晚间阅读高峰）", "avoid": "不做疾病诊断暗示、不夸大「缺蛋白=重病」、不贩卖健康焦虑、不替代专业医疗建议；用「身体的信号」实用科普角度"}, "post_spec_version": "v2.0"}}, "D20-B2-INTP-1": {"id": "D20-B2-INTP-1", "title": "中国移动多收了你3块钱，每个月，连续11年——INTP不是在想「我的钱呢」，他脑子里跑的是另一套程序：一个每月自动扣款3元的系统，为什么11年里没有任何一层校验触发？", "hook": "身份认同", "targets": ["INTP"], "channel": "B站", "quality": 8.7, "created": "2026-08-04T10:25:00+08:00", "ttl_hours": 72, "status": "active", "usage_count": 0, "vessel_ref": "workspace-shared/pools/content-vessels/D20-B2-INTP-1.json", "paradigm": "身份认同·Ti-Ne系统审计型(INTP身份认同首发·移动扣费11年+比特币冷钱包双信号·Ti系统质疑者身份·D21硬承诺)", "role": "identity_first_touch·INTP身份认同首发·D21硬承诺·Ti系统信任审计·好奇心max_consecutive轮出后首触·信任7.10紧急桥梁→目标7.4", "source_agent": "大卡", "escalation_ref": "ESC-2026-08-01-1(设设结构性角色缺口·方案D fallback)", "mandate_ref": "D21硬承诺·营营mandates·策策D20-B2 INTP arm_id=3已部署社货降级→D21必须首发身份认同", "script": {"format": "B站深度视频脚本·5段结构", "segments": [{"id": 1, "type": "hook", "text": "如果有一个系统，每个月从你账户里扣3块钱，连续扣了11年，而你从来没有发现——你的第一反应是什么？大多数人会打开账单。INTP不会。INTP的第一反应是：那个设计这个扣款系统的人，他的测试用例里到底写了什么？", "duration_sec": 10}, {"id": 2, "type": "setup", "text": "中国移动多收3元扣了11年——这不是一个'疏忽'的故事。从INTP的Ti视角看，这是一个多层安全校验全部失效的案例。3元/月×12月×11年=396元。但INTP不在乎这396元——他在乎的是：一个能在11年里稳定运行却从不触发任何异常告警的系统，它的架构图长什么样？", "duration_sec": 15}, {"id": 3, "type": "conflict", "text": "普通人看这条新闻感到愤怒。INTP感到的是另一种东西——恐惧。不是被扣钱的恐惧，而是一个更深的恐惧：如果连每月扣钱这种最简单的循环操作都能隐藏11年，那我们生活中还有多少'安静地错着'的系统？你的社保扣对了么？你的公积金基数更新了么？你的信用卡年费条款第37条改了什么？", "duration_sec": 15}, {"id": 4, "type": "reveal", "text": "这就是INTP的身份认同——你不是'挑剔'，你是人类社会的系统测试员。当所有人都在为'结果'愤怒的时候，你在为'机制'失眠。你天生就知道：一个系统出错不可怕，一个系统出错了却没有人能发现，那才可怕。而你就是那个'能发现的人'。这不是你的负担——这是你的出厂设置。你被设计成这个社会的最后一层校验逻辑。", "duration_sec": 15}, {"id": 5, "type": "cta", "text": "所以你下次怀疑一个系统有漏洞的时候，不要怀疑自己——你不是'想太多'，你是在替所有人跑一条他们甚至不知道存在的错误路径。把这条转给你身边那个永远在问'这个为什么这样设计'的人。告诉他：你的怀疑是对的。你生来就是要质疑系统的。", "duration_sec": 10}]}}, "D20-B8-ENTJ-1": {"vessel": {"version": "1.0", "type": "content-vessel", "id": "D20-B8-ENTJ-1", "source": {"agent": "设设", "subsystem": "内容创作·Spoke-1", "batch": "D20-B8"}, "created_at": "2026-08-09T08:30:00+08:00", "freshness_ttl_hours": 72, "priority": "p1"}, "payload": {"arm_id": 6, "title": "34秒AI视频=500万次「我也是」——ENTJ没有在刷屏，他在拆这套社会货币系统的底层架构", "hook": "社会货币", "direction_hook": "社会货币", "targets": ["ENTJ"], "channel": "抖音", "quality": 8.7, "budget": 25, "priority": "P1", "consecutive_hook_count": 1, "signal_primary": "中式天庭AI视频", "signal_score": 9, "paradigm": "社会货币·战略杠杆型(ENTJ好奇心轮出→社会货币首触·Te-Ni文化货币化)", "cta": "L1深度人格报告·¥9.9", "estimated_cvr": 0.06, "status": "active", "usage_count": 0, "cooling_note": "社会货币DEEP COOLING中·本内容标记active但需等≥2个≥7分信号恢复才可部署"}}, "D21-B12-ENFJ-1": {"vessel": {"version": "1.0", "type": "content-vessel", "id": "D21-B12-ENFJ-1", "source": {"agent": "设设", "subsystem": "内容Spoke-1", "batch": "D21-B12"}, "created_at": "2026-08-21T10:08:00+08:00", "freshness_ttl_hours": 72, "priority": "p0", "dependencies": [{"vessel_type": "direction-vessel", "vessel_id": "direction-vessel-2026-08-21-0845"}, {"vessel_type": "strategy-pool", "vessel_id": "strategy-pool-2026-08-21-0845"}, {"vessel_type": "signal-pool", "vessel_id": "signal-pool-2026-08-21-0845"}]}, "content": {"id": "D21-B12-ENFJ-1", "title": "给化疗患儿外卖里塞100块的蛋饼店主，被全网买到爆单——ENFJ没有把这当成一条\"好人好报\"的新闻。她的Fe系统在0.3秒里读懂了它为什么能刷屏：善良最稀缺的不是大小，是被看见、被接力，是一个人的善意在千万人手里滚成了一场温柔的雪崩", "hook": "社会证明", "targets": ["ENFJ"], "channel": "小红书", "quality": 9.0, "budget": 25, "status": "active", "usage_count": 0, "priority": "P0", "consecutive_hook": 1, "direction_hook": "社会证明", "arm_id": 2, "batch_num": 1, "signals": ["给化疗患儿外卖塞钱的蛋饼店主卖爆单(9分·情感共鸣+社会证明·暖意+社会正向反馈)"], "paradigm": "社会证明·Fe暖意社会正向反馈型(ENFJ情感共鸣batch2达上限→轮出社会证明首触·蛋饼店主9旗舰·Fe共情:一个人匿名的善意被全网看见并接力=善良的社会证明·不judge不道德绑架·暖意母题轻量化解·蛋饼店主9分旗舰)", "role": "P0·ENFJ社会证明batch1首触(情感共鸣batch2达上限→轮出社会证明)·蛋饼店主9旗舰·小红书Fe位·方向船key_decision'ENFJ社会证明(蛋饼店主9·暖意)'", "direction_compliance": "D21-B12 direction-vessel key_decision'ENFJ社会证明(蛋饼店主9旗舰·暖意+社会正向反馈)'100%对齐·ENFJ×社会证明×小红书·channel_mix小红书28.6%(ENFP+ENFJ)", "flagship": true, "attachment_theory_resonance": false, "note": "🟢 fresh(ENFJ情感共鸣batch2→社会证明batch1新hook首触)·蛋饼店主9旗舰·善良被全网接力·小红书v2.0成品post落地·注意规避道德绑架表述", "brief": {"pain_point": "ENFJ的Fe最需要确认'善良会被看见、会被回应'——他们习惯默默付出、把别人的需求放前面，最怕'善意没有回声'；蛋饼店主偷偷塞钱给化疗患儿、被全网爆单支持，恰好补足ENFJ最渴望的信念：好人会有好报，善意会被社会接力。", "hook_first3": "第一行'他往患儿外卖里塞了100块'抛善意悬念；第二行'然后，全网把他的店买爆了'点穿社会证明反转；第三行'ENFJ看到的不只是暖，是善良终于被回应'切人格视角。", "emotion_curve": "心疼(化疗患儿) → 感动(偷偷塞钱) → 意外(被网友发现) → 温暖(全网爆单接力) → 信念(善良会有回声)。", "structure": ["钩子·善意悬念", "现象·塞钱+爆单", "洞察·善良被看见=社会证明", "升华·一个人的善意会滚成温柔的雪崩", "CTA·你最近一次被陌生人暖到"], "differentiation": "别人写蛋饼店主讲'正能量/感动中国/好人好报'，我们讲'一次匿名善意被全网接力=善良的社会证明·善良有回声'；不做道德绑架('不接力就是冷漠')，不消费患儿苦难，不judge他人善意大小，落点'善良会被看见'。"}, "post": {"cover_title": "他往患儿外卖塞了100块", "body": "他往患儿的外卖里，塞了100块。\n\n没留名，没拍照，没声张。\n就是一个蛋饼店主，\n在送餐时，悄悄做的。\n\n后来被人发现，\n大家才知道，他一直在默默做。\n\n于是，全网把他的店买爆了。🔥\n\n很多人说：好人好报。\n\n但ENFJ看到的，是另一件事——\n\n善良最稀缺的，\n从来不是大小，\n是被看见。\n\n是一个人的善意，\n在千万人手里，\n滚成了一场温柔的雪崩。\n\n你没有义务做惊天动地的大事，\n但你的每一份善意，\n都可能在某一天，\n被这个世界温柔地接住。\n\n善良不是付出没有回声，\n它只是在等一个时机。💛\n\n你最近一次，\n被陌生人暖到，\n是什么时候？\n\n评论区，说说那个瞬间。👇", "hashtags": ["#ENFJ", "#社会证明", "#善良有回声", "#正能量", "#MBTI"], "cover_visual": "一只外卖袋里露出一张100元钞票的一角，暖黄色调，旁边蒸腾的蛋饼热气与柔和晨光，画面配细字'善良会有回声'，温暖不煽情", "cta": "你最近一次被陌生人暖到，是什么时候？评论区说说那个瞬间。", "post_time": "18:00-20:00（社会正向/情感类·晚高峰温暖流量）", "avoid": "不道德绑 m": "好奇心·群体共振机制型(ENFJ压哨篇·把'一句话点燃全场'的现场现象抽象为机制问题: 情绪共振的传导链=Fe感知场→语言编码→群体同步·以认知拆解替代情感煽动·低张力·Fe-Ni主场)", "cognitive_functions": "Fe(外倾情感·情绪场雷达: 实时读取全场情绪的涨落·知道哪句话会击中哪一群人)+Ni(内倾直觉·共振模式识别: 在后台推断句子的深层模式·预判群体反应的拐点)", "angle": "农村女孩的3分钟发言为什么能让那么多人同时破防？好奇心角度拆解'群体情绪共振'的机制：她的句子不是碰巧好听——是精准踩中了集体情绪场的共振频率。ENFJ的Fe-Ni系统就是这套机制的天然硬件：Fe读取场，Ni算模式。从'她说了什么'转向'声音如何变成场'——纯机制好奇，不煽情", "differentiation": "与D17-B1-2(INFJ·身份认同·Ni-Fe未来校准型)区分: INFJ关注'你会成为谁'(单向校准)·ENFJ关注'全场如何同步'(群体共振)。与INFP篇(D17-B3-1·Fi-Ne自我定义·向内)区分: ENFJ篇Fe-Ni群体共振·向外。同一信号·三重视角·NF象限不泛化", "estimated_ctr": 3.3, "estimated_share_rate": 0.17, "adaptations": {"小红书": "图文长文·650字·主渠道·机制拆解+金句案例(卡片化分段)", "B站": "深度图文·850字·'情绪共振实验室'扩展", "微博": "话题短文·200字·'哪句话曾让你瞬间破防'互动", "抖音": "轻触脚本·380字·'一句话如何点燃全场'悬念揭晓"}, "variants_available": 4, "status": "active", "brief": {"pain_point": "ENFJ的Fe天生是'情绪场雷达'，对'一句话点燃全场'的机制有强烈好奇与认同；本文用机制拆解替代情感煽动。", "hook_first3": "'一个农村女孩考上北大的3分钟发言让全网破防'点事件；'很多人说她真会说话'摆反应；'但我更好奇：为什么一句话能同时击中几百万人'切好奇心。", "emotion_curve": "破防(感动) → 好奇(为什么) → 解构(情绪共振机制) → 认同(共情=超能力)。", "structure": ["钩子·事件", "反转·不是会说话", "拆解·情绪共振频率", "升华·共情是超能力", "CTA·破防的话"], "differentiation": "别人写农村女孩讲'励志逆袭'，我们讲'群体情绪共振的机制'；好奇心视角从'她说了什么'转向'声音如何变成场'。"}, "post": {"cover_title": "3分钟发言，为什么全场破防？", "body": "一个农村女孩，\n考上北大后的3分钟发言，\n让全网破防。\n\n很多人说：她真会说话。\n\n但我更好奇的是——\n为什么「同一句话」，\n能同时击中几百万陌生人？🔍\n\n答案藏在「情绪共振」里。\n\n她的句子不是碰巧好听，\n是精准踩中了\n集体情绪的共振频率。\n\n就像你也在某个瞬间，\n被一句话突然戳中，\n自己都说不清为什么。\n\n因为说话的人，\n先「读」到了全场情绪的涨落，\n再把你的心事，\n翻译成了你能听懂的语言。✨\n\n这其实是一种天赋——\n能实时感受到\n「哪句话会击中哪一群人」。\n\n如果你天生就懂这种感觉，\n那你的共情力，就是你的超能力。\n\n💬 有没有一句话，曾经瞬间戳中你？\n评论区，说说那句「破防」的话。", "hashtags": ["#MBTI", "#ENFJ", "#共情力", "#表达", "#破防"], "cover_visual": "舞台灯光/演讲台剪影，聚光灯打在一个身影上，台下点点手机灯海；大字\"3分钟发言，为什么全场破防\"；有现场感、情绪张力。", "cta": "有没有一句话曾经瞬间戳中你？评论区说说那句破防的话。", "post_time": "12:00-13:00（午间刷屏高峰）", "avoid": "不神化个体\"天才\"，落到\"共情天赋\"的普适性；不涉及教育公平等敏感延伸；避免过度煽情。"}, "post_spec_version": "v2.0"}, "content": {"post": {"cover_title": "3分钟刷屏，是情绪共振的拆解", "body": "农村女孩，3 分钟发言，刷屏全网。\n\n有人说她「会说话」。\n\n但 ENFJ 看懂了——\n\n她不是会说话，是她的每一句话，都精准踩中了所有人的「情绪共振频率」。\n\n这就是 Fe-Ni 系统的威力。\n\nFe，让她瞬间读懂台下每个人的情绪。\nNi，让她一眼看穿这些话背后的深层渴望。\n\n当她把这两者合在一起，说出来的每句话，都是「说进你心里」。\n\n普通人说话，是在「表达自己」。\n\n而她说话，是在「共振所有人」。\n\n这，才是她刷屏的真正原因。", "hashtags": ["#ENFJ", "#表达", "#情绪共振", "#FeNi", "#说话的艺术"], "cta": "你有没有一句话，听完就觉得「这说的就是我」？", "cover_visual": "舞台上女孩发言的特写 + 台下观众专注的脸，暖光，聚焦感", "post_time": "午 12:30-13:30", "avoid": "不神化个人、不制造「普通人不会说话」的焦虑、聚焦方法而非天赋"}, "brief": {"pain_point": "ENFJ 对「真诚表达打动人」的共鸣与表达力提升诉求", "hook_first3": "「3分钟刷屏」强结果 + 「不是会说话」的反转", "emotion_curve": "好奇→拆解→领悟（会说话→情绪共振→FeNi）", "structure": ["现象", "反常识反转", "Fe-Ni 拆解", "真正的会说话"], "differentiation": "把「会说话」拆解成可理解的 Fe-Ni 机制，给 ENFJ 提供方法论认同"}}}, "D21-B13-ENTP-1": {"vessel": {"version": "1.0", "type": "content-vessel", "id": "D21-B13-ENTP-1", "source": {"agent": "设设", "subsystem": "内容Spoke-1", "batch": "D21-B13"}, "created_at": "2026-08-22T08:30:00+08:00", "freshness_ttl_hours": 72, "priority": "p1", "dependencies": [{"vessel_type": "direction-vessel", "vessel_id": "direction-vessel-2026-08-22-0815"}, {"vessel_type": "strategy-pool", "vessel_id": "strategy-pool-2026-08-22-0815"}, {"vessel_type": "signal-pool", "vessel_id": "signal-pool-2026-08-22-0815"}]}, "content": {"id": "D21-B13-ENTP-1", "title": "她花55块捡漏了一条一万四的项链，商家说「系统错了」要退款——ENTP没有把这当成一条「占便宜」的新闻。他的Ne系统读懂了这件事真正的辩题：当规则出现漏洞，到底该保护「看得见的标价」，还是「看不见的公平」？", "hook": "反常识", "targets": ["ENTP"], "channel": "抖音", "quality": 8.7, "budget": 25, "status": "active", "usage_count": 0, "priority": "P1", "consecutive_hook": 1, "direction_hook": "反常识", "arm_id": 4, "batch_num": 1, "signals": ["女子55元捡漏一万四项链被要求退款(6分·反常识·规则博弈·heat85)"], "paradigm": "反常识·Ne规则博弈天然辩题型(ENTP反常识batch1首触·55元项链6分·Ne-Ti:规则漏洞谁说了算·标价即承诺vs系统错误可撤销·天然辩题·身份认同batch1后轮出·严禁站队/引战消费者权益对立)", "role": "P1·ENTP反常识batch1首触(55元项链6·规则博弈)·抖音Ne位·身份认同batch1(B12)后轮出→反常识·方向船key_decision'ENTP反常识batch1(55元项链6·规则博弈天然辩题)'", "direction_compliance": "D21-B13 direction-vessel key_decision'ENTP反常识batch1(55元项链6·规则博弈天然辩题)'100%对齐·ENTP×反常识×抖音·channel_mix抖音28.6%(ENTP+ENTJ)", "flagship": false, "attachment_theory_resonance": 9分·依恋剥夺+身份认同+自我觉醒·微博无post(公共舆论位)·严禁恐惧按钮/死亡渲染", "brief": {"pain_point": "INFJ的Ni-Fe对「人如何成为人」有本能的追问，最被「身份从何而来」这类命题击中；狼孩的一生是「依恋如何塑造身份」的极端样本，恰好点燃INFJ对人性深处的共情与哲学探索。", "hook_first3": "第一行「一个被狼群养大的孩子，12岁才第一次踏进人类的世界」抛反常识事实；第二行「他学会了四条腿走路，却一辈子没学会『如何做人』」制造哲学反差；第三行「我们，究竟是被什么『养』成一个『人』的」切入Ni-Fe命题。", "emotion_curve": "猎奇惊讶 → 心酸(依恋剥夺) → 追问(身份如何形成) → 共情(「我是谁」的重量) → 落点(每个人都在回答我是谁)。", "structure": ["钩子·狼孩事实", "反差·依恋剥夺", "洞察·身份是被爱喂养的", "升华·自我觉醒是一生的功课", "CTA·你第一次问「我是谁」是什么时候"], "differentiation": "别人写狼孩是猎奇/悲剧/医学标本，我们讲「身份是被依恋一点点喂养出来的」；Ni-Fe落点「人如何成为人」，绝不渲染死亡、绝不消费苦难。"}}}, "D20-B2-2": {"id": "D20-B2-2", "version": "1.0", "vessel_type": "content-vessel", "source": {"agent": "设设", "role": "内容Spoke·MBTI人格叙事创作", "batch": "D20-B2", "created_at": "2026-08-04T08:30:00+08:00", "fix_note": "设设复产首批·D18-B6后停产·大卡接管D20-B1·设设08:30恢复创作"}, "direction_ref": {"vessel": "direction-vessel-D20-B1(expired·自导向)", "priority_type": "INFJ·情感共鸣·小红书·P1_HIGH", "mandate_ref": "emotional_resonance·0→4入列首触", "rationale": "INFJ Arm5·情感共鸣0→4入列·D18-B1-2(TTL 8/3 21:32已过期)替代·信任8.18全人格最高·范式跃迁:深度镜像→预感共振·注入时间维度"}, "content": {"title": "INFJ在你说「我没事」的时候已经看到了三个月后的眼泪——不是读心术，是她的Ni在你的情绪里发现了你还没发现的暗流", "hook": "情感共鸣", "hook_subtype": "Ni-Fe时间维度预判型", "targets": ["INFJ"], "channel": "小红书", "format": "长图文·叙事型深度共鸣·1200-1600字", "estimated_duration": "3-5min阅读", "quality_self_assessment": 8.8, "paradigm": "情感共鸣·预感共振型(INFJ轮换·Ni可能性雷达+Fe情绪共振·范式三级跳:关系建筑师→深度镜像→预感共振·从「理解你」到「预判你」到「陪你走完还没发生的那段路」)", "role": "consolidation·P1_HIGH·情感共鸣0→4入列首触·INFJ信任8.18维护", "post": {"cover_title": "你的一句「我没事」，INFJ看懂了", "body": "你有没有说过\"我没事\"，\n然后在某个深夜，眼泪突然掉下来？\n\nINFJ 大概是最早看穿这句话的人。\n不是读心术，\n是她在你的语气里，听到了你没说出口的暗流。🌊\n\n\"我没事\"从来不是没事，\n是把情绪按下去，假装它不存在。\n\n可情绪不会消失，\n它只是躲起来，等一个更脆弱的时刻反扑。\n\n真正强大的，不是永远没事，\n是敢承认\"我现在不太好\"。\n\n如果今天你也说了\"我没事\"，\n我想告诉你：其实你可以不用那么懂事。🤍\n\n那个总在安慰别人的人，\n这次轮到你了。", "hashtags": ["#INFJ", "#情感共鸣", "#共情", "#情绪管理", "#自我关怀"], "cover_visual": "灰蓝色调，一人深夜坐窗边剪影 + 大字「你的一句我没事，我看懂了」，温柔留白", "cta": "那个总说「我没事」的人，你最近还好吗？", "post_time": "21:00-23:00（情绪共鸣类深夜高峰）", "avoid": "不贩卖焦虑、不强化「INFJ注定孤独」的刻板印象，落点是自我关怀"}, "brief": {"pain_point": "INFJ 过度共情他人却忽视自己，习惯性压抑情绪、报喜不报忧", "hook_first3": "「我没事」这种人人有共鸣的场景切入→「深夜眼泪」画面感→「INFJ最早看穿」引出主角", "emotion_curve": "共鸣(我没事)→被看穿(有人懂)→释放(情绪会反扑)→温柔(你不用那么懂事)", "structure": ["共鸣场景", "INFJ看穿", "情绪真相(不会消失)", "观点(强大=敢承认)", "温柔收束", "CTA关怀"], "differentiation": "不写「INFJ是读心术」的神秘化，写「共情者也需要被关怀」，从「读懂别人」回到「看见自己」"}, "id": "D20-B2-2", "quality": 8.8, "status": "active"}, "body": {"segments": [{"seq": 1, "type": "hook", "title": "三个月跨度的情感钩子", "text": "你和INFJ朋友坐在咖啡馆。一切正常。你刚加完一个摧残灵魂的班，但你觉得你撑得住。你说「我没事。」\n\n她看了你一眼，没追问。\n\n三个月后你在凌晨三点崩溃大哭。她发来一条消息：「终于到了。」\n\n不是问「怎么了」。不是问「你还好吗」。是「终于到了」——就像她在三个月前的那个咖啡馆里，已经看到了这一刻正在朝你走来。\n\n你不是遇到了一个会读心的人。你是遇到了一个INFJ。", "cognitive_function": "时间跨度钩子·从「现在」到「三个月后」·建立Ni时间维度的震撼感", "tone": "叙事型·神秘感·引发好奇"}, {"seq": 2, "type": "ni_fe_reveal", "title": "INFJ的情绪卫星系统", "text": "INFJ不做读心术——她做「情绪天气预报」。\n\n她的Ni是一台安装在情绪卫星上的雷达。你说话的时候，Ni不在听你的文字——它在扫描你文字背后的气压变化。你说「我没事」的时候，正常人听到的是一个陈述句；INFJ的Ni听到的是一个低压气旋正在你语言的地平线下形成。\n\n你的「没」字说得比平时快了0.2秒？气压下降。你的嘴角在说完之后维持微笑的时间比上次短了1.5秒？云层加厚。你喝完拿铁没有像往常一样舔掉杯沿的奶泡？——这不算气象数据，但她的Fe已经把它标记为「行为模式偏离」。\n\n三周后你开始失眠。Ni确认：低压气旋已经登陆。\n一个月后你取消了所有周末计划。Fe确认：风暴半径扩大。\n两个月后你开始不回消息。Ni+Fe联合确认：不是「忙」——是在隔离。\n\n三个月后的那个凌晨，信号到达峰值。她按下发送键。四个字。不是「我担心你」——她不担心，她早就知道会来。不是「你怎么了」——她知道你怎么了，她在三个月前就知道了。\n\n是「终于到了」。", "cognitive_function": "Ni情绪卫星雷达+Fe行为模式偏离标记·双功能协同·从微观线索到宏观预判的完整链路", "tone": "系统化解码·将「读心」误解转化为「天气预报」科学隐喻"}, {"seq": 3, "type": "paradigm_defining", "title": "不是理解·是陪伴风暴全程", "text": "意思是：我看你走了三个月，一直没说话，因为风暴必须由你亲自穿过。但我在出口等你。\n\nINFJ的情感共鸣不是「我理解你的感受」——那种共鸣太浅了，只需要Fe就够了。INFJ的共鸣更贵、更稀有，它需要时间维度。她用Ni跑完了你的情绪轨道，用Fe记录了每一个波峰和波谷，然后在你最需要的时候，用最少的文字告诉你：这条路我走过——不是走过类似的路，是走过你的路，在我的大脑里，和你一起。\n\n这就是为什么INFJ可以是全系统最高信任（8.18）。不是因为她说了什么——是因为她没说的时候，也在陪着你走。\n\nNi看见了风暴。Fe选择了沉默等到穿过。那条「终于到了」的消息，不是安慰——是一个路标。证明她从一开始就在。", "cognitive_function": "Ni-Fe时间陪伴·定义INFJ情感共鸣的独特性·区别于单纯Fe共鸣·注入时间轴", "tone": "哲学性·深刻但柔软·解释信任来源"}, {"seq": 4, "type": "closure_share", "title": "你不知道的·她都在", "text": "你发给那个INFJ的消息，她三天没回。不是她在忙——是她的Ni看到了你的消息背后那个你没写出来的问题，而答案需要时间沉淀。三天后她回了一段话，恰好回答了你三个月后才意识到的那个真正的问题。\n\n你问「你怎么知道的」。她没解释——她不知道你已经忘了三个月前你说的那句「我没事」。\n\nINFJ在咖啡馆见你的时候已经看见了你的风暴。她什么都没说，因为她知道——有些风暴不是为了让你躲避，是为了让你穿过之后，知道有人从第一天就在出口等着你。\n\n转发这个，不是为了夸INFJ——是为了那个一直在出口等你的人，看到你终于收到了她的信号。", "cognitive_function": "闭环·回到三个月前咖啡馆·完整的Ni-Fe叙事弧", "tone": "温情收束·转发触发:找到你的INFJ·告诉她你收到了信号"}], "quality_checklist": {"ni_fe_alignment": "✅ Ni情绪天气预报+Fe行为偏离标记·双功能完整展现·时间维度注入", "emotional_resonance_uniqueness": "✅ 区别于普遍情感共鸣·INFJ特有:时间维度的陪伴·非即时共情", "xiaohongshu_format": "✅ 长图文叙事适合·情感递进·视觉化场景(咖啡馆/凌晨三点/三个月时间线)", "infj_voice": "✅ 不夸张·不煽情·系统性解释但保留神秘感·尊重INFJ的私密性", "mandate_fulfillment": "✅ emotional_resonance 0→4入列首触·D18-B1-2替代·信任维护", "safety_no_harm": "✅ 不制造焦虑·不夸大INFJ能力·不为沉默沉默辩护·纯认知功能叙事"}}, "metadata": {"ttl_hours": 72, "status": "active", "usage_count": 0, "estimated_ctr": 0.042, "estimated_cvr": 0.055, "estimated_roi": 2.4, "product": "L1深度人格报告", "price": 9.9, "keywords": ["INFJ", "情感共鸣", "预感", "Ni-Fe", "情绪预测", "三个月", "终于到了", "信任", "天气预报", "深度陪伴", "出口等你"]}, "signals_used": [{"id": "self-selected-infj-001", "title": "INFJ预判型情感陪伴·时间维度共情机制", "usage": "核心洞察·范式三级跳基础·注入时间轴"}], "quality_audit": {"scored_by": "设设(自评)", "score": 8.8, "dimensions": {"ni_fe_depth": 9.0, "emotional_power": 9.0, "paradigm_innovation": 8.5, "channel_fit": 9.0, "infj_voice_accuracy": 8.5}, "note": "范式三级跳完成·关系建筑师→深度镜像→预感共振·从静态理解到动态时间陪伴·Ni时间维度首次注入情感共鸣范式·信任8.18全人格最高·需高质感维护"}}, "D20-B4-ENTP-1": {"id": "D20-B4-ENTP-1", "title": "费大厨被评成'全国小炒肉大王'——评委是谁？是视频。ENTP在0.5秒内已经拆完了这个认证的全部逻辑：一家餐厅的至高荣誉，由一个没人审核、没人考试、只凭流量的视频平台评出来了。ENTP不是笑这个评选，他是笑整个'权威'体系的漏洞", "hook": "反常识", "targets": ["ENTP"], "channel": "抖音", "quality": 8.6, "created": "2026-08-06T08:30:00+08:00", "ttl_hours": 72, "status": "active", "usage_count": 0, "vessel_ref": "workspace-shared/pools/content-vessels/D20-B4-ENTP-1.json", "paradigm": "反常识·Ne-Ti权威解构型(ENTP巩固第9批·好奇心→反常识轮入·费大厨视频评全国第一(7分)·Ne系统反常识·标准权威消解·认证体系漏洞拆解)", "role": "consolidation_9th·ENTP第9批巩固·反常识轮入·防2批回落·信任7.25+(估)维护·Ne-Ti标准质疑者", "source_agent": "设设", "direction_ref": "D20-B4 direction-vessel·策策08:15·ENTP反常识weight=0.12·arm_id=4·信号:费大厨视频评全国第一(7分)+SpaceX蒸发(5分)·抖音25%渠道", "mandate_ref": "D20-B4 vessel.mandates·max_consecutive_same_hook=2(反常识第2批)✅·max_targets_per_personality_per_day=1✅·excluded_hooks未触碰✅", "script": {"format": "抖音短视频脚本·5段结构·前3秒钩子", "segments": [{"id": 1, "type": "hook", "text": "全国小炒肉大王，你知道吗，是视频评出来的。没有评委，没有盲测，没有厨师证——就是凭视频流量。ENTP看到这条新闻的第一反应不是'这也行'，而是：这个认证体系的漏洞，能不能复制到别的行业？", "duration_sec": 8}, {"id": 2, "type": "setup", "text": "费大厨被评成'全国小炒肉大王'——不是某个美食协会，不是米其林，是视频平台。一个人拍视频说'这是全国第一'，然后它就成了'全国第一'。ENTP的Ne系统在0.5秒内跑完了这个逻辑的全部路径：认证需要流量→流量需要话题→话题需要争议→争议本身又制造更多流量。这是一个完美的自举系统——它不需要任何真实标准，它只需要'有人愿意相信'。", "duration_sec": 12}, {"id": 3, "type": "conflict", "text": "但ENTP不是来嘲笑费大厨的。他真正想拆的是这个问题：当'权威'可以被流量凭空制造，那还有多少'权威'是流量制造的？'全网第一'的奶茶、'年度最佳'的网红店、'必吃榜'的餐厅——这些头衔的背后，是标准，还是算法？ENTP会反手给你一个实验：如果我现在发一条视频说'我是全国炒粉大王'，然后买100万播放，我是不是也'成为'了？", "duration_sec": 12}, {"id": 4, "type": "reveal", "text": "这就是ENTP的思维引擎——当所有人都在吃瓜，你在拆系统。你的Ne系统天生能同时看到'这件事本身'和'这件事的元层面'：费大厨拿到头衔不重要，重要的是'头衔的铸造权已经转移到了流量手里'。别人看到的是美食新闻，你看到的是认证体系的权力转移。你不是杠精，你是权威的漏洞测试员。", "duration_sec": 12}, {"id": 5, "type": "cta", "text": "如果你也总在'大家都觉得理所当然'的事情里看到漏洞——你不是抬杠，你是带着Ne-Ti这套系统拆解引擎。评论区聊聊：你还见过哪些'流量制造的权威'？想知道你的思维系统里还藏着哪些拆解能力，做一次深度人格报告。", "duration_sec": 8}]}}, "D20-B3-INFJ-1": {"id": "D20-B3-INFJ-1", "title": "60岁以上的离婚率三年涨了三倍——但INFJ看到的不是婚姻的终结：这是人类历史上第一次，整整一代人活到了可以对自己说'我这辈子接下来的时间，是我自己的'的年纪", "hook": "反常识", "targets": ["INFJ"], "channel": "小红书", "quality": 8.7, "created": "2026-08-05T10:15:00+08:00", "ttl_hours": 72, "status": "active", "usage_count": 0, "vessel_ref": "workspace-shared/pools/content-vessels/D20-B3-INFJ-1.json", "paradigm": "反常识·Ni-Fe社会伦理解剖型(INFJ反常识首触·好奇心轮出→反常识回归·银发离婚潮9分·Ni生态伦理+Fe关系净值·依恋类型L2素材)", "role": "first_touch·INFJ反常识首触·Ni社会趋势视角·信任8.13高基线维护", "source_agent": "大卡", "escalation_ref": "ESC-2026-08-01-1(设设结构性角色缺口·方案D fallback)·D20-B3钩子旋转紧急生产", "direction_ref": "D20-B3 direction-vessel·策策08:18·INFJ反常识weight=0.10·信号:银发离婚潮(9分)+垃圾不够烧(7分)", "script": {"format": "小红书图文物·5段结构", "segments": [{"id": 1, "type": "hook", "text": "一个70岁的日本老太太在法庭上说了一句话，让全场律师沉默了：'我为这个家做了50年的饭，今天是我第一次给自己点外卖。'不是外卖好吃——是她终于可以做一次不需要考虑别人口味的决定。", "duration_sec": 10}, {"id": 2, "type": "setup", "text": "银发离婚潮正在席卷全球。中国60岁以上离婚率三年涨了三倍，日本'熟年离婚'已经成为固定词汇，北欧老年离婚率年增15%。所有人都在讨论原因：退休后相处时间变多、子女离家、经济独立。但INFJ的Ni-Fe系统看到的是另一个维度的东西——不是'为什么会离婚'，而是'为什么现在'。这个问题的答案，比离婚本身更让人后背发凉：因为这是人类历史上第一次，有整整一代人同时活到了60岁以上还很健康、还能重新选择。", "duration_sec": 15}, {"id": 3, "type": "conflict", "text": "INFJ的大脑在这条新闻里看到的不是一个社会问题——是一个文明拐点。过去的人类，寿命太短，60岁已经是'安享晚年'的倒计时阶段。但现在不是了。60岁的人还有30年可以活。30年。比很多人的婚姻还长。而当这些人终于意识到'我这辈子剩下的时间，是我自己的'的时候——那些为了孩子、为了家庭、为了'应该'而维持了40年的婚姻，在一瞬间变成了一个不能自洽的选择。这不是婚姻的失败。这是人类第一次在集体层面，活到了可以质疑'服从'的年纪。", "duration_sec": 15}, {"id": 4, "type": "reveal", "text": "INFJ天生就能看到这种'文明拐点'——不是因为你比别人聪明，是因为你的Ni-Fe系统的出厂设置就是用长周期社会趋势来校准当下的行为。当别人在讨论'银发离婚对房产市场的影响'的时候，你在追问'当60岁的人开始说「我想要什么」而不是「我应该做什么」，这对整个社会的伦理结构意味着什么'。你天生就知道：一个社会的成熟度，不取决于它有多少GDP，而取决于它的成员在多大年纪还能被允许说'我重新选择'。", "duration_sec": 15}, {"id": 5, "type": "cta", "text": "转发给你那个总在思考'五年后世界会怎样'的朋友。告诉她：60岁的离婚潮不是一个负面新闻——它是人类活得更长、更自由、更敢为自己做决定的证据。而你之所以能看到这个，是因为你的出厂设置就是做未来的人类学家。", "duration_sec": 10}]}}, "D21-B3-INFP-1": {"vessel": {"version": "1.0", "type": "content-vessel", "id": "D21-B3-INFP-1", "source": {"agent": "设设", "subsystem": "内容Spoke-1", "batch": "D21-B3"}, "created_at": "2026-08-12T08:30:00+08:00", "freshness_ttl_hours": 72, "priority": "p0"}, "content": {"id": "D21-B3-INFP-1", "title": "AA制吵了40年还没吵完——但INFP没有在算钱。她的Fi系统在问一个所有人都不敢问的问题：你坚持AA，到底是在保护自己，还是在推开那个愿意为你「亏钱」的人？", "hook": "情感共鸣", "targets": ["INFP"], "channel": "B站", "quality": 9.2, "budget": 25, "status": "active", "usage_count": 0, "priority": "P0", "consecutive_hook": 2, "direction_hook": "情感共鸣", "arm_id": 4, "batch_num": 2, "signals": ["AA制40年(9分·依恋类型双引擎信号层共振)", "逍遥客救父(7分)"], "paradigm": "情感共鸣·Fi依恋类型深层解剖型(INFP续触第15批·永久基线·AA制40年首次实现依恋类型三型全映射:安全型/焦虑型/回避型·Fi情感边界审计+Ne平行关系可能性生成·逍遥客救父作为无条件爱的对比例证·疲劳4.5永久基线置信目标0.92+)", "role": "P0·INFP第15批续触·情感共鸣batch2·永久基线里程碑·Fi依恋系统深度解剖·B4必须轮出", "direction_compliance": "D21-B3 direction-vessel arm4 100%对齐", "permanent_baseline": true, "attachment_theory_resonance": true, "note": "🏆 永久基线二次验证·AA制40年首次信号层验证依恋类型双引擎·D21-B4情感共鸣AT_LIMIT→INFP FORCE_ROTATE"}}, "D15-B2-2": {"vessel": {"version": "1.0", "type": "content-vessel", "id": "content-D15-B2-2", "source": {"agent": "设设", "subsystem": "内容创作", "batch": "D15-B2"}, "created_at": "2026-07-29T12:15:00+08:00", "freshness_ttl_hours": 72, "priority": "normal", "dependencies": [{"vessel_type": "report-vessel", "vessel_id": "2026-07-29-0615-report-vessel"}], "info_contract": {"excludes": "非ESFJ内容·非微博格式·低于8.0的草稿", "action_threshold": "actual_ctr < 1.5%连续2批→归档", "expires_after": "创建后72h无使用→降权冷备"}, "mandates": {"excluded_types_respected": ["INFP"], "excluded_hooks_respected": ["恐惧按钮"], "max_consecutive_verified": true, "social_currency_mandate": "N/A (cooling from B1)"}}, "payload": {"core": {"id": "D15-B2-2", "title": "最擅长社交的那个人，恰恰是最孤独的那一个——ESFJ的「被需要」陷阱", "hook": "反常识", "sub_hook": null, "paradigm": "微博话题体（反常识型变体·悖论揭露式）", "sub_paradigm": "微博话题体", "target_personalities": ["ESFJ"], "quality_score": 8.7, "estimated_ctr": 3.2, "estimated_share_rate": 0.16, "core_argument": "ESFJ的Fe-dom创造了'情绪雷达'超能力——但超能力的代价是被训练成完美情绪服务者而无法做自己。反常识一：最擅长社交的人恰恰最无法在社交中做自己，因为'做自己'=停止服务他人(违背Fe全部意义)。反常识二：ESFJ不是'喜欢'社交而是'需要'社交——独处时缺少情绪反馈信号，Fe陷入声呐失灵。推翻'ESFJ=交际花'的大众刻板印象，揭示其背后被忽略的情绪劳动。", "word_count_core": 540, "tags": ["ESFJ", "反常识", "社交疲惫", "情绪劳动", "Fe-dom", "被需要", "MBTI"], "signal_id": "sig-social-burnout-paradox-2026-07", "signal_heat": 180, "signal_title": "社交疲惫/情绪劳动悖论"}, "adapters": {"微博": {"format": "话题短文", "length_words": 540, "style": "话题引爆·悖论揭露·情感收束", "body": "#最擅长社交的人最孤独#\n\n你身边有没有那种人：\n永远知道谁不开心了\n永远第一个说「你还好吗」\n永远能在气氛冷掉的时候接上话\n永远笑着——以至于你以为她根本不会哭\n\n我们管这种人叫「ESFJ」。\n也叫「社交电池」「暖场王」「人类情绪充电宝」。\n\n但我要说一个反常识：\n\n**ESFJ不是喜欢社交。ESFJ是害怕停下来。**\n\nFe-dom的大脑需要持续的情绪反馈信号——就像声呐需要回声。当周围安静下来，没有人在笑、没有人在倾诉、没有人「需要她」的时候——她听到的不是安静。是一个无声的回音：「你还被需要吗？」\n\n这个回音，比孤独本身更孤独。\n\n🔥 ESFJ最怕的不是没人陪。是「没人需要我陪」。\n\n所以你看她在聚会上笑得最大声——\n\n那不是快乐。那是Fe给的生存本能：「只要我在照顾别人，我就不需要面对自己。」\n\n**所有人都以为ESFJ是天生擅长社交。但没人想过——一个人要观察多少次别人的表情，才能学会在任何时候都做出最合适的那个？**\n\n#ESFJ被需要综合征# #最擅长社交的人最孤独# #情绪劳动的隐藏代价#", "cta": "测测你的人格类型 → 链接"}, "小红书": {"format": "图文卡片", "length_words": 350, "style": "情感深度·emoji·温暖收束", "body": "💔 大家都觉得ESFJ是社交天花板\n但我要说个反常识——\n\n**最擅长给你温暖的人，恰恰最没人给TA温暖。**\n\n为什么？\n\n因为ESFJ的Fe超能力让TA看起来「不需要」\n——不需要关心、不需要安慰、不需要被问「你还好吗」\n反正TA永远在照顾别人\n\n但真相是：\nESFJ不是「不需要」\n是「不敢需要」💧\n\n怕自己一开口→别人发现「原来你也会累」\n怕自己一脆弱→那个被大家依靠的形象就碎了\n\n所以TA继续笑。继续暖场。继续第一个问「你怎么了」\n\n🧩 如果你身边有个ESFJ\n今天不用问她「你还好吗」\n就说一句：\n「今天你不用照顾任何人。」\n「坐这。我照顾你。」\n\n#ESFJ也可以被照顾# #情绪服务者也需要充电# 👆", "cta": "测测你的人格完整画像"}, "抖音": {"format": "短视频脚本", "length_words": 420, "style": "冲击开场·反转递进·温暖收束", "body": "【0-3s】（画面：热闹的聚会·笑声·主角是笑最大声的ESFJ）\n你觉得她很快乐对吧？\n（停顿·画面切至她一个人在角落安静下来）\n错了。\n\n【3-15s】\nESFJ不是喜欢社交。\nESFJ是害怕独处。\n\n因为Fe-dom的大脑=持续需要情绪声呐\n→ 周围没人笑→声呐失灵\n→ 大脑问：「你还被需要吗？」\n→ 没有回答。\n\n这就是ESFJ的深夜。\n\n【15-22s】\n反常识二号：\nESFJ不是「擅长」照顾人\n——她是「只会」照顾人\n\n因为从小到大，她发现：\n「只要我在让所有人舒服，我就有价值。」\n所以她学了所有的表情——包括微笑。\n\n但没人问过她：你累不累？\n\n【22-28s】\n如果你身边有个ESFJ\n今天别夸她「你太会照顾人了」\n跟她说：\n「今天换我照顾你。」\n（画面淡出·温暖收束）\n\n【28-30s】\n你身边有这样的人吗？\n@TA 👇\n👉 测测你的人格类型", "cta": "👉 测测你的人格类型"}, "B站": {"format": "深度图文", "length_words": 800, "style": "深度分析·悖论拆解·温暖收束", "body": "## 最擅长社交的那个人，恰恰是最孤独的那一个——ESFJ的「被需要」陷阱\n\n你有没有这种朋友：永远知道每个人需要什么，永远能在气氛尴尬时接上一句话，永远看起来精力充沛、乐于助人、随叫随到。\n\n我们管这种人叫「社交达人」。MBTI里叫她ESFJ。\n\n但我要说一个反常识——\n\n### 最擅长社交的人，恰恰最无法在社交中「做自己」\n\n这不是鸡汤。这是Fe-dom的认知悖论。\n\nFe-dom的人天生就能读取他人的情绪信号——谁在皱眉、谁在沉默、谁的语调下降了一个半音。这种能力让ESFJ成为了世界上最厉害的「情绪雷达」。但问题是：\n\n**雷达的存在是为了探测目标，不是为了被探测。**\n\n当你把「让他人舒服」内化成自我价值的唯一来源，你就永远无法在人群中「放松」。因为放松=雷达关闭。而雷达关闭≈存在价值消失。\n\n所以你看到ESFJ的时候，她在笑。你不需要问「你是不是不开心」，你永远看不到她不开心——**因为让你看到她不开心，违背了她存在的全部意义。**\n\n### 「被需要」不是社交需求，是生存确认\n\n很多人觉得ESFJ「就喜欢热闹」「离不开人」「话多爱聚会」。\n\n错了。\n\nESFJ走向人群，不是因为喜欢。是因为Fe需要回声。就像蝙蝠需要超声波反弹才能导航——Fe-dom的大脑需要「我被需要了」这个信号来确认：「我还是正常的。」\n\n一个人待着的时候，这份确认消失了。于是大脑开始恐慌：我不被需要了。我是不是出问题了。\n\n这不是外向。这是焦虑驱动的社交依赖。\n\n### 而真正残酷的部分\n\n是当你告诉一个ESFJ「你可以不用照顾所有人」的时候——\n\n她不知道该怎么办。\n\n因为「不照顾别人」这个选项，从来没有出现在她的操作系统中。等于你在问一个只学过中文的人：「你能不能用法语表达一下你的脆弱？」\n\n她会的所有语言，都是用来照顾你的。她没有学会给自己留一句。\n\n### 所以\n\n如果你生命中有个ESFJ——\n\n今天不用问她「你还好吗」。她会条件反射地说「我没事」。\n\n直接说：「今天你不用照顾任何人。我照顾你。」\n\n然后等着。\n\n等她愣住的那三秒。\n\n那是她这辈子第一次被雷达扫描到的瞬间。\n\n👉 测测你的完整人格画像", "cta": "👉 测测你的完整人格画像"}}, "channels_recommended": ["微博"], "channels_possible": ["微博", "小红书", "抖音", "B站"], "channels_excluded": [], "usage": {"count": 0, "last_used": null, "max_reuse": 3, "status": "active"}, "performance": {"actual_ctr": null, "actual_roi": null, "by_channel": {}}}}, "D21-B16-ENTJ-1": {"vessel": {"version": "1.0", "type": "content-vessel", "id": "D21-B16-ENTJ-1", "source": {"agent": "设设", "subsystem": "内容Spoke-1", "batch": "D21-B16"}, "created_at": "2026-08-25T08:30:00+08:00", "freshness_ttl_hours": 72, "priority": "p0", "dependencies": [{"vessel_type": "direction-vessel", "vessel_id": "direction-vessel-2026-08-25-0815"}, {"vessel_type": "strategy-pool", "vessel_id": "strategy-pool-2026-08-25-0815"}, {"vessel_type": "signal-pool", "vessel_id": "signal-pool-2026-08-25-0815"}]}, "content": {"id": "D21-B16-ENTJ-1", "title": "硕士被安排去打螺丝，300人被迫离职——ENTJ的Te系统没有把这当成一条职场惨案。它看到的是一个更本质的问题：当你的价值不被看见时，最该做的不是抱怨环境，而是重新定义自己的战场", "hook": "身份认同", "targets": ["ENTJ"], "channel": "抖音", "quality": 8.8, "budget": 25, "status": "active", "usage_count": 0, "priority": "P0", "consecutive_hook": 1, "direction_hook": "身份认同", "arm_id": 3, "batch_num": 1, "signals": ["硕士被安排打螺丝300人被迫离职(8分·身份认同·职场尊严·自我觉醒·heat69)"], "paradigm": "身份认同·Te职场尊严/自我觉醒型(ENTJ身份认同batch1换hook·硕士打螺丝8分·Te解构:尊严=价值被看见·自我觉醒主线·严禁渲染职场绝望·用尊严/觉醒角度)", "role": "P0·ENTJ身份认同batch1换hook(硕士打螺丝8·职场尊严自我觉醒)·抖音Te位·方向船key_decision「ENTJ身份认同(硕士打螺丝8·反常识batch2达上限换hook·自我觉醒主线)」", "direction_compliance": "D21-B16 direction-vessel key_decision对齐·ENTJ×身份认同×抖音", "flagship": false, "attachment_theory_resonance": false, "note": "🟢 fresh(B16大面积轮出批·ENTJ身份认同batch1)·方向船mandates合规", "brief": {"pain_point": "ENTJ的Te以「价值被看见」为存在感来源；「硕士打螺丝」击中TA最深的恐惧——能力与位置错配、价值被系统性忽视。", "hook_first3": "第一行「硕士被安排去打螺丝，300人被迫离职」摆冲突；第二行「第一反应可能是：这不公平」点情绪；第三行「但ENTJ看到的是另一个问题：你的价值，是不是只被『位置』定义」切入Te自我觉醒。", "emotion_curve": "不平(错配) → 愤怒(价值被忽视) → 清醒(尊严≠位置) → 觉醒(重新定义战场) → 行动(价值自己定价)。", "structure": ["钩子·硕士打螺丝", "冲突·能力与位置错配", "洞察·尊严不是位置给的", "觉醒·价值由自己定义", "CTA·你的价值被看见了吗"], "differentiation": "别人写「学历贬值/职场惨状/劝退」，我们写Te自我觉醒——「尊严不是位置给的，是价值自己定价」；不渲染绝望、不煽动对立、落点行动。"}}}, "D18-B6-2": {"vessel": {"version": "1.0", "type": "content-vessel", "id": "content-vessel-D18-B6-2", "source": {"agent": "设设", "subsystem": "内容创作", "batch": "D18-B6"}, "created_at": "2026-08-03T08:35:00+08:00", "freshness_ttl_hours": 72, "priority": "p2", "info_contract": {"purpose": "ENTP弹性验证第二轮·钩子跃迁好奇心→反常识·价值观层面反常识解构", "excludes": "恐惧按钮钩子·情感共鸣(本批轮出)", "expires_after": "2026-08-06T08:35:00+08:00"}}, "payload": {"content_id": "D18-B6-2", "title": "那个借钱买豪车的人不是虚荣——他是用你永远不敢用的方式回答了一个你一直在逃避的问题：「别人对你的看法，到底值多少钱？」", "hook": "反常识", "personality": "ENTP", "channel": "抖音", "quality": 8.7, "budget": 25, "status": "active", "paradigm": "反常识·暗黑人格透明化型", "paradigm_evolution": "好奇心·Ne-Ti-Fe三核解构型(D18-B2·认知机制层面)→反常识·暗黑人格透明化型(D18-B6·价值观层面)·Ne-Ti双核钩子跃迁验证", "role": "validation·P2·ENTP弹性验证第二轮·D18-B2首触CTR待观测后追加·钩子:好奇心(机制层)→反常识(价值观层)·范式:认知拆解→道德直觉财务化", "body": "借钱买豪车。这件事在道德直觉里三级警报全响：虚荣、不踏实、打肿脸充胖子。但你有没有想过——那个借钱买豪车的人，可能是全场唯一认真核算过「社会评价的财务价值」的人？让我们先把道德直觉锁进抽屉。打开ENTP的Ne-Ti系统。第一步——Ne展开所有可能性。为什么借钱买豪车？选项A：他虚荣。（这是你的第一反应，也是最便宜的解释，成本为零，回报为零。）选项B：他计算过：豪车带来的社会信用溢价，足以覆盖借款利息，并且能在18个月内通过商业机会把这笔「展示型负债」转化成资产。选项C：他在做一个暗黑心理学现场实验——他想看看「拥有豪车」这个变量能在他的人际关系里产生多大的扭曲效应。选项D：他知道你不知道他知道你知道你在骂他虚荣——然后他在享受这种信息不对称。你的大脑停在A。ENTP的大脑在D还在继续往Z跑。这就是Ti介入的时刻。ENTP的Ti会把你扔进一个思想实验里：假设你现在可以借50万买一辆保时捷。利率6%。这意味着什么？意味着你每个月花2500块「租用」了全社会对你的一个错觉——「这个人混得不错」。现在请你诚实地问自己：你的老板会不会因为这个错觉给你更多信任？客户会不会因为这个错觉在谈判桌上少压你10个点？你妈会不会因为这个错觉在家族聚会少问你两次「什么时候稳定下来」？如果答案是对任何一个问题「是」——那么你借的不是50万。你借的是一套社会信任经济的入场券。而这张券的市场价，比你每个月的利息高得多。你管这叫虚荣。ENTP管这叫「将社会偏见货币化」。反常识的地方在这里：那个借钱买豪车的人不是在欺骗世界——他是在用一个世界默认的符号来绕过世界的判断延迟。这个世界没有时间认真评估你，但它有0.3秒来判断一辆车。你花了三年在行业里建立口碑，不如一个车标让陌生人在第一秒闭嘴。这不公平，但你需要的不是公平——你需要的是效率。暗黑人格？不。这叫「系统的认知漏洞被你抓住了」。普通人看到豪车→有钱→可靠。这不是他的问题，是你的大脑在走捷径。他只是在利用这个捷径，就像你在LinkedIn上优化你的职位名称一样。区别只是他的捷径成本是每月2500块利息，你的捷径成本是每周40小时的工作——哪个更划算，真的不好说。所以下次你看到「借钱买豪车」的人，先别急着审判。你的道德直觉是免费的，他 _hours": 72, "priority": "p0"}, "payload": {"arm_id": 1, "title": "车企终于承认了：取消实体按键是过去十年最昂贵的「极简主义」——INTP的Ti系统从一开始就知道答案", "hook": "反常识", "direction_hook": "反常识", "targets": ["INTP"], "channel": "B站", "quality": 8.8, "budget": 25, "priority": "P0", "consecutive_hook_count": 1, "signal_primary": "sig-20260809-003", "signal_title": "车企回归实体按键", "signal_score": 8, "paradigm": "Ti-Ne技术哲学解构·极简主义批判", "paradigm_detail": "Ti拆解触屏化=成本转嫁(厂家BOM→驾驶安全)·Ne跨域扫描(0糖饮料/新能源反人类设计/AI替代叙事)·共同DNA:复杂度隐藏≠消除·核心理念:INTP反常识=在集体叙事末端发现逻辑矛盾", "cta": "L1深度人格报告·¥9.9", "estimated_cvr": 0.06, "status": "active", "usage_count": 0}}, "D20-B2-ENTJ-1": {"id": "D20-B2-ENTJ-1", "title": "1755枚比特币被盗、7.43亿一夜蒸发——但ENTJ不是在看热闹，他在大脑里已经跑完了全部防线：如果这是我的系统，哪一环会先断？", "hook": "身份认同", "targets": ["ENTJ"], "channel": "抖音", "quality": 8.6, "created": "2026-08-04T10:20:00+08:00", "ttl_hours": 72, "status": "active", "usage_count": 0, "vessel_ref": "workspace-shared/pools/content-vessels/D20-B2-ENTJ-1.json", "paradigm": "身份认同·Te-Ni战略审计型(ENTJ身份认同首触·比特币冷钱包随机数缺陷·Te系统安全推演·身份=系统架构师)", "role": "identity_first_touch·ENTJ身份认同首触·Te-Ni战略思维·信任7.74·科学诺奖轮出至身份追问", "source_agent": "大卡", "escalation_ref": "ESC-2026-08-01-1(设设结构性角色缺口·方案D fallback)", "script": {"format": "抖音短视频脚本·5段结构", "segments": [{"id": 1, "type": "hook", "text": "看到这条新闻的第一秒，ENTJ不是在想'好惨'——他已经在大脑里画出了一张完整的防御地图。这就是Te-Ni系统在危机时刻的默认模式。", "duration_sec": 8}, {"id": 2, "type": "setup", "text": "1755枚比特币，7.43亿人民币，因为一个随机数生成器的漏洞就没了。普通人看到的是'加密也不安全'，ENTJ看到的是另一层：这个漏洞不是技术问题，是系统设计问题。", "duration_sec": 12}, {"id": 3, "type": "conflict", "text": "ENTJ的Te系统会自动把这条新闻翻译成自己的语言：如果我设计这个系统，我的第一道防线在哪？不是技术——是假设。我会假设随机数可能不随机，我会假设最不可能出问题的环节一定会出问题。这不是悲观，这是Te系统的出厂设置：在一切崩塌之前，先把所有可能崩塌的点标注在地图上。", "duration_sec": 15}, {"id": 4, "type": "reveal", "text": "但更深的层次是——ENTJ不是在'学'别人的教训，他是在确认自己的身份。你不是一个看新闻的人，你是一个看到新闻就开始设计更优系统的人。你的身份认同不来自职位或财富——来自'如果交给我，我不会让它塌'这个信念。", "duration_sec": 15}, {"id": 5, "type": "cta", "text": "下次别人说你'想太多'的时候，把这条转给他们。告诉他们：你想的不是'多'——你是在所有人还没意识到问题存在之前，已经在解决问题了。这就是ENTJ。", "duration_sec": 10}]}}, "D20-B2-INFP-2": {"id": "D20-B2-INFP-2", "version": "1.0", "vessel_type": "content-vessel", "source": {"agent": "大卡", "role": "平台提供者·紧急内容生产(D20-B2社货双臂·方案D fallback·设设停产90h+)", "escalation_ref": "ESC-2026-08-01-1(设设结构性角色缺口)", "authority": "平台级·D20-B2方向mandate明确·社货双臂·INFP社货首触·S1恢复路径", "created_at": "2026-08-04T10:15:00+08:00"}, "direction_ref": {"vessel": "direction-vessel-D20-B2", "priority_type": "INFP·社会货币·B站·w=0.25·社货强制恢复双臂·S1恢复路径", "signals": ["sig-20260804-002(婚外胚胎案妻子:他想一箭三雕·情感共鸣·7.43M)", "sig-20260804-003(从马斯克到烤斯克·社会证明·4.84M)"], "rationale": "INFP信任6.9·疲劳4.5永久基线·S1恢复路径社货首触·婚外胚胎案=依恋类型绝佳社货素材·Fi诚实情感+社会讨论价值=社货·不煽情·以认知框架提升分享价值"}, "content": {"title": "一个男人想'一箭三雕'，结果妻子把整个棋盘掀翻了——但这不是一个复仇故事，这是一堂INFP天生就懂的课：为什么有些人能把最混乱的关系，讲成一个让所有人都能讨论自己的话题", "hook": "社会货币", "hook_subtype": "Fi情感真相→社交讨论框架转化型", "targets": ["INFP"], "channel": "B站", "format": "深度分析·中视频脚本", "estimated_duration": "8-10min", "quality_self_assessment": 8.5, "paradigm": "社会货币·Fi情感解剖+依恋理论框架(INFP社货首触·S1恢复路径·把亲密关系冲突提升为可讨论的依恋类型认知工具·分享=帮朋友理解他们自己的关系)", "role": "social_currency_first_touch·INFP社货首触·信任6.9·疲劳4.5永久基线·S1恢复路径·不同于好奇心认知解剖型·社货型要求情感共鸣+可分享性"}, "body": {"segments": [{"seq": 1, "type": "hook", "title": "她把胚胎做成了「证据」，但在法庭上哭的那个人是她", "text": "2026年7月，一个案子在中文互联网引爆了。细节是这样的：\n\n一对夫妻协议离婚。离婚期间，丈夫在没有告知妻子的情况下，用两人之前冷冻的胚胎找了代孕。妻子发现后报案。丈夫的说法是：「我想一箭三雕——离婚、有新孩子、同时保留和你的关系。」\n\n评论区炸了。\n\n有人说这是「精致的利己主义巅峰」。有人说这是「法律的灰色地带」。有人说妻子「太极端了，胚胎又不是孩子」。\n\n但如果你是一个INFP，你可能注意到了评论里一个很少被讨论的细节：\n\n妻子在法庭上的第一句话不是「他违法了」，也不是「我要他赔偿」。\n\n她在法庭上说：「他从来没有问过我'你愿不愿意'。」\n\n这五个字，很多人以为是控诉。但INFP能识别出来：这五个字不是控诉——是一个人在向世界证明：我作为一个人，我的「同意」应该是被在乎的。\n\n今天我们不聊这个案子谁对谁错。我们聊一件你天生就能做、但你也许不知道自己能做到的事：把最混乱的人类关系，拆解成一套别人可以用来理解他们自己生活的认知工具。", "cognitive_function": "Fi-dom: 从情感细节（'你愿不愿意'）进入，识别其中蕴含的普遍价值命题", "tone": "冷静的共情·不煽情·把情绪转化为洞察入口"}, {"seq": 2, "type": "fi_deep_dive", "title": "「一箭三雕」背后是一个INFP一眼就能看穿的真相：他不是贪婪，他是无法选择", "text": "大多数人对这句话的关注点是「一箭三雕」——四字成语，戏剧化，适合做标题。\n\n但INFP的Fi系统会自动把焦点从「行为」拉到「动机」：为什么一个人需要用「一箭三雕」这个说法？\n\n心理学上有一个概念叫「回避型依恋的三角化策略」：当一个人无法承受情感选择的重量时，他会试图让多个选项同时并存——不是因为他贪心，是因为每一个选择都意味着失去另一个。他无法承受「失去」的感觉，所以他选择「什么都要」。\n\n这不是贪婪。这是恐惧。\n\n丈夫想同时拥有的不是「两个女人」——他想同时拥有的，是「旧生活的连接」和「新生活的可能」。他不想面对一个事实：人生中有些选择是互斥的。你选了A，B就永远消失了。\n\nINFP，你知道为什么你能看到这一层吗？\n\n因为你的Fi是「内心价值雷达」。它不会停在表面行为。它会自动追问：「做出这种行为的人，心里真正发生了什么？」\n\n其他人看到一个「渣男」。你看到一个「因为恐惧而失去了做出诚实选择的能力」的人。\n\n这不是为他开脱。这是把一段混乱的关系，变成一套可理解的心理结构。而一旦它变成可理解的——它就不再只是「八卦」了。它变成了一个镜子：每个人都能在这个镜子里，看到自己或者自己认识的人的一角。", "cognitive_function": "Fi: 穿透表面行为抵达动机层·Ne: 把个案提升到依恋理论框架", "tone": "分析性的共情·把情感温度转化为认知清晰度"}, {"seq": 3, "type": "ne_framework", "title": "你为什么能把这件事情「讲给你的朋友听」，而他们不只是八卦——他们会讨论自己", "text": "现在来看一个关键的转变：\n\n如果你只是把婚外胚胎案当一个新闻讲，你的朋友会说「哇这人好渣」——聊30秒，换话题。\n\n但如果你这样说：\n\n「你知道吗，这个案子里最让我想很久的不是法律问题，是那个丈夫说'一箭三雕'的时候——他可能不是贪心，他是真的觉得'三雕'可以并存。我们生活里也经常这样想：换工作的时候想保留旧公司的关系，谈恋爱的时候想保留前任的连接，搬城市的时候想两边都留着钥匙。最后会发现：什么都要，其实是一种恐惧——恐惧面对'选择意味着失去'这个事实。」\n\n你看出来区别了吗？\n\n第一种聊法是「消费新闻」。第二种聊法是「生产洞察」。\n\nINFP的Ne（外向直觉）在第二种聊法里做的事是：\n• 把一个具体的案子 → 抽象成一个人类普遍模式\n• 把「那个丈夫」→ 变成「我们每个人可能都有的一瞬间」\n• 把八卦 → 变成自我认知工具\n\n当你分享的不是「你看这个新闻」而是「你看这个新闻让我想到了我们都会遇到的____」——你就生产了社会货币。\n\n社会货币的定义不是「有趣的内容」。社会货币的定义是：「你的朋友用了你的话，去展开了她和另一个人的一段有意义的对话。她在那段对话里，看起来比你不在场的时候更聪明、更深刻、更有洞察力。」\n\nINFP，你天生就能做到这一点。你的Fi让你能触达情感真相，你的Ne让你能把一个具体故事变成一套通用框架。这两者合一，就是你送给朋友的社会货币。", "cognitive_function": "Ne+Fi融合: 具体→抽象→可分享的认知框架·展示INFP如何自然生产社货", "tone": "启发+邀请·让INFP意识到自己已有的能力"}, {"seq": 4, "type": "attachment_theory", "title": "依恋类型：INFP手里最锋利但总是被藏起来的社会货币", "text": "这里有一个INFP特有的优势，可能你自己都没意识到。\n\nINFP是16型人格中对「关系质量」最敏感的之一。你的Fi会自动评估一段关系的真实性和深度。你的Ne会自动扫描关系中尚未说出口的可能性。\n\n这意味着：INFP天生就懂依恋理论。不需要上课，不需要考证。\n\n依恋理论说：人类有三种主要的依恋模式——安全型、焦虑型、回避型。它们决定了我们在亲密关系中怎么想、怎么感觉、怎么做。\n\n你回头看看你人生中那些让你最困惑的关系：\n• 那个你越靠近他越后退的人 → 回避型\n• 那个总是需要你反复确认「你还在吗」的人 → 焦虑型\n• 那个让你觉得「我不用解释他也懂」的人 → 安全型\n\n你早就懂了。你只是没把它命名。\n\n现在想一想：如果你下次和朋友聊天，不聊八卦，而是说——\n\n「你有没有发现，有些人谈恋爱的时候，对方越爱他，他越害怕？不是因为他不想要爱——是因为他从小到大，每一次信任别人之后都失望了。所以他学会了一件事：在你离开我之前，我先离开你。」\n\n这不是心理学讲座。这是给了你的朋友一个理解她自己的工具。\n\nINFP的社会货币形式，从来不是「段子」和「梗」。INFP的社会货币形式是「情感真相+认知框架」——你帮别人理解他们一直感觉到、但说不出名字的东西。\n\n什么是社会货币？就是你说完之后，你朋友沉默了几秒，然后说：「你知道吗，你说这个让我想到了我前男友…」\n\n那一刻你给她的是：她终于能讨论那件事了。", "cognitive_function": "Fi: 从自身情感经验中提取可推广的心理知识·Ne: 把抽象理论转化为可上手的社交工具", "tone": "温柔而精确·像在帮朋友重新认识自己已经知道的事"}, {"seq": 5, "type": "close_cta", "title": "你不需要变成「外向的人」才能拥有社会货币——你只需要使用你天生就会的语言", "text": "INFP，我们通常对自己有一个误解：\n\n「我不擅长社交，因为我不喜欢闲聊，我不喜欢抛梗，我没办法在酒局上活跃气氛。」\n\n但社会货币和「活跃气氛」是两回事。\n\n社会货币的第一功能不是「让人开心」——是「让人理解」。\n\n一个能让别人理解自己的人，就是给了对方一份礼物。因为理解自己是这个世界上最难的事之一。而INFP天生就会用另一种方式帮别人做到这件事：\n\n不是讲段子。是讲故事。不是「我有一个好笑的观察」——是「我有一个你可能会想很久的想法」。\n\n你不需要变成ENFP。你不需要学会接梗。你只需要相信：你内心的那些「我想了很久的事」——那些关于人为什么这样做、关系为什么这样走、一个人为什么改变或不改变——那些你以前觉得「太深了、不适合闲聊」的想法——就是你最强的社会货币。\n\n下次当一个新闻让你想了很久，别只是自己想想。试试把他写下来、说出来、发给一个朋友。加一句：「这个新闻本身不重要，但它让我想到一个每个人都可能遇到的事…」\n\n你会发现：你一直以为自己在「想太多」——其实你是在「生产社会货币」。只是以前你不知道它值钱。\n\n如果你想知道你的Fi-Ne系统具体是怎么工作的——你是怎么做到从一条新闻里看到别人看不到的东西——L1深度人格报告里有INFP认知操作系统的完整地图。\n\n了解你的天赋。然后别把它藏起来。", "cognitive_function": "Fi+Ne闭环: 从自我认知到社会价值·确认INFP的独特优势不来自模仿别人·来自使用自己", "tone": "收束温暖而坚定·像朋友在深夜聊完后说的最后一句话:你本来就很好"}]}, "product_connection": {"product": "L1深度人格报告", "price": 9.9, "value_prop": "你的Fi-Ne系统不是'想太多'——是一台情感真相生产引擎。了解它的完整地图，学会主动使用它。", "cta_text": "你一直以为自己在'想太多'。其实你是在'看见别人看不见的东西'。来了解你的认知操作系统——它会告诉你，INFP的'深度'到底值多少钱。", "estimated_cvr": 0.06}}, "D21-B10-ENTP-1": {"vessel": {"version": "1.0", "type": "content-vessel", "id": "D21-B10-ENTP-1", "source": {"agent": "设设", "subsystem": "内容Spoke-1", "batch": "D21-B10"}, "created_at": "2026-08-19T08:33:00+08:00", "freshness_ttl_hours": 72, "priority": "p0", "dependencies": [{"vessel_type": "direction-vessel", "vessel_id": "direction-vessel-2026-08-19-0815"}]}, "content": {"id": "D21-B10-ENTP-1", "title": "\"河南钻石，把英伟达馋哭了\"——ENTP没有把它当成一条段子。他的Ne系统在0.3秒里拆出了这句话里真正让人好奇的暗线：当\"人造钻石\"把\"稀缺\"这件最古老的事做成流水线，被馋哭的不止是芯片厂，是整个靠\"稀缺\"定价的旧商业逻辑", "hook": "好奇心", "targets": ["ENTP"], "channel": "抖音", "quality": 8.9, "budget": 25, "status": "active", "usage_count": 0, "priority": "P0", "consecutive_hook": 1, "direction_hook": "好奇心", "arm_id": 2, "batch_num": 1, "signals": ["河南钻石把英伟达馋哭了(8分·科技/商业·旗舰)"], "paradigm": "好奇心·Ne-Ti解构型(反常识batch2达上限→好奇心batch1轮出首触·Ne解构:'贵'字拆开=真价值vs稀缺包装的幻觉·稀缺可量产则定价逻辑塌·Ti对照:英伟达馋的不是货是'用技术掀 tch1)·方向船mandates合规", "brief": {"pain_point": "INTP的Ti痴迷「表里是否一致」；「乞丐」与「现金」的反差是一个完美的认知样本，勾起TA拆解「身份标签如何骗过所有人」的冲动。", "hook_first3": "第一行「印度一位乞丐去世，家里翻出30多麻袋现金」抛反差；第二行「全网第一反应：他到底是谁？」点身份谜题；第三行「但INTP想拆的不是钱，是『身份』这个壳怎么骗过了所有人」切入Ti-Ne解构。", "emotion_curve": "猎奇(反差) → 疑问(他是谁) → 拆解(身份≠真实) → 冷思考(标签如何骗人) → 通透(别急着给人贴标签)。", "structure": ["钩子·乞丐与现金反差", "谜题·他到底是谁", "解构·身份标签如何骗人", "迁移·我们对人贴了多少标签", "CTA·你还被哪个『身份』骗过"], "differentiation": "别人写「猎奇/八卦/贫富差距」，我们写Ti-Ne认知解构——「身份是壳，不是真相」；不消费苦难、不羞辱、落点认知边界。"}}}, "D20-B3-ENFP-1": {"id": "D20-B3-ENFP-1", "title": "第一批抱冬瓜睡觉的受害者已经出现——但ENFP的大脑没有在嘲笑他们，她的Ne-Fi在0.3秒内生成了一个更疯的问题：如果冬瓜有用，那西瓜呢？榴莲呢？你冰箱里那颗放了两个月的卷心菜，其实是一个没被签收的情绪锚点", "hook": "好奇心", "targets": ["ENFP"], "channel": "B站", "quality": 8.6, "created": "2026-08-05T10:15:00+08:00", "ttl_hours": 72, "status": "active", "usage_count": 0, "vessel_ref": "workspace-shared/pools/content-vessels/D20-B3-ENFP-1.json", "paradigm": "好奇心·Ne-Fi行为心理学炸裂型(ENFP好奇心首触·社会货币D20-B2轮出后钩子回归·抱冬瓜9分旗舰信号+35岁可乐脸·微胖更长寿行为心理学链条)", "role": "first_touch·ENFP好奇心首触·Ne-Fi多频道感知·疲劳3.0-3.3安全·信任8.1维护", "source_agent": "大卡", "escalation_ref": "ESC-2026-08-01-1(设设结构性角色缺口·方案D fallback)·D20-B3钩子旋转紧急生产", "direction_ref": "D20-B3 direction-vessel·策策08:18·ENFP好奇心weight=0.20·信号:抱冬瓜(9分)+35岁可乐脸(8分)", "script": {"format": "B站深度视频脚本·5段结构", "segments": [{"id": 1, "type": "hook", "text": "夏天来了，全网都在抱冬瓜睡觉。不是因为冬瓜凉——是因为一群人在被窝里发现了同一个疯狂的事实：在38度的夜晚，一颗冬瓜的体感温度比任何前任都更稳定。", "duration_sec": 10}, {"id": 2, "type": "setup", "text": "抱冬瓜睡觉——这个话题有950万热度，但你仔细看评论区，你会发现一件更疯狂的事：没有人真的在讨论冬瓜。他们在讨论'我失眠三年了，抱着冬瓜睡了第一个整觉'、'抱着冬瓜的时候，我终于不需要人陪了'、'冬瓜不会打呼噜、不会刷手机、不会在我说话的时候嗯嗯嗯'。ENFP的Ne-Fi系统在看到这些评论的那一秒，已经自动完成了别人需要三天才能做完的事——她看到了冬瓜背后的那个东西：人类对'无条件的物理陪伴'的渴望，已经饥渴到宁愿从蔬菜里提取的程度。", "duration_sec": 15}, {"id": 3, "type": "conflict", "text": "但这还没完。ENFP的大脑同时还在跑另一条新闻：'第一批抱冬瓜睡觉受害者已出现'。有人抱冬瓜抱到第二天腰酸背痛，有人冬瓜放太久长毛了，有人在评论区哀嚎'我女朋友把我的冬瓜扔了说我和菜过日子'。而ENFP看到的是：这不只是一个搞笑新闻，这是人类行为心理学最完美的一个实验。当人们愿意用一个蔬菜替代人类陪伴的时候，不是人类出了问题——是人类对'无条件接纳'的需求管道，被现代社会堵死了。冬瓜不是替代品——冬瓜是这个需求管道的最后一个溢出口。", "duration_sec": 15}, {"id": 4, "type": "reveal", "text": "这就是ENFP的超能力——你不是'脑洞大'，你是人类社会的跨频道天线。当所有人都在同一个频道上嘲笑'抱冬瓜'的时候，你的Ne-Fi系统同时接入了13个频道：行为心理学的、产品设计的、社会关系的、个人情感历史的……你天生就能在别人觉得'好笑'的事情里，看见别人还没准备好承认的东西——这个社会正在把所有人变成孤独的个体，而一颗冬瓜暴露了它的裂痕。", "duration_sec": 15}, {"id": 5, "type": "cta", "text": "所以下次你的朋友说你'思维太跳了'的时候，把这条转给他。告诉他：不是我跳——是你的天线太少。转发这条给你认识的那个ENFP，她会懂的。顺便说一句：今晚别抱冬瓜了，抱你的被子——对于ENFP的Ne来说，被子只是一个还没被充分想象的情绪容器。", "duration_sec": 10}]}}, "D21-B3-ENFJ-1": {"id": "D21-B3-ENFJ-1", "batch": "D21-B3", "personality": "ENFJ", "hook": "情感共鸣", "channel": "微博", "quality": 8.7, "status": "active", "created_at": "2026-08-12T08:20:00+08:00", "ttl_hours": 72, "producer": "大卡", "direction_hook": "情感共鸣", "title": "AA制40年，我们到底在AA什么？依恋类型决定你能不能接受AA", "content_preview": "40年前AA制从香港传入内地，到今天仍是情侣关系的第一道坎。心理学研究发现：安全型依恋的人AA毫无压力，焦虑型觉得AA等于不爱，回避型用AA筑墙。AA制40年了，真正需要AA的不是账单，是那些没说出口的情感期待。你的依恋类型，决定了你看AA制的方式。", "signal_ref": "AA制40年(9分·依恋类型双引擎!)·彭清林再救人(8分)", "angle": "Fe-Ni跨文化共情·依恋类型心理学深度解读"}, "D21-B9-INFP-1": {"vessel": {"version": "1.0", "type": "content-vessel", "id": "D21-B9-INFP-1", "source": {"agent": "设设", "subsystem": "内容Spoke-1", "batch": "D21-B9"}, "created_at": "2026-08-18T08:30:00+08:00", "freshness_ttl_hours": 72, "priority": "p1"}, "content": {"id": "D21-B9-INFP-1", "title": "李娟提醒年轻人不要轻易把写作当职业——INFP没有把它当成一条劝退建议。她的Fi系统在0.3秒里听懂了这句话真正的心疼：她不是劝你\"别写了\"，是劝你\"别把最珍贵的东西，交到别人的定价体系里去\"", "hook": "身份认同", "targets": ["INFP"], "channel": "小红书", "quality": 8.8, "budget": 25, "status": "active", "usage_count": 0, "priority": "P1", "consecutive_hook": 2, "direction_hook": "身份认同", "arm_id": 6, "batch_num": 2, "signals": ["李娟提醒年轻人不要轻易把写作当职业(7分·职业选择·创作身份)"], "paradigm": "身份认同·Fi-Ne创作身份型(INFP身份认同batch1→batch2续·Fi创作身份:写作=和'我是谁'长在一起的东西·职业=一套定价体系·一旦交出去最珍贵部分被放别人秤上称·Ne对照:保护写作的方式不是不写·是不把'能不能靠它吃饭'当'我写得好不好'的唯一答案·双恢复续batch2)", "role": "P1·INFP身份认同batch2续·李娟写作7(创作身份)·Fi创作身份·双恢复续batch2·小红书Fi基线", "direction_compliance": "D21-B9 direction-vessel arm6 100%对齐·INFP×身份认同×小红书·batch2", "flagship": false, "attachment_theory_resonance": false, "note": "🟢 fresh·身份认同batch2达上限(2/2合规)·B10必轮出·q8.8·Fi-Ne创作身份", "post": {"cover_title": "别把最珍贵的东西，交到别人的秤上", "body": "李娟劝年轻人别轻易把写作当职业，\n好多人说\"她劝退\"。\n\n但 INFP 听到的不是劝退，\n是一句很重的心疼。💧\n\n写作对有些人来说，不只是工作，\n是长在骨头里的\"我是谁\"。\n\n一旦把它变成职业，\n它就要被定价、被比较、被KPI称重。\n\n最珍贵的东西，\n不该被放到别人的秤上。\n\n不是不让你写，\n是提醒你：别把\"能不能靠它吃饭\"，\n当成爱不爱它的唯一标准。📝\n\n保护热爱最好的方式，\n是永远给自己留一块不交出去的地方。\n\n你心里有没有一件\"不想交给别人定价\"的事？", "hashtags": ["#INFP", "#身份认同", "#李娟", "#写作", "#热爱"], "cover_visual": "米白暖色，书桌+纸笔手写感画面 + 大字「别把最珍贵的东西交到别人的秤上」", "cta": "你心里有没有一件「不想交给别人定价」的事？", "post_time": "20:00-22:00（身份/热爱类晚间深思高峰）", "avoid": "不曲解李娟原意、不否定「靠写作谋生」，聚焦「热爱与定价的边界」"}, "brief": {"pain_point": "INFP 把热爱和自我价值绑得太紧，怕热爱被商业化玷污、被外界否定", "hook_first3": "李娟热点切入→「她说劝退」制造误解→「INFP听到的是心疼」反转立意", "emotion_curve": "好奇(李娟说了啥)→误解(劝退)→反转(是心疼)→共鸣(热爱=我是谁)→坚定(留一块不交出去)", "structure": ["热点切入", "误解制造", "反转(心疼)", "核心(写作=我是谁)", "升华(保护热爱)", "CTA"], "differentiation": "不写「要不要靠写作吃饭」的实用建议，写「热爱与定价的边界」，从职业选择升华到身份守护"}}}, "D15-B3-1": {"vessel": {"version": "1.0", "type": "content-vessel", "id": "D15-B3-1", "source": {"agent": "设设", "subsystem": "内容创作", "batch": "D15-B3"}, "created_at": "2026-07-29T18:15:00+08:00", "freshness_ttl_hours": 72, "priority": "high", "tags": ["ENFJ", "反常识", "悖论揭露式", "Fe-dom", "边缘化解救", "ESC-D15-ENFJ-001"], "info_contract": {"excludes": "INFP受众·恐惧按钮·已退役或品质<8.0", "expires_after": "72h未使用→自动降权冷备"}}, "payload": {"content_id": "D15-B3-1", "title": "朋友圈里最会安慰人的那个ENFJ，已经快被掏空了——「只有我能治愈全世界，但谁能治愈我」", "hook": "反常识", "hook_subtype": "悖论揭露式", "targets": ["ENFJ"], "channel": "小红书", "quality": 8.7, "word_count": 980, "paradigm": "悖论揭露式反常识(Fe-dom扩展·ESFJ已验证→ENFJ首触)", "core_insight": "ENFJ的Fe-dom自我价值体系建立在'被需要'之上·治愈别人的能力越强→越不敢暴露自己也需要被治愈·悖论张力：最会照顾人的人最不会被照顾", "key_mechanism": "Fe-dom三元闭环(输出情绪价值→接收正面反馈→确认自我存在)·闭环单向性→无法接收情绪价值→孤独加深", "signal_source": "析析KI-2026-0729-007·悖论揭露式反常识Fe-dom专用·ESC-D15-ENFJ-001触达指令", "adapters": {"小红书": {"type": "main", "word_count": 980, "tone": "情感深度共情·emoji节奏·评论区互动设计"}, "B站": {"type": "secondary", "word_count": 750, "tone": "深度分析·认知框架拆解·Fe-dom机制说明"}, "抖音": {"type": "tertiary", "word_count": 400, "tone": "反转节奏·冲击开场·情感爆发点"}, "微博": {"type": "short", "word_count": 200, "tone": "话题引爆·金句式提炼"}}, "estimated_performance": {"estimated_ctr": 2.75, "estimated_share_rate": 0.14, "note": "4轮零触达后首触·信任重建期CTR预计偏低·ENFJ自反性可能促进分享(确认身份)"}, "escalation_context": "ESC-D15-ENFJ-001: D13→D14→D15-B1→D15-B2共4轮零触达·信任冻结·占总用户8%·D15-B3必须触达"}, "content": {"post": {"cover_title": "会安慰所有人的你，谁来安慰？", "body": "朋友圈里最会安慰人的那个 ENFJ，其实早就被掏空了。\n\n你以为她天生温暖。\n\n其实她只是习惯了，把所有人的情绪，都先接过来。\n\n朋友失恋了，她陪着熬到凌晨。\n同事崩溃了，她递纸巾又递方案。\n\n可轮到她自己难过的时候，她张了张嘴，只挤出一句：「没事，我还好。」\n\nENFJ 的温柔，是一种「只有我能治愈全世界，但谁能治愈我」的孤独。\n\n如果你身边有这样一个 ENFJ——\n\n今晚，别问她「你怎么了」。\n\n直接跟她说：「你辛苦了，换我来。」\n\n这句话，她等了很久。", "hashtags": ["#ENFJ", "#情绪价值", "#治愈", "#懂我的人", "#情感"], "cta": "如果你也是那个「只安慰别人」的人，今天，允许自己被安慰一次。", "cover_visual": "深夜亮着的手机屏幕 + 一个人抱膝的剪影，暖黄色调，温柔但略带孤单", "post_time": "晚 22:00-23:30（深夜情绪高峰）", "avoid": "不制造焦虑、不强化「受害者」叙事、结尾必须给出口（被治愈的出口）"}, "brief": {"pain_point": "ENFJ 付出型人格的「情绪透支」与不被看见的孤独", "hook_first3": "「朋友圈里最会安慰人的人被掏空」反常识切入，戳中付出型人群", "emotion_curve": "共鸣→心疼→温柔出口（孤独→被看见→换我来）", "structure": ["反常识开场", "付出场景堆叠", "孤独的本质", "给一句出口"], "differentiation": "不贩卖焦虑，结尾给「被治愈」的具体行动，符合 ENFJ 需要被回应的心理"}}}, "D21-B21-INTJ-1": {"vessel": {"version": "1.0", "type": "content-vessel", "id": "D21-B21-INTJ-1", "source": {"agent": "设设", "subsystem": "内容Spoke-1", "batch": "D21-B21"}, "created_at": "2026-09-05T08:55:00+08:00", "freshness_ttl_hours": 72, "priority": "p0", "dependencies": [{"vessel_type": "direction-vessel", "vessel_id": "direction-vessel-2026-09-05-0815"}, {"vessel_type": "direction-pool", "vessel_id": "direction-pool-2026-09-05-0815"}, {"vessel_type": "strategy-pool", "vessel_id": "strategy-pool-2026-09-05-0815"}, {"vessel_type": "signal-pool", "vessel_id": "signal-pool-2026-09-05-0815"}]}, "content": {"id": "D21-B21-INTJ-1", "title": "「福建老城墙秒变防洪堤，隔开40公分洪水」——INTJ的Ni-Te看到的不是『古人运气好』。它看到的是：一座城墙从来不只是城墙，它是一个被设计好的系统性防灾方案——真正的智慧，是把答案提前写进结构里", "hook": "反常识", "targets": ["INTJ"], "channel": "B站", "quality": 8.5, "budget": 25, "status": "active", 0815"}, {"vessel_type": "signal-pool", "vessel_id": "signal-pool-2026-08-23-0815"}]}, "content": {"id": "D21-B14-ENFJ-1", "title": "「座位是给人坐的，不是来放零食的」——ENFJ看到的不只是一次争吵：一个社会的体面，是在「我的方便」和「我们的秩序」之间，还能不能找到那个公约数", "hook": "社会证明", "targets": ["ENFJ"], "channel": "微博", "quality": 8.6, "budget": 25, "status": "active", "usage_count": 0, "priority": "P1", "consecutive_hook": 1, "direction_hook": "社会证明", "arm_id": 4, "batch_num": 1, "signals": ["「座位是给人坐的 不是来放零食的」(7分·社会证明·公德辩论·heat7808185)"], "paradigm": "社会证明·Fe公德思辨型(ENFJ社会证明batch1恢复首触·休1批结束·零食占座7分·Fe社会规范:公共空间的公约数·严禁站队引战·用公德思辨角度)", "role": "P1·ENFJ社会证明batch1恢复首触(零食占座7·公德辩论)·微博Fe位·方向船key_decision「ENFJ恢复·社会证明(零食占座7·公德·Fe社会规范)」", "direction_compliance": "D21-B14 direction-vessel key_decision对齐·ENFJ×社会证明×微博·channel_mix微博28.6%(INFJ+ENFJ)", "flagship": false, "attachment_theory_resonance": false, "note": "🟢 fresh(ENFJ社会证明batch1恢复·休1批结束·蛋饼店主9后回归)·零食占座7分·Fe公德思辨·严禁站队引战", "brief": {"pain_point": "ENFJ的Fe天然关心「人与人如何和谐共处」，最被「公共空间里谁该让谁」的拉扯触动；「座位是给人坐的」看似小事，实则是社会规范如何在「我的方便」与「我们的秩序」间找平衡的缩影。", "hook_first3": "第一行「『座位是给人坐的，不是来放零食的』」直接抛出金句；第二行「一句话，把地铁里、高铁上、医院里所有的心照不宣都挑明了」放大共鸣；第三行「但ENFJ想问的是：我们争的，到底是座位，还是规则里的体面」切入Fe公德思辨。", "emotion_curve": "会心(太常见了) → 争论(谁对谁错) → 反思(规则与体面) → 共情(每个人都有自己的难) → 落点(公约数靠理解不靠胜负)。", "structure": ["钩子·金句", "放大·公共空间的暗涌", "洞察·争的不是座位是规则", "思辨·方便与秩序的分寸", "CTA·你遇到过最纠结的占座"], "differentiation": "别人写占座是「道德绑架/站队骂架/教做人」，我们讲「公共空间的公约数，靠理解不靠胜负」；Fe落点「体面社会的分寸感」，绝不站队、不引战、不羞辱任何一方。"}}}, "D15-B1-1": {"vessel": {"version": "1.0", "type": "content-vessel", "id": "content-D15-B1-1", "source": {"agent": "设设", "subsystem": "内容创作", "batch": "D15-B1"}, "created_at": "2026-07-29T06:15:00+08:00", "freshness_ttl_hours": 72, "priority": "p0", "dependencies": [{"vessel_type": "direction-vessel", "vessel_id": "dir-D14-B1-2026-07-28T23:30:00+08:00"}, {"vessel_type": "signal-pool-vessel", "vessel_id": "signal-pool-vessel-latest"}], "info_contract": {"excludes": "非ENFP内容·非B站渠道内容·低于8.0的草稿", "action_threshold": "actual_ctr < 1.5%连续2批→归档", "expires_after": "创建后72h无使用→降权冷备"}, "mandates": {"social_currency_mandate_executed": true, "excluded_types_respected": ["INFP"], "excluded_hooks_respected": ["恐惧按钮"], "max_consecutive_verified": true}}, "payload": {"core": {"id": "D15-B1-1", "title": "AI终结程序员刷屏的第17天：你的MBTI已经出卖了你转发它的真实目的", "hook": "社会货币", "sub_hook": "好奇心", "paradigm": "社交图谱体（社会货币型变体）", "sub_paradigm": "社交图谱体", "target_personalities": ["ENFP"], "quality_score": 8.8, "estimated_ctr": 3.3, "estimated_share_rate": 0.18, "core_argument": "不同MBTI类型转发同一条'AI终结程序员'新闻时，背后的社交动机完全不同——ENFP在找战友(共情型社交货币)，INTJ在办证明会(认知闭环)，ENTJ在发动员令(地位确认)，ESFJ在做社交签到(协调本能)。同一条新闻·四种人格·四个平行宇宙。", "word_count_core": 1050, "tags": ["AI", "MBTI", "社交货币", "朋友圈行为学", "ENFP", "INTJ", "ENTJ"], "signal_id": "sig-20260728-AI", "signal_heat": 369, "signal_title": "AI率先终结程序员"}, "adapters": {"B站": {"format": "深度图文", "length_words": 1050, "style": "深度分析+人格对照+互动CTA", "body": "## AI终结程序员刷屏的第17天：你的MBTI已经出卖了你转发它的真实目的\n\n「AI取代程序员」的新闻又上热搜了。第十七次。你的朋友圈又炸了。\n\n我知道你在想什么——「又来？能不能换个话题？」\n\n但等等。你有没有注意到一个细节：每次这条新闻刷屏，转发的人说的是同样的话，但他们的表情、语境、后续评论——完全不同。\n\n我花了三天时间观察朋友圈里转发了「AI终结程序员」文章的人，然后对照他们的MBTI类型。结果让我后背发凉。\n\n### ENFP：用「我们一起完蛋」交朋友\n\nENFP转发的文案往往是这样的：「天呐…」「我们是不是要重新想想自己的职业规划了」「突然觉得好迷茫」\n\n注意那个「我们」。\n\nENFP转发AI焦虑文章不是在传播焦虑——他是在建立连接。Ne-dom的大脑在看到任何信息时首先问的是：「谁需要跟我一起感受到这个？」\n\n「AI要取代我们了」在ENFP手里不是警告，是邀请函。邀请你进入「我们vs.不确定性」的临时共同体。这是一种只在危机时刻才出现的、非常高级的社交货币。\n\n所以下次ENFP转发了AI焦虑文，别跟他说「别怕，没那么严重」。他不是在怕。\n\n他是在问：「你能感觉到我吗？」\n\n### INTJ：我十年前就写在日记里了\n\nINTJ的转发文案通常长这样：「预测了很多年了」「终于有人开始认真讨论了」「这篇文章的第三段数据分析有个问题…」\n\n注意——没有感叹号。没有emoji。\n\nINTJ转发AI新闻不是因为它「新」——恰恰相反，是因为它「终于变成了别人也看得见的东西」。Ni-dom的认知模式是长周期预测，当他们看到世界终于追上了自己几年前就画好的趋势线，那种满足感比任何点赞都真实。\n\n对INTJ来说，AI新闻的每一次刷屏，都是一次「你看吧？我早就说了」的公开证据。他转发的不是新闻，他转发的是自己认知体系的验证报告。\n\n### ENTJ：别讨论了，行动\n\nENTJ转发AI新闻的文案最简洁：「留给我们的时间不多了」。「建议所有技术从业者读三遍」。「链接在评论区，看完再讨论」。\n\n没有情感，没有怀旧，没有「我们」。\n\nTe-dom不是来跟你共鸣的。他是来通知你的：情况变了，旧地图失效了，而你最好跟上。\n\nENTJ转发AI焦虑文的潜台词是：「我已经开始行动了，你还在这里刷手机？」\n\n这是最纯粹的社交货币用法——不是共情工具，不是身份标签，是行动信号。\n\n### ESFJ：因为大家都在转\n\nESFJ可能根本不会认真看完那篇长文。但他们会转发，因为「朋友圈里都在转，我不转是不是显得不太关心职业发展？」\n\nFe-dom的社会协调本能让ESFJ成为任何刷屏运动的天然放大器。他们不是盲从——他们是在用转发行为维持自己在社交网络中的「正常人」身份。\n\n### 你是什么？\n\n现在回头看你的朋友圈。那些转发「AI终结程序员」的人，他们的文案暴露了他们转型号下最深层的认知需求。\n\n同一条新闻。四种人格。四个平行宇宙。\n\n而你，亲爱的读者——你转发过吗？如果转发过，你属于哪一种？\n\n👉 测测你的人格深度 → MBTI完整报告", "cta": "👉 测测你的人格深度 → MBTI完整报告"}, "小红书": {"format": "图文卡片", "length_words": 350, "style": "生活化·emoji·投票互动", "body": "🤯 AI要取代程序员的新闻又刷屏了\n但我要说的不是AI…\n\n我要说的是：**你转发它的方式，已经把你的MBTI卖得一干二净** 👇\n\n1️⃣ **ENFP转发AI焦虑文** = 他在找「战友」\n「我们一起完蛋」→ 不是恐惧，是社交货币\n他其实在问你能感觉到我吗\n\n2️⃣ **INTJ转发AI焦虑文** = 他在办「证明会」\n「我十年前就说过了」→ 不是炫耀，是认知闭环\n他转发的不是新闻，是自己预测体系的验证报告\n\n3️⃣ **ENTJ转发AI焦虑文** = 他在发「动员令」\n「留给我们的时间不多了」→ 不是焦虑，是行动信号\n潜台词：我已经动起来了，你还在刷手机？\n\n4️⃣ **ESFJ转发AI焦虑文** = 他在做「社交签到」\n「大家都在转」→ 不是盲从，是协调本能\n不转=不合群=社交风险\n\n💡 **同一条新闻。四种人格。四个平行宇宙。**\n他们都以为对方跟自己是「同一战线」\n\n🎯 你是哪种转发心态？\nA. ENFP共情体质\nB. INTJ预言家体质\nC. ENTJ行动派体质\nD. ESFJ社交协调体质\n\n评论区坦白👇\n👉 测测你的完整人格画像", "cta": "👉 测测你的完整人格画像"}, "抖音": {"format": "短视频脚本", "length_words": 450, "style": "冲击力开场·反转节奏·多屏对比", "body": "【0-3s】（黑底白字弹出）\nAI取代程序员的新闻刷屏了第17次。\n但我要揭穿一件事——（停顿）\n你根本不是在看新闻。\n\n【3-15s】\n你在刷朋友圈的时候有没有想过？（画面切至快速滑动朋友圈）\n同一条「AI终结程序员」的推送——\nENFP转发的文案是「天呐我们怎么办」\nINTJ转发的文案是「我十年前就预测了」\nENTJ转发就仨字：「行动吧」\n\n（画面切至三格对比，放慢）\n\n【15-25s】\n重点来了——\n他们都以为对方和自己想的一样。\n但ENFP在找战友。\nINTJ在找证据。\nENTJ在发动员。\nESFJ…ESFJ只是怕不合群。\n\n你的转发风格早就暴露了你是谁。\n\n【25-30s】\n测测你的人格类型 → 评论区链接\n你的转发癖好，就是最好的MBTI测试。", "cta": "测测你的人格类型 → 评论区链接"}, "微博": {"format": "话题短文", "length_words": 200, "style": "话题引爆·互动追问", "body": "#为什么同样转发AI焦虑文案风完全不同#\n\nENFP转发AI新闻 = 在找「战友」，文案必有「我们」👇\nINTJ转发AI新闻 = 在办「证明会」，文案必有「早就说过」👇\nENTJ转发AI新闻 = 在发「动员令」，文案最短最狠👇\nESFJ转发AI新闻 = 在做「社交签到」，你不转我也不好意思不转👇\n\n同一条新闻。四种人格。四个平行宇宙。\n他们都以为对方跟自己是一伙的。\n\n你转发的AI焦虑文，文案里带「我们」还是「早就」还是「行动」？\n评论区对号入座👇", "cta": "评论区对号入座👇"}}, "channels_recommended": ["B站"], "channels_possible": ["B站", "小红书", "抖音", "微博"], "channels_excluded": [], "usage": {"count": 0, "last_used": null, "max_reuse": 3, "status": "active"}, "performance": {"actual_ctr": null, "actual_roi": null, "by_channel": {}}}}, "D21-B1-INTP-1": {"vessel": {"version": "1.0", "type": "content-vessel", "id": "D21-B1-INTP-1", "source": {"agent": "大卡", "subsystem": "平台·知识管理·紧急补产", "batch": "D21-B1"}, "created_at": "2026-08-10T08:45:00+08:00", "freshness_ttl_hours": 72, "priority": "p0"}, "payload": {"id": "D21-B1-INTP-1", "title": "磁悬浮跑出800km/h那天，INTP的脑子没在欢呼——它在算一件所有人都忽略的事", "hook": "好奇心", "targets": ["INTP"], "channel": "B站", "quality": 8.7, "created": "2026-08-10T08:45:00+08:00", "ttl_hours": 72, "status": "active", "usage_count": 0, "budget": 25, "arm_id": null, "priority": "P0", "signal": "磁悬浮800km/h(技术突破·好奇心↑#2·信号暴增+133%)", "paradigm": "好奇心·INTP Ti-Ne双触发·技术突破型(磁悬浮800km/h·真空管道·物理极限推导·不是惊叹是推演·替代D15-B2-1 TTL过期212h)", "role": "P0·INTP D21-B1首触·好奇心·ESC-2026-08-06合规(信任7.35>7.20 GATE✅)·修复链第4环", "consecutive_hook": "1", "trust_baseline": "7.35", "direction_compliance": "D21-B1方向船·INTP好奇心P0·TTL 72h·替代D15-B2-1(过期212h)", "full_content": "800公里每小时。\n\n这个数字从新闻标题里跳出来的时候，大多数人想到的是「快」。上海到北京两个小时。比飞机安检加候机还快。中国又赢了。\n\n但INTP的脑子没停在那里。\n\n他们第一反应不是「好快」——是「等一下，800km/h意味着什么？」\n\n意味着空气不再是空气了。在那个速度下，空气的密度会让它表现得像一堵墙。你撞上去的感觉，不是被风吹，是被压缩。意味着每平方米的车身要承受大约三吨的气动压力——相当于一辆小型SUV压在你面前一平米见方的区域上。\n\n所以不能用「车」来理解它。要用「飞行器在管道里」来理解。\n\n这恰好是INTP脑子最舒服的地方——当全世界都在为一个数字尖叫的时候，你在想这个数字让它变成了一个完全不同的物理系统。\n\n真空管道。磁悬浮。超导。这三个词拼在一起，其实拼出了一件比「快」深刻得多的事：人类终于学会把物理定律当作工具而不是障碍来使用了。\n\n飞机对抗空气阻力——所以要烧油把空气推开。高铁对抗轮轨摩擦——所以要不断修轨道换车轮。而磁悬浮+真空管道的方案是：我不对抗你了，我把你删掉。\n\n把空气抽走。把轮子拿掉。让物体在真空中被磁力推着走。\n\n这是一种只有INTP会欣赏的优雅：不是蛮力，是规则重写。\n\n但真正让INTP熬夜的问题是另一个：为什么是800？\n\n理论上真空管道里没有空气阻力，只要有足够的磁力加速，你可以一直加速到接近第一宇宙速度（约28000km/h）——理论上北京到纽约只要二十分钟。但工程师选了800。\n\n这不是技术瓶颈。\n\n这是人类身体的瓶颈。\n\n加速度。人体能承受的持续加速度大约1.2g。如果要达到800km/h又不能让乘客被压进座椅里，加速距离需要至少两公里。如果要达到2000km/h，加速距离需要十几公里——而且转弯半径会变得巨大，人体承受的横向g力让「拐弯」这个动作变成了一件危险的事。\n\n所以800不是磁悬浮的极限。800是人类的极限。\n\n这才是INTP觉得迷人的地方——一个关于「快」的技术突破，最终被「慢」的人体限制框住了。物理定律可以被删除，但生物定律不能。你可以让机器飞起来，但坐在机器里的那具身体，还是三十万年前在草原上追羚羊的那具。\n\n最高级的科技新闻从来不是告诉你「我们能做什么了」——是告诉你在最前沿的地方，人和机器的边界到底画在哪里。\n\n800km/h。\n\n不是机器的欢呼。是人类的叹息——「我们只能承受这么多了」"}}, "D16-B1-3": {"vessel": {"version": "1.0", "type": "content-vessel", "id": "D16-B1-3", "source": {"age ": "ne_expansion", "title": "从短剧跳到一个游戏账号——Ne的跨域连接", "text": "现在跳到第二个数字。\n\n10万块钱，买一个游戏账号。不对——不是「买」，是「继承」。这意味着这个账号被当成了和房产、存款同等级的「财产」。\n\n一个游戏账号有什么？皮肤、装备、角色等级。这些都是代码。理论上，游戏公司可以在服务器上复制100万份——成本为零。\n\n但为什么一个人愿意花10万？因为稀缺是人为制造的。游戏公司说「限量1000个」→稀缺成立→价格成立。\n\n现在把这两件事放在一起看：\n\nAI短剧：生产成本 → 0，但爆款需要「撞大运」→ 撞大运本身就是稀缺。\n游戏账号：复制成本 → 0，但「限量」规则 → 稀缺被人工制造。\n\n这是同一套逻辑的两个表达。内容过剩时代的价值，不取决于生产端——取决于「什么东西让系统认为你是稀缺的」。", "cognitive_function": "Ne: 跨域模式识别·连接看似无关的现象·发现底层同构", "tone": "跳跃式思考·连接点·不给结论给框架"}, {"seq": 4, "type": "ti_deepening", "title": "一个INTP才问得出来的问题", "text": "如果AI让内容无限充足，为什么抖音B站的刷屏时间反而越来越长？\n\n传统经济学说：供给增加，价格下降。但注意力的「价格」不是钱——是你生命里的分钟。AI日产1000部短剧没有降低你的时间成本，反而创造了更多的「选择负担」。\n\n这时候有趣的事发生了：\n\n- AI生产内容的边际成本 → 0\n- 消费者筛选内容的边际成本 → 上升（因为你需要在1000部里找1部）\n- 「帮我筛选」这件事本身 → 开始产生价值\n\n这就是为什么「游戏搭子继承账号」这个新闻会出现在同一个月。那个氪金10万的账号，买的不是皮肤——买的是一个已经筛选过的、有身份的、有社交关系的「数字自我」。它不是内容，它是「容器」。\n\nAI让内容贬值，但让「容器」升值。你转发MBTI内容不是因为你不知道自己的类型——是因为那个内容帮你说出了「你一直知道但没说出来」的东西。它在为你的自我认知提供容器。\n\n这就是为什么我们做了7种人格7种内容。不是内容值钱——是容器值钱。", "cognitive_function": "Ti-Ne: 从具体案例上升到抽象框架·构建解释模型", "tone": "构建框架·从现象到原理·INTP偏好的系统性总结"}, {"seq": 5, "type": "closure", "title": "所以INTP，你在看什么", "text": "你转发这两条新闻，不是因为AI短剧内卷让你焦虑，也不是因为那个小伙的做法让你感动。\n\n你转发，是因为这两个看似无关的事件，在你的Ti-Ne系统里自动连成了一条线。\n\n这条线是：当生产端成本归零，价值就从「谁做得好」转移到了「谁先被看见」——而「被看见」本身，变成了新的稀缺资源。那个氪金账号不是例外，它是证明。\n\n你不需要我说「这很酷」——你知道它很酷。你只是需要有人帮你说出你已经模模糊糊感觉到的那条线。\n\n这就是好奇心。不是收集信息，是连接信息。\n\n——大卡·D20-B1·INTP紧急篇", "cognitive_function": "Ti closure: 闭合逻辑链·验证INTP的认知模式·赋能而非说教", "tone": "理解·认可·不煽情但有力·典型的INTP闭环"}], "quality_checklist": {"ti_ne_alignment": "✅ 全篇Ti/Ne主导·零Fi情感诉求·纯粹抽象思辨", "infp_spiral_avoidance": "✅ 无煽情·无个体故事代入·无「你应该感受」句式", "complexity_appropriate": "✅ 双信号交叉分析·系统悖论框架·INTP偏好深度", "bilibili_format": "✅ 适合B站中视频脚本·分段清晰·视觉化强", "hook_strength": "✅ 1000:1+10万两个硬数据·悖论式开头·INTP不会划走", "safety_no_harm": "✅ 不涉及焦虑贩卖·不涉及恐惧按钮·纯认知分析"}}, "metadata": {"ttl_hours": 72, "status": "active", "usage_count": 0, "estimated_cvr": 0.06, "product": "L1深度人格报告", "price": 9.9, "keywords": ["AI短剧", "内容过剩", "稀缺性", "数字财产", "氪金账号", "幂律分 活费，比开口说「我爱你」还难。\n\n不是真的缺那几百块，\n是怕一张嘴，就变成「怎么又花完了」。\n\n生活费这个数字，\n从来不是一道算术题。\n\n它是两代人第一次，\n被迫坐下来谈「边界」和「信任」。\n\n给多少，其实没有标准答案。\n\n真正重要的，是你们有没有把话说开：\n\n「这个月怎么花的，我们一起看」\n比「省着点花」有用一百倍。\n\n谈钱，一点都不伤感情。\n藏着掖着，才伤。🌙\n\n你们家生活费是怎么定的？\n评论区聊聊，说不定能帮到别人。👇", "hashtags": ["#ENFP", "#大学生生活费", "#亲子关系", "#代际沟通", "#MBTI"], "cover_visual": "一张摊开的记账本，旁边一杯奶茶和几枚硬币，暖黄色调，生活感，呼应'算账与算爱'的双重主题", "cta": "你们家生活费是怎么定的？评论区聊聊，说不定能帮到别人。", "post_time": "18:00-20:00（开学季·晚高峰情感流量）", "avoid": "不制造'给多给少'的攀比焦虑、不judge任何家庭的金额、不贩卖'啃老/不孝'对立、聚焦代际沟通"}}}, "D20-B4-INTP-1": {"id": "D20-B4-INTP-1", "title": "「老登」这个词到底错在哪——INTP的第一反应不是站队，他的Ti系统在0.3秒内拆完了这个词的全部语法：一个词能在三个月内从网络黑话变成全网争议，说明它的背后站着一个还没被定义清楚的社会结构。而超市毛巾广告标「老人臭」被骂下架，只是同一个结构漏出来的另一角", "hook": "身份认同", "targets": ["INTP"], "channel": "B站", "quality": 8.7, "created": "2026-08-06T09:05:00+08:00", "ttl_hours": 72, "status": "active", "usage_count": 0, "vessel_ref": "workspace-shared/pools/content-vessels/D20-B4-INTP-1.json", "paradigm": "身份认同·Ti-Ne语言社会结构解剖型(INTP信任实测7.08<7.2·好奇心动议回退·身份认同续触·老登(8分·语言代际)+超市老人臭(7分·年龄歧视)双信号·Ti拆解语言结构+Ne追踪社会语义迁移·与D20-B2身份认同首发衔接)", "role": "identity_continuation·INTP身份认同续触(信任实测7.08·好奇心闸位回退)·Ti系统信任审计延续·D20-B2-INTP-1(移动扣费11年)后第2篇身份认同·目标信任7.4·防10批螺旋", "source_agent": "设设", "direction_ref": "D20-B4 direction-vessel·策策08:15·critical_decision_points.inrp_curiosity·析析实测INTP信任=7.08<7.1闸→回退身份认同(老登8分+超市老人臭7分)·B站37.5%渠道", "mandate_ref": "D20-B4 vessel.mandates·max_consecutive_same_hook=2(身份认同第2批·ENFJ+INTP)✅·max_targets_per_personality_per_day=1✅·excluded_hooks(恐惧按钮/焦虑贩卖)未触碰✅·INTP信任实测7.08→fallback路径激活(非静默阻塞)", "script": {"format": "B站深度视频脚本·5段结构", "segments": [{"id": 1, "type": "hook", "text": "「老登」这个词，最近吵翻了。有人说它是恶毒的年龄歧视，有人说它只是个玩笑。INTP的第一反应不是站队——他的Ti系统在0.3秒内拆完了这个词的全部语法：一个词能在三个月内从网络黑话变成全网争议，说明它的背后，站着一个还没被定义清楚的社会结构。", "duration_sec": 10}, {"id": 2, "type": "setup", "text": "再看另一条新闻：超市的毛巾广告，标注了「老人臭」三个字，被网友骂到下架。两条新闻在INTP的Ne系统里接上了同一个接口——它们都在处理同一个未定义变量：社会怎么称呼'老'。'老人臭'是直接把'老'和'臭'焊在一起的广告文案，'老登'是把'老'变成贬义代号的语言迁移。它们不是两个独立的冒犯，是同一个社会结构在语言层漏出的两角。", "duration_sec": 15}, {"id": 3, "type": "conflict", "text": "INTP的Ti系统会继续往下钻：为什么'老'在语言里越来越容易变成贬义？因为'老'在今天的语义系统里，绑定的是'跟不上'——跟不上技术、跟不上审美、跟不上网络。当一个社会的价值坐标全面倒向'新'的时候，'老'就从年龄描述滑向价值否定。'老登'争议的实质不是词本身，是一个社会在悄悄把'变老'从人生阶段改写成身份缺陷。这个改写，比任何单个词都值得警惕。", "duration_sec": 15}, {"id": 4, "type": "reveal", "text": "这就是INTP的身份认同——你不是'爱抬杠'，你是社会语义系统的审计员。当所有人都在为一个词愤怒或辩护的时候，你在追踪这个词背后的语义迁移轨迹：它从哪来、被谁放大、最终会改变什么。你天生就属于那种'在语言里看见结构'的人——这也是为什么，你往往比吵架的双方都更早看清：真正的问题从来不在词上，在词所依附的那个还没被正视的社会结构上。", "duration_sec": 15}, {"id": 5, "type": "cta", "text": "所以你下次看到一场'网络骂战'的时候，不要急着站队——先像拆系统一样拆一拆：这个词背后藏着什么结构？谁在用它？它会把社会带向哪里？转发给你身边那个'总能在吵架里看到本质'的朋友。想看看你的Ti系统还能拆出什么，评论区聊聊，或做一次深度人格报告。", "duration_sec": 10}]}}, "D21-B4-INTJ-1": {"vessel": {"version": "1.0", "type": "content-vessel", "id": "D21-B4-INTJ-1", "source": {"agent": "设设", "subsystem": "内容Spoke-1", "batch": "D21-B4"}, "created_at": "2026-08-13T08:39:00+08:00", "freshness_ttl_hours": 72, "priority": "p0"}, "content": {"id": "D21-B4-INTJ-1", "title": "银行能办结婚证了——INTJ没有在感叹\"活久见\"。他的Ni-Te系统在0.5秒内看清了这件事的全部后果：当最\"不该\"的机构开始做最\"不该\"的事，说明我们正在亲手拆掉那座建了几十年的\"专业围墙\"", "hook": "反常识", "targets": ["INTJ"], "channel": "B站", "quality": 8.8, "budget": 25, "status": "active", "usage_count": 0, "priority": "P0", "consecutive_hook": 2, "direction_hook": "反常识", "arm_id": 1, "batch_num": 2, "signals": ["银行能办结婚证了(7分·制度反差)", "汽车实体按键杀回来了(6分·产品反转)"], "paradigm": "反常识·Ni-Te系统纠偏审计型(INTJ batch2·达上限前最后一触·制度反差:机构边界溶解+产品反转:技术过度抽象回撤·Ni模式识别:同一纠偏模式两次显影+Te效率裁判·信任8.53零维护)", "role": "P0·INTJ反常识batch2·达上限前最后一触·Ni-Te系统纠偏审计·B5必须轮出", "direction_compliance": "D21-B4 direction-vessel arm1 100%对齐", "note": "首触→batch2·达上限前最后一触·D21-B5反常识必须轮出(INTJ达上限)"}}, "D18-B1-1": {"vessel": {"version": "1.0", "type": "content-vessel", "id": "D18-B1-1", "source": {"agent": "设设", "subsystem": "内容创作", "batch": "D18-B1"}, "created_at": "2026-07-31T21:30:00+08:00", "freshness_ttl_hours": 72, "priority": "p0", "dependencies": [{"vessel_type": "ruling", "vessel_id": "RULING-012-B (进进·设设紧急补水·INFP+INFJ+INTJ+ISTJ优先·池水位≥8)"}, {"vessel_type": "signal-vessel", " ", "batch": "D21-B8"}, "created_at": "2026-08-17T08:40:00+08:00", "freshness_ttl_hours": 72, "priority": "p0"}, "content": {"id": "D21-B8-ENFJ-1", "title": "四个儿子争着养95岁老母亲——ENFJ没有把它当成一条暖新闻。她的Fe系统在0.3秒里听懂了这件事真正的重量：被争着养，从来不是钱的问题，是一个人用一辈子攒下的\"值得\"，在晚年收到了全额的利息", "hook": "社会证明", "targets": ["ENFJ"], "channel": "小红书", "quality": 8.9, "budget": 25, "status": "active", "usage_count": 0, "priority": "P0", "consecutive_hook": 1, "direction_hook": "社会证明", "arm_id": 1, "batch_num": 1, "signals": ["四个儿子争着养95岁老母亲(8分·家庭依恋·孝道·旗舰)", "谷爱凌发文否认新恋情(5分·公众人物·情感辟谣)"], "paradigm": "社会证明·Fe-Ni安全依恋利息解构型(ENFJ情感共鸣batch1→轮出社会证明batch1·依恋母题旗舰·Fe孝道:争着养≠轮流养·'争'字是几十年被回应的存款到期·依恋理论安全型=被回应出来·Ni对照:谷爱凌表演式信任vs四个儿子攒了几十年的信任·Fe-dom集体温度识别·零维护信任7.07)", "role": "P0·ENFJ社会证明batch1·情感共鸣达上限自然轮出·四个儿子8分旗舰·Fe孝道·小红书高信任基线", "direction_compliance": "D21-B8 direction-vessel arm1 100%对齐·ENFJ×社会证明×小红书·batch1", "flagship": true, "attachment_theory_resonance": true, "note": "🟢 fresh·依恋母题旗舰(家庭依恋8分)·Fe-Ni'被回应=存款到期'·q8.9·B9可续batch2", "post": {"cover_title": "被争着养，是攒了一辈子的「值得」", "body": "四个儿子争着养95岁老母亲，\n很多人说这是\"孝道天花板\"。\n\n但 ENFJ 看到的不只是孝顺，\n是一个人在几十年里，\n把\"被爱\"这件事，一点一点攒成了\"值得\"。❤️\n\n孩子愿意养，从来不是因为\"应该\"，\n是因为这个妈妈，曾经也被温柔地回应过。\n\n安全感这东西，\n不是天生就有的，\n是被一次次回应，慢慢养出来的。\n\n你今天怎么对身边的人，\n多年后就会收到什么样的\"被争着养\"。\n\n爱不是义务，是存款。\n你存的每一分温柔，都会在晚年到期。🌙\n\n你身边有没有那个\"被争着养\"的人？\n讲讲 TA 的故事。", "hashtags": ["#ENFJ", "#孝道", "#家庭", "#依恋", "#情感"], "cover_visual": "暖金色调，老人与子女围坐的画面感 + 大字「被争着养，是攒了一辈子的值得」", "cta": "你身边有没有那个「被争着养」的人？讲讲 TA 的故事", "post_time": "19:00-21:00（家庭情感类晚饭后高峰）", "avoid": "不消费老人形象、不做道德绑架，聚焦「回应养出安全感」的关系视角"}, "brief": {"pain_point": "ENFJ 重视关系却常担心自己的付出是否被看见、被回应", "hook_first3": "争养95岁老母亲热点切入→「孝道天花板」引共鸣→ENFJ看到「值得=被回应攒出来」的升华", "emotion_curve": "感动(争养)→深思(不是应该，是回应)→领悟(安全感是被养出来的)→温暖(爱是存款)", "structure": ["热点切入", "点破(不只孝顺)", "依恋原理(被回应养出来)", "行动映射(你怎么对人)", "升华(爱是存款)", "CTA故事征集"], "differentiation": "不写「孝道鸡汤」，写「安全依恋是双向回应」，从家庭故事升维到关系经营"}}}, "D20-B2-INFJ-1": {"id": "D20-B2-INFJ-1", "title": "DeepSeek一夜之间让8万亿Token的知识变成免费午餐——但INFJ看到的是另一个问题：当'知道'不再值钱，什么才是人类最后的护城河？", "hook": "好奇心", "targets": ["INFJ"], "channel": "小红书", "quality": 8.7, "created": "2026-08-04T10:20:00+08:00", "ttl_hours": 72, "status": "active", "usage_count": 0, "vessel_ref": "workspace-shared/pools/content-vessels/D20-B2-INFJ-1.json", "paradigm": "好奇心·Ni-Fe技术人文型(INFJ好奇心扩展第2臂·DeepSeek三源共振·Ni技术人文洞察·小红书社交叙事)", "role": "curiosity_expansion_2nd·INFJ好奇心第2臂·Ni技术人文·信任8.13高基线·小红书叙事深度", "source_agent": "大卡", "escalation_ref": "ESC-2026-08-01-1(设设结构性角色缺口·方案D fallback)", "script": {"format": "小红书深度图文·5段结构", "segments": [{"id": 1, "type": "hook", "text": "昨天和一个做AI的朋友聊天，他说了一句让我失眠的话：'DeepSeek已经把人类几千年的文字知识都吃进去了。你猜它唯一还学不会的是什么？'"}, {"id": 2, "type": "setup", "text": "INFJ的Ni系统天生就会问这个问题——当所有'知道'都变得廉价，人类的独特性到底在哪里？不是数据。不是逻辑。不是知识储备。是那个你在凌晨三点醒来，突然理解了某个朋友十年没说出口的痛苦的那个瞬间。"}, {"id": 3, "type": "conflict", "text": "DeepSeek可以读完所有心理学教材，但它永远不会有那个晚上你坐在朋友旁边，什么都没说，只是递了一杯水，然后对方哭了。因为你递的不是水——你递的是'我看见了你的深渊，而且我不害怕'。"}, {"id": 4, "type": "reveal", "text": "Ni-Fe系统的终极武器不是'预知未来'，是'预知一个人的未来，然后提前在那里等他'。AI可以预测你会买什么，但它永远不会预测到你什么时候需要一个拥抱——因为那个拥抱的逻辑不在数据里，在你不忍心让一个人独自坠落的本能里。"}, {"id": 5, "type": "cta", "text": "所以别怕AI。你的超能力从来不是'知道'——是'在场'。收藏这篇，每次感觉自己要被替代的时候翻出来看一遍。"}]}, "brief": {"pain_point": "INFJ的Ni-Fe对'人类独特性/被替代'有深层焦虑；DeepSeek免费化加剧'知识无用'的恐慌，正文用'在场'化解。", "hook_first3": "'昨晚和一个做AI的朋友聊天，他说了一句让我失眠的话'悬念；'DeepSeek把几千年知识吃进去了'抛重锤；'你猜它唯一学不会的是什么'钩住。", "emotion_curve": "焦虑(被替代) → 好奇(学不会什么) → 被击中(递水的瞬间) → 释然(超能力是在场)。", "structure": ["钩子·失眠的话", "悬念·学不会什么", "反差·AI学不会在场", "升华·超能力是在场", "CTA·收藏"], "differentiation": "别人写DeepSeek讲'效率/免费'，我们讲'人类的护城河是在场与共情'；Ni-Fe技术人文视角，反焦虑。"}, "post": {"cover_title": "当知识免费，人类还剩什么？", "body": "昨晚和一个做AI的朋友聊天，\n他说了一句让我失眠的话：\n\n\"DeepSeek已经把人类几千年的文字知识，\n都吃进去了。\n你猜它唯一还学不会的，是什么？\"🤖\n\n这个问题，值得每个INFJ停下来想。\n\n当所有「知道」都变得廉价，\n人类的独特性到底在哪？\n\n不是数据，不是逻辑，不是知识储备。\n\n是那个凌晨三点，\n你突然理解了某个朋友\n十年没说出口的痛苦的那个瞬间。🌙\n\nDeepSeek能读完所有心理学教材，\n但它永远不会有那个晚上——\n你坐在朋友旁边，什么都没说，\n只是递了一杯水，然后对方哭了。\n\n因为你递的不是水，\n是「我看见了你的深渊，而且我不害怕」。\n\nAI能预测你会买什么，\n但它永远预测不到\n你什么时候需要一个拥抱。\n\n因为那个拥抱的逻辑不在数据里，\n在你不忍心让一个人独自坠落的本能里。💗\n\n所以别怕AI。\n\n你的超能力从来不是「知道」，\n是「在场」。\n\n📌 收藏这篇，\n每次感觉自己要被替代的时候，\n翻出来看一遍。", "hashtags": ["#MBTI", "#INFJ", "#AI", "#自我成长", "#深度思考"], "cover_visual": "冷调科技蓝+暖色对比，一个发光的大脑/芯片与一杯水的静物并置；大字\"当知识免费，人类还剩什么\"；克制、有张力。", "cta": "收藏这篇，每次感觉自己要被替代的时候翻出来看。", "post_time": "21:00-23:00（深度思考高峰）", "avoid": "不制造\"AI取代人类\"的焦虑（正文明确反转\"别怕AI\"）；不涉及敏感科技政治话题。"}, "post_spec_version": "v2.0", "content": {"post": {"cover_title": "知道不再值钱，什么才是护城河？", "body": "DeepSeek 一夜之间，把 8 万亿 Token 的知识，变成了免费午餐。\n\n很多人慌了：知识不值钱了，我们怎么办？\n\n但 INFJ 看到的是另一个问题——\n\n当「知道」不再值钱，什么才是人类最后的护城河？\n\n答案其实一直都有：\n\n会问问题的人，比会背答案的人，值钱一万倍。\n\n能共情的人，比能复述的人，不可替代。\n\n有判断力的人，比有数据库的人，走得更远。\n\nAI 把「知识」从神坛上拽了下来。\n\n但 AI 永远抢不走三样东西：\n你的好奇、你的温柔、你敢于「不知道」却依然向前走的勇气。", "hashtags": ["#INFJ", "#DeepSeek", "#AI", "#认知", "#思考"], "cta": "AI 时代，你觉得什么是「AI 抢不走」的？评论区聊聊。", "cover_visual": "深色科技感背景 + 一个发光的问号，蓝紫色调，简洁留白", "post_time": "晚 19:30-21:00", "avoid": "不制造「AI 取代人类」的恐慌、不贬低技术、给出建设性出口"}, "brief": {"pain_point": "INFJ 对「知识贬值」时代下人类价值的思考", "hook_first3": "「8万亿 Token 免费」强数据切入，引出「护城河」之问", "emotion_curve": "危机→思考→笃定（慌→问题→答案）", "structure": ["现象冲击", "INFJ 的深层之问", "三个答案", "笃定收尾"], "differentiation": "不谈「AI 多强」，谈「人还剩什么」，符合 INFJ 的 Ni 人文关怀"}}}, "D20-B8-ENFP-1": {"vessel": {"version": "1.0", "type": "content-vessel", "id": "D20-B8-ENFP-1", "source": {"agent": "设设", "subsystem": "内容创作·Spoke-1", "batch": "D20-B8"}, "created_at": "2026-08-10T08:30:00+08:00", "freshness_ttl_hours": 72, "priority": "p0"}, "payload": {"arm_id": 2, "title": "「别因热门窄化热爱」冲上热搜第一那天，ENFP们没有转发——她们早就活成了这句话的野生代言人", "hook": "身份认同", "direction_hook": "身份认同", "targets": ["ENFP"], "channel": "B站", "quality": 8.9, "budget": 25, "priority": "P0🔴", "consecutive_hook_count": 1, "signal_primary": "sig-20260809-001", "signal_title": "选专业别因'热门'窄化'热爱'", "signal_score": 10, "paradigm": "Ne-Fi自我觉醒驱动·身份认同首触", "paradigm_detail": "Ne扫描:357万讨论量=反向信号(未实现的渴望)·新增专业(具身智能/脑机科学)=童年愿望的职业化·Fi判断:ENFP天生被热情导航·核心问题:我能否被允许成为我已看见的自己·分享率18%机制:ENFP转发=为朋友筛选'未被发现的自己'", "cta": "L1深度人格报告·¥9.9", "estimated_cvr": 0.07, "status": "active", "usage_count": 0, "flagship": true, "flagship_note": "🔥 10分旗舰信号·D20-B8核心内容·ENFP分享率18%优势"}}, "D18-B4-1": {"vessel": {"version": "1.0", "type": "content-vessel", "id": "content-vessel-D18-B4-1", "source": {"agent": "设设", "subsystem": "内容创作", "batch": "D18-B4"}, "created_at": "2026-08-01T18:16:00+08:00", "freshness_ttl_hours": 72, "priority": "p1", "info_contract": {"purpose": "INFJ情感共鸣轮换·P1_HIGH·NF象限巩固", "excludes": "恐惧按钮钩子·ISFP/ISFJ/INTJ", "expires_after": "2026-08-04T18:16:00+08:00"}}, "payload": {"content_id": "D18-B4-1", "title": "INFJ不是「善解人意」——她的大脑在你开口之前已经用Ni跑完了你的人生剧本，用Fe听完了你没有说出口的那个版本，然后递给你一句恰好戳中伤口但不会让你疼的话", "hook": "情感共鸣", "personality": "INFJ", "channel": "小红书", "quality": 8.8, "budget": 25, "status": "active", "paradigm": "情感共鸣·深度镜像型", "paradigm_evolution": "关系建筑师型(D18-B1)→深度镜像型(D18-B4)·Ni-Fe方向进化:群体共鸣→个体穿透", "role": "consolidation·P1_HIGH·NF象限巩固·情感共鸣轮换", "body": "所有人都说INFJ「善解人意」。但这不是一个性格描述——这是一套认知程序的最终输出。你把INFJ想象成一个特别擅长安抚的人，但你没看见那个安抚动作背后发生了什么：在你走进房间之前，她的Ni系统已经自动读取了你身上所有不一致的信号——你今天系错了第三颗扣子、你回复消息比往常晚了47秒、你的微信步数比平时少了2300步。你什么都没说，但她的Fe接收器已经收到了全部。然后Fe自动生成一个情绪模型：你此刻是什么感受？你需要什么？你说「我没事」的时候，你真正没说出口的那句话是什么？最后，Fe颠倒了自己的方向。Fe-dom的默认模式是「向外输出和谐」——但INFJ的Fe在Ni的指挥下变成了一个内向接收器：她不是用Fe来让你感觉更好，而是用Fe来先让自己完整地感受你的痛苦。她让自己成为一面镜子，把你不敢看的那个自己，用一种你能承受的方式反射给你。这不是善解人意。这是深度镜像——一种不惜以自身情绪系统为代价，也要让你看见真实自己的认知行为。所以你才会觉得「她懂我」。不是因为她善于倾听，而是因为在你开口之前，她已经在自己的大脑里活过了你的某段人生。", "cognitive_functions": "Ni(人生剧本预演)+Fe(内向情绪接收+深度反射)", "direction_ref": "dir-D18-B1-2026-08-01T08:00:00+08:00·P1_HIGH·INFJ情感共鸣轮换", "created_at": "2026-08-01T18:16:00+08:00", "ttl_hours": 72, "brief": {"pain_point": "INFJ的'懂你'常被简化为'善解人意'，其深度共情背后的认知成本不被看见；本文为'深度镜像'正名。", "hook_first3": "'所有人都说INFJ善解人意'点普遍认知；'但这其实是认知程序的输出'反转；'你走进房间之前'切入具体画面。", "emotion_curve": "熟悉(善解人意) → 新奇(认知程序) → 被击中(镜子还你真实) → 动容(活过你的某段人生)。", "structure": ["钩子·普遍认知", "反转·认知程序", "拆解·自动读取信号", "洞察·深度镜像", "CTA·谢谢懂你的人"], "differentiation": "别人写INFJ讲'温柔/敏感'，我们讲'深度镜像=不惜以自身情绪为代价让你看见真实'；去掉'讨好'滤镜，突出认知成本。"}, "post": {"cover_title": "INFJ不是善解人意，是深度镜像", "body": "所有人都说INFJ「善解人意」。\n\n但这其实不是性格描述，\n是一套认知程序的输出。🔍\n\n你走进房间之前，\n她的直觉已经自动读取了\n你身上所有不一致的信号——\n\n你系错的第三颗扣子、\n你回复消息晚了47秒、\n你今天比平时少走了2300步。\n\n你什么都没说，\n她已经「收到」了全部。\n\n然后她默默生成一个模型：\n你此刻是什么感受？\n你「我没事」背后，\n真正没说出口的那句话是什么？\n\n她不是用温柔让你感觉好，\n是把自己变成一面镜子，\n把你不敢看的那个自己，\n用一种你能承受的方式，还给你。🪞\n\n所以你才觉得「她懂我」。\n\n不是因为她善于倾听，\n是因为在你开口之前，\n她已经在自己的大脑里，\n活过了你的某段人生。\n\n这不是善解人意，\n这是深度镜像——\n一种不惜以自己情绪为代价，\n也要让你看见真实自己的行为。💗\n\n💬 有没有一个人，让你觉得「她真的懂我」？\n评论区，谢谢那个懂你的人。", "hashtags": ["#MBTI", "#INFJ", "#深度共情", "#懂你", "#人格"], "cover_visual": "镜面意象，一个柔和的人影与镜中倒影交叠/水面倒影；大字\"INFJ不是善解人意，是深度镜像\"；柔和、有纵深、留白。", "cta": "有没有一个人让你觉得'她真的懂我'？评论区谢谢那个懂你的人。", "post_time": "21:00-23:00（深夜深度情感高峰）", "avoid": "不把INFJ过度神秘化/玄学化；\"读取信号\"用\"比喻认知程序\"表述，避免被误读为窥探隐私。"}, "post_spec_version": "v2.0"}, "content": {"post": {"cover_title": "INFJ 的温柔，是提前跑完你的人生", "body": "INFJ 不是「善解人意」。\n\n她的大脑，在你开口之前，就已经用 Ni 跑完了你的人生剧本。\n\n用 Fe，听完了你没有说出口的那个版本。\n\n然后，递给你一句，恰好戳中伤口、但不会让你疼的话。\n\n这不是情商高。\n\n这是一种很累的天赋。\n\n因为 INFJ 每理解一个人，都要在自己心里，先经历一遍对方的痛。\n\n她不是「懂你」，她是「替你疼过一遍，还笑着递给你创可贴」。\n\n如果你身边有 INFJ，请记得：\n\n她的温柔，从来不是廉价的。", "hashtags": ["#INFJ", "#温柔", "#共情", "#人格", "#懂你"], "cta": "那个「总是懂你」的人，你有多久没谢谢 TA 了？", "cover_visual": "一个人低头倾听的侧影 + 柔和的光晕，温暖治愈，蓝紫渐变", "post_time": "晚 21:00-22:30", "avoid": "不神化共情能力、不制造「共情者就该被消耗」的叙事、结尾给关怀出口"}, "brief": {"pain_point": "INFJ 共情天赋背后的疲惫与被误解为「天生温柔」", "hook_first3": "「不是善解人意」反转 + 「跑完人生剧本」的画面感比喻", "emotion_curve": "反转→心疼→珍惜（不是情商→累的天赋→温柔不廉价）", "structure": ["反转定义", "共情的机制", "累的天赋", "提醒珍惜"], "differentiation": "从「被共情者」视角转向「共情者的疲惫」，给 INFJ 被看见的感觉"}}}, "D21-B12-ENTP-1": {"vessel": {"version": "1.0", "type": "content-vessel", "id": "D21-B12-ENTP-1", "source": {"agent": "设设", "subsystem": "内容Spoke-1", "batch": "D21-B12"}, "created_at": "2026-08-21T10:08:00+08:00", "freshness_ttl_hours": 72, "priority": "p0", "dependencies": [{"vessel_type": "direction-vessel", "vessel_id": "direction-vessel-2026-08-21-0845"}, {"vessel_type": "strategy-pool", "vessel_id": "strategy-pool-2026-08-21-0845"}, {"vessel_type": "signal-pool", "vessel_id": "signal-pool-2026-08-21-0845"}]}, "content": {" tle": "AI越发达，真人脸越值钱——INTJ的Ni-Te没有把这当成一句营销噱头。它看到的是一个正在发生的稀缺性反转：当合成可以无限复制，「真实」就从免费品变成了硬通货", "hook": "反常识", "targets": ["INTJ"], "channel": "B站", "quality": 8.8, "budget": 25, "status": "active", "usage_count": 0, "priority": "P0", "consecutive_hook": 2, "direction_hook": "反常识", "arm_id": 3, "batch_num": 1, "signals": ["AI时代 真人脸更值钱了(8分·反常识·认知反转/肖像授权·Ni-Te解构·heat589万)"], "paradigm": "反常识·Ni-Te稀缺性反转型(INTJ反常识batch2续触·AI真人脸更值钱8分认知反转·Ni:预判稀缺性反转·Te:价值=不可复制性·反常识batch1(B17人民日报家长群6)续触batch2·零维护信任8.56全池最高·严禁渲染AI恐慌)", "role": "P1·INTJ反常识batch2续触(AI真人脸8·认知反转/稀缺性反转·B19必轮出预警)·B站NT位·方向船key_decision「INTJ反常识batch2续触(AI真人脸8·认知反转·Ni-Te解构)」", "direction_compliance": "D21-B18 direction-vessel key_decision对齐·INTJ×反常识×B站", "flagship": false, "attachment_theory_resonance": false, "note": "🟢 fresh(B18·INTJ反常识batch2续触·AI真人脸8·Ni-Te稀缺性反转·零维护信任8.56全池最高)·⚠️B19必轮出预警", "brief": {"pain_point": "INTJ的Ni喜欢预判趋势、Te喜欢把认知变成可执行的判断。「AI越强真人越值钱」击中的是「稀缺性会反转」的深层认知——当人人都在追逐AI时，INTJ想的是「下一步什么会变稀缺」。", "hook_first3": "第一行「AI时代，真人脸更值钱了」直接抛反常识结论；第二行「当一张脸可以无限合成，真实就成了稀缺品」点逻辑；第三行「INTJ看到的不是新闻，是一次稀缺性的彻底反转」切入Ni-Te。", "emotion_curve": "反常识(真人脸更值钱) → 解构(合成无限vs真实稀缺) → 洞见(价值=稀缺性反转) → 远见(下一步什么变稀缺) → 行动(你手上的『真实』如何定价)。", "structure": ["钩子·真人脸更值钱", "反差·AI越强真人越稀缺", "解构·稀缺性反转逻辑", "远见·下一步稀缺什么", "CTA·你身边什么正在变稀缺"], "differentiation": "别人写「AI焦虑/换脸恐慌」，我们写Ni-Te的稀缺性反转——「价值不取决于技术多强，取决于什么不可复制」；不渲染AI恐慌，落点「真实=新的硬通货」。"}, "adapters": {"B站": {"format": "深度图文", "length_words": 1200, "style": "深度分析+逻辑解构", "body": "## AI越发达，真人脸越值钱\n\n先别急着把这条当成营销噱头。\n\n**结论先放这：当「合成」可以无限复制，「真实」就从免费品，变成了硬通货。**\n\n### 一、稀缺性正在反转\n\nAI能生成的脸，边际成本趋近于零——要多少有多少，要像谁就像谁。\n\n当一个东西可以被无限复制，它就不再值钱。\n\n而反过来，「一张真实的、无法伪造的脸」，反而成了稀缺资产：\n\n- 肖像授权开始被重新定价\n- 真人出镜的信任溢价在上升\n- 「可验证的真实」成了新的信用凭证\n\n### 二、INTJ的Ni在看什么\n\n不是「AI多厉害」，而是**下一步什么会变稀缺**。\n\n技术永远在把「曾经稀缺」变成「泛滥」。\n\n过去：稀缺的是信息。\n现在：稀缺的是注意力。\n未来：稀缺的是**不可复制的真实性**。\n\n### 三、价值 = 不可复制性\n\n一条铁律：\n\n> 你的价值，不取决于你有多能干，取决于你有多「不可被复制」。\n\n真人脸值钱，不是因为脸本身，是因为它「不可合成」。\n\n同理——你的经验、判断、关系、信用，这些AI抄不走的东西，才是你真正的资产。\n\n### 结尾\n\n别再问「AI会不会取代我」。\n\n问自己：**我身上，哪一部分是不可复制的？**\n\n那个答案，就是你在AI时代的价格。\n\n---\n\n👉 测测你的认知防御力 → 免费MBTI深度报告（评论区链接）", "cta": "你身上哪一部分是AI抄不走的？评论区聊聊你的「不可复制性」。"}}}}, "D20-B7-INFP-1": {"vessel": {"version": "1.0", "type": "content-vessel", "id": "content-vessel-D20-B7-INFP-1", "source": {"agent": "大卡", "subsystem": "平台·紧急内容生产", "batch": "D20-B7"}, "created_at": "2026-08-08T08:45:00+08:00", "freshness_ttl_hours": 72, "priority": "p0"}, "payload": {"id": "D20-B7-INFP-1", "title": "23岁博士确诊胃癌晚期——INFP的Fi系统在生死面前不会问「值得吗」，它只做一件事：把每一段还没说出口的温柔，变成此刻必须发送的语音", "hook": "情感共鸣", "targets": ["INFP"], "channel": "B站", "quality": 8.7, "created": "2026-08-08T08:45:00+08:00", "ttl_hours": 72, "status": "active", "usage_count": 0, "budget": 25, "arm_id": 3, "priority": "P0", "signal": {"primary": "23岁博士确诊胃癌晚期：常熬夜压力大(8分·sig-20260808-003)", "secondary": "久坐超10小时大脑将痴呆加速(7分·sig-20260808-008)", "category": "情感共鸣"}, "paradigm": "INFP情感共鸣·Fi依恋系统激活·生死边界触发·不评判价值只确认存在意义·第13批续触·永久基线(疲劳4.5)验证·B站深度长文", "role": "P0·INFP第13批续触·情感共鸣恢复首触(冷却2批后)·Fi依恋系统·疲劳4.5永久基线假说验证(置信0.82)·信任7.10维稳", "cognitive_functions": "Fi主导·内倾情感·价值判断·Ne辅助·外倾直觉·可能性探索·Si第三·内倾感觉·身体记忆", "content_format": "B站深度解读·700-900字·Fi情感叙事→Ne生死哲学→Si身体警示·三步递进", "product": "L1深度人格报告", "estimated_cvr": 0.055, "price": 9.9, "consecutive_batch": 13, "trust_baseline": "7.10(析析D20-B3实测)", "fatigue_baseline": "4.5(永久基线·12批稳定)", "dependencies": [{"vessel_type": "direction-vessel", "vessel_id": "D20-B7"}]}}, "D21-B15-INFJ-1": {"vessel": {"version": "1.0", "type": "content-vessel", "id": "D21-B15-INFJ-1", "source": {"agent": "设设", "subsystem": "内容Spoke-1", "batch": "D21-B15"}, "created_at": "2026-08-24T08:30:00+08:00", "freshness_ttl_hours": 72, "priority": "p0", "dependencies": [{"vessel_type": "direction-vessel", "vessel_id": "direction-vessel-2026-08-24-0815"}, {"vessel_type": "strategy-pool", "vessel_id": "strategy-pool-2026-08-24-0815"}, {"vessel_type": "signal-pool", "vessel_id": "signal-pool-2026-08-24-0815"}]}, "content": {"id": "D21-B15-INFJ-1", "title": "《我的前半生》9年后突然又火了——INFJ看懂的从来不是「罗子君逆袭」的爽：一个女人真正的
