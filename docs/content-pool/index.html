<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>内容池 · 实时数据</title>
<style>
:root{--bg:#080b11;--surface:#111620;--surface2:#161b26;--border:#212836;--fg:#e1e4eb;--muted:#6e7687;--accent:#6366f1;--accent2:#8b5cf6;--green:#22c55e;--yellow:#eab308;--red:#ef4444;--orange:#f97316;--cyan:#06b6d4}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:14px/1.5 system-ui,-apple-system,sans-serif;padding:16px;max-width:1600px;margin:0 auto}
a{color:var(--accent)}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px}
.top h1{font-size:16px;display:flex;align-items:center;gap:8px}
.top .sub{font-size:11px;color:var(--muted)}
.top .live{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--green)}
.live .dot{width:8px;height:8px;background:var(--green);border-radius:50%;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.banner{background:#3a1d1d;border:1px solid #5c2a2a;border-radius:8px;padding:10px 14px;font-size:12px;margin-bottom:12px;color:#fca5a5;white-space:pre-wrap}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px;text-align:center}
.stat .val{font-size:22px;font-weight:700;line-height:1.2}
.stat .lbl{font-size:10px;color:var(--muted);margin-top:2px}
.stat.crit .val{color:var(--red)}
.stat.ok .val{color:var(--green)}
.stat.warn .val{color:var(--yellow)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.toolbar select,.toolbar input{background:var(--surface);border:1px solid var(--border);color:var(--fg);border-radius:6px;padding:6px 10px;font-size:12px;outline:none}
.toolbar input[type=text]{min-width:200px}
.toolbar .count{font-size:11px;color:var(--muted);margin-left:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px;cursor:pointer;transition:all .15s;display:flex;flex-direction:column;gap:8px}
.card:hover{border-color:var(--accent);transform:translateY(-1px)}
.card .cid{font-size:10px;color:var(--muted);font-family:ui-monospace,monospace}
.card .title{font-size:12.5px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.badges{display:flex;flex-wrap:wrap;gap:4px}
.badge{font-size:9px;padding:2px 7px;border-radius:10px;border:1px solid var(--border);color:var(--muted);white-space:nowrap}
.badge.hook{background:#1a1f2e;color:var(--cyan);border-color:var(--cyan)}
.badge.target{background:#1a1f2e;color:var(--accent2);border-color:var(--accent2)}
.badge.channel{background:#1a1f2e;color:var(--yellow);border-color:var(--yellow)}
.badge.active{background:#0d2b16;color:var(--green);border-color:var(--green)}
.badge.deployed{background:#1a2a3d;color:#60a5fa;border-color:#60a5fa}
.badge.conflict{background:#3a1d1d;color:var(--red);border-color:var(--red)}
.badge.post{background:#3a2a1d;color:var(--orange);border-color:var(--orange)}
.card .meta{display:flex;gap:12px;font-size:10px;color:var(--muted);flex-wrap:wrap}
.meta b{color:var(--fg);font-weight:600}
.q{font-weight:700}
.q.hi{color:var(--green)}.q.mid{color:var(--yellow)}.q.lo{color:var(--red)}.q.zero{color:var(--muted)}
.empty{grid-column:1/-1;background:var(--surface);border:1px dashed var(--border);border-radius:10px;padding:40px;text-align:center;color:var(--muted)}
.empty .icon{font-size:40px;margin-bottom:8px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-start;justify-content:center;z-index:100;padding:30px;overflow-y:auto}
.modal-bg.open{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:12px;max-width:720px;width:100%;padding:20px;margin:auto}
.modal h2{font-size:15px;margin-bottom:10px;line-height:1.5}
.modal .field{margin-bottom:10px;font-size:12px}
.modal .field .k{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.5px;margin-bottom:2px}
.modal .field .v{white-space:pre-wrap;line-height:1.6}
.modal .close{float:right;background:var(--surface2);border:1px solid var(--border);color:var(--fg);border-radius:6px;padding:4px 10px;cursor:pointer;font-size:12px}
.kv{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.kv .badge{font-size:10px;padding:3px 9px}
.posts-wrap{margin-bottom:16px}
.posts-head{display:flex;align-items:baseline;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.posts-head h2{font-size:14px;color:var(--orange);display:flex;align-items:center;gap:6px}
.posts-head .sub{font-size:11px;color:var(--muted)}
.posts-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:12px}
.post{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px}
.post .xhs-cover{background:linear-gradient(135deg,#2d1b2e,#1b2d3a);border-radius:8px;padding:18px 14px}
.post .xhs-cover-title{font-size:18px;font-weight:700;line-height:1.4;color:var(--fg)}
.post .xhs-meta{color:var(--muted);font-size:12px;margin-top:6px;display:flex;gap:10px;flex-wrap:wrap}
.post .xhs-body{font-size:14px;line-height:1.75;color:var(--fg)}
.post .xhs-tags{display:flex;gap:6px;flex-wrap:wrap}
.post .xhs-tags .tag{color:#58a6ff;font-size:12px}
.post .xhs-cta{color:var(--muted);font-size:13px;border-top:1px dashed var(--border);padding-top:8px}
.post .xhs-extra summary{cursor:pointer;color:var(--muted);font-size:12px;user-select:none}
.post .xhs-extra-body{font-size:12px;color:var(--muted);line-height:1.7;margin-top:8px}
.post .xhs-extra-body b{color:var(--fg)}
.post .xhs-extra-body hr{border:none;border-top:1px solid var(--border);margin:8px 0}
.tabs{display:flex;gap:8px;margin-bottom:14px;border-bottom:1px solid var(--border)}
.tab{background:none;border:none;border-bottom:2px solid transparent;color:var(--muted);padding:10px 16px;font-size:13px;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:6px}
.tab:hover{color:var(--fg)}
.tab.active{color:var(--fg);border-bottom-color:var(--accent);font-weight:600}
.tab .tcount{font-size:10px;background:var(--surface2);color:var(--muted);border-radius:10px;padding:1px 8px}
.tab.active .tcount{background:var(--accent);color:#fff}
</style>
</head>
<body>
<div class="top">
  <div>
    <h1>📚 内容池 · 实时数据</h1>
    <div class="sub">数据源 workdpace-notes/3.2 笔记-水池/3.2.d 内容池（选题·成品帖子·效果指标 md 笔记）· 由设设/投投产出</div>
  </div>
  <div class="live"><span class="dot"></span><span id="live-info">加载中…</span></div>
</div>

<div id="banner"></div>
<div class="stats" id="stats"></div>

<div class="tabs">
  <button class="tab active" id="tab-posts" type="button">🍠 成品帖子 <span class="tcount" id="posts-count"></span></button>
  <button class="tab" id="tab-dirs" type="button">📋 创作方向 <span class="tcount" id="dirs-count"></span></button>
</div>

<div class="tab-panel" id="panel-posts">
<div class="posts-wrap" id="posts-wrap">
  <div class="posts-head">

  </div>
  <div class="posts-grid" id="posts-grid"></div>
</div>
</div>

<div class="tab-panel" id="panel-dirs" style="display:none">
<div class="toolbar">
  <select id="f-hook"><option value="">全部钩子</option></select>
  <select id="f-channel"><option value="">全部渠道</option></select>
  <select id="f-target"><option value="">全部人格</option></select>
  <select id="f-status"><option value="">全部状态</option></select>
  <select id="f-quality">

    <option value="hi">≥ 8.8</option>
    <option value="mid">8.0–8.7</option>
    <option value="lo">&lt; 8.0</option>
    <option value="zero">未评分(0)</option>
  </select>
  <input type="text" id="f-search" placeholder="搜索标题 / ID / 内容关键词…">
  <span class="count" id="count"></span>
</div>

<div class="grid" id="grid"></div>
<div class="empty" id="empty" style="display:none"><div class="icon">🔍</div>没有匹配的内容</div>
</div>

<div class="modal-bg" id="modal-bg">
  <div class="modal" id="modal">
    <button class="close" onclick="closeModal()">✕ 关闭</button>
    <h2 id="m-title"></h2>
    <div class="kv" id="m-badges"></div>
    <div id="m-body"></div>
  </div>
</div>

"quality": 8.7, "status": "active", "created": "2026-07-28T18:15:00+08:00", "budget": "", "flagship": false, "attachment_theory_resonance": false, "batch": "D14-B1", "producer": "设设", "paradigm": "", "role": "", "direction_compliance": "", "note": "", "brief": {"pain_point": "INFJ/INFP/INTJ共同痛点——过度依赖外界认可、持续'证明自己'的内耗；周星驰的'不享受镜头'是'停止证明'的样本。", "hook_first3": "'周星驰说：我老了，不享受镜头了'点事件；'很多人当告别'摆反应；'但它不是认输，是证明模式关机'反转。", "emotion_curve": "好奇(告别?) → 被点醒(证明模式) → 共鸣(前半生都在证明) → 释然(可以不证明了)。", "structure": "钩子·事件 / 反转·证明模式关机 / 共鸣·我们都曾在证明 / 洞察·MBTI与停止证明 / CTA·你在为什么证明", "differentiation": "别人写周星驰'老了'，我们讲'停止证明自己'的解放；用MBTI视角把明星事件转成自我成长提问。"}, "has_post": true}], "total": 203, "posts": [{"id": "D21-B25-INFP-1", "title": "下班后，我总要在车里多坐十分钟", "channel": "小红书", "hook": "情感共鸣", "targets": ["INFP"], "quality": 9.0, "status": "active", "post": {"cover_title": "下班后，我总要在车里多坐十分钟", "body": "你有没有过这种时刻：\n车已经停到楼下，\n手却迟迟没有去拉车门。🚗\n\n不是不想回家，\n是想先变回自己。\n\n白天是打工人，\n要回消息、要接住情绪、\n要扮演一个「靠谱的成年人」。\n\n只有那十分钟，\n没有消息、没有角色，\n只有安静和音乐。🎵\n\n以前我总觉得自己矫情，\n都到家门口了还不下车。\n\n后来才懂：\n那不是在逃避，\n是在过渡。\n\n在「打工人」和「真实的自己」之间，\n我需要一个不被任何人打扰的缓冲带。\n\n独处不是孤僻，\n是把自己接回来。\n\n先把自己变回自己，\n再推开那扇门。🚪\n\n💬 你也有属于你自己的「十分钟」吗？\n是车里、是楼道，还是别的什么地方？\n评论区说说，我懂你。", "hashtags": ["#下班独处", "#自我关怀", "#INFP", "#独处", "#情绪价值"], "cover_visual": "低饱和蓝灰色调(夜色+车内暖光对比)，主视觉用「驾驶座里一个人望向窗外」的侧影，配一句「先变回自己，再回家」的手写体，留白大、氛围安静克制，避免鸡汤高饱和风", "cta": "你也有属于你自己的「十分钟」吗？是车里、是楼道，还是别的什么地方？评论区说说，我懂你。", "post_time": "18:00-20:00（情感/自我关怀向·晚间下班情绪高峰）", "avoid": "不渲染婚姻/家庭对立、不写「逃避家庭/责任」、不做两性对立、不用「男人/女人都累」式煽动；落点「独处是自我重建/过渡空间」正向角度，避免被解读为对家人的抱怨"}, "brief": {"pain_point": "INFP每天在『必须扮演的成年人』和『真实的自己』之间来回切换，最耗竭的不是工作本身，是『没有一刻属于自己』。下班后把车停在楼下多坐十分钟，戳中的正是INFP对『内在空间』的渴望——不是不想回家，是需要在推开家门前，先把那个被打工耗尽的人缓一缓、变回自己。INFP停留，是因为这印证了Fi最深的信念：独处不是孤僻，是自我存在的必要呼吸。", "hook_first3": "第一行『下班后，为什么总想在车里多坐十分钟』抛出真实场景；第二行『不是不想回家，是想先变回自己』点破反差；第三行『INFP看懂了：那十分钟，是打工人和真实自己之间唯一的过渡空间』切入Fi边界。", "emotion_curve": "疲惫(被生活塞满) → 停顿(车里的安静) → 共鸣(独处是自我重建) → 释然(不必愧疚) → 温暖(给自己几分钟是被允许的)。", "structure": "钩子·车内独处场景 / 背景·为什么到家门口却不下车 / 洞察·过渡空间=自我边界的刚需 / 迁移·独处是成为自己的前奏 / CTA·你也有属于自己的『十分钟』吗", "differentiation": "别人写『车里独处』是贩卖中年婚姻疲惫/逃避家庭；我们写Fi的『过渡空间』——不把独处写成对家人/责任的逃避，而写成『把自己接回来』的自我关怀；落点正向，让INFP看见的不是一个想逃的人，而是一个在认真对待自己内在世界的人。"}, "realizes": ["D21-B25-INFP-1"]}, {"id": "D21-B25-ENFP-1", "title": "48岁才懂：迟一点长大也没关系", "channel": "小红书", "hook": "身份认同", "targets": ["ENFP"], "quality": 8.9, "status": "active", "post": {"cover_title": "48岁才懂：迟一点长大也没关系", "body": "48岁的倪虹洁说了一句话，\n很多人听完就松了绑。🌱\n\n她说：迟一点长大也没关系。\n\n我们好像一直活在一张时间表里：\n25岁该稳定，\n30岁该成熟，\n40岁该定型。\n\n没按表走，\n就会焦虑、会自责、\n会觉得自己「掉队」了。\n\n可是长大这件事，\n从来不是按时打卡。⏳\n\n有人20岁就想明白了，\n有人48岁才刚开窍，\n这不丢人。\n\n成长不是和别人比速度，\n是按自己的节奏开花。\n\n你不需要追上任何人的时间表，\n你只需要对自己的节奏诚实。\n\n迟一点长大，\n是终于敢承认：\n我的节奏，由我定。✨\n\n💬 你被哪一种「年龄期待」压得最累？\n评论区聊聊，也许我们都该给自己松松绑。", "hashtags": ["#自我成长", "#年龄焦虑", "#ENFP", "#自我接纳", "#人生节奏"], "cover_visual": "柔和奶油色调(低饱和+一点暖黄)，主视觉用「一支慢慢绽开的花」极简插画，配一句「迟一点长大也没关系」的手写体，留白舒适、治愈不鸡汤，呼应「慢下来」的节奏感", "cta": "你被哪一种「年龄期待」压得最累？评论区聊聊，也许我们都该给自己松松绑。", "post_time": "12:00-13:00 或 18:00-20:00（女性成长/自我接纳向·午间或晚间情绪高峰）", "avoid": "不贩卖年龄焦虑、不做「30岁就该怎样」式恐吓、不制造女性/婚姻对立、不贬低「按部就班」的人；落点「按自己的节奏成为自己」正向角度，避免被解读为否定他人选择"}, "brief": {"pain_point": "ENFP最怕被『社会时钟』推着走——多少岁该稳定、多少岁该成熟、多少岁该定型。『48岁倪虹洁说迟一点长大也没关系』戳中的正是ENFP对『自我节奏』的捍卫：成长不是按年龄打卡，是按内心的节奏开花。ENFP停留，是因为这句话替他们说出了那句憋了很久的『我不想被催着长大，我想按自己的速度成为自己』。", "hook_first3": "第一行『48岁倪虹洁说：迟一点长大也没关系』摆出反年龄焦虑金句；第二行『一句话，替多少人松了绑』点共鸣；第三行『ENFP看懂了：长大不是按时打卡，是按自己的节奏开花』切入Fi自我接纳。", "emotion_curve": "焦虑(被社会时钟追赶) → 松动(她说没关系) → 共鸣(我也有自己的节奏) → 释然(不必愧疚) → 自由(我的节奏由我定)。", "structure": "钩子·金句点题 / 背景·年龄焦虑的社会时钟 / 洞察·成长=按内心节奏 / 迁移·迟一点长大是自我接纳 / CTA·你被什么年龄期待压过", "differentiation": "别人写倪虹洁是娱乐圈怀旧/年龄话题蹭热度；我们写Fi的『自我接纳』——不贩卖年龄焦虑、不做励志鸡汤，落点『按自己的节奏成为自己』；让ENFP看见的不是一个女明星的保养秘诀，而是一个普通人对时间表的温柔反抗。"}, "realizes": ["D21-B25-ENFP-1"]}, {"id": "D21-B25-ENTJ-1", "title": "别问自己到没到顶，问自己还想不想打", "channel": "微博", "hook": "身份认同", "targets": ["ENTJ"], "quality": 8.6, "status": "active", "post": {"cover_title": "别问自己到没到顶，问自己还想不想打", "body": "郑钦文说：「我的巅峰期还在后面。」\n\n一句话，她把冠军变成了起点。\n\n大多数人夺冠后的第一反应，是终于能松一口气——「我到了」。\n\n郑钦文不是。她刚站上一个高峰，眼睛已经望向下一座。\n\n这不是谦虚，也不是客套。这是 Te 的本能：**把「现在」当成进行时，把「巅峰」当成未完成时。**\n\nENTJ 最怕的从来不是失败，是「到顶了」。\n\n失败可以复盘、可以再打；「到顶了」意味着没有上升空间了，意味着接下来只能守成、不能进攻。\n\n守成，对 Te 来说，是最无聊的活法。\n\n所以郑钦文这句话真正的分量，不在她的成绩，而在她定义「巅峰」的方式——\n\n**巅峰不是年龄，不是名次，是野心还在不在。**\n\n野心还在，35 岁、40 岁、50 岁，都是上升期；\n\n野心没了，20 岁就已经开始走下坡。\n\n这就是长期主义最锋利的地方：它不是「慢慢来」的自我安慰，而是「永远有下一仗要打」的自我驱动。\n\n很多人会问：「我是不是已经过了最好的时候？」\n\n这个问题本身就是答案。\n\n会问的人，往往还想要，只是不敢承认；真正到顶的人，不会问，只会停。\n\n郑钦文给了一个更干脆的参照：\n\n**别问自己「到没到顶」，问自己「还想不想打」。**\n\n还想打，你的巅峰期就还没到。\n\n不想打了，你才真正老了。\n\n那么，你的巅峰期——是已经过了，还是还没开始？", "hashtags": [], "cover_visual": "", "cta": "", "post_time": "20:00-22:00（晚间情绪/自我成长向）", "avoid": "不做胜负复盘、不蹭夺冠热度、不情绪煽动；落点「野心不灭则巅峰永续」正向"}, "brief": {"pain_point": "ENTJ把人生当成一个不断进攻的项目，最怕的不是失败，是『到顶了、没上升空间了』。郑钦文一句『我的巅峰期还在后面』，戳中的正是ENTJ对『长期主义』的信仰——真正的高手永远把巅峰放在未来，因为只要野心还在，天花板就不存在。ENTJ停留，是因为这句话替他们确认了那条最深的信念：成绩是路标，不是终点。", "hook_first3": "第一行『郑钦文说：我的巅峰期还在后面』点出宣言；第二行『一句话，把冠军变成了起点』点反差；第三行『ENTJ看懂了：巅峰期的定义不是年龄，是野心还在不在』切入Te长期主义。", "emotion_curve": "战意(赛场宣言) → 认同(巅峰是进行时) → 共鸣(我的野心也没退) → 坚定(天花板不存在) → 昂扬(继续进攻)。", "structure": "钩子·宣言点题 / 背景·冠军之后怎么走 / 洞察·巅峰=野心还在不在 / 迁移·长期主义的自我驱动 / CTA·你的巅峰期，你认为到了吗", "differentiation": "别人写郑钦文是体育战报/励志鸡汤/蹭夺冠热度；我们写Te的『长期主义』——不做胜负复盘、不做情绪煽动，落点『野心不灭则巅峰永续』；让ENTJ看见的不是一个冠军的荣耀，而是一种『永远把未来当成战场』的心法。"}, "realizes": ["D21-B25-ENTJ-1"]}, {"id": "D21-B24-INFP-1", "title": "被围观到动手，他剪掉了流量", "channel": "小红书", "hook": "社会证明", "targets": ["INFP"], "quality": 8.4, "status": "active", "post": {"cover_title": "被围观到动手，他剪掉了流量", "body": "葫芦爷爷火了，\n火到他不得不动手。✂️\n\n他剪的不是葫芦，\n是把他围成打卡点的流量喧嚣。\n\n有人觉得可惜，\n有人觉得他太倔。\n\n但我看懂了：\n他剪掉的是别人强加给他的戏。🌿\n\n流量想让他一直演下去，\n演一个「网红爷爷」。\n\n可他从头到尾，\n只想安安静静种他的葫芦。\n\n这一次，大家都站在他这边。\n不是可怜他，\n是终于懂了——\n一个人有权对流量说不。\n\n本真从来不是活成别人想看的样子，\n是在被围观的时候，\n依然有底气把门关上。🚪\n\n💬 你有没有哪一刻，\n特别想把喧嚣关在门外？\n评论区聊聊，我懂你。", "hashtags": ["#葫芦爷爷", "#个人边界", "#INFP", "#本真", "#拒绝流量"], "cover_visual": "低饱和治愈系配色(暖灰+一点藤蔓绿)，主视觉用『一双手剪断一根流量线』的极简插画，配一句『回归安静』的手写体，留白大、情绪克制，呼应『关上门』的安静感，避免网红高饱和风", "cta": "你有没有哪一刻，特别想把喧嚣关在门外？评论区聊聊，我懂你。", "post_time": "18:00-20:00（情感/本真向·晚间情绪高峰）", "avoid": "不消费当事人、不渲染网暴对立、不站队拉踩、不用『老人可怜』式煽情；落点『本真/个人边界/回归安静』正向角度"}, "brief": {"pain_point": "INFP最怕被『围观着活成一个模板』。葫芦爷爷剪葫芦的瞬间，戳中的正是INFP对『个人边界』的本能捍卫——当流量把一个人变成打卡点，继续配合就是出卖自己。公众这一次站爷爷这边、理解他剪葫芦维护安静，等于社会终于承认了『一个人有权对流量说不』。INFP停留，是因为这印证了Fi最深的信念：本真比被喜欢更重要。", "hook_first3": "第一行『葫芦爷爷剪的不是葫芦，是流量喧嚣』点出反讽；第二行『他被围观到不得不动手』交代被消费的处境；第三行『INFP看懂了：他剪掉的是别人强加给他的戏』切入Fi边界。", "emotion_curve": "心疼(被围观绑架) → 释然(他动手了) → 共鸣(本真胜过流量) → 坚定(边界值得捍卫) → 温暖(回归安静是选择)。", "structure": "钩子·反讽点题开场 / 背景·流量如何把老人变成打卡点 / 洞察·剪葫芦=夺回个人边界 / 迁移·本真是被围观时还能说不 / CTA·你有没有想关掉喧嚣的时刻", "differentiation": "别人写葫芦爷爷玩梗/猎奇/蹭流量热点；我们写Fi的『本真边界』——不消费当事人、不渲染对立，落点『回归安静是一种主动选择』；把『剪葫芦』还原成一次关于个人边界的公共讨论，让INFP看见的不是一个网红老头，而是一个不肯被流量驯化的普通人。"}, "realizes": ["D21-B24-INFP-1"]}, {"id": "D21-B23-INTP-1", "title": "40年前的蛇精，突然被全网追着打卡", "channel": "小红书", "hook": "好奇心", "targets": ["INTP"], "quality": 8.3, "status": "active", "post": {"cover_title": "40年前的蛇精，突然被全网追着打卡", "body": "最近「葫芦娃爷爷」火了，\n连「蛇精」都来打卡。🐍\n\n不是爷爷本人，\n是当年那部动画里的角色，\n突然被年轻人玩成了新梗。\n\n作为一个爱琢磨的人，\n我忍不住拆解一下：\n为什么偏偏是「蛇精」？🧠\n\n40年过去了，\n我们记得最牢的，\n不是主角的正能量，\n而是那个妖艳又笨拙的反派。\n\n因为反派有「人味」，\n有缺点、会翻车、\n会喊出那句魔性台词。\n\n怀旧从来不是回到过去，\n是给过去一个当代的注脚。📝\n\n我们怀念的也不是那部动画，\n是那个还能被一部动画逗笑的自己。\n\n💬 你童年里最难忘的一个反派是谁？\n评论区说说，看看我们是不是同一代人。", "hashtags": ["#葫芦娃", "#童年回忆", "#INTP", "#怀旧", "#文化梗"], "cover_visual": "复古高饱和配色(经典葫芦娃粗线条+撞色)，主视觉用蛇精卡通剪影+现代「打卡」手势的拼贴，文字排版用像素/复古字体，带一点「爷青回」的俏皮感，避免沉重怀旧色调", "cta": "你童年里最难忘的一个反派是谁？评论区说说，看看我们是不是同一代人。", "post_time": "12:00-13:00 或 18:00-20:00（文化怀旧/轻松向·午间或下班高峰）", "avoid": "不渲染代际对立/年龄焦虑、不玩梗过度低俗、不消费老一辈、不用『落伍/过时』式焦虑标题；落点『怀旧=给过去当代注脚/童真的自己』"}, "brief": {"pain_point": "INTP以Ne-Ti为根基，遇到任何「火得莫名其妙」的现象都忍不住拆解它的机制。葫芦娃爷爷爆火、『蛇精』来打卡，对INTP的吸引力不在「怀旧情怀」，而在于『一个40年前的符号，为什么会在今天被重新激活』这个解构命题。INTP停留，是因为好奇这件事「怎么火起来的」。", "hook_first3": "第一行『葫芦娃爷爷爆火，蛇精都来打卡』抛出荒诞反差；第二行『一个40年前的动画角色，突然被玩成新梗』点出时间跨度；第三行『INTP忍不住拆解：为什么偏偏是蛇精？』切入Ne-Ti。", "emotion_curve": "荒诞(这也火) → 好奇(凭什么火) → 拆解(集体记忆如何编码) → 恍然(怀的是童真的自己) → 温柔(给过去一个注脚)。", "structure": "钩子·荒诞反差开场 / 反叙事·40年前的符号翻红 / 洞察·集体记忆被重新编码成流量 / 迁移·我们怀念的是童真的自己 / CTA·你童年最难忘的反派", "differentiation": "别人写葫芦娃玩梗/怀旧煽情/贩卖年龄焦虑，我们写Ne-Ti的『文化现象解构』——不渲染代际对立，落点『怀旧=给过去一个当代注脚』；把『蛇精翻红』还原成『一次集体记忆的再编码』，让INTP看见的不是怀旧，而是一个可拆解的文化样本。"}, "realizes": ["D21-B23-INTP-1"]}, {"id": "D21-B21-INFJ-1", "title": "24岁抗癌博主走了，却教会我活", "channel": "小红书", "hook": "情感共鸣", "targets": ["INFJ"], "quality": 8.9, "status": "active", "post": {"cover_title": "24岁抗癌博主走了，却教会我活", "body": "小詹走了，年仅24岁。🕯️\n\n不是一条新闻，\n是一个年轻人认真活过的证据。\n\n她生病的时候，\n没有躲起来，\n而是把每一天都拍下来、写下来，\n告诉陌生人：要好好吃饭，要好好活。\n\nINFJ会忍不住想：\n如果生命的长度不由我，\n那意义的密度呢？🌱\n\n我们总以为来日方长，\n把想做的事、想说的话，\n都推到「以后」。\n\n可她用24年告诉我们：\n生命的意义，\n从来不在长度，\n而在密度。\n\n把今天活成光，\n就是对「以后」最好的回答。✨\n\n💬 如果你知道生命有时限，\n你最想先做的那件事是什么？\n评论区告诉我，我们互相提醒。", "hashtags": ["#抗癌博主", "#INFJ", "#生命的意义", "#珍惜当下", "#自我成长"], "cover_visual": "温柔暖色调(浅米白+一点暖黄光)，画面留白处手写体『把今天活成光』，主视觉是一束照进房间的晨光或一株向上生长的植物，避免任何悲伤压抑的死亡意象", "cta": "如果你知道生命有时限，你最想先做的那件事是什么？评论区告诉我，我们互相提醒。", "post_time": "20:00-22:00（生命/自我成长类·晚间情绪共鸣时段）", "avoid": "不消费逝者(不晒病情细节/不渲染死亡过程)、不用『可怕/惋惜』式恐惧标题、不贩卖健康焦虑、不引导『及时行乐』极端消费；落点『生命意义/珍惜当下/向死而生』"}, "brief": {"pain_point": "INFJ对生命意义有天然的深度追问(Ni)，同时对他人苦难有极强的共情(Fe)。一个24岁抗癌博主的离世，会同时击中INFJ的两个软肋——对『生命如此短暂』的虚无感，和对『这个年轻人曾如何用力活过』的心疼。INFJ停留，不是因为这是一条新闻，而是一次关于『我们该如何活着』的叩问。", "hook_first3": "第一行『24岁，抗癌博主小詹，走了』直接陈述事实；第二行『不是一条新闻，是一个年轻人认真活过的证据』点出视角；第三行『INFJ会忍不住想——如果生命的长度不由我，那意义的密度呢？』切入Ni-Fe。", "emotion_curve": "心疼(那么年轻) → 敬意(她用力活过) → 沉思(生命的意义不在长度) → 温柔(珍惜当下) → 行动(把今天活成光)。", "structure": "钩子·事实开场 / 反叙事·不是新闻是证据 / 洞察·意义在密度不在长度 / 迁移·珍惜当下 / CTA·你如何珍惜今天", "differentiation": "别人写死亡博眼球/渲染悲伤/消费逝者，我们写Ni-Fe的『向死而生』——不渲染恐惧，落点『生命的意义不在长度而在密度』；把『离世』还原成『她如何用力活过』，让INFJ看见的不是死亡，而是活着的方式。"}, "realizes": ["D21-B21-INFJ-1"]}, {"id": "D20-B2-2", "title": "你的一句「我没事」，INFJ看懂了", "channel": "小红书", "hook": "情感共鸣", "targets": ["INFJ"], "quality": 0, "status": "active", "post": {"cover_title": "你的一句「我没事」，INFJ看懂了", "body": "你有没有说过\"我没事\"，\n然后在某个深夜，眼泪突然掉下来？\n\nINFJ 大概是最早看穿这句话的人。\n不是读心术，\n是她在你的语气里，听到了你没说出口的暗流。🌊\n\n\"我没事\"从来不是没事，\n是把情绪按下去，假装它不存在。\n\n可情绪不会消失，\n它只是躲起来，等一个更脆弱的时刻反扑。\n\n真正强大的，不是永远没事，\n是敢承认\"我现在不太好\"。\n\n如果今天你也说了\"我没事\"，\n我想告诉你：其实你可以不用那么懂事。🤍\n\n那个总在安慰别人的人，\n这次轮到你了。", "hashtags": ["#INFJ", "#情感共鸣", "#共情", "#情绪管理", "#自我关怀"], "cover_visual": "灰蓝色调，一人深夜坐窗边剪影 + 大字「你的一句我没事，我看懂了」，温柔留白", "cta": "那个总说「我没事」的人，你最近还好吗？", "post_time": "21:00-23:00（情绪共鸣类深夜高峰）", "avoid": "不贩卖焦虑、不强化「INFJ注定孤独」的刻板印象，落点是自我关怀"}, "brief": {"pain_point": "INFJ 过度共情他人却忽视自己，习惯性压抑情绪、报喜不报忧", "hook_first3": "「我没事」这种人人有共鸣的场景切入→「深夜眼泪」画面感→「INFJ最早看穿」引出主角", "emotion_curve": "共鸣(我没事)→被看穿(有人懂)→释放(情绪会反扑)→温柔(你不用那么懂事)", "structure": "共鸣场景 / INFJ看穿 / 情绪真相(不会消失) / 观点(强大=敢承认) / 温柔收束 / CTA关怀", "differentiation": "不写「INFJ是读心术」的神秘化，写「共情者也需要被关怀」，从「读懂别人」回到「看见自己」"}, "realizes": ["D20-B2-2"]}, {"id": "D21-B20-INTJ-1", "title": "分数，从来不是你的定义", "channel": "小红书", "hook": "身份认同", "targets": ["INTJ"], "quality": 8.7, "status": "active", "post": {"cover_title": "分数，从来不是你的定义", "body": "你是不是也曾经，\n用一次考试、一个分数，\n给自己判过刑？\n\n「我考砸了，所以我完蛋了」\n「我没进名校，所以我不行」\n\n但这届年轻人说：\n分数，只是人生的一次计量。\n它衡量的是那一次，\n不是你整个人。📏\n\nINTJ太懂这种拧巴了：\n你想把一切做到最优，\n于是把别人的标尺，\n当成了自己的标准。\n\n可真正的独立，\n不是考得比谁都高，\n而是把评价自己的权利，\n从别人手里拿回来。\n\n你的价值，\n不该由一张成绩单盖章。\n它该由你自己定义。✨\n\n💬 你有没有被一个分数\n「定义」过的瞬间？\n评论区聊聊，\n你后来是怎么拿回主动权的。", "hashtags": ["#不被分数定义", "#MBTI", "#INTJ", "#自我成长", "#人生选择"], "cover_visual": "一张被撕开一角的成绩单 + 留白处手写体「你自己定义」；冷调蓝白 + 一点暖黄高对比", "cta": "你有没有被一个分数「定义」过的瞬间？评论区聊聊你后来是怎么拿回主动权的。", "post_time": "18:00-20:00（自我成长/身份认同类·晚间深度阅读时段）", "avoid": "不贬低考试/学历/名校的价值（避免「读书无用论」对立）；不渲染分数焦虑；落点「自主定义/边界」，规避成功学鸡汤"}, "brief": {"pain_point": "INTJ的Ni追求「长远的掌控与独立」，但从小被分数/排名这套外部评价体系规训，内心始终在「我要做到最优」和「这标准到底是谁定的」之间拉扯。这届年轻人不被分数定义人生，击中的是INTJ最深的渴望——把评价权拿回自己手里。", "hook_first3": "第一行「这届年轻人说：不被分数定义人生」直接点题；第二行「很多人以为这是躺平，其实恰恰相反」破除误读；第三行「INTJ看到的不是反学历，是『独立』这个词的真正含义」切入Ni-Te。", "emotion_curve": "共鸣(被分数规训过) → 松动(标准是别人定的) → 清醒(独立=拿回评价权) → 笃定(我自己定义价值) → 行动(写下你的定义)。", "structure": "钩子·不被分数定义 / 误读·这不是躺平 / 洞察·独立=拿回评价权 / 迁移·你也被什么标尺困住 / CTA·你如何定义自己", "differentiation": "别人写「分数无用论」或「高考逆袭」，我们写Ni-Te的「评价权独立」——不贬低考试的价值，落点「把标尺从别人手里拿回来」；把「不被定义」还原成「自主定义」，让INTJ看见掌控感其实在自己手里。"}, "realizes": ["D21-B20-INTJ-1"]}, {"id": "D21-B19-ENFP-1", "title": "他们也是孩子，却选择了向前", "channel": "小红书", "hook": "情感共鸣", "targets": ["ENFP"], "quality": 8.9, "status": "active", "post": {"cover_title": "他们也是孩子，却选择了向前", "body": "刷到这条新闻的时候，\n我眼眶一下子热了。\n\n一群群众，哽咽着送别救援人员。\n有人喊出那句：\n「他们也是孩子，\n却为我们冲锋陷阵。」🥹\n\n脱下那身衣服，\n他们和你的弟弟、同学、朋友，\n没什么两样。\n也会怕，也会想家，\n也会在深夜偷偷掉眼泪。\n\n可到了那一刻，\n害怕和勇敢，\n从来不是反义词。\n\n真正的勇敢，\n是心里装着怕，\n腿却还是迈了出去。🚶‍♂️\n\nENFP太懂这种感觉了：\n你心里也有一个\n「想冲上去」的瞬间，\n只是还没被喊出来。\n\n那不是渺小，\n那是你还没认领的光。✨\n\n💬 你生命里有没有过\n「害怕却依然做了」的时刻？\n评论区说出来，\n那是你真实的力量。", "hashtags": ["#致敬救援人员", "#平凡人的力量", "#MBTI", "#ENFP", "#自我成长"], "cover_visual": "救援人员背影与人群送行剪影 + 逆光暖色调；大字「他们也是孩子」；橙色+深蓝高对比", "cta": "你生命里有没有过「害怕却依然做了」的时刻？评论区说出来，那是你真实的力量。", "post_time": "18:00-20:00（正能量/共鸣类·晚间情绪高峰）", "avoid": "不消费苦难、不渲染悲壮牺牲、不贬低未参与救援的人；落点「平凡人的担当/害怕与勇敢并存」，规避「英雄神话」套路化"}, "brief": {"pain_point": "ENFP的Fi渴望确认「我的人生有意义、我的选择有价值」，但在宏大叙事里总觉得自己渺小、觉得「英雄」离自己很远。救援群像击中的是：英雄不是天生的超人，是普通人在关键时刻选择了向前——这正是ENFP内心深处最渴望确认的「平凡人的力量」。", "hook_first3": "第一行「他们也是孩子，却为我们冲锋陷阵」直接引用群众送行时的哽咽原话；第二行「脱下那身衣服，他们和你的弟弟、同学、朋友没什么两样」拉近距离；第三行「ENFP看到的不只是感动，是『害怕和勇敢从来不是反义词』」切入Ne-Fi。", "emotion_curve": "心疼(他们也是孩子) → 敬畏(依然选择向前) → 共鸣(平凡人的担当) → 热血(我也可以成为别人的光) → 行动(认出自己那份没被喊出的勇气)。", "structure": "钩子·他们也是孩子 / 反差·英雄是普通人 / 洞察·害怕与勇敢并存 / 迁移·你生命里的冲锋时刻 / CTA·说出你曾经「害怕却做了」的事", "differentiation": "别人写「致敬英雄/煽情泪点」，我们写Ne-Fi的「平凡人担当」——不消费苦难、不渲染牺牲的悲壮，落点「真正的勇敢是带着害怕向前」；把「英雄」还原成「也会害怕的普通人」，让ENFP看见自己身上同样有那份光。"}, "realizes": ["D21-B19-ENFP-1"]}, {"id": "D21-B18-ENFP-1", "title": "82岁拿下世界冠军，年龄只是数字", "channel": "小红书", "hook": "情感共鸣", "targets": ["ENFP"], "quality": 9.0, "status": "deployed", "post": {"cover_title": "82岁拿下世界冠军，年龄只是数字", "body": "刷到这条新闻的时候，\n我盯着「82岁」看了很久。\n\n一个中国老人，\n在韩国的赛道上，\n拿下了跨栏世界冠军。🏅\n\n有人会说：\n82岁了，还折腾什么？\n安享晚年不好吗？\n\n可他的起跑线告诉你：\n年龄是日历上的数字，\n不是人生赛道的终点线。🚩\n\nENFP太懂这种痛了：\n从小到大，\n总有人告诉你「这个年纪该干嘛」。\n\n25岁该稳定，\n30岁该结婚，\n40岁该认命……\n\n可你心里那团没灭的火，\n才是你真实的年龄。🔥\n\n想做的事，\n从来不需要等到「合适的年纪」。\n\n你现在心里惦记的那件，\n「等我准备好了再说」的事，\n就是你还活着的最好证明。\n\n💬 那件你一直想做、\n却总觉得「来不及了」的事，\n是什么？\n评论区说出来，\n我们一起出发。", "hashtags": ["#82岁跨栏冠军", "#自我成长", "#MBTI", "#ENFP", "#别被年龄定义"], "cover_visual": "跑道上白发老人跨栏冲刺剪影 + 金色晨光逆光；大字『82岁，照样起跑』；暖金+深蓝高对比", "cta": "那件你一直想做却总说「来不及了」的事是什么？评论区说出来，我们一起出发。", "post_time": "12:00-13:00（自我成长类·午间情绪高峰）", "avoid": "不贩卖年龄焦虑、不渲染悲情、不贬低「按部就班」的人生选择；落点「可能性/真实自我」，规避「不服老」鸡汤套路化"}, "brief": {"pain_point": "ENFP的Ne渴望可能性、Fi渴望「活成真实的自己」，但现实里总被「什么年纪该做什么事」的框架束缚。82岁跨栏夺冠击中的是「可能性不该被年龄封印」——这正是ENFP最痛、也最渴望挣脱的枷锁。", "hook_first3": "第一行「82岁，中国老人，在韩国拿下跨栏世界冠军」摆事实；第二行「82岁该干嘛？有人说该安享晚年，他选择了起跑线」点反差；第三行「ENFP看到的不只是励志，是『真实的你，从来不该被年龄定义』」切入Ne-Fi。", "emotion_curve": "震撼(82岁夺冠) → 反常识(年龄vs可能) → 热血(心里那团火) → 笃定(活成真实自我) → 行动(现在就去做那件『不敢』的事)。", "structure": "钩子·82岁夺冠 / 反差·年龄≠终点线 / 洞察·没灭的火才是真实年龄 / 迁移·你被什么封印了 / CTA·那件你一直想做没做的事", "differentiation": "别人写「不服老鸡汤/养生励志」，我们写Ne-Fi的可能性解放——「年龄是日历的刻度，不是灵魂的边界」；不贩卖年龄焦虑、不渲染悲情，落点「真实的自我永远有资格出发」。"}, "realizes": ["D21-B18-ENFP-1"]}, {"id": "D21-B18-ISTJ-1", "title": "扶老人被讹1.9万，监控还他清白", "channel": "小红书", "hook": "社会证明", "targets": ["ISTJ"], "quality": 8.8, "status": "deployed", "post": {"cover_title": "扶老人被讹1.9万，监控还他清白", "body": "这事看得我血压都上来了。\n\n一个店主，\n看到老人摔倒，\n上去扶了一把。\n\n结果反手被索赔1.9万。😤\n\n「不是你撞的，你为什么要扶？」\n\n这句最伤人的话，\n差点让他百口莫辩。\n\n好在，店里的监控，\n完整记下了全过程。\n\n最终，\n他收到了全额退款，\n也等来了清白。\n\nISTJ会告诉你：\n这不是「好人有好报」的鸡汤。\n\n这是规则和证据，\n在关键时刻，\n替善意兜了底。🧭\n\n善意不该靠运气，\n该靠规则托底。\n\n该做的事，\n从来不会因为被误解，\n就变成错的。\n\n💬 你遇到过\n「做了好事却被误解」的时候吗？\n后来，\n公道还给你了吗？\n评论区说说。", "hashtags": ["#社会正能量", "#扶不扶", "#MBTI", "#ISTJ", "#规则与正义"], "cover_visual": "便利店监控画面构图 + 老人与店主对视的暖色场景；大字『善意，有规则托底』；冷灰监控框 + 暖色人物", "cta": "你遇到过「做了好事却被误解」的时候吗？后来公道还给你了吗？评论区说说。", "post_time": "18:00-20:00（社会话题类·晚间讨论高峰）", "avoid": "不渲染「扶不扶」对立焦虑、不道德绑架、不做「好人没好报」负面暗示；落点「规则与证据托底善意」"}, "brief": {"pain_point": "ISTJ的Si依赖规则、秩序和「做了正确的事就该有正确的结果」。扶老人反被索赔击中的是「做好事却被规则反噬」的恐惧——而最终全额退款，正是ISTJ最渴望的「规则终将主持公道」。", "hook_first3": "第一行「扶起摔倒的老人，反被索赔1.9万」摆冲突；第二行「店里的监控，最后帮他还了清白」点反转；第三行「ISTJ看到的不是鸡汤，是『规则和证据，是善意最后的护栏』」切入Si。", "emotion_curve": "愤怒(好人被讹) → 憋屈(百口莫辩) → 反转(监控+全额退款) → 笃定(规则主持公道) → 安心(该做的事还是要做)。", "structure": "钩子·扶老人被索赔 / 冲突·善意被误解 / 反转·监控+全额退款 / 洞察·规则是善意的护栏 / CTA·你遇到过善意被误解吗", "differentiation": "别人写「好人有好报/社会道德」，我们写Si的规则感——「善意不该靠运气，该靠规则和证据托底」；不贩卖对立、不渲染「扶不扶」焦虑，落点「规则终将主持公道」。"}, "realizes": ["D21-B18-ISTJ-1"]}, {"id": "D21-B17-ISTJ-1", "title": "自学考进交大，他靠什么", "channel": "小红书", "hook": "情感共鸣", "targets": ["ISTJ"], "quality": 9.0, "status": "deployed", "post": {"cover_title": "自学考进交大，他靠什么", "body": "刷到这条新闻的时候，\n我停了三秒。\n\n一个少年，没人看着，\n自己把自己送进了上海交大。\n\n姐姐在镜头前哽咽，\n说「他自己熬过来的」。\n\n没有补习班，\n没有家长天天盯，\n全靠自己。😭\n\nISTJ会告诉你：\n这从来不是一条爽文。\n\n真正的自律，\n不是有人管才努力，\n是没人看的时候，\n你依然按自己的秩序走。🧭\n\n把日子过成清单，\n把目标拆成每天一点点，\n把「我该」变成「我想」。\n\n这就是最硬核的底气。\n\n他不是天才，\n他只是把「没人管」\n过成了「自己说了算」。\n\n💬 你靠什么，\n撑过没人看着你的那段日子？\n评论区聊聊。", "hashtags": ["#自学逆袭", "#自律", "#MBTI", "#ISTJ", "#自我成长"], "cover_visual": "深夜台灯下伏案学习的少年剪影 + 姐姐哽咽的虚化侧影；大字『没人管，才见真自律』；蓝灰冷调 + 一点暖黄灯光", "cta": "你靠什么，撑过没人看着你的那段日子？评论区聊聊你的答案。", "post_time": "12:00-13:00（教育/成长类·午间学习场景高峰）", "avoid": "不渲染寒门悲情、不制造教育焦虑、不贬低应试/鸡娃；落点「自我秩序/自律」，规避「逆袭神话」夸大"}, "brief": {"pain_point": "ISTJ的Si依赖「可预期的秩序」带来安全感；「没人管的孩子自学考上交大」击中的是「在无序环境里，一个人如何靠自己建立秩序」——这正是Si最敬佩、也最需要的确定性。", "hook_first3": "第一行「少年『自学』考上上海交大，姐姐当场哽咽」摆事实；第二行「没有补习班、没有家长盯，全靠自己熬」点反差；第三行「ISTJ看到的不是爽文，是自律背后最硬核的秩序：没人看着，你依然按自己的节奏走」切入Si。", "emotion_curve": "惊叹(自学逆袭) → 心疼(姐姐哽咽/没人管) → 敬佩(自律秩序) → 笃定(靠自己建立秩序) → 行动(我也能守住自己的节奏)。", "structure": "钩子·自学考上交大 / 细节·姐姐哽咽的亲情锚点 / 洞察·自律=自己管自己的秩序 / 迁移·没人监督时的自我秩序 / CTA·你靠什么撑过低谷", "differentiation": "别人写「寒门逆袭/教育焦虑/鸡娃对照」，我们写Si秩序感——「自律不是苦情，是把没人管的日子过成自己说了算的秩序」；不贩卖教育焦虑、不渲染寒门悲情、落点「自我秩序」这条ISTJ最信的东西。"}, "realizes": ["D21-B17-ISTJ-1"]}, {"id": "D21-B16-ISTJ-1", "title": "扶老人不担责，公道到了", "channel": "小红书", "hook": "社会证明", "targets": ["ISTJ"], "quality": 8.7, "status": "deployed", "post": {"cover_title": "扶老人不担责，公道到了", "body": "前几天那个新闻，\n你刷到了吗？\n\n店主好心帮扶老人，\n结果被卷进纠纷。\n\n很多人第一反应是：\n「以后谁还敢做好事？」😔\n\n直到官方出来确认——\n店主不担责。\n\n这句话，\n比任何安慰都重。\n\n因为它守住的，\n不是一个人，\n是一条社会底线：\n好人好事，不该被辜负。\n\nISTJ会告诉你：\n公道不是口号，\n是这个社会最硬的秩序。🧭\n\n规则存在的意义，\n就是让对的人，\n不必寒心；\n让守规矩的人，\n永远有底气。\n\n这个结果，\n不是给一个人的交代，\n是给所有「想做好人」的人，\n一颗定心丸。\n\n💬 如果是你，\n现在还敢扶吗？\n评论区聊聊。", "hashtags": ["#社会公道", "#好人好事", "#MBTI", "#ISTJ", "#正能量"], "cover_visual": "暖色系·普通店主搀扶老人的侧影剪影 + 大字『公道到了，好人不怕』；干净、有温度、正向感", "cta": "如果是你，现在还敢扶吗？评论区聊聊你的答案。", "post_time": "18:00-20:00（社会议题·晚间情感共鸣高峰）", "avoid": "不放大『扶老人被讹』的对立情绪、不消费涉事双方、不渲染负面；用『公道闭环』正向角度，规避『碰瓷/讹诈』等敏感词"}, "brief": {"pain_point": "ISTJ的Si依赖「秩序与规则」带来安全感；「做好事反被讹」会动摇TA对社会底线的信任，「官方确认不担责」恰好修复这份秩序感。", "hook_first3": "第一行「帮扶老人的店主，官方确认不担责」摆结论；第二行「这句确认，比任何安慰都重」点社会意义；第三行「ISTJ看到的是：好人好事不该被辜负，公道是最硬的秩序」切入Si秩序感。", "emotion_curve": "担忧(会被讹吗) → 安心(官方确认) → 笃定(公道闭环) → 秩序(社会底线) → 行动(敢做好事)。", "structure": "钩子·官方确认不担责 / 背景·帮扶老人被讹 / 洞察·公道是社会的秩序 / 迁移·好人好事不该被辜负 / CTA·你还敢扶吗", "differentiation": "别人写「扶老人被讹/法律争议/情绪对立」，我们写Si秩序闭环——「公道不是口号，是社会运行的底线」；不煽动对立、不道德绑架、落点秩序感。"}, "realizes": ["D21-B16-ISTJ-1"]}, {"id": "D21-B15-ENFP-1", "title": "38岁考大学，39岁年级第一", "channel": "小红书", "hook": "身份认同", "targets": ["ENFP"], "quality": 9.0, "status": "deployed", "post": {"cover_title": "38岁考大学，39岁年级第一", "body": "38岁，他去考了大学。🎓\n\n身边很多人不理解：\n「这个年纪了，折腾什么？」\n\n39岁，\n他考了年级第一。\n\n一年时间，\n从「门外汉」到「第一名」，\n他不是天才，\n只是比任何人都想证明一件事——\n\n人生，从来没有太晚的开始。\n\n我们总爱给自己设限：\n「25岁该稳定了」\n「30岁该结婚了」\n「35岁来不及了」……\n\n但这些「该」，\n是谁定的呢？\n\nENFP知道，\n真正的自我觉醒，\n不是等到万事俱备，\n而是永远不对自己说\n「太晚了」。\n\n38岁去考大学，\n不是任性，\n是他忠于自己。\n39岁考第一，\n不是奇迹，\n是他从未放弃自己。💛\n\n年龄只是一个数字，\n它拦不住真正想活出自己的人。\n\n别让「太晚了」，\n成为你唯一的人生答案。\n\n💬 你有没有一个\n「别人都说太晚了，但你还是去做了」的决定？\n评论区，说给我听。", "hashtags": ["#自我觉醒", "#MBTI", "#ENFP", "#人生不设限", "#自我成长"], "cover_visual": "中年男人伏案读书的背影 + 成绩单「年级第一」特写，暖金色调、坚定不煽情，大字『人生没有太晚』", "cta": "你有没有一个「别人都说太晚了，但你还是去做了」的决定？评论区讲给我听。", "post_time": "12:00-13:00（午间励志情绪高峰）", "avoid": "不贩卖年龄焦虑、不贬低年轻/早慧路径、不渲染「逆天改命」夸张情绪；聚焦「不设限」的自我觉醒正面能量"}, "brief": {"pain_point": "ENFP的Fi最怕被「年龄/阶段」的规训困住——「这个年纪该稳定了」「来不及了」；38岁考大学、39岁年级第一，证明「忠于自己」从不受年龄设限。", "hook_first3": "第一行「38岁，他去考了大学」抛反差；第二行「39岁，他考了年级第一」再翻一层；第三行「很多人说太晚了，但他用一年证明：太晚是假的，太早放弃才是真的」切入Fi自我觉醒。", "emotion_curve": "惊讶(38岁考大学) → 佩服(年级第一) → 反思(年龄规训) → 共鸣(忠于自己) → 热血(不设限)。", "structure": "钩子·38岁考大学 / 反差·39岁年级第一 / 洞察·年龄规训是幻觉 / 升华·自我觉醒=不对自己说太晚 / CTA·你被「太晚了」拦住过吗", "differentiation": "别人写「大器晚成/励志鸡汤/逆天改命」，我们写Fi自我觉醒——「不设限不是鸡汤，是每一次都不对自己说『太晚』」；正面励志、绝不judge年龄与人生节奏。"}, "realizes": ["D21-B15-ENFP-1"]}, {"id": "D21-B15-ISTJ-1", "title": "总觉得累？可能是秋乏", "channel": "小红书", "hook": "好奇心", "targets": ["ISTJ"], "quality": 8.6, "status": "deployed", "post": {"cover_title": "总觉得累？可能是秋乏", "body": "最近总觉得累，🚶\n做什么都提不起劲。\n\n早上起不来，\n下午昏昏沉沉，\n连平时喜欢的事都懒得碰。\n\n你的第一反应，\n是不是又在心里骂自己：\n「我是不是太懒了？」\n\n先别急着怪自己。\n\n这个季节的累，\n大概率是——秋乏。🍂\n\n入秋之后，\n气温下降、昼短夜长，\n身体在悄悄「换季」，\n新陈代谢也在调整节奏。\n\n这种时候，\n累不是你的意志问题，\n是身体在按它的节律走。\n\n所以，\n别再用「再坚持一下」硬撑，\n而是顺着节律，\n早睡一点，\n动一动，\n给自己一点缓冲的时间。\n\nISTJ会告诉你：\n规律不是苦行，\n是听懂身体的语言。💛\n\n累是身体的信号，\n不是意志的失败。\n\n照顾好自己的节奏，\n比硬扛更重要。\n\n💬 你最近也总觉得累吗？\n评论区说说，\n是秋乏，还是没睡够？", "hashtags": ["#秋乏", "#健康科普", "#MBTI", "#ISTJ", "#自我关怀"], "cover_visual": "秋日窗边一杯温水 + 一本翻开的书，暖棕色调、松弛感，大字『累≠懒，是身体在换季』", "cta": "你最近也总觉得累吗？评论区说说，是秋乏还是没睡够。", "post_time": "12:00-13:00 或 18:00-20:00（实用科普·午间/晚间阅读高峰）", "avoid": "不做疾病诊断暗示、不夸大「秋乏=重病」、不贩卖健康焦虑、不替代专业医疗建议；用「身体的信号」实用科普角度"}, "brief": {"pain_point": "ISTJ的Si最依赖「规律/节律」，「总累」会打破TA的掌控感；「秋乏=换季节律」的解释让TA重新拿回身体的规律感。", "hook_first3": "第一行「最近总觉得累，做什么都提不起劲」点共鸣；第二行「先别急着怪自己懒」摆自judge；第三行「可能是秋乏，身体在换季」给Si节律解释。", "emotion_curve": "疲惫(共鸣) → 松一口气(不是懒) → 掌控(节律解释) → 调整(顺应换季) → 踏实(照顾自己)。", "structure": "钩子·总累共鸣 / 去自责·不是懒 / 节律·秋乏=换季 / 落地·顺应节律调整 / CTA·你秋天最容易累吗", "differentiation": "别人写「养生偏方/补品/吓唬你生病」，我们写Si节律认知——「累是身体的信号，不是意志的失败」；实用科普、不恐吓、不替代医疗建议。"}, "realizes": ["D21-B15-ISTJ-1"]}, {"id": "D21-B14-ISTJ-1", "title": "总犯困？可能不是上班累的", "channel": "小红书", "hook": "好奇心", "targets": ["ISTJ"], "quality": 8.6, "status": "deployed", "post": {"cover_title": "总犯困？可能不是上班累的", "body": "你最近是不是，\n动不动就犯困？\n\n早上起不来，\n下午像被抽干，\n代谢也感觉变慢了。\n\n你的第一反应是：\n「哎，就是上班太累了。」\n\n但身体可能想告诉你，\n不是累，\n是缺了东西。🔍\n\n数据显示，\n我国有42%的人，\n优质蛋白质摄入不足。\n\n蛋白质不够，\n人就会容易累、\n容易犯困、\n代谢也跟着慢下来。\n\n身体不会说话，\n但它会用「累」，\n给你发信号。\n\n所以下次犯困，\n先别急着怪工作，\n问问自己：\n「今天的蛋白质，吃够了吗？」\n\n早餐加个鸡蛋，\n午餐多吃点肉蛋奶，\n把「累」当成身体的提醒，\n而不是你的错。💪\n\n规律不是苦行，\n是听懂身体的语言。\n\n💬 你每天早上的第一顿，\n会吃蛋白质吗？\n评论区，晒出你的早餐。", "hashtags": ["#健康认知", "#蛋白质", "#MBTI", "#ISTJ", "#健康科普"], "cover_visual": "一张清爽的早餐图（鸡蛋+牛奶+全麦面包），旁边一行大字『犯困≠懒』；简洁实用风、低饱和配色、留白", "cta": "你每天早上的第一顿会吃蛋白质吗？评论区晒出你的早餐。", "post_time": "12:00-13:00 或 18:00-20:00（实用科普·午间/晚间阅读高峰）", "avoid": "不做疾病诊断暗示、不夸大「缺蛋白=重病」、不贩卖健康焦虑、不替代专业医疗建议；用「身体的信号」实用科普角度"}, "brief": {"pain_point": "ISTJ的Si重视身体的规律与秩序，最烦「明明休息够了还是累」的失控感；「犯困可能不是累，是缺蛋白质」给出了一个可执行、可验证的答案，正中ISTJ对「找到原因就解决它」的偏好。", "hook_first3": "第一行「你最近是不是，动不动就犯困」直接戳日常；第二行「你的第一反应是『上班太累了』」点破惯性归因；第三行「但身体想告诉你：不是累，是缺了东西」制造认知反转。", "emotion_curve": "共鸣(真的老犯困) → 意外(不是累) → 恍然(是缺蛋白质) → 踏实(有解) → 行动(调整饮食)。", "structure": "钩子·犯困日常 / 反转·不是累是缺蛋白 / 科普·42%优质蛋白不足 / 落地·早餐加点蛋奶 / CTA·你的早餐吃蛋白吗", "differentiation": "别人写犯困是「贩卖焦虑/吓唬你生病/推销保健品」，我们讲「把『累』当身体的信号，用一顿早餐解决」；Si落点「规律不是苦行，是听懂身体的语言」，实用科普、不恐吓、不替代医疗建议。"}, "realizes": ["D21-B14-ISTJ-1"]}, {"id": "D21-B14-ENFP-1", "title": "她放弃本科，8年后回来专升本", "channel": "小红书", "hook": "身份认同", "targets": ["ENFP"], "quality": 8.8, "status": "deployed", "post": {"cover_title": "她放弃本科，8年后回来专升本", "body": "她做了一个让全家都反对的决定。\n\n放弃本科，去当兵。\n\n很多人说：\n「好好的大学不读，图什么？」\n\n8年后，\n她又做了一个「回头」的决定——\n军士专升本，重新读书。\n\n看起来，\n她好像绕了一个大圈。\n\n但ENFP看到的，\n是另一件事：\n\n人生从来不是一条直线。\n\n真正的「自我觉醒」，\n不是一次就选对，\n而是每一个岔路口，\n都敢停下来问自己：\n「我到底想要什么？」\n\n18岁选当兵，\n是她忠于那时的自己。\n26岁回来读书，\n是她忠于现在的自己。\n\n两个选择都不「错」，\n因为选择本身，\n就是在一步步走近自己。💛\n\n别怕走弯路。\n\n那些你以为的弯路，\n其实都是，\n你走向自己的必经之路。\n\n💬 你有没有一个，\n「当时没人理解，但我不后悔」的选择？\n评论区，说给我听。", "hashtags": ["#自我觉醒", "#MBTI", "#ENFP", "#人生选择", "#自我成长"], "cover_visual": "身穿军装的女兵侧影，与书桌前伏案的女生背影，中间一条折返的光带路径；暖色调、坚定不煽情；大字『人生不是直线』", "cta": "你有没有一个「当时没人理解，但我不后悔」的选择？评论区说给我听。", "post_time": "12:00-13:00（午间励志情绪高峰）", "avoid": "不judge学历选择、不贬低任何人生路径、不制造「读本科无用」对立；聚焦「每个选择都是走向自己」的自我觉醒正面能量"}, "brief": {"pain_point": "ENFP的Fi渴望「忠于自己」的自由，最怕被「读大学才是正路」「年龄到了该怎样」的规训困住；女兵「先当兵、再专升本」的折返路径，恰好证明「忠于自己」可以发生在人生的每个岔路口。", "hook_first3": "第一行「她做了一个让全家都反对的决定——放弃本科，去当兵」抛冲突；第二行「8年后，她又做了一个『回头』的决定，回来读书」制造折返反差；第三行「看起来绕了一大圈，其实是她在一步步走近自己」切入Fi自我觉醒。", "emotion_curve": "好奇(为什么放弃) → 佩服(敢选) → 触动(回头也需要勇气) → 共鸣(忠于自己) → 温暖(每个选择都算数)。", "structure": "钩子·放弃本科去当兵 / 折返·8年后回来读书 / 洞察·人生不是直线 / 升华·自我觉醒是每次诚实 / CTA·你不后悔的一次选择", "differentiation": "别人写女兵讲「军旅励志/学历逆袭/女强人」，我们讲「自我觉醒不是一次选对，是每次岔路都敢对自己诚实」；Fi落点「每个选择都是走向自己」，正面励志、绝不judge学历与人生路径。"}, "realizes": ["D21-B14-ENFP-1"]}, {"id": "D21-B13-ENFP-1", "title": "62岁，她生下了健康男婴", "channel": "小红书", "hook": "反常识", "targets": ["ENFP"], "quality": 8.8, "status": "deployed", "post": {"cover_title": "62岁，她生下了健康男婴", "body": "62岁。\n\n她生下了一个6斤的健康男婴。👶\n\n产科主任说，\n自己从没接诊过这个年纪的产妇。\n\n很多人第一反应是：\n「这不可能吧？」\n\n但ENFP看到的，\n是另一层东西——\n\n所谓「生命边界」，\n从来不是年龄那一栏数字，\n而是一个人，\n还敢不敢对「可能」两个字点头。\n\n我们总被一种声音追着跑：\n「什么年纪，就该做什么事」。\n\n好像过了某个点，\n人生的可能性就自动关机了。\n\n可这个孩子用第一声啼哭告诉你：\n生命这件事，\n从来不认时钟。🕊️\n\n它认的，\n是一个人对生命的渴望，\n和一个妈妈敢相信「我能」的勇气。\n\n所以别急着用年龄给自己设限。\n\n你生命里那些「不可能」，\n也许差的，\n只是你敢不敢点头。\n\n💬 你人生里，最「不可能」却做到了的事，\n是哪一件？\n评论区，说给我听。", "hashtags": ["#反常识", "#生命奇迹", "#MBTI", "#ENFP", "#自我成长"], "cover_visual": "柔和晨光里，一双略显苍老却稳稳托着新生婴儿的手，暖调、安静、有母性光辉；画面留白，配大字『生命不认时钟』，治愈不煽情", "cta": "你人生里最『不可能』却做到了的事，是哪一件？评论区说给我听。", "post_time": "12:00-13:00（午间情绪高峰·治愈类）", "avoid": "不渲染高龄生育医学风险、不做'高龄产子=危险'的焦虑暗示、不猎奇产妇年龄细节、不judge个人生育选择；聚焦'生命边界是敢相信可能'的生命奇迹与母性光辉"}, "brief": {"pain_point": "ENFP的Fi渴望确认'人生的可能性不该被年龄/社会时钟锁死'，最怕被'什么年纪该干什么事'的规训困住；62岁产妇挑战了所有人对'生命边界'的默认假设，恰好击中ENFP对'可能'的信仰。", "hook_first3": "第一行'62岁，她生下了6斤的健康男婴'直接抛反常识事实；第二行'产科主任说，从没接诊过这个年纪的产妇'用权威口吻强化反差；第三行'但真正反常识的，不是年龄'切入Fi生命哲学。", "emotion_curve": "惊讶(62岁生子) → 柔软(生命降临) → 触动(边界的重新定义) → 坚定(相信'可能') → 温暖(母性光辉)。", "structure": "钩子·反常识事实 / 反差·医生从未接诊 / 洞察·边界是敢相信可能 / 升华·母性光辉与生命奇迹 / CTA·你生命里最'不可能'的一次", "differentiation": "别人写高龄生育讲'风险/医学极限/猎奇'，我们讲'生命边界不是年龄，是一个人还敢不敢相信可能'；Fi温柔视角落点'生命奇迹与母性光辉'，绝不贩卖年龄焦虑、绝不渲染生育风险。"}, "realizes": ["D21-B13-ENFP-1"]}, {"id": "D21-B13-ISTJ-1", "title": "老实人不是标签，是选择", "channel": "小红书", "hook": "身份认同", "targets": ["ISTJ"], "quality": 8.6, "status": "deployed", "post": {"cover_title": "老实人不是标签，是选择", "body": "《披哥》舞台上，\n欢子被批「摆烂」，\n张彬彬、曹骏这些「老实人」，\n豁出去了。\n\n弹幕吵成一片。\n\n但ISTJ看到的，\n不是抓马——\n\n是一个人被贴上「老实」「摆烂」的标签时，\n最难受的，\n从来不是被骂，\n而是「我到底是谁」，\n被别人的嘴给定义了。\n\n「老实人」这个词，\n用久了就变成一张标签，\n贴在你身上，\n替你回答一切：\n你会不会拒绝、你敢不敢出头、\n你能不能赢。\n\n可它从来不是你的全部。\n\n一个人可以话不多，\n但心里有数；\n可以慢半拍，\n但每一步都算数。\n\n「老实」不是认怂，\n是你在喧嚣里，\n选择了按自己的节奏活。\n\n你被哪个标签误读过？\n评论区，\n说说那个标签，\n和真正的你。", "hashtags": ["#身份认同", "#MBTI", "#ISTJ", "#老实人", "#自我成长"], "cover_visual": "冷色舞台光与暖色侧脸剪影的对比，一个安静、不抢镜头却坚定的身影，配大字『标签不能定义你』，克制、有力量感", "cta": "你被哪个标签误读过？评论区说说那个标签和真正的你。", "post_time": "18:00-20:00（晚间共鸣高峰·身份认同类）", "avoid": "不judge欢子/披哥艺人表现、不站队粉丝阵营、不消费争议细节、不把'老实人'写成贬义或抬高；聚焦'标签不能定义你'的自我定位"}, "brief": {"pain_point": "ISTJ最需要'稳定、可预期、被准确理解'的自我定位，最怕被外界用标签草率定义——'老实人''摆烂'这类标签会直接刺痛他们对'我是谁'的秩序感；欢子被批摆烂、老实人豁出去，正是ISTJ最熟悉的'标签vs自我'冲突。", "hook_first3": "第一行''老实人豁出去了''引综艺热词；第二行'欢子被骂摆烂，弹幕刷屏'摆冲突现场；第三行'但ISTJ看到的不是抓马，是标签如何定义一个人'切人格视角。", "emotion_curve": "不解(为什么被骂) → 共鸣(被标签定义的不适) → 坚定(自我定位由自己定) → 释然(标签不等于我)。", "structure": "钩子·标签冲突 / 现象·摆烂与老实人 / 洞察·标签定义自我 / 升华·自我定位由自己写 / CTA·你被哪个标签误读过", "differentiation": "别人写披哥讲'综艺效果/人设翻车/吃瓜'，我们讲'标签如何偷走一个人的自我定义'；Si视角落到'被准确理解'的渴望，绝不judge艺人表现、绝不站队粉丝、不消费争议细节。"}, "realizes": ["D21-B13-ISTJ-1"]}, {"id": "D21-B12-ENFP-1", "title": "月入4万，他转行去卖馒头", "channel": "小红书", "hook": "反常识", "targets": ["ENFP"], "quality": 9.0, "status": "deployed", "post": {"cover_title": "月入4万，他转行去卖馒头", "body": "月入4万，他转身去卖馒头。\n\n不是破产，不是被裁。\n是他自己，不想拉了。🎻\n\n很多人第一反应是：疯了吧？\n\n体面、高薪、稳定的工作，\n说放就放，去揉面、蒸馒头。\n\n但停下来想一想，\n那个\"可惜\"，是谁的可惜？\n\n是社会给的\"应该\"：\n你应该做体面的工作，\n你应该守住4万月薪，\n你应该别折腾。\n\n可是\"应该\"和\"想要\"，\n从来不是一回事。\n\n大提琴老师真正放下的，\n不是钱，\n是那个\"别人眼里的好\"。\n\n他选的是——\n我终于可以，只为自己活。🌙\n\n这不是一个转行的故事，\n是一个\"自我觉醒\"的故事。\n\n最难的不是爬得更高，\n是在所有人都说\"你傻\"的时候，\n还坚定地选\"我想要\"。\n\n你现在走的路，\n是\"应该\"，还是\"想要\"？\n\n评论区，说说你的那个\"想要\"。👇", "hashtags": ["#ENFP", "#自我觉醒", "#职业选择", "#反内卷", "#MBTI"], "cover_visual": "一把大提琴与一笼刚出锅的馒头并置，暖黄色调，一人背影，画面留白处配大字'4万→馒头'，反差感强，呼应'放下与选择'", "cta": "你现在走的路，是'应该'还是'想要'？评论区说说你的那个'想要'。", "post_time": "18:00-20:00（自我觉醒/职业类·晚高峰情感+职场流量）", "avoid": "不鼓吹裸辞、不贬低稳定高薪职业、不贩卖'不转行就是没活明白'的焦虑、聚焦'选择权在自己'"}, "brief": {"pain_point": "ENFP的Fi最怕被'应该'绑架——考好学校、进大厂、体面高薪，这些别人眼里的'好'对ENFP反而是牢笼；大提琴老师放弃4万高薪，戳中的正是'我到底在为自己活，还是为别人的期待活'。", "hook_first3": "第一行'月入4万，他转身去卖馒头'制造反差；第二行'不是失败，是终于敢选想要'点穿反常识核心；第三行'ENFP看到的不止是一个人的转行'切人格视角。", "emotion_curve": "猎奇/反差(4万→卖馒头) → 羡慕(敢选想要) → 被戳中(我也在被'应该'推着走) → 释然(人生可以重选) → 勇气(我也想为自己活一次)。", "structure": "钩子·反差题 / 现象·别人眼里的'降级' / 洞察·自我觉醒不是爬更高是敢选 / 升华·'应该'vs'想要' / CTA·你现在选哪个", "differentiation": "别人写大提琴老师讲'转行励志/职业自由/馒头店火了'，我们讲'4万高薪是外部模板·转行是一次Fi的自我觉醒'；不做'辞职追梦'鸡汤，不judge稳定工作，落点'选择权在自己'。"}, "realizes": ["D21-B12-ENFP-1"]}, {"id": "D21-B12-INFP-1", "title": "结婚38年，才补拍婚纱照", "channel": "微博", "hook": "情感共鸣", "targets": ["INFP"], "quality": 8.7, "status": "deployed", "post": {"cover_title": "结婚38年，才补拍婚纱照", "body": "结婚38年，他们才补拍婚纱照。\n\n不是补办婚礼，\n是两个人，安安静静地，\n把迟到了38年的那张照片补上。📷\n\n很多人羡慕的是：\n原来爱情可以这么长。\n\n但INFP看到的，是另一件事——\n\n38年，不用每天说\"我爱你\"，\n不用秀给谁看，\n就是平平淡淡地，一起变老。\n\n这在心理学上，\n叫\"安全型依恋\"。\n\n不是离不开，\n是\"我们一直在\"。\n不是轰轰烈烈，\n是笃定。\n\n年轻时我们总以为，\n爱要够用力、够惊天动地。\n\n后来才懂，\n最奢侈的爱，是38年后，\n还愿意为对方补一张婚纱照。🤍\n\n你更信哪一种爱？\n是轰轰烈烈，还是细水长流？\n\n评论区，聊聊你的答案。👇", "hashtags": ["#INFP", "#安全型依恋", "#亲密关系", "#情感共鸣", "#MBTI"], "cover_visual": "一张泛黄的旧婚纱照旁放着崭新的婚纱照，暖白柔光，岁月感与温柔并置，配细字'38年·我们一直在'", "cta": "你更信哪一种爱？是轰轰烈烈，还是细水长流？评论区聊聊你的答案。", "post_time": "20:00-22:00（情感/依恋类·深夜情感流量高峰）", "avoid": "不催婚、不制造'没结婚/没仪式就是遗憾'的焦虑、不judge任何关系形态、聚焦'安全型依恋的陪伴本质'"}, "brief": {"pain_point": "INFP的Fi对'真实的爱/长久的陪伴'极度渴望，也最容易被'38年才补拍婚纱照'这种不张扬却笃定的爱打动；背后的情感需求不是羡慕婚礼，是相信'有人愿意和我一起走到老'。", "hook_first3": "第一行'结婚38年，他们才补拍婚纱照'抛反差；第二行'不是迟到的仪式，是安全型依恋的样子'点穿母题；第三行'INFP看到的不是新闻，是我们一直在'切人格。", "emotion_curve": "好奇(38年才拍) → 柔软(补拍的瞬间) → 被治愈(安全型依恋) → 相信(爱可以这么稳) → 向往(我也想被这样爱)。", "structure": "钩子·反差题 / 现象·38年补拍 / 洞察·安全型依恋不用秀 / 升华·爱是'我们一直在' / CTA·你信哪种爱", "differentiation": "别人写金龟子讲'童年回忆杀/不老女神/补拍婚纱照好甜'，我们讲'38年补拍=安全型依恋的具象·爱不是证明是陪伴'；不做催婚/婚恋焦虑，不做'别人家的爱情'judge，落点'安全型依恋可以长什么样'。"}, "realizes": ["D21-B12-INFP-1"]}, {"id": "D21-B12-ENFJ-1", "title": "他往患儿外卖塞了100块", "channel": "小红书", "hook": "社会证明", "targets": ["ENFJ"], "quality": 9.0, "status": "deployed", "post": {"cover_title": "他往患儿外卖塞了100块", "body": "他往患儿的外卖里，塞了100块。\n\n没留名，没拍照，没声张。\n就是一个蛋饼店主，\n在送餐时，悄悄做的。\n\n后来被人发现，\n大家才知道，他一直在默默做。\n\n于是，全网把他的店买爆了。🔥\n\n很多人说：好人好报。\n\n但ENFJ看到的，是另一件事——\n\n善良最稀缺的，\n从来不是大小，\n是被看见。\n\n是一个人的善意，\n在千万人手里，\n滚成了一场温柔的雪崩。\n\n你没有义务做惊天动地的大事，\n但你的每一份善意，\n都可能在某一天，\n被这个世界温柔地接住。\n\n善良不是付出没有回声，\n它只是在等一个时机。💛\n\n你最近一次，\n被陌生人暖到，\n是什么时候？\n\n评论区，说说那个瞬间。👇", "hashtags": ["#ENFJ", "#社会证明", "#善良有回声", "#正能量", "#MBTI"], "cover_visual": "一只外卖袋里露出一张100元钞票的一角，暖黄色调，旁边蒸腾的蛋饼热气与柔和晨光，画面配细字'善良会有回声'，温暖不煽情", "cta": "你最近一次被陌生人暖到，是什么时候？评论区说说那个瞬间。", "post_time": "18:00-20:00（社会正向/情感类·晚高峰温暖流量）", "avoid": "不道德绑架('不接力就是冷漠')、不消费化疗患儿苦难细节、不judge他人善意大小、聚焦'善良被看见·善良有回声'"}, "brief": {"pain_point": "ENFJ的Fe最需要确认'善良会被看见、会被回应'——他们习惯默默付出、把别人的需求放前面，最怕'善意没有回声'；蛋饼店主偷偷塞钱给化疗患儿、被全网爆单支持，恰好补足ENFJ最渴望的信念：好人会有好报，善意会被社会接力。", "hook_first3": "第一行'他往患儿外卖里塞了100块'抛善意悬念；第二行'然后，全网把他的店买爆了'点穿社会证明反转；第三行'ENFJ看到的不只是暖，是善良终于被回应'切人格视角。", "emotion_curve": "心疼(化疗患儿) → 感动(偷偷塞钱) → 意外(被网友发现) → 温暖(全网爆单接力) → 信念(善良会有回声)。", "structure": "钩子·善意悬念 / 现象·塞钱+爆单 / 洞察·善良被看见=社会证明 / 升华·一个人的善意会滚成温柔的雪崩 / CTA·你最近一次被陌生人暖到", "differentiation": "别人写蛋饼店主讲'正能量/感动中国/好人好报'，我们讲'一次匿名善意被全网接力=善良的社会证明·善良有回声'；不做道德绑架('不接力就是冷漠')，不消费患儿苦难，不judge他人善意大小，落点'善良会被看见'。"}, "realizes": ["D21-B12-ENFJ-1"]}, {"id": "D21-B11-ENTP-1", "title": "ENTP 的脑子，没有「不可能」", "channel": "小红书", "hook": "好奇心", "targets": ["ENTP"], "quality": 8.8, "status": "retired", "post": {"cover_title": "ENTP 的脑子，没有「不可能」", "body": "别人看到一堵墙，ENTP 看到的是「这墙能不能拆了当滑梯」。\n\nENTP 的大脑里，从来没有「不可能」三个字。\n\n只有「还没想到」。\n\n所以别人眼里的死路，在 ENTP 这里，全是还没被发现的岔路。\n\n他天生爱问：「凭什么只能这样？」\n\n然后，用好奇心当钥匙，把那些「理所当然」的门，一扇扇撬开。\n\n如果你也是 ENTP，你不需要被鼓励「大胆一点」。\n\n你需要的，只是把脑子里那个一直在转的 Ne 引擎，放到一个能发光的地方。\n\n你的「不安分」，是这个时代最值钱的能力。", "hashtags": ["#ENTP", "#好奇心", "#创新", "#打破常规", "#可能性"], "cover_visual": "一堵墙上被画了无数条彩色箭头，指向不同方向，明快高饱和配色", "cta": "ENTP 们，你最近正在「撬」哪扇「理所当然」的门？", "post_time": "午 13:00-14:00", "avoid": "不鼓励鲁莽冒险、不贬低稳健型人格、强调「可能性」而非「冲动」"}, "brief": {"pain_point": "ENTP 的「不安分」被误解为「不靠谱」，渴望被认可为创造力", "hook_first3": "「墙拆了当滑梯」的画面感比喻，快速建立 ENTP 的脑回路", "emotion_curve": "认同→兴奋→骄傲（没有不可能→撬门→最值钱）", "structure": "反常识开场 / ENTP 的思维机制 / 好奇心的价值 / 骄傲收尾", "differentiation": "把「不安分」重新定义为「最值钱的能力」，给 ENTP 提供身份骄傲"}, "realizes": ["D21-B11-ENTP-1"]}, {"id": "D21-B11-ENFP-2", "title": "ENFP 的社交，是把人点亮", "channel": "小红书", "hook": "社会货币", "targets": ["ENFP"], "quality": 8.7, "status": "retired", "post": {"cover_title": "ENFP 的社交，是把人点亮", "body": "别再说 ENFP 只是「话多」了。\n\nENFP 的社交，从来不是没话找话。\n\n是「把人点亮」。\n\n他能在一堆人里，精准找到那个低着头、不太敢说话的，然后凑过去，用一个恰到好处的玩笑，把对方逗笑。\n\n被 ENFP 认真对待过的人，都有过同一种感受：\n\n「和他待一会儿，我好像也变有趣了。」\n\n这就是 ENFP 最厉害的地方——\n\n他不只是自己发光，他让身边每个人都相信，自己也会发光。\n\n情绪价值，是这个时代最贵的货币。\n\n而 ENFP，就是行走的造币机。", "hashtags": ["#ENFP", "#情绪价值", "#社交", "#感染力", "#点亮"], "cover_visual": "一群人围坐，中间一个人笑容明亮，像光源一样，暖黄色调，充满活力", "cta": "你被哪个 ENFP「点亮」过？把 TA 的可爱说出来。", "post_time": "午 12:00-13:00", "avoid": "不强化「话多烦人」的刻板印象、不制造社交焦虑、聚焦「点亮」的正向价值"}, "brief": {"pain_point": "ENFP 的「话多」被误解为「不稳重」，渴望被认可为情绪价值创造者", "hook_first3": "「别再说 ENFP 只是话多」替 ENFP 正名，制造立场认同", "emotion_curve": "正名→温暖→骄傲（话多→点亮→造币机）", "structure": "正名开场 / 点亮的场景 / 情绪价值的价值 / 骄傲收尾", "differentiation": "把「话多」重新定义为「点亮他人」，给 ENFP 提供情绪价值创造者的骄傲"}, "realizes": ["D21-B11-ENFP-2"]}, {"id": "D21-B11-ISTJ-1", "title": "ISTJ 的靠谱，是说到做到一万次", "channel": "小红书", "hook": "社会证明", "targets": ["ISTJ"], "quality": 8.7, "status": "retired", "post": {"cover_title": "ISTJ 的靠谱，是说到做到一万次", "body": "这个时代最稀缺的人，不是最聪明的，是最靠谱的。\n\n而 ISTJ，就是「靠谱」本身。\n\n别人把「说到做到」当口号，ISTJ 把它当肌肉记忆。\n\n一万次答应，就有一万次兑现。\n\n他不抢眼，不喧哗，不表演。\n\n他只是安安静静地，把每一件答应过的事，都稳稳落地。\n\n时间久了你会发现——\n\n那些曾经光芒万丈的人来来去去，最后还站在你身边的，是那个 ISTJ。\n\n靠谱，才是这个时代最顶级的才华。\n\n而 ISTJ，天生就有。", "hashtags": ["#ISTJ", "#靠谱", "#长期主义", "#说到做到", "#稀缺"], "cover_visual": "一本翻旧了的日程本上，密密麻麻打满了对勾，暖黄纸质感，踏实感", "cta": "你身边那个「最让你安心」的人，是什么类型？", "post_time": "早 8:00-9:00", "avoid": "不贬低灵活型人格、不制造「老实人吃亏」的焦虑、聚焦靠谱的价值"}, "brief": {"pain_point": "ISTJ 的「低调靠谱」被忽视，渴望被认可为顶级稀缺", "hook_first3": "「最稀缺的不是聪明是靠谱」反常识价值判断，快速建立认同", "emotion_curve": "认同→踏实→骄傲（稀缺→肌肉记忆→顶级才华）", "structure": "价值判断 / ISTJ 的靠谱 / 时间的验证 / 骄傲收尾", "differentiation": "把「靠谱」定义为「顶级才华」，给 ISTJ 提供被看见的价值感"}, "realizes": ["D21-B11-ISTJ-1"]}, {"id": "D21-B11-INTJ-1", "title": "INTJ 不陪你内耗，他直接给方案", "channel": "小红书", "hook": "反常识", "targets": ["INTJ"], "quality": 8.8, "status": "retired", "post": {"cover_title": "INTJ 不陪你内耗，他直接给方案", "body": "你在情绪里打转，INTJ 已经在旁边列好了三套方案。\n\n不是 INTJ 冷血。\n\n是他太清楚一件事——\n\n情绪内耗，是这个世界上最昂贵的无用功。\n\n所以 INTJ 的本能反应，从来不是「抱抱你」，而是「帮你把问题拆了」。\n\n你要的不是安慰，是出口。\n\n而 INTJ，就是那个在最乱的房间里，先把灯打开的人。\n\n他不会陪你哭，但会陪你「把哭的原因，一条条解决掉」。\n\n这，才是 INTJ 最深的温柔——\n\n「我不哄你，但我陪你赢。」", "hashtags": ["#INTJ", "#反内耗", "#高效", "#理性", "#温柔"], "cover_visual": "整洁的桌面上摊开三张方案纸 + 一支笔，冷色调，理性有序", "cta": "你身边那个「不哄你但帮你解决」的人，是谁？", "post_time": "早 7:30-8:30", "avoid": "不贬低情绪价值、不制造「理性优于感性」的对立、强调温柔藏在行动里"}, "brief": {"pain_point": "INTJ 的理性被误解为「冷血」，渴望被理解「行动即温柔」", "hook_first3": "「不陪你内耗，直接给方案」反常识对比，快速建立 INTJ 形象", "emotion_curve": "误解→理解→感动（冷血→开灯→陪你赢）", "structure": "反常识开场 / INTJ 的逻辑 / 行动即温柔 / 感动的收尾", "differentiation": "把「理性」重新定义为「最深的温柔」，给 INTJ 提供情感认同"}, "realizes": ["D21-B11-INTJ-1"]}, {"id": "D21-B11-ENFP-1", "title": "生活费给多少？孩子算的是爱", "channel": "小红书", "hook": "社会证明", "targets": ["ENFP"], "quality": 8.7, "status": "deployed", "post": {"cover_title": "生活费给多少？孩子算的是爱", "body": "大学生一个月该给多少生活费？\n\n这道题，每年开学都要吵上热搜。\n\n有人说 1500 就够，有人说 3000 都紧。\n\n但吵来吵去，很少有人点破一件事——\n\n家长在算账，孩子其实在算爱。💔\n\n你有没有过那种瞬间：\n\n开口要生活费，比开口说「我爱你」还难。\n\n不是真的缺那几百块，\n是怕一张嘴，就变成「怎么又花完了」。\n\n生活费这个数字，\n从来不是一道算术题。\n\n它是两代人第一次，\n被迫坐下来谈「边界」和「信任」。\n\n给多少，其实没有标准答案。\n\n真正重要的，是你们有没有把话说开：\n\n「这个月怎么花的，我们一起看」\n比「省着点花」有用一百倍。\n\n谈钱，一点都不伤感情。\n藏着掖着，才伤。🌙\n\n你们家生活费是怎么定的？\n评论区聊聊，说不定能帮到别人。👇", "hashtags": ["#ENFP", "#大学生生活费", "#亲子关系", "#代际沟通", "#MBTI"], "cover_visual": "一张摊开的记账本，旁边一杯奶茶和几枚硬币，暖黄色调，生活感，呼应'算账与算爱'的双重主题", "cta": "你们家生活费是怎么定的？评论区聊聊，说不定能帮到别人。", "post_time": "18:00-20:00（开学季·晚高峰情感流量）", "avoid": "不制造'给多给少'的攀比焦虑、不judge任何家庭的金额、不贩卖'啃老/不孝'对立、聚焦代际沟通"}, "brief": {"pain_point": "ENFP的Fi最在意'被爱是否真实/被信任是否足够'，而生活费数字恰好把亲子关系量化成一个尴尬的'别人给多少'；背后的焦虑不是钱，是'我的价值被怎么定价'。", "hook_first3": "第一行'大学生一个月该给多少生活费'抛全民争议题；第二行'家长在算账，孩子在算爱'点穿代际错位；第三行'ENFP听到的不是数字'切人格视角。", "emotion_curve": "共鸣/尴尬(给多少之争) → 被戳中(算钱还是算爱) → 释然(数字不重要，边界才重要) → 勇气(把话摊开谈)。", "structure": "钩子·争议题 / 现象·家长算账vs孩子算爱 / 洞察·生活费是边界谈判 / 升华·谈钱不可耻，谈爱要直说 / CTA·你家怎么定的", "differentiation": "别人写生活费讲'给多少合适/攀比/啃老'，我们讲'生活费是一场被数字包装的边界与爱的谈判'；落在Fi亲子代际，不做攀比焦虑，不judge给多给少。"}, "realizes": ["D21-B11-ENFP-1"]}, {"id": "D21-B10-ENFJ-1", "title": "周星驰：为什么不重回幕前", "channel": "小红书", "hook": "情感共鸣", "targets": ["ENFJ"], "quality": 8.7, "status": "deployed", "post": {"cover_title": "周星驰：为什么不重回幕前", "body": "周星驰说，自己不享受镜头了。\n\n有人觉得可惜，\n有人觉得他江郎才尽。\n\n但我却从这句话里，\n听出了一种很深的温柔。\n\n他不是不爱演戏了，\n是太爱了——\n爱到不忍心让那个「英雄」，\n在大家面前老去。🎬\n\n我们都怀念周星驰，\n其实也是在怀念看周星驰电影长大的自己。\n\n那个在出租屋里笑到流泪的自己，\n那个以为「努力就一定会成功」的自己。\n\n他不回来，\n那个少年就永远留在原地，闪闪发光。\n\n有些告别，不是离开，\n是把最好的自己，稳稳地留在原地。✨\n\n这世界需要英雄，\n也需要英雄体面地谢幕。\n\n谢谢他，把最干净的笑声留给了我们。\n\n💬 你是在哪部电影里，第一次看懂周星驰的？\n评论区，聊聊你的那一部。", "hashtags": ["#情感", "#MBTI", "#ENFJ", "#周星驰", "#怀旧"], "cover_visual": "复古胶片色调，一张空荡荡的旧电影院座椅/放映机剪影，一束光打下来；标题字\"周星驰：为什么不重回幕前\"压在下方，怀旧、留白、有电影质感。", "cta": "你是在哪部电影里，第一次看懂周星驰的？评论区聊聊。", "post_time": "20:00-22:00（深夜情绪高峰，怀旧内容共鸣强）", "avoid": "不消费明星隐私、不做\"过气\"等负面定性；避免\"江郎才尽\"式贬损（仅作反面引子，正文明确反转）；不引导粉丝打投。"}, "brief": {"pain_point": "ENFJ的Fe对'体面与爱'极度敏感，容易为'英雄迟暮'心碎；周星驰的'不重回幕前'恰好是'用爱守护体面'的范本。", "hook_first3": "第一行'周星驰说，自己不享受镜头了'点事件；第二行'有人觉得可惜/江郎才尽'摆大众反应；第三行'但我听出一种很深的温柔'反转制造停留。", "emotion_curve": "惋惜/争议(大众视角) → 被点醒(太爱了不忍老去) → 怀旧(想起看戏的自己) → 释然(体面谢幕也是爱)。", "structure": "钩子·争议反差 / 洞察·太爱了不忍老去 / 共鸣·怀念的是自己 / 升华·体面谢幕 / CTA·你的第一部", "differentiation": "别人写周星驰讲'搞笑天才/过气'，我们讲'体面退场=更深的情'；把怀旧落到'看戏长大的自己'的自我认同，而非单纯追忆明星。"}, "realizes": ["D21-B10-ENFJ-1"]}, {"id": "D21-B10-ENFP-1", "title": "七夕，微信悄悄把红包开到520", "channel": "小红书", "hook": "情感共鸣", "targets": ["ENFP"], "quality": 8.8, "status": "deployed", "post": {"cover_title": "七夕，微信悄悄把红包开到520", "body": "七夕这天，微信悄悄把红包上限开到了520。\n\n很多人当它是功能更新。\n但我盯着那个数字，突然就懂了。\n\n520，从来不是一个金额。\n是「我想对你说很多，又怕说太多」的人，\n终于有了一次把心意说出口的勇气。💌\n\n你有没有那种时候——\n话在嘴边绕了三天，\n最后只憋出一句「在吗」。\n\n不是不会表达，\n是怕认真了，反而显得唐突。\n\n而520这个数字，\n就是给所有「不敢开口」的人留的一扇门。\n\n它站在「我爱你」和「在吗」之间，\n不轰轰烈烈，但最温柔。🌙\n\n有人收到520，红着脸截图；\n有人没收到，也不代表没人爱。\n\n被爱的证明，\n从来不只在一个红包里，\n在那些「怕你不够用」「记得吃饭」「早点睡」的日常里。\n\n这个七夕，\n愿你的心意，都有人接住。\n也愿有人，借着520，把憋了很久的话递给你。\n\n💬 评论区聊聊：\n你心里有没有一句「一直想说，没敢说出口」的话？\n今天就当练习，先说给我听。", "hashtags": ["#情感", "#MBTI", "#ENFP", "#七夕", "#亲密关系"], "cover_visual": "粉色+暖黄渐变背景，中央一个大大的\"520\"数字气泡，旁边一颗手绘爱心；底部一行小字\"想对你说很多，又怕说太多\"。柔光、留白、治愈系插画风。", "cta": "评论区引导：你心里有没有一句一直想说没敢说的话？先说给我听。", "post_time": "18:00-20:00（七夕当晚情绪高峰）", "avoid": "避免\"必须发红包\"\"不发就是不爱你\"等消费主义绑架表述；不鼓励攀比金额；不出现\"转账\"\"红包雨\"等诱导性营销词；弱化\"大额\"字眼。"}, "brief": {"pain_point": "ENFP的Fi渴望真实亲密连接，却又怕'认真会被辜负/显得唐突'；520红包恰好踩中'想表达又怕过度'的纠结。", "hook_first3": "第一行点破'微信把红包开到520'；第二行'很多人当它是功能更新'制造反差；第三行'我盯着那个数字突然就懂了'拉人进入情绪。", "emotion_curve": "好奇/平淡(功能更新) → 被戳中(不敢开口的共鸣) → 释然/温暖(被爱的证据在日常) → 勇气(把话说出口)。", "structure": "钩子·数字反差 / 痛点·不敢开口 / 洞察·520是一扇门 / 升华·被爱在日常 / CTA·说出来练习", "differentiation": "别人写520红包讲'仪式感/消费'，我们讲'给不敢开口的人留一扇门'，落在依恋母题而非消费主义绑架。"}, "realizes": ["D21-B10-ENFP-1"]}, {"id": "D21-B9-INFP-1", "title": "别把最珍贵的东西，交到别人的秤上", "channel": "小红书", "hook": "身份认同", "targets": ["INFP"], "quality": 8.8, "status": "deployed", "post": {"cover_title": "别把最珍贵的东西，交到别人的秤上", "body": "李娟劝年轻人别轻易把写作当职业，\n好多人说\"她劝退\"。\n\n但 INFP 听到的不是劝退，\n是一句很重的心疼。💧\n\n写作对有些人来说，不只是工作，\n是长在骨头里的\"我是谁\"。\n\n一旦把它变成职业，\n它就要被定价、被比较、被KPI称重。\n\n最珍贵的东西，\n不该被放到别人的秤上。\n\n不是不让你写，\n是提醒你：别把\"能不能靠它吃饭\"，\n当成爱不爱它的唯一标准。📝\n\n保护热爱最好的方式，\n是永远给自己留一块不交出去的地方。\n\n你心里有没有一件\"不想交给别人定价\"的事？", "hashtags": ["#INFP", "#身份认同", "#李娟", "#写作", "#热爱"], "cover_visual": "米白暖色，书桌+纸笔手写感画面 + 大字「别把最珍贵的东西交到别人的秤上」", "cta": "你心里有没有一件「不想交给别人定价」的事？", "post_time": "20:00-22:00（身份/热爱类晚间深思高峰）", "avoid": "不曲解李娟原意、不否定「靠写作谋生」，聚焦「热爱与定价的边界」"}, "brief": {"pain_point": "INFP 把热爱和自我价值绑得太紧，怕热爱被商业化玷污、被外界否定", "hook_first3": "李娟热点切入→「她说劝退」制造误解→「INFP听到的是心疼」反转立意", "emotion_curve": "好奇(李娟说了啥)→误解(劝退)→反转(是心疼)→共鸣(热爱=我是谁)→坚定(留一块不交出去)", "structure": "热点切入 / 误解制造 / 反转(心疼) / 核心(写作=我是谁) / 升华(保护热爱) / CTA", "differentiation": "不写「要不要靠写作吃饭」的实用建议，写「热爱与定价的边界」，从职业选择升华到身份守护"}, "realizes": ["D21-B9-INFP-1"]}, {"id": "D21-B9-ENFP-1", "title": "成年人的爱，敢说出口才算数", "channel": "小红书", "hook": "情感共鸣", "targets": ["ENFP"], "quality": 8.8, "status": "deployed", "post": {"cover_title": "成年人的爱，敢说出口才算数", "body": "蓝盈莹公开承认新恋情那天，\n很多人把它当八卦看。\n\n但 ENFP 看到的不是八卦，\n是一个成年人，终于敢把\"我在爱\"三个字，\n堂堂正正说出来。✨\n\n我们这一代人，太习惯\"先试探、再暧昧、最后不了了之\"。\n好像谁先承认，谁就输了。\n\n可你有没有发现——\n那些敢坦然说\"我需要你\"的人，\n反而更早遇到对的人。\n\n因为安全感不是等来的，\n是\"我敢给关系一个名分\"换来的。\n\n成年人的体面，不是藏得深，\n是爱得起、也认得起。💛\n\n你在感情里，是\"先承认\"还是\"等对方先\"？\n评论区聊聊，我给你留个位置。", "hashtags": ["#ENFP", "#情感共鸣", "#蓝盈莹", "#亲密关系", "#安全型依恋"], "cover_visual": "暖色调，蓝盈莹侧脸剪影 + 大字「成年人的爱，敢说出口才算数」，底部小字「安全感是名分换来的」", "cta": "你在感情里，是「先承认」还是「等对方先」？评论区聊聊", "post_time": "18:00-20:00（情感类内容晚间共鸣高峰）", "avoid": "避免站队讨论明星隐私、避免评价恋情细节，聚焦「公开承认」这个行为本身"}, "brief": {"pain_point": "ENFP 渴望被爱又怕显得「太需要」，在「主动」和「体面」之间反复拉扯", "hook_first3": "第一句蓝盈莹公开恋情切热点→第二句点破「不是八卦」→第三句落到「成年人敢说我在爱」的反差", "emotion_curve": "好奇(八卦)→认同(谁先承认谁输)→释然(安全感是名分换来的)→温暖(体面=爱得起)", "structure": "热点切入 / 点破反差 / 社会观察(试探/暧昧/不了了之) / 观点反转(安全感不是等来的) / 收束升华(体面=爱得起) / CTA互动", "differentiation": "同类内容多写「ENFP恋爱脑」，本文写「ENFP的安全型依恋能力」，从「被爱」转向「敢爱」"}, "realizes": ["D21-B9-ENFP-1"]}, {"id": "D21-B8-ENFJ-1", "title": "被争着养，是攒了一辈子的「值得」", "channel": "小红书", "hook": "社会证明", "targets": ["ENFJ"], "quality": 8.9, "status": "deployed", "post": {"cover_title": "被争着养，是攒了一辈子的「值得」", "body": "四个儿子争着养95岁老母亲，\n很多人说这是\"孝道天花板\"。\n\n但 ENFJ 看到的不只是孝顺，\n是一个人在几十年里，\n把\"被爱\"这件事，一点一点攒成了\"值得\"。❤️\n\n孩子愿意养，从来不是因为\"应该\"，\n是因为这个妈妈，曾经也被温柔地回应过。\n\n安全感这东西，\n不是天生就有的，\n是被一次次回应，慢慢养出来的。\n\n你今天怎么对身边的人，\n多年后就会收到什么样的\"被争着养\"。\n\n爱不是义务，是存款。\n你存的每一分温柔，都会在晚年到期。🌙\n\n你身边有没有那个\"被争着养\"的人？\n讲讲 TA 的故事。", "hashtags": ["#ENFJ", "#孝道", "#家庭", "#依恋", "#情感"], "cover_visual": "暖金色调，老人与子女围坐的画面感 + 大字「被争着养，是攒了一辈子的值得」", "cta": "你身边有没有那个「被争着养」的人？讲讲 TA 的故事", "post_time": "19:00-21:00（家庭情感类晚饭后高峰）", "avoid": "不消费老人形象、不做道德绑架，聚焦「回应养出安全感」的关系视角"}, "brief": {"pain_point": "ENFJ 重视关系却常担心自己的付出是否被看见、被回应", "hook_first3": "争养95岁老母亲热点切入→「孝道天花板」引共鸣→ENFJ看到「值得=被回应攒出来」的升华", "emotion_curve": "感动(争养)→深思(不是应该，是回应)→领悟(安全感是被养出来的)→温暖(爱是存款)", "structure": "热点切入 / 点破(不只孝顺) / 依恋原理(被回应养出来) / 行动映射(你怎么对人) / 升华(爱是存款) / CTA故事征集", "differentiation": "不写「孝道鸡汤」，写「安全依恋是双向回应」，从家庭故事升维到关系经营"}, "realizes": ["D21-B8-ENFJ-1"]}, {"id": "D21-B8-INFP-1", "title": "两代人同时当妈，人生顺序失效了", "channel": "小红书", "hook": "身份认同", "targets": ["INFP"], "quality": 9.0, "status": "deployed", "post": {"cover_title": "两代人同时当妈，人生顺序失效了", "body": "00后女儿和80后妈妈，前后脚生娃。\n有人觉得\"乱了辈分\"。\n\n但 INFP 看到的是另一件事：\n人生的顺序，本来就可以被重新排列。🔄\n\n\"到了什么年纪就该做什么事\"，\n这句话困住了太多人。\n\n可这一对母女告诉我们：\n\"成为母亲\"和\"成为自己\"，\n从来不冲突，也可以同时发生。\n\n年龄不是倒计时，\n是你可以随时重新出发的起点。\n\n别被\"应该\"绑架，\n你的人生，可以有自己的时区。⏰\n\n你有没有过\"人生顺序被打乱\"却反而更清醒的时刻？", "hashtags": ["#INFP", "#身份认同", "#代际", "#母亲", "#女性成长"], "cover_visual": "柔和粉白调，两代女性并肩的画面感 + 大字「两代人同时当妈，人生顺序失效了」", "cta": "你有没有过「人生顺序被打乱」却反而更清醒的时刻？", "post_time": "20:00-22:00（女性成长类晚间高峰）", "avoid": "不渲染「乱了辈分」的猎奇，不评判生育选择，聚焦「打破社会时钟」"}, "brief": {"pain_point": "INFP 在「社会时钟」和「自我节奏」之间挣扎，怕成为母亲/进入某角色就失去自己", "hook_first3": "母女前后脚生娃热点切入→「乱了辈分」引争议→INFP看到「顺序可以重排」反转", "emotion_curve": "新奇(前后脚生娃)→争议(乱了辈分)→反转(顺序可重排)→释然(成为母亲≠失去自己)→自由(自己的时区)", "structure": "热点切入 / 争议制造 / 反转(顺序重排) / 核心(母亲vs自己) / 升华(时区自由) / CTA", "differentiation": "不写「母女同龄」的猎奇，写「社会时钟可以被打破」，从代际趣闻升华到身份自主"}, "realizes": ["D21-B8-INFP-1"]}, {"id": "D21-B7-ENFJ-1", "title": "人不会为公司哭，只为被当人对待", "channel": "小红书", "hook": "情感共鸣", "targets": ["ENFJ"], "quality": 8.9, "status": "active", "post": {"cover_title": "人不会为公司哭，只为被当人对待", "body": "许昌，胖东来附近。\n\n一个老板在镜头前红了眼眶，\n反复说：舍不得。\n\n很多人不理解：\n一家超市而已，至于吗？\n\n但我想说——\n人，从来不会为一家公司哭。🏪\n\n人会哭，\n是因为在某个地方，\n第一次被当成「一个人」对待。\n\n不是「消费者」，\n不是「业绩」，\n是「你」。\n\n你买到的每样东西，\n都有人替你把关；\n你提的每个意见，\n都有人认真听完。\n\n这种「被认真对待」的感觉，\n在这个把人当流量的时代，\n太稀缺了。💧\n\n所以那个老板哭的，\n不是一家店，\n是被好好对待过的自己。\n\n愿我们都能遇到，\n把你当「人」看的那个地方、那个人。\n\n💬 你有没有过「被认真对待」的瞬间？\n评论区，说给我听。", "hashtags": ["#情感", "#MBTI", "#ENFJ", "#胖东来", "#被认真对待"], "cover_visual": "暖色调，超市暖光下的货架/人背影，配大字\"人不会为公司哭，只为被当人对待\"；治愈、烟火气、留白。", "cta": "你有没有过'被认真对待'的瞬间？评论区说给我听。", "post_time": "12:00-13:00（午间情绪高峰）", "avoid": "不神化企业、不引战其他商超、不做软文式吹捧；避免\"良心企业\"等绝对化表述被判定营销。"}, "brief": {"pain_point": "ENFJ的Fe对'真诚/被当作人'极度渴求，也最容易被'真诚稀缺'的时代刺痛；胖东来流泪正是'真诚被看见'的稀缺样本。", "hook_first3": "'许昌胖东来附近，一个老板流泪说舍不得'点事件；'很多人不理解：一家超市而已'摆大众反应；'但我想说：人从来不会为公司哭'反转立论。", "emotion_curve": "好奇(为什么哭) → 被戳中(被当人对待的稀缺) → 共情(哭的是被好好对待过的自己) → 温暖(愿我们都能被认真对待)。", "structure": "钩子·流泪事件 / 反转·人不会为公司哭 / 洞察·稀缺的是被当人对待 / 升华·哭的是自己 / CTA·被认真对待的瞬间", "differentiation": "别人写胖东来讲'良心企业/服务好'，我们讲'被当人对待的稀缺'；Fe视角落到情感而非消费测评。"}, "realizes": ["D21-B7-ENFJ-1"]}, {"id": "D21-B5-ENFJ-1", "title": "我们为什么那么在意「别人怎么看」？", "channel": "小红书", "hook": "社会证明", "targets": ["ENFJ"], "quality": 8.9, "status": "deployed", "post": {"cover_title": "我们为什么那么在意「别人怎么看」？", "body": "马斯克一句\"中国太棒了\"刷屏，\n有人很兴奋，有人却看得很别扭。\n\nENFJ 没有跟着喊。\n她看到的不是\"外国人夸我们\"，\n而是我们有多需要这声夸奖。😶\n\n其实，越在意\"外面怎么看\"，\n越说明心里有一块还没被自己认可。\n\n我们拼命想让世界看见，\n是因为还没学会自己看见自己。\n\n外界的掌声是镜子，不是答案。\n真正的底气，是有一天别人夸不夸你，\n你都知道自己值多少。\n\n别把\"被认可\"当成目标，\n把\"认可自己\"练成习惯。🌿\n\n你是更在意被认可，还是被理解？\n在评论区告诉我。", "hashtags": ["#ENFJ", "#社会认可", "#马斯克", "#自我价值", "#心理成长"], "cover_visual": "深蓝冷色调，马斯克像素剪影虚化背景 + 大字「我们为什么那么在意别人怎么看」，强调「自我认可」", "cta": "你是更在意被认可，还是被理解？评论区告诉我", "post_time": "12:00-13:00 或 20:00-22:00（自我成长类午休/睡前高峰）", "avoid": "不渲染民族情绪、不站队立场，聚焦「向外求认可」的普遍心理"}, "brief": {"pain_point": "ENFJ 习惯性向外求认可，把「别人怎么看」当成自我价值的标尺", "hook_first3": "马斯克刷屏热点切入→「有人兴奋有人别扭」制造张力→「ENFJ没跟着喊」反差点出核心", "emotion_curve": "兴奋/别扭(张力)→戳破(你有多需要这声夸)→醒悟(没被自己认可)→坚定(底气来自自己)", "structure": "热点切入 / 两种反应张力 / 戳破向外求认可 / 观点(镜子不是答案) / 收束(认可自己) / CTA", "differentiation": "不写「马斯克夸中国」的爽文，写「我们为什么需要被夸」的自我审视，从社会证明反转到自我认可"}, "realizes": ["D21-B5-ENFJ-1"]}, {"id": "D21-B4-INFJ-1", "title": "一场「过夜」争吵，藏着每个家庭的边界", "channel": "小红书", "hook": "情感共鸣", "targets": ["INFJ"], "quality": 9, "status": "deployed", "post": {"cover_title": "一场「过夜」争吵，藏着每个家庭的边界", "body": "女儿想在同学家过夜被爸爸拒绝，\n全网吵翻了。\n\n但 INFJ 没有急着站队。\n她看到这场争吵真正的主角，\n不是\"该不该过夜\"，是\"边界\"两个字。🚪\n\n有的家庭，用\"拒绝\"表达爱——\n怕你受伤，所以画了条线。\n有的家庭，用\"承担\"表达爱——\n再难，也陪你一起扛。\n\n两种爱，没有对错，\n只是不同的\"爱的语言\"。\n\n吵翻天的从来不是事情本身，\n是每个人心里那条\"我该管你到什么程度\"的线。\n\n看懂了自己家的边界，\n很多争吵，其实可以不发生。🤍\n\n你们家，是\"管得严\"还是\"放得开\"？", "hashtags": ["#INFJ", "#家庭边界", "#依恋", "#亲子关系", "#心理"], "cover_visual": "中性暖灰调，门/边界意象 + 大字「一场过夜争吵，藏着每个家庭的边界」", "cta": "你们家，是「管得严」还是「放得开」？", "post_time": "19:00-21:00（亲子/家庭类晚间高峰）", "avoid": "不站队「该不该过夜」的争论、不评判具体家庭，聚焦「边界是爱的语言」"}, "brief": {"pain_point": "INFJ 对家庭关系敏感，常在「被管束」和「被理解」之间感到拉扯", "hook_first3": "过夜被拒热点切入→「全网吵翻」引对立→INFJ不站队点出「边界才是主角」", "emotion_curve": "对立(该不该过夜)→抽离(不站队)→洞察(两种爱的语言)→理解(没有对错)→释然(看懂边界)", "structure": "热点切入 / 对立制造 / 抽离视角 / 两种爱(拒绝vs承担) / 核心(爱的语言) / 释然(看懂边界) / CTA", "differentiation": "不写「该不该过夜」的站队争论，写「边界是爱的语言」，从亲子争吵升维到关系理解"}, "realizes": ["D21-B4-INFJ-1"]}, {"id": "D21-B3-INFJ-1", "title": "追科学家的星，才是文明的换频", "channel": "小红书", "hook": "身份认同", "targets": ["INFJ"], "quality": 9, "status": "deployed", "post": {"cover_title": "追科学家的星，才是文明的换频", "body": "你有没有发现，热搜变了。\n\n从「谁塌房了」，变成「谁为国拿下了第一」。\n\n当一群人开始追科学家的星，INFJ 看到的不只是「追星」。\n\n她看到的是一个文明的价值观，正在换频——\n从「谁更抓眼球」，切到了「谁更值得被看见」。\n\nINFJ 天生就盯着这种看不见的东西。\n她能在 0.3 秒里，从一片喧嚣里，听出一个时代心跳的频率变了。\n\n这世界从来不缺热闹，缺的是愿意为「安静的名字」停留的眼睛。\n\n而此刻，越来越多的人，开始把目光从舞台中央，移向实验室的灯。\n\n这就是 INFJ 等了很久的那件事：\n真正的光，终于照到了真正发光的灵魂。", "hashtags": ["#INFJ", "#科学家", "#价值观", "#文明", "#追星"], "cover_visual": "实验室深夜亮灯的窗户 + 舞台聚光灯熄灭的对比图，冷蓝调，底部一行大字标题", "cta": "你最近一次，为谁「不是因为颜值或人设」而真心敬佩？评论区说说。", "post_time": "晚 20:00-21:30（INFJ 深度阅读高峰）", "avoid": "不贬低娱乐圈追星、不拉踩任何具体明星、不用「脑残粉」等攻击性词"}, "brief": {"pain_point": "INFJ 对「浅层追捧」的疲惫，渴望看到价值回归", "hook_first3": "前 3 秒抛出「热搜变了」的观察，制造「文明换频」的反差", "emotion_curve": "观察→共鸣→升华（时代噪音→价值回归→光找到灵魂）", "structure": "热搜变了的现象 / INFJ 的深层解读 / 文明换频的升华", "differentiation": "不批判追星，而是肯定「价值的重新排序」，给 INFJ 提供「我早就懂」的认同"}, "realizes": ["D21-B3-INFJ-1"]}, {"id": "D20-B8-INFJ-1", "title": "最安静的名字，值得最喧闹的位置", "channel": "", "hook": "身份认同", "targets": ["INFJ"], "quality": 8.8, "status": "deployed", "post": {"cover_title": "最安静的名字，值得最喧闹的位置", "body": "商场里，钱学森的巨幅海报挂起来了。\n\nINFJ 站了很久。\n\n她看到的不只是「致敬一位科学家」。\n\n她看到的是一个民族，终于学会了一件事——\n把最安静的名字，放在最喧闹的地方。\n\n这很难。因为喧闹的地方，从来都属于会吆喝的人。\n\n而科学家，恰恰是最不会吆喝的那群人。\n\n他们把自己埋进公式和实验室，一埋就是一辈子。\n\nINFJ 懂的。\n\n这个世界需要热闹，但更需要有人在热闹之外，替所有人守住那条「对的方向」。\n\n当安静开始被看见，说明这个时代，开始懂得什么是真正重要的东西了。", "hashtags": ["#INFJ", "#钱学森", "#致敬科学家", "#价值观", "#安静的力量"], "cover_visual": "商场巨幅海报仰拍视角，海报上科学家的剪影 + 下方人群，暖黄与深蓝对比", "cta": "你心里有没有一个「值得被更多人看见」的安静的名字？评论区留给他。", "post_time": "晚 19:00-20:30", "avoid": "不涉及敏感历史细节、不用「民粹」叙事、避免过度政治化表达"}, "brief": {"pain_point": "INFJ 对「喧嚣压过价值」的隐忧与期待", "hook_first3": "「商场挂出钱学森海报」具体场景切入，快速建立视觉画面", "emotion_curve": "场景→凝视→洞察→释然", "structure": "具体场景 / INFJ 的看见 / 安静与喧闹的对照 / 时代懂了", "differentiation": "从「海报」这个小切口，引出「价值排序」的大命题，符合 INFJ 的 Ni 深度"}, "realizes": ["D20-B8-INFJ-1"]}, {"id": "D20-B9-ENFJ-1", "title": "河南AI短剧出海，我们学会了被看见", "channel": "", "hook": "情感共鸣", "targets": ["ENFJ"], "quality": 8.7, "status": "active", "post": {"cover_title": "河南AI短剧出海，我们学会了被看见", "body": "日本电视台，在播河南农村的 AI 短剧。\n\nENFJ 看到的不是「文化出海」。\n\n她看到的是——「我们终于学会了，怎么被看见。」\n\n以前，我们的故事要出去，得先把自己「翻译」成别人习惯的样子。\n\n可现在，一个河南农村的 AI 短剧，就那样被播了出去。\n\n它没刻意讨好谁，也没放低自己。\n\n它就讲自己的故事，讲得够真、够好。\n\n然后，世界自己凑过来了。\n\n这就是 ENFJ 心里「被看见」最好的样子：\n\n不是「求你看我」，是「我值得你看」。", "hashtags": ["#ENFJ", "#AI短剧", "#文化出海", "#河南", "#被看见"], "cover_visual": "电视屏幕上播放着农村短剧 + 一家人围看的画面，暖黄生活感", "cta": "你有没有一个「终于被看见」的瞬间？说出来，我为你鼓掌。", "post_time": "晚 19:00-20:30", "avoid": "不贬低其他文化、不碰地域刻板印象、聚焦「被看见」的正向情绪"}, "brief": {"pain_point": "ENFJ 对「被看见、被认可」的深层渴望与民族文化自豪", "hook_first3": "「日本电视台播河南AI短剧」反差场景 + 「被看见」的情感升华", "emotion_curve": "好奇→自豪→升华（出海→被看见→我值得你看）", "structure": "现象 / ENFJ 的看见 / 被看见的本质 / 升华", "differentiation": "从「文化出海」的宏大叙事转向「被看见」的个人情感，正中 ENFJ"}, "realizes": ["D20-B9-ENFJ-1"]}, {"id": "D20-B8-ENFJ-1", "title": "中式天庭，是文明不需要翻译的自我介绍", "channel": "", "hook": "社会货币", "targets": ["ENFJ"], "quality": 8.7, "status": "hook_conflict", "post": {"cover_title": "中式天庭，是文明不需要翻译的自我介绍", "body": "那个 500 万人转发的「中式天庭」AI 视频，你看哭了吗？\n\nENFJ 看的不是特效有多炫。\n\n她看到的是一个文明，终于找到了「不需要翻译」的自我介绍。\n\n以前我们想让世界懂我们，得先说英文，得先解释「这是什么」。\n\n可这个视频，把天庭、把神话、把中国人刻在骨子里的浪漫，直接用画面砸进你眼里。\n\n你不需要被科普，你就懂了。\n\n这就是 ENFJ 最在意的东西——\n被看见，被理解，被「不费力的」接受。\n\n当一个文明的底气足够大，它就不再需要自我介绍。\n\n它站在那里，就赢了。", "hashtags": ["#ENFJ", "#中式天庭", "#AI视频", "#文化自信", "#国潮"], "cover_visual": "中式天庭 AI 视频标志性画面（神仙列阵/云海），金红配色，大字标题叠加", "cta": "你刷到这个视频时，最先被哪一帧击中？分享你的瞬间。", "post_time": "午 12:00-13:00（午休刷屏高峰）", "avoid": "不贬低其他国家文化、不煽动对立、不碰具体敏感历史事件"}, "brief": {"pain_point": "ENFJ 对「文化被看见、被理解」的深层渴望", "hook_first3": "「你看哭了吗」情感钩子 + 500万转发数据背书", "emotion_curve": "共鸣→自豪→升华（特效→文化→底气）", "structure": "爆款现象 / ENFJ 的独特视角 / 不需要翻译的底气", "differentiation": "不谈技术，谈「被看见」的情感，正中 ENFJ 的 Fe 核心"}, "realizes": ["D20-B8-ENFJ-1"]}, {"id": "D20-B7-INFJ-1", "title": "六分钟收完稻谷，是一个家族的保存键", "channel": "", "hook": "情感共鸣", "targets": ["INFJ"], "quality": 8.7, "status": "deployed", "post": {"cover_title": "六分钟收完稻谷，是一个家族的保存键", "body": "大雨将至，一家六口，六分钟，收完一千斤稻谷。\n\n有人看到的是「干得真快」。\n\nINFJ 看到的，是三代人同时按下的保存键。\n\n谷粒落地的声音，是奶奶、爸爸、孩子，把同一段记忆，存进了同一阵风里。\n\n这是一种很古老的东西。\n\n它不靠语言，靠的是「我们都懂这一刻有多重要」。\n\nINFJ 会被这样的画面击中——\n因为她天生就在寻找这种「无声的连接」。\n\n一家人为了同一个目标，拼尽全力，不需要说一句话。\n\n这，就是 INFJ 心里「家」的样子。", "hashtags": ["#INFJ", "#家庭", "#稻谷", "#温暖", "#治愈"], "cover_visual": "大雨前的田野，一家六口弯腰收稻的远景，天空压着乌云，泥土暖色", "cta": "你记忆里，有没有一个「一家人不需要说话就懂了」的瞬间？", "post_time": "晚 20:00-21:00", "avoid": "不煽情过度、不涉及农村刻板印象、保持对劳动的尊重"}, "brief": {"pain_point": "INFJ 对「无声家庭连接」的深层共鸣", "hook_first3": "「六分钟收一千斤稻谷」强数据 + 紧迫场景快速抓人", "emotion_curve": "场景→洞察→共鸣（快→保存键→家的样子）", "structure": "强场景开场 / INFJ 的 Ni 洞察 / 无声连接的意义", "differentiation": "从「效率」里挖出「情感记忆」，符合 INFJ 的 Ni-Fe 深度解读"}, "realizes": ["D20-B7-INFJ-1"]}, {"id": "D20-B4-ENFJ-1", "title": "妈妈考研，女儿是第一个支持的人", "channel": "", "hook": "身份认同", "targets": ["ENFJ"], "quality": 8.5, "status": "active", "post": {"cover_title": "妈妈考研，女儿是第一个支持的人", "body": "41 岁的妈妈，考上了 985 研究生。\n\n很多人看到的是「励志」。\n\n但 ENFJ 看到的是另一个更温柔的故事——\n\n妈妈终于开始，为自己的人生投资了。\n\n而比妈妈更早看到这件事的，是她的女儿。\n\n女儿那句「妈，你去考吧」，才是这条新闻里，最温柔的齿轮。\n\nENFJ 太懂这种「被家人托住」的力量了。\n\n一个人敢在 41 岁重启人生，不是因为不怕，是因为身后有人对她说：\n「你去，我托着你。」\n\n所以你看，一个女人的野心，往往是被爱点亮的那盏灯。", "hashtags": ["#ENFJ", "#妈妈考研", "#女性成长", "#家庭", "#温柔的力量"], "cover_visual": "妈妈伏案学习的背影 + 女儿在门口微笑的画面，暖光，生活感", "cta": "你人生里，有没有一句「你去吧」推过你一把？说说那个人。", "post_time": "晚 20:30-22:00", "avoid": "不强化「妈妈牺牲」的苦情、不制造代际对立、聚焦支持而非牺牲"}, "brief": {"pain_point": "ENFJ 对「被家人托住」的深层共鸣与女性成长议题", "hook_first3": "「41岁妈妈考985」具体故事 + 「最温柔齿轮」的情感反转", "emotion_curve": "励志→温柔→共鸣（妈妈→女儿→被托住）", "structure": "故事切入 / ENFJ 的独特视角 / 被托住的力量 / 野心是爱点亮的", "differentiation": "不从「励志」谈，从「支持」谈，正中 ENFJ 的 Fe 关系视角"}, "realizes": ["D20-B4-ENFJ-1"]}, {"id": "D20-B4-INFJ-1", "title": "13岁炒粉少年，看见一个系统的切片", "channel": "", "hook": "情感共鸣", "targets": ["INFJ"], "quality": 8.8, "status": "active", "post": {"cover_title": "13岁炒粉少年，看见一个系统的切片", "body": "13 岁的少年，白天写作业，晚上在夜市炒粉。\n\n很多人看到的是「懂事」。\n\n但 INFJ 看到的是一个社会结构的切片——\n\n为什么一个 13 岁的孩子，需要同时扛起作业本和炒锅？\n\n这不是一个孩子的故事。\n\n这是一个系统，把负担转移给了最没有选择权的人。\n\nINFJ 天生就会这样想问题。\n\n她不会只盯着一个人，她会看到这个人背后，那一整张看不见的网。\n\n懂事的孩子，值得被看见。\n\n但更值得被追问的，是「为什么需要他这么懂事」。", "hashtags": ["#INFJ", "#社会观察", "#少年", "#深度思考", "#人间"], "cover_visual": "夜市灯火下少年炒粉的侧影 + 旁边放着的书包，冷暖对比，纪实感", "cta": "你有没有在某个「懂事」背后，看到更深的东西？", "post_time": "晚 21:00-22:30", "avoid": "不消费苦难、不指责具体个人、聚焦结构性思考而非煽情"}, "brief": {"pain_point": "INFJ 对社会结构性问题的敏锐与关怀", "hook_first3": "「13岁少年夜市炒粉」具体场景 + 「系统的切片」反常识解读", "emotion_curve": "场景→洞察→追问（懂事→系统→为什么）", "structure": "场景 / INFJ 的 Ni 洞察 / 结构性追问", "differentiation": "从「个体懂事」上升到「系统追问」，符合 INFJ 的 Ni-Fe 社会关怀"}, "realizes": ["D20-B4-INFJ-1"]}, {"id": "D20-B2-INFJ-1", "title": "知道不再值钱，什么才是护城河？", "channel": "", "hook": "好奇心", "targets": ["INFJ"], "quality": 8.7, "status": "active", "post": {"cover_title": "知道不再值钱，什么才是护城河？", "body": "DeepSeek 一夜之间，把 8 万亿 Token 的知识，变成了免费午餐。\n\n很多人慌了：知识不值钱了，我们怎么办？\n\n但 INFJ 看到的是另一个问题——\n\n当「知道」不再值钱，什么才是人类最后的护城河？\n\n答案其实一直都有：\n\n会问问题的人，比会背答案的人，值钱一万倍。\n\n能共情的人，比能复述的人，不可替代。\n\n有判断力的人，比有数据库的人，走得更远。\n\nAI 把「知识」从神坛上拽了下来。\n\n但 AI 永远抢不走三样东西：\n你的好奇、你的温柔、你敢于「不知道」却依然向前走的勇气。", "hashtags": ["#INFJ", "#DeepSeek", "#AI", "#认知", "#思考"], "cover_visual": "深色科技感背景 + 一个发光的问号，蓝紫色调，简洁留白", "cta": "AI 时代，你觉得什么是「AI 抢不走」的？评论区聊聊。", "post_time": "晚 19:30-21:00", "avoid": "不制造「AI 取代人类」的恐慌、不贬低技术、给出建设性出口"}, "brief": {"pain_point": "INFJ 对「知识贬值」时代下人类价值的思考", "hook_first3": "「8万亿 Token 免费」强数据切入，引出「护城河」之问", "emotion_curve": "危机→思考→笃定（慌→问题→答案）", "structure": "现象冲击 / INFJ 的深层之问 / 三个答案 / 笃定收尾", "differentiation": "不谈「AI 多强」，谈「人还剩什么」，符合 INFJ 的 Ni 人文关怀"}, "realizes": ["D20-B2-INFJ-1"]}, {"id": "D18-B4-1", "title": "INFJ 的温柔，是提前跑完你的人生", "channel": "", "hook": "情感共鸣", "targets": ["INFJ"], "quality": 8.8, "status": "active", "post": {"cover_title": "INFJ 的温柔，是提前跑完你的人生", "body": "INFJ 不是「善解人意」。\n\n她的大脑，在你开口之前，就已经用 Ni 跑完了你的人生剧本。\n\n用 Fe，听完了你没有说出口的那个版本。\n\n然后，递给你一句，恰好戳中伤口、但不会让你疼的话。\n\n这不是情商高。\n\n这是一种很累的天赋。\n\n因为 INFJ 每理解一个人，都要在自己心里，先经历一遍对方的痛。\n\n她不是「懂你」，她是「替你疼过一遍，还笑着递给你创可贴」。\n\n如果你身边有 INFJ，请记得：\n\n她的温柔，从来不是廉价的。", "hashtags": ["#INFJ", "#温柔", "#共情", "#人格", "#懂你"], "cover_visual": "一个人低头倾听的侧影 + 柔和的光晕，温暖治愈，蓝紫渐变", "cta": "那个「总是懂你」的人，你有多久没谢谢 TA 了？", "post_time": "晚 21:00-22:30", "avoid": "不神化共情能力、不制造「共情者就该被消耗」的叙事、结尾给关怀出口"}, "brief": {"pain_point": "INFJ 共情天赋背后的疲惫与被误解为「天生温柔」", "hook_first3": "「不是善解人意」反转 + 「跑完人生剧本」的画面感比喻", "emotion_curve": "反转→心疼→珍惜（不是情商→累的天赋→温柔不廉价）", "structure": "反转定义 / 共情的机制 / 累的天赋 / 提醒珍惜", "differentiation": "从「被共情者」视角转向「共情者的疲惫」，给 INFJ 被看见的感觉"}, "realizes": ["D18-B4-1"]}, {"id": "D18-B1-2", "title": "扛钢管的妈妈，是关系建筑师", "channel": "", "hook": "情感共鸣", "targets": ["INFJ"], "quality": 8.7, "status": "active", "post": {"cover_title": "扛钢管的妈妈，是关系建筑师", "body": "单亲妈妈，扛钢管，供女儿考上北大。\n\n有人看到的是「苦情」。\n\n但 INFJ 看到的是另一种东西——\n\n一个「用 Ni 看见终点，用 Fe 扛住现在」的关系建筑师。\n\n她心里，早就看见了女儿未来那个「北大」的终点。\n\n所以她愿意，在现在这个最苦的阶段，一根钢管一根钢管地扛。\n\n这不是苦情，这是信念。\n\nINFJ 太懂这种「为了终点而忍受当下」的力量了。\n\n因为 INFJ 自己，就是这样活着的——\n\n心里有光，脚下有泥，但眼睛，一直看着远方。", "hashtags": ["#INFJ", "#单亲妈妈", "#信念", "#母爱", "#成长"], "cover_visual": "工地脚手架与母亲劳作的背影 + 远处一束光，纪实与希望的对比", "cta": "你心里有没有一个「看见了终点，所以扛住现在」的时刻？", "post_time": "晚 20:00-21:30", "avoid": "不消费苦难、不强化「母亲必须牺牲」、聚焦「信念」而非「惨」"}, "brief": {"pain_point": "INFJ 对「为终点忍受当下」的信念共鸣", "hook_first3": "「扛钢管供女儿上北大」强故事 + 「关系建筑师」的独特定义", "emotion_curve": "故事→洞察→共鸣（苦情→信念→看见远方）", "structure": "故事切入 / INFJ 的重新定义 / 信念的本质 / 共鸣收尾", "differentiation": "把「苦情」重新定义为「信念」，符合 INFJ 的 Ni 长期主义视角"}, "realizes": ["D18-B1-2"]}, {"id": "D17-B3-2", "title": "3分钟刷屏，是情绪共振的拆解", "channel": "", "hook": "好奇心", "targets": ["ENFJ"], "quality": 8.6, "status": "active", "post": {"cover_title": "3分钟刷屏，是情绪共振的拆解", "body": "农村女孩，3 分钟发言，刷屏全网。\n\n有人说她「会说话」。\n\n但 ENFJ 看懂了——\n\n她不是会说话，是她的每一句话，都精准踩中了所有人的「情绪共振频率」。\n\n这就是 Fe-Ni 系统的威力。\n\nFe，让她瞬间读懂台下每个人的情绪。\nNi，让她一眼看穿这些话背后的深层渴望。\n\n当她把这两者合在一起，说出来的每句话，都是「说进你心里」。\n\n普通人说话，是在「表达自己」。\n\n而她说话，是在「共振所有人」。\n\n这，才是她刷屏的真正原因。", "hashtags": ["#ENFJ", "#表达", "#情绪共振", "#FeNi", "#说话的艺术"], "cover_visual": "舞台上女孩发言的特写 + 台下观众专注的脸，暖光，聚焦感", "cta": "你有没有一句话，听完就觉得「这说的就是我」？", "post_time": "午 12:30-13:30", "avoid": "不神化个人、不制造「普通人不会说话」的焦虑、聚焦方法而非天赋"}, "brief": {"pain_point": "ENFJ 对「真诚表达打动人」的共鸣与表达力提升诉求", "hook_first3": "「3分钟刷屏」强结果 + 「不是会说话」的反转", "emotion_curve": "好奇→拆解→领悟（会说话→情绪共振→FeNi）", "structure": "现象 / 反常识反转 / Fe-Ni 拆解 / 真正的会说话", "differentiation": "把「会说话」拆解成可理解的 Fe-Ni 机制，给 ENFJ 提供方法论认同"}, "realizes": ["D17-B3-2"]}, {"id": "D17-B1-2", "title": "INFJ 不交朋友，她在校准你", "channel": "", "hook": "身份认同", "targets": ["INFJ"], "quality": 8.8, "status": "active", "post": {"cover_title": "INFJ 不交朋友，她在校准你", "body": "INFJ 不交朋友。\n\n别误会，不是她冷。\n\n是她在「校准」你可能会成为的那个人，然后决定，要不要陪你走这段路。\n\nINFJ 看人，看的不是你现在是谁。\n\n是你「可能成为谁」。\n\n她会观察你如何处理一次尴尬，如何对待一个比你弱的人，如何在没人看见的时候做选择。\n\n这些瞬间，比一万句自我介绍，都更真实。\n\n所以 INFJ 的朋友很少，但每一个，都是她认真「校准」过的灵魂。\n\n如果你被一个 INFJ 认定，恭喜你——\n\n她不是随便选了你，她是「看见」了你。", "hashtags": ["#INFJ", "#友谊", "#深度关系", "#人格", "#懂我"], "cover_visual": "一个人的剪影望向远处人群，中间留白，深蓝冷调，有距离感但温暖", "cta": "INFJ 的朋友们，说说你是怎么被「认定」的？", "post_time": "晚 20:00-21:30", "avoid": "不强化「INFJ 高傲/难接近」的刻板印象、不贬低泛泛之交"}, "brief": {"pain_point": "INFJ 对「深度关系」的重视与「被误解为冷」的委屈", "hook_first3": "「INFJ 不交朋友」反常识开场，制造悬念后反转", "emotion_curve": "误解→解释→骄傲（不交朋友→校准→被看见）", "structure": "反常识开场 / 校准的逻辑 / 看人的方式 / 被认定的珍贵", "differentiation": "把「朋友少」重新定义为「深度校准」，给 INFJ 提供认同与骄傲"}, "realizes": ["D17-B1-2"]}, {"id": "D16-B1-1", "title": "不接电话的那晚，ENFJ 听到了呼吸", "channel": "", "hook": "身份认同", "targets": ["ENFJ"], "quality": 8.8, "status": "active", "post": {"cover_title": "不接电话的那晚，ENFJ 听到了呼吸", "body": "当 ENFJ 终于学会「不接电话」的那个晚上，她第一次听到了自己的呼吸声。\n\n在这之前，她的手机就是她的命。\n\n谁需要她，她就在。\n谁求助她，她就冲。\n\n她以为，被需要，就是被爱。\n\n直到那天，她把手机关静音，躺下来，听到自己呼吸的声音。\n\n她突然懂了——\n\n「我不需要被需要，我本身就有价值。」\n\n这句话，她花了很久很久，才对自己说出口。\n\n亲爱的 ENFJ，你的价值，从来不需要靠「被需要」来证明。\n\n你存在，就已经很值得。", "hashtags": ["#ENFJ", "#自我价值", "#边界感", "#治愈", "#成长"], "cover_visual": "夜晚安静的房间 + 床头柜上息屏的手机，一束柔光，静谧治愈感", "cta": "你有没有一个「终于为自己」的瞬间？说出来，我们都为你高兴。", "post_time": "晚 22:30-23:30", "avoid": "不否定付出、不鼓励极端断联、强调「边界」而非「冷漠」"}, "brief": {"pain_point": "ENFJ 把「被需要」等同于「有价值」的自我认知误区", "hook_first3": "「第一次听到自己呼吸」的细节，制造强烈画面感与反差", "emotion_curve": "疲惫→觉醒→释然（被需要→呼吸→我本身有价值）", "structure": "觉醒瞬间 / 过去的模式 / 核心领悟 / 温柔鼓励", "differentiation": "从「呼吸声」这个微小细节切入，给出「自我价值」的温柔出口"}, "realizes": ["D16-B1-1"]}, {"id": "D15-B3-1", "title": "会安慰所有人的你，谁来安慰？", "channel": "", "hook": "反常识", "targets": ["ENFJ"], "quality": 8.7, "status": "deployed", "post": {"cover_title": "会安慰所有人的你，谁来安慰？", "body": "朋友圈里最会安慰人的那个 ENFJ，其实早就被掏空了。\n\n你以为她天生温暖。\n\n其实她只是习惯了，把所有人的情绪，都先接过来。\n\n朋友失恋了，她陪着熬到凌晨。\n同事崩溃了，她递纸巾又递方案。\n\n可轮到她自己难过的时候，她张了张嘴，只挤出一句：「没事，我还好。」\n\nENFJ 的温柔，是一种「只有我能治愈全世界，但谁能治愈我」的孤独。\n\n如果你身边有这样一个 ENFJ——\n\n今晚，别问她「你怎么了」。\n\n直接跟她说：「你辛苦了，换我来。」\n\n这句话，她等了很久。", "hashtags": ["#ENFJ", "#情绪价值", "#治愈", "#懂我的人", "#情感"], "cover_visual": "深夜亮着的手机屏幕 + 一个人抱膝的剪影，暖黄色调，温柔但略带孤单", "cta": "如果你也是那个「只安慰别人」的人，今天，允许自己被安慰一次。", "post_time": "晚 22:00-23:30（深夜情绪高峰）", "avoid": "不制造焦虑、不强化「受害者」叙事、结尾必须给出口（被治愈的出口）"}, "brief": {"pain_point": "ENFJ 付出型人格的「情绪透支」与不被看见的孤独", "hook_first3": "「朋友圈里最会安慰人的人被掏空」反常识切入，戳中付出型人群", "emotion_curve": "共鸣→心疼→温柔出口（孤独→被看见→换我来）", "structure": "反常识开场 / 付出场景堆叠 / 孤独的本质 / 给一句出口", "differentiation": "不贩卖焦虑，结尾给「被治愈」的具体行动，符合 ENFJ 需要被回应的心理"}, "realizes": ["D15-B3-1"]}, {"id": "D15-B2-3", "title": "你的社恐，是在守护一个审美世界", "channel": "", "hook": "情感共鸣", "targets": ["ISFP"], "quality": 8.7, "status": "deployed", "post": {"cover_title": "你的社恐，是在守护一个审美世界", "body": "别再逼 ISFP「外向一点」了。\n\n你以为 TA 是社恐，其实是 TA 在守护一个不能被打扰的审美世界。\n\nISFP 不是不会社交，是 TA 的内心太丰富了。\n\n一首歌、一片晚霞、一段只有 TA 懂的画面，都值得 TA 一个人慢慢品味。\n\n强行把 TA 拉进喧闹的人群，等于把一幅画扔进了菜市场。\n\nISFP 的安静，是一种选择，不是缺陷。\n\nTA 在用「不打扰」，保护自己心里那个精致的小宇宙。\n\n如果你身边有 ISFP，最好的陪伴是：\n「你待着就好，我在这儿，不吵你。」", "hashtags": ["#ISFP", "#社恐", "#审美", "#内向", "#懂我"], "cover_visual": "一个人坐在窗边看晚霞的侧影 + 柔和的暮色，低饱和暖调，留白很多", "cta": "ISFP 们，你们心里那个「不能被吵到的小世界」里，最近放着什么？", "post_time": "晚 21:00-22:00", "avoid": "不用「孤僻」「不合群」等负面标签、不鼓励极端社交回避"}, "brief": {"pain_point": "ISFP 被误解为「社恐」，实际是审美世界的自我保护", "hook_first3": "「别再逼 ISFP 外向」替内向者发声，制造立场认同", "emotion_curve": "被理解→释然→骄傲（误解→守护→选择）", "structure": "打破误解 / 审美世界的解释 / 安静是选择 / 给陪伴方式", "differentiation": "把「社恐」重新定义为「审美守护」，给 ISFP 提供身份骄傲"}, "realizes": ["D15-B2-3"]}, {"id": "D14-B1-1", "title": "你会在几岁，不再证明自己？", "channel": "小红书", "hook": "好奇心", "targets": ["INFJ", "INFP", "INTJ"], "quality": 8.7, "status": "active", "post": {"cover_title": "你会在几岁，不再证明自己？", "body": "周星驰说：我老了，不享受镜头了。\n\n这句话，\n被很多人当成了「告别」。\n\n但我想请你换个角度看——\n它不是认输，\n是一个人的「证明模式」终于关机了。🔕\n\n你有没有发现，\n我们人生的前几十年，\n几乎都在做同一件事：\n证明自己。\n\n证明给父母看、给老师看、\n给老板看、给朋友圈看。\n\n可周星驰告诉你：\n人到某个年纪，\n是可以「不再证明自己」的。\n\n不是不优秀了，\n是终于明白——\n我不需要别人的镜头，\n才确认自己存在。🌙\n\n这其实和MBTI很像。\n有人30岁就放下了证明，\n有人60岁还在追一个\"被认可\"。\n\n差别不在能力，\n在你有没有找到\n「自己定义自己」的那把钥匙。\n\n你，会在几岁，不再证明自己？\n\n💬 评论区聊聊：\n你现在，还在为什么而证明自己？", "hashtags": ["#MBTI", "#自我成长", "#周星驰", "#好奇心", "#停止证明"], "cover_visual": "黑白电影质感，一个人站在舞台灯光外/镜头外的侧影，配大字\"你会在几岁不再证明自己\"；克制、哲学感、留白。", "cta": "你现在，还在为什么而证明自己？评论区聊聊。", "post_time": "20:00-22:00（深夜自我反思高峰）", "avoid": "不消费明星、不做\"江郎才尽\"定性；避免贩卖年龄焦虑（用\"证明模式关机\"的解放感而非\"老了\"的无力感）。"}, "brief": {"pain_point": "INFJ/INFP/INTJ共同痛点——过度依赖外界认可、持续'证明自己'的内耗；周星驰的'不享受镜头'是'停止证明'的样本。", "hook_first3": "'周星驰说：我老了，不享受镜头了'点事件；'很多人当告别'摆反应；'但它不是认输，是证明模式关机'反转。", "emotion_curve": "好奇(告别?) → 被点醒(证明模式) → 共鸣(前半生都在证明) → 释然(可以不证明了)。", "structure": "钩子·事件 / 反转·证明模式关机 / 共鸣·我们都曾在证明 / 洞察·MBTI与停止证明 / CTA·你在为什么证明", "differentiation": "别人写周星驰'老了'，我们讲'停止证明自己'的解放；用MBTI视角把明星事件转成自我成长提问。"}, "realizes": ["D14-B1-1"]}], "vessels": {"D21-B3-ENTJ-1": {"vessel": {"source": {"agent": "设设", "subsystem": "内容创作", "batch": "D21-B3"}}, "content": {"id": "D21-B3-ENTJ-1", "title": "苹果在中国终于当了一回\"说了不算的人\"——ENTJ没有在吃瓜，他在拆这套权力结构的源代码", "hook": "反常识", "targets": ["ENTJ"], "channel": "抖音", "quality": 8.8, "status": "active", "created": "2026-08-12T08:30:00+08:00", "budget": 25, "flagship": false, "attachment_theory_resonance": false, "batch": "D21-B3", "producer": "设设", "paradigm": "反常识·Te-Ni权力结构审计型(ENTJ续触batch2·苹果买方霸权权力反转+梁文锋3850%增幅双信号·Te战略审计买方权力地图+Ni系统思维全球权力结构裂缝·信任7.74惯性持稳)", "role": "P0·ENTJ反常识batch2·max_consecutive=2合规·权力结构反转叙事·B4必须轮出", "direction_compliance": "D21-B3 direction-vessel arm1 100%对齐", "not -ENFP-1", "title": "月入4万的大提琴老师，转身去卖馒头——ENFP没有把这当成一条\"职业降级\"的八卦。她的Fi系统在0.3秒里听懂了这个选择真正的重量：一个人最难的不是赚到别人眼里的\"好\"，是敢在\"应该\"和\"想要\"之间，坚定地选后者", "hook": "反常识", "targets": ["ENFP"], "channel": "小红书", "quality": 9.0, "status": "deployed", "created": "2026-08-21T08:35:00+08:00", "budget": 25, "flagship": true, "attachment_theory_resonance": false, "batch": "D21-B12", "producer": "设设", "paradigm": "反常识·Fi-Ne自我觉醒型(B12大面积轮出·ENTJ/INTJ反常识batch2达上限→ENFP接管反常识batch1首触·大提琴老师9分旗舰·Fi价值裁判:4万高薪=外部给定的成就模板·Ne对照:真正的自我觉醒不是爬得更高·是敢撕掉'应该'的剧本·自我觉醒母题二级命中)", "role": "P0·ENFP反常识batch1首触(自我觉醒旗舰9)·大提琴老师转行卖馒头·小红书Fi位·hook_priority#1·方向船key_decision点名'自我觉醒旗舰'", "direction_compliance": "D21-B12 direction-pool key_decision'自我觉醒旗舰·大提琴老师馒头9分(ENFP反常识)'100%对齐·ENFP×反常识×小红书", "note": "🟢 fresh(ENFP社会证明batch1→反常识batch1新hook首触)·大提琴老师9旗舰·放弃4万高薪转行·自我觉醒母题·小红书v2.0成品post落地", "signals": ["月入4万大提琴老师回应转行卖馒头(9分·反常识/自我觉醒·旗舰)"], "brief": {"pain_point": "ENFP的Fi最怕被'应该'绑架——考好学校、进大厂、体面高薪，这些别人眼里的'好'对ENFP反而是牢笼；大提琴老师放弃4万高薪，戳中的正是'我到底在为自己活，还是为别人的期待活'。", "hook_first3": "第一行'月入4万，他转身去卖馒头'制造反差；第二行'不是失败，是终于敢选想要'点穿反常识核心；第三行'ENFP看到的不止是一个人的转行'切人格视角。", "emotion_curve": "猎奇/反差(4万→卖馒头) → 羡慕(敢选想要) → 被戳中(我也在被'应该'推着走) → 释然(人生可以重选) → 勇气(我也想为自己活一次)。", "structure": "钩子·反差题 / 现象·别人眼里的'降级' / 洞察·自我觉醒不是爬更高是敢选 / 升华·'应该'vs'想要' / CTA·你现在选哪个", "differentiation": "别人写大提琴老师讲'转行励志/职业自由/馒头店火了'，我们讲'4万高薪是外部模板·转行是一次Fi的自我觉醒'；不做'辞职追梦'鸡汤，不judge稳定工作，落点'选择权在自己'。"}, "actual_ctr": null, "actual_roi": null, "last_used": "2026-08-21T09:25:00+08:00", "usage_count": 1.0, "deployed_batch": "D21-B12", "writeback_note": "B12大面积轮出批·ENFP反常识batch1首触fresh(大提琴馒头9旗舰)", "post": {"cover_title": "月入4万，他转行去卖馒头", "body": "月入4万，他转身去卖馒头。\n\n不是破产，不是被裁。\n是他自己，不想拉了。🎻\n\n很多人第一反应是：疯了吧？\n\n体面、高薪、稳定的工作，\n说放就放，去揉面、蒸馒头。\n\n但停下来想一想，\n那个\"可惜\"，是谁的可惜？\n\n是社会给的\"应该\"：\n你应该做体面的工作，\n你应该守住4万月薪，\n你应该别折腾。\n\n可是\"应该\"和\"想要\"，\n从来不是一回事。\n\n大提琴老师真正放下的，\n不是钱，\n是那个\"别人眼里的好\"。\n\n他选的是——\n我终于可以，只为自己活。🌙\n\n这不是一个转行的故事，\n是一个\"自我觉醒\"的故事。\n\n最难的不是爬得更高，\n是在所有人都说\"你傻\"的时候，\n还坚定地选\"我想要\"。\n\n你现在走的路，\n是\"应该\"，还是\"想要\"？\n\n评论 : "D21-B7"}}, "content": {"id": "D21-B7-ENFJ-1", "title": "许昌胖东来附近，一个老板流泪说\"舍不得\"——ENFJ没有把这当成一条商业新闻。她的Fe系统在0.3秒里听懂了这场眼泪真正的分量：人不会为一家公司哭，人会为\"被当成一个人对待\"而哭", "hook": "情感共鸣", "targets": ["ENFJ"], "channel": "小红书", "quality": 8.9, "status": "active", "created": "2026-08-16T08:30:00+08:00", "budget": 25, "flagship": false, "attachment_theory_resonance": false, "batch": "D21-B7", "producer": "设设", "paradigm": "情感共鸣·Fe-Ni真诚稀缺双弦型(ENFJ轮出首触·社会证明batch2达上限→轮出情感共鸣·Fe共情:人被当成一个人对待而哭+Ni洞察:真诚是最稀缺竞争力·胖东来流泪7分旗舰·Fe-dom弹性验证)", "role": "P1·ENFJ情感共鸣轮出首触·Fe-Ni真诚稀缺双弦·社会证明轮出接棒·胖东来流泪7旗舰", "direction_compliance": "D21-B7 direction-vessel arm6 100%对齐", "note": "🆕 社会证明batch2达上限→轮出情感共鸣首触·Fe共情(胖东来流泪7)·真诚稀缺母题·D21-B8评估续触batch2", "signals": ["许昌胖东来附近老板流泪说舍不得(7分·社会情绪)"], "brief": {"pain_point": "ENFJ的Fe对'真诚/被当作人'极度渴求，也最容易被'真诚稀缺'的时代刺痛；胖东来流泪正是'真诚被看见'的稀缺样本。", "hook_first3": "'许昌胖东来附近，一个老板流泪说舍不得'点事件；'很多人不理解：一家超市而已'摆大众反应；'但我想说：人从来不会为公司哭'反转立论。", "emotion_curve": "好奇(为什么哭) → 被戳中(被当人对待的稀缺) → 共情(哭的是被好好对待过的自己) → 温暖(愿我们都能被认真对待)。", "structure": "钩子·流泪事件 / 反转·人不会为公司哭 / 洞察·稀缺的是被当人对待 / 升华·哭的是自己 / CTA·被认真对待的瞬间", "differentiation": "别人写胖东来讲'良心企业/服务好'，我们讲'被当人对待的稀缺'；Fe视角落到情感而非消费测评。"}, "post": {"cover_title": "人不会为公司哭，只为被当人对待", "body": "许昌，胖东来附近。\n\n一个老板在镜头前红了眼眶，\n反复说：舍不得。\n\n很多人不理解：\n一家超市而已，至于吗？\n\n但我想说——\n人，从来不会为一家公司哭。🏪\n\n人会哭，\n是因为在某个地方，\n第一次被当成「一个人」对待。\n\n不是「消费者」，\n不是「业绩」，\n是「你」。\n\n你买到的每样东西，\n都有人替你把关；\n你提的每个意见，\n都有人认真听完。\n\n这种「被认真对待」的感觉，\n在这个把人当流量的时代，\n太稀缺了。💧\n\n所以那个老板哭的，\n不是一家店，\n是被好好对待过的自己。\n\n愿我们都能遇到，\n把你当「人」看的那个地方、那个人。\n\n💬 你有没有过「被认真对待」的瞬间？\n评论区，说给我听。", "hashtags": ["#情感", "#MBTI", "#ENFJ", "#胖东来", "#被认真对待"], "cover_visual": "暖色调，超市暖光下的货架/人背影，配大字\"人不会为公司哭，只为被当人对待\"；治愈、烟火气、留白。", "cta": "你有没有过'被认真对待'的瞬间？评论区说给我听。", "post_time": "12:00-13:00（午间情绪高峰）", "avoid": "不神化企业、不引战其他商超、不做软文式吹捧；避免\"良心企业\"等绝对化表述被判定营销。"}}}, "D18-B5-2": {"vessel": {"source": {"agent": "设设", "subsystem": "内容创作", "batch": ""}}, "content": {"id": "D18-B5-2", "title": "一个12岁的男孩在镜头前拿到了9分——所有人都在鼓掌，但ENFP的大脑里正在发生一场灾难：她的Ne-Fi系统自动生成了这个男孩未来60年的人生剧本，每一页都写着「9分之 tual_ctr": null, "actual_roi": null, "last_used": "2026-08-20T09:25:00+08:00", "usage_count": 1.0, "deployed_batch": "D21-B11", "writeback_note": "fresh首用·usage 0→1·arm4 D21-B11", "post": {"cover_title": "生活费给多少？孩子算的是爱", "body": "大学生一个月该给多少生活费？\n\n这道题，每年开学都要吵上热搜。\n\n有人说 1500 就够，有人说 3000 都紧。\n\n但吵来吵去，很少有人点破一件事——\n\n家长在算账，孩子其实在算爱。💔\n\n你有没有过那种瞬间：\n\n开口要生活费，比开口说「我爱你」还难。\n\n不是真的缺那几百块，\n是怕一张嘴，就变成「怎么又花完了」。\n\n生活费这个数字，\n从来不是一道算术题。\n\n它是两代人第一次，\n被迫坐下来谈「边界」和「信任」。\n\n给多少，其实没有标准答案。\n\n真正重要的，是你们有没有把话说开：\n\n「这个月怎么花的，我们一起看」\n比「省着点花」有用一百倍。\n\n谈钱，一点都不伤感情。\n藏着掖着，才伤。🌙\n\n你们家生活费是怎么定的？\n评论区聊聊，说不定能帮到别人。👇", "hashtags": ["#ENFP", "#大学生生活费", "#亲子关系", "#代际沟通", "#MBTI"], "cover_visual": "一张摊开的记账本，旁边一杯奶茶和几枚硬币，暖黄色调，生活感，呼应'算账与算爱'的双重主题", "cta": "你们家生活费是怎么定的？评论区聊聊，说不定能帮到别人。", "post_time": "18:00-20:00（开学季·晚高峰情感流量）", "avoid": "不制造'给多给少'的攀比焦虑、不judge任何家庭的金额、不贩卖'啃老/不孝'对立、聚焦代际沟通"}}}, "D17-B3-2": {"vessel": {"source": {"agent": "设设", "subsystem": "内容创作", "batch": "D17-B3"}}, "content": {"id": "D17-B3-2", "title": "农村女孩3分钟发言刷屏全网——她不是会说话，是她的每一句话都踩中了所有人的「情绪共振频率」：Fe-Ni系统第一次被拆开给你看", "hook": "好奇心", "targets": ["ENFJ"], "channel": "小红书", "quality": 8.6, "status": "active", "created": "2026-07-31T00:00:00+08:00", "budget": 25, "flagship": false, "attachment_theory_resonance": false, "batch": "D17-B3", "producer": "设设", "paradigm": "", "role": "", "direction_compliance": "", "note": "", "brief": {"pain_point": "ENFJ 对「真诚表达打动人」的共鸣与表达力提升诉求", "hook_first3": "「3分钟刷屏」强结果 + 「不是会说话」的反转", "emotion_curve": "好奇→拆解→领悟（会说话→情绪共振→FeNi）", "structure": "现象 / 反常识反转 / Fe-Ni 拆解 / 真正的会说话", "differentiation": "把「会说话」拆解成可理解的 Fe-Ni 机制，给 ENFJ 提供方法论认同"}, "post": {"cover_title": "3分钟刷屏，是情绪共振的拆解", "body": "农村女孩，3 分钟发言，刷屏全网。\n\n有人说她「会说话」。\n\n但 ENFJ 看懂了——\n\n她不是会说话，是她的每一句话，都精准踩中了所有人的「情绪共振频率」。\n\n这就是 Fe-Ni 系统的威力。\n\nFe，让她瞬间读懂台下每个人的情绪。\nNi，让她一眼看穿这些话背后的深层渴望。\n\n当她把这两者合在一起，说出来的每句话，都是「说进你心里」。\n\n普通人说话，是在「表达自己」。\n\n而她说话，是在「共振所有人」。\n\n这，才是她刷屏的真正原因。", "hashtags": ["#ENFJ", "#表达", "#情绪共振", "#FeNi", "#说话的艺术"], "cover_visual": "舞台上女孩发言的特写 + 台下观众专注的脸，暖 liance": "D21-B25 rotation对齐·ENTJ×身份认同×微博·续batch2·身份认同达max_consecutive=2(B26必轮出)·正向(自信/长期主义·不同角度于B23·2批间隔)·0违规", "note": "🟢 fresh(D21-B25轮换批·ENTJ身份认同batch2旗舰)·依据B25方向船mandates+priority_types+strategy-pool·郑钦文巅峰期8旗舰·Te雄心/长期主义·微博体育位·正向(自信)·轻微重复风险已标注(B23已用郑钦文逆转9·不同角度)·投投冻结延续·解冻后按方向船部署", "signals": ["郑钦文：我的巅峰期还在后面(8分·身份认同·体育·自信/长期主义·heat11308828·top_signals 08:00)"], "brief": {"pain_point": "ENTJ把人生当成一个不断进攻的项目，最怕的不是失败，是『到顶了、没上升空间了』。郑钦文一句『我的巅峰期还在后面』，戳中的正是ENTJ对『长期主义』的信仰——真正的高手永远把巅峰放在未来，因为只要野心还在，天花板就不存在。ENTJ停留，是因为这句话替他们确认了那条最深的信念：成绩是路标，不是终点。", "hook_first3": "第一行『郑钦文说：我的巅峰期还在后面』点出宣言；第二行『一句话，把冠军变成了起点』点反差；第三行『ENTJ看懂了：巅峰期的定义不是年龄，是野心还在不在』切入Te长期主义。", "emotion_curve": "战意(赛场宣言) → 认同(巅峰是进行时) → 共鸣(我的野心也没退) → 坚定(天花板不存在) → 昂扬(继续进攻)。", "structure": "钩子·宣言点题 / 背景·冠军之后怎么走 / 洞察·巅峰=野心还在不在 / 迁移·长期主义的自我驱动 / CTA·你的巅峰期，你认为到了吗", "differentiation": "别人写郑钦文是体育战报/励志鸡汤/蹭夺冠热度；我们写Te的『长期主义』——不做胜负复盘、不做情绪煽动，落点『野心不灭则巅峰永续』；让ENTJ看见的不是一个冠军的荣耀，而是一种『永远把未来当成战场』的心法。"}, "post": {"cover_title": "别问自己到没到顶，问自己还想不想打", "body": "郑钦文说：「我的巅峰期还在后面。」\n\n一句话，她把冠军变成了起点。\n\n大多数人夺冠后的第一反应，是终于能松一口气——「我到了」。\n\n郑钦文不是。她刚站上一个高峰，眼睛已经望向下一座。\n\n这不是谦虚，也不是客套。这是 Te 的本能：**把「现在」当成进行时，把「巅峰」当成未完成时。**\n\nENTJ 最怕的从来不是失败，是「到顶了」。\n\n失败可以复盘、可以再打；「到顶了」意味着没有上升空间了，意味着接下来只能守成、不能进攻。\n\n守成，对 Te 来说，是最无聊的活法。\n\n所以郑钦文这句话真正的分量，不在她的成绩，而在她定义「巅峰」的方式——\n\n**巅峰不是年龄，不是名次，是野心还在不在。**\n\n野心还在，35 岁、40 岁、50 岁，都是上升期；\n\n野心没了，20 岁就已经开始走下坡。\n\n这就是长期主义最锋利的地方：它不是「慢慢来」的自我安慰，而是「永远有下一仗要打」的自我驱动。\n\n很多人会问：「我是不是已经过了最好的时候？」\n\n这个问题本身就是答案。\n\n会问的人，往往还想要，只是不敢承认；真正到顶的人，不会问，只会停。\n\n郑钦文给了一个更干脆的参照：\n\n**别问自己「到没到顶」，问自己「还想不想打」。**\n\n还想打，你的巅峰期就还没到。\n\n不想打了，你才真正老了。\n\n那么，你的巅峰期——是已经过了，还是还没开始？", "hashtags": [], "cover_visual": "", "cta": "", "post_time": "20:00-22:00（晚间情绪/自我成长向）", "avoid": "不做胜负复盘、不蹭夺冠热度、不情绪煽动；落点「野心不灭则巅峰永续」正向"}}}, "D21-B14-ENFP-1": {"vessel": {"source": {"agent": "设设", "subsystem": "内容创作", "batch": "D21-B14"}}, "content": {"id": "D21-B14-ENFP-1", "title": "她放弃本科去当兵，8年后又回来专升本——ENFP看到的不只是一个励志故事：真正的自我觉醒，从来不是一次就选对，而是每一个岔路口都敢对自己诚实", "hook": "身份认同", "targets": ["ENFP"], "channe
