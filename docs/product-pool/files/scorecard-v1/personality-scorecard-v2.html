<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<title>人格记分卡 v2.0 · 测一测出结果</title>
<style>

  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--ink); padding:20px; }
  .wrap { max-width:880px; margin:0 auto; }
  h1 { font-size:22px; text-align:center; letter-spacing:1px; }
  .sub { color:var(--muted); font-size:13px; margin:8px 0 18px; line-height:1.7; text-align:center; }
  .tabs { display:flex; gap:8px; margin-bottom:16px; background:#eee8dd; border-radius:12px; padding:5px; }

  .q { margin-bottom:18px; }
  .q .qt { font-size:15px; font-weight:600; line-height:1.6; margin-bottom:10px; }

  .opt.sel { border-color:var(--accent); background:#fdf3ec; font-weight:600; }

  .result-head { text-align:center; }
  .result-head .os { font-size:15px; line-height:1.9; color:#4a4a4a; background:#faf7f1; border-radius:10px; padding:14px; margin-top:10px; text-align:left; }

  .bar { height:10px; border-radius:5px; background:#efeae1; overflow:hidden; }

  .tag { display:inline-block; background:#f3eee5; border-radius:6px; padding:3px 9px; font-size:12px; color:#7a6f5f; margin:3px; }
  .cases .case { background:#faf7f1; border-radius:10px; padding:12px 14px; margin-bottom:10px; }
  .cases .case .ct { font-size:14px; font-weight:600; }
  .cases .case .cs { font-size:12px; color:var(--muted); margin-top:4px; line-height:1.6; }
  .cases .case .cq { font-size:11px; color:var(--accent); margin-top:4px; }
  .std-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  @media(max-width:680px){ .std-grid{ grid-template-columns:1fr; } }
  .std-card { background:#faf7f1; border-radius:10px; padding:14px; }
  .std-card h3 { font-size:14px; margin-bottom:4px; }
  .std-card p { font-size:12px; color:var(--muted); line-height:1.6; }
  .disclaimer { font-size:11px; color:var(--muted); background:#faf7f1; border-radius:8px; padding:10px 12px; line-height:1.7; margin-top:12px; }
  .footer { text-align:center; color:var(--muted); font-size:12px; margin-top:22px; line-height:1.8; }

  .btn-sec button { flex:1; padding:10px; border:none; border-radius:9px; font-size:13px; cursor:pointer; }
  .btn-retry { background:#eee8dd; color:#7a6f5f; }
  .btn-std { background:var(--good); color:#fff; }
</style>
</head>

      <div class="btn-sec">

      <div id="caseList"></div>
    </div>
  </div>

  <div class="footer">
    人格记分卡 v2.0 · 荐荐（产品Hub）· 一次性交付 · 无支付依赖 · 2026-08-21<br>

    b.onclick = () => {
      answers[qi] = oi;
      body.querySelectorAll('.opt').forEach(x => x.classList.remove('sel'));
      b.classList.add('sel');
      document.getElementById('nextBtn').disabled = false;
    };
    body.appendChild(b);
  });
  document.getElementById('nextBtn').disabled = answers[qi] < 0;
  document.getElementById('nextBtn').textContent = qi === DATA.questions.length-1 ? '✨ 查看我的记分卡' : '下一题';
}
document.getElementById('nextBtn').onclick = () => {
  if (qi < DATA.questions.length-1) { qi++; renderQ(); }
  else { calc(); }
};

function level(v) {
  if (v>=72) return ['极高','#22c55e'];
  if (v>=58) return ['偏高','#a3e635'];
  if (v>=43) return ['中等','#eab308'];
  if (v>=28) return ['偏低','#f97316'];
  return ['极低','#ef4444'];
}

function calc() {
  const raw = {}; const cnt = {};
  DIMS.forEach(d => { raw[d]=0; cnt[d]=0; });
  DATA.questions.forEach((q, i) => {
    const opt = q.options[answers[i]];
    for (const [d, s] of Object.entries(opt.scores)) { raw[d]+=s; cnt[d]++; }
  });
  const norm = {};
  DIMS.forEach(d => {
    norm[d] = cnt[d] ? Math.max(1, Math.min(99, Math.round((raw[d]/cnt[d]+3)/6*100))) : 50;
  });
  const top2 = [...DIMS].sort((a,b)=>norm[b]-norm[a]).slice(0,2);
  const low2 = [...DIMS].sort((a,b)=>norm[a]-norm[b]).slice(0,2);
  // 认知OS
  const osParts = [];
  const h = DATA.hooks;
  osParts.push('你的认知操作系统以「'+DATA.dimensions[top2[0]].icon+' '+DATA.dimensions[top2[0]].name+'」为核心引擎——'+h[top2[0]].high);
  if (norm[top2[0]]-norm[top2[1]] < 15) osParts.push('同时「'+DATA.dimensions[top2[1]].name+'」是你的副引擎——'+h[top2[1]].high);
  osParts.push('你的「'+DATA.dimensions[low2[0]].name+'」维度偏低——'+h[low2[0]].low);
  document.getElementById('rOs').textContent = osParts.join(' ');
  // 条形
  const bars = document.getElementById('rBars');
  bars.innerHTML = '';
  DIMS.forEach(d => {
    const [lv, col] = level(norm[d]);
    const row = document.createElement('div');
    row.className = 'bar-row';
    row.innerHTML = '<div class="lbl"><span>'+DATA.dimensions[d].icon+' '+DATA.dimensions[d].name+'</span><span class="lv" style="color:'+col+'">'+norm[d]+' · '+lv+'</span></div><div class="bar"><i style="width:'+norm[d]+'%;background:'+col+'"></i></div>';
    bars.appendChild(row);
  });
  document.getElementById('rTop').textContent = '核心优势：'+top2.map(d=>DATA.strengths[d]).join(' + ');
  document.getElementById('rLow').textContent = '盲区提醒：'+low2.map(d=>DATA.blinds[d]).join(' · ');
  document.getElementById('rDisclaimer').textContent = DATA.disclaimer;
  document.getElementById('quizCard').style.display = 'none';
  document.getElementById('resultCard').style.display = 'block';
  window.scrollTo({top:0, behavior:'smooth'});
}
function retry() {
  answers = new Array(DATA.questions.length).fill(-1); qi = 0;
  document.getElementById('quizCard').style.display = 'block';
  document.getElementById('resultCard').style.display = 'none';
  renderQ();
}

// Tab B 渲染
function renderStd() {
  const g = document.getElementById('stdGrid');
  g.innerHTML = '';
  DIMS.forEach(d => {
    const dm = DATA.dimensions[d];
    const c = document.createElement('div');
    c.className = 'std-card';
    c.innerHTML = '<h3>'+dm.icon+' '+dm.name+'</h3><p>'+dm.desc+'</p>';
    g.appendChild(c);
  });
  const cl = document.getElementById('caseList');
  cl.innerHTML = '';
  DATA.cases.forEach(cs => {
    const c = document.createElement('div');
    c.className = 'case';
    c.innerHTML = '<div class="ct">'+cs.title+'（'+cs.type+'）</div><div class="cs">'+cs.summary+'</div><div class="cq">内容池 '+cs.id+' · 质量 '+cs.q+' 分 · 关联维度 '+cs.dim+'</div>';
    cl.appendChild(c);
  });
}
renderStd();
renderQ();
</script>
