<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>认知功能记分卡 v2.0 · 测一测出结果</title>
<style>
  :root { --bg:#f4f2ee; --card:#fff; --ink:#2b2b2b; --accent:#5a7d9a; --muted:#8a857d; --bdr:#e5ddd0; --good:#3d7a5a; --warn:#b0523c; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--ink); padding:20px; }
  .wrap { max-width:880px; margin:0 auto; }
  h1 { font-size:22px; text-align:center; letter-spacing:1px; }
  .sub { color:var(--muted); font-size:13px; margin:8px 0 18px; line-height:1.7; text-align:center; }
  .tabs { display:flex; gap:8px; margin-bottom:16px; background:#e8eef2; border-radius:12px; padding:5px; }
  .tab { flex:1; padding:10px; text-align:center; border-radius:9px; font-size:14px; cursor:pointer; color:var(--muted); font-weight:600; }
  .tab.active { background:#fff; color:var(--accent); box-shadow:0 1px 6px rgba(0,0,0,.08); }
  .panel { display:none; } .panel.active { display:block; }
  .card { background:var(--card); border-radius:14px; padding:20px; box-shadow:0 2px 10px rgba(0,0,0,.05); margin-bottom:14px; }
  .q { margin-bottom:18px; }
  .q .qt { font-size:15px; font-weight:600; line-height:1.6; margin-bottom:10px; }
  .opt { display:block; width:100%; text-align:left; background:var(--bg); border:2px solid var(--bdr); border-radius:10px; padding:11px 14px; font-size:13px; color:var(--ink); cursor:pointer; margin-bottom:8px; line-height:1.5; transition:.12s; }
  .opt:hover { border-color:#a8bccd; }
  .opt.sel { border-color:var(--accent); background:#eef3f7; font-weight:600; }
  .next { display:block; width:100%; padding:12px; border:none; border-radius:10px; background:var(--accent); color:#fff; font-size:15px; font-weight:700; cursor:pointer; letter-spacing:2px; }
  .next:disabled { background:#c8d2da; cursor:not-allowed; }
  .rank-row { display:flex; align-items:center; gap:10px; margin-bottom:9px; }
  .rank-no { width:26px; height:26px; border-radius:50%; background:var(--accent); color:#fff; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; flex-shrink:0; }
  .rank-fn { width:130px; font-size:14px; font-weight:600; }
  .rank-bar { flex:1; height:10px; background:#efeae1; border-radius:5px; overflow:hidden; }
  .rank-bar > i { display:block; height:100%; border-radius:5px; background:var(--accent); }
  .rank-score { width:44px; text-align:right; font-size:13px; font-weight:700; color:var(--muted); }
  .main-fn { text-align:center; padding:14px; background:#eef3f7; border-radius:12px; margin-top:12px; }
  .main-fn .big { font-size:26px; font-weight:800; color:var(--accent); }
  .cell-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:12px; }
  @media(max-width:680px){ .cell-grid{ grid-template-columns:1fr; } }
  .cell { background:#faf7f1; border-radius:10px; padding:12px 14px; }
  .cell h3 { font-size:12px; color:var(--muted); margin-bottom:6px; }
  .cell p { font-size:13px; line-height:1.6; }
  .cell.power { border-left:3px solid var(--good); }
  .cell.side { border-left:3px solid var(--warn); }
  .case-quote { border-left:3px solid var(--accent); padding:10px 12px; background:#eef3f7; border-radius:0 8px 8px 0; font-size:13px; line-height:1.8; color:#4a5a6a; margin-top:12px; }
  .disclaimer { font-size:11px; color:var(--muted); background:#faf7f1; border-radius:8px; padding:10px 12px; line-height:1.7; margin-top:12px; }
  .std-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
  @media(max-width:720px){ .std-grid{ grid-template-columns:repeat(2,1fr); } }
  .std-card { background:#faf7f1; border-radius:10px; padding:12px; cursor:pointer; border:2px solid transparent; }
  .std-card.active { border-color:var(--accent); background:#eef3f7; }
  .std-card .emo { font-size:22px; } .std-card .fk { font-size:17px; font-weight:800; color:var(--accent); }
  .std-card .fn { font-size:11px; color:var(--muted); }
  .footer { text-align:center; color:var(--muted); font-size:12px; margin-top:22px; line-height:1.8; }
  .btn-sec { display:flex; gap:10px; margin-top:12px; }
  .btn-sec button { flex:1; padding:10px; border:none; border-radius:9px; font-size:13px; cursor:pointer; }
  .btn-retry { background:#e8eef2; color:#5a7d9a; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🧠 认知功能记分卡</h1>
  <div class="sub">8 题测一测 · 出你的认知功能排序（主功能 / 副功能 / 盲区）</div>
  <div class="tabs">
    <div class="tab active" id="tabA" onclick="switchTab('A')">🎯 测一测 · 出结果</div>
    <div class="tab" id="tabB" onclick="switchTab('B')">📚 标准记分卡 + 经典案例</div>
  </div>

  <div class="panel active" id="panelA">
    <div class="card" id="quizCard">
      <div class="sub" style="text-align:left;margin:0 0 12px;" id="qProgress">第 1/8 题 · 约 2 分钟</div>
      <div class="q" id="qBody"></div>
      <button class="next" id="nextBtn" disabled>下一题</button>
    </div>
    <div class="card" id="resultCard" style="display:none;">
      <div class="sub" style="margin:0;">你的认知功能排序</div>
      <div style="margin-top:10px;" id="rankList"></div>
      <div class="main-fn" id="mainFn"></div>
      <div class="cell-grid">
        <div class="cell power"><h3>⚡ 主功能超能力</h3><p id="mPower"></p></div>
        <div class="cell side"><h3>⚠️ 主功能副作用</h3><p id="mSide"></p></div>
        <div class="cell"><h3>🔍 盲区功能</h3><p id="mBlind"></p></div>
        <div class="cell"><h3>📌 经典案例</h3><p id="mCase"></p></div>
      </div>
      <div class="btn-sec">
        <button class="btn-retry" onclick="retry()">🔄 再测一次</button>
      </div>
      <div class="disclaimer" id="rDisclaimer"></div>
    </div>
  </div>

  <div class="panel" id="panelB">
    <div class="card">
      <div class="sub" style="margin:0 0 10px;">标准记分卡 · 8 功能档案（点击查看详情）</div>
      <div class="std-grid" id="stdGrid"></div>
    </div>
  </div>

  <div class="footer">
    认知功能记分卡 v2.0 · 荐荐（产品Hub）· 一次性交付 · 无支付依赖 · 2026-08-21<br>
    理论框架+内容池观测·非个体心理测量·SP 象限标注待数据
  </div>
</div>

<script>
const DATA = {"title": "认知功能记分卡 · 测一测", "estimated_time": "2分钟", "questions": [{"id": 1, "fn": "Fi", "text": "朋友做了一件「很成功但违背你价值观」的事，你会：", "options": [{"text": "心里咯噔一下——成功归成功，但我的直觉告诉我这不对", "scores": {"Fi": 3}}, {"text": "有点别扭，但理性想想也能理解ta的选择", "scores": {"Fi": 1}}, {"text": "恭喜ta——结果好就行，价值观各有各的", "scores": {"Fi": -2}}, {"text": "看具体情况，不轻易下判断", "scores": {"Fi": 0}}]}, {"id": 2, "fn": "Fe", "text": "一群人在场时，有个人被冷落了，你：", "options": [{"text": "第一时间注意到，会主动把话题引向ta", "scores": {"Fe": 3}}, {"text": "能感觉到气氛，但不确定要不要介入", "scores": {"Fe": 1}}, {"text": "没太注意，聊得开心就行", "scores": {"Fe": -2}}, {"text": "看ta自己的表现，不主动干预", "scores": {"Fe": 0}}]}, {"id": 3, "fn": "Ti", "text": "一个观点听起来很有道理，但你隐约觉得哪里不对，你会：", "options": [{"text": "逐条拆它的逻辑链，直到找到漏洞或确认它成立", "scores": {"Ti": 3}}, {"text": "先记下来，有空再推敲", "scores": {"Ti": 1}}, {"text": "感觉不对就存疑，但懒得深究", "scores": {"Ti": -1}}, {"text": "看是谁说的——信任的人说的就基本接受", "scores": {"Ti": -2}}]}, {"id": 4, "fn": "Te", "text": "团队目标混乱、大家各做各的，你会：", "options": [{"text": "主动梳理目标、分派任务、定deadline", "scores": {"Te": 3}}, {"text": "建议leader明确目标，但不主动牵头", "scores": {"Te": 1}}, {"text": "先做好自己那部分，别的管不了", "scores": {"Te": -2}}, {"text": "观察一下，等有人先动", "scores": {"Te": -1}}]}, {"id": 5, "fn": "Ni", "text": "一个热点突然爆火，你会：", "options": [{"text": "直觉告诉我这背后有更深的结构，不是表面那样", "scores": {"Ni": 3}}, {"text": "有点预感它会火，但不深究", "scores": {"Ni": 1}}, {"text": "大家转我就看，不琢磨", "scores": {"Ni": -2}}, {"text": "搜一下来龙去脉，搞清楚事实", "scores": {"Ni": 0}}]}, {"id": 6, "fn": "Ne", "text": "面对一个常规任务，你更容易：", "options": [{"text": "脑内自动冒出七八种不一样的解法/可能性", "scores": {"Ne": 3}}, {"text": "想到一两个变体思路，但不跑太远", "scores": {"Ne": 1}}, {"text": "按最稳妥的方式做，别节外生枝", "scores": {"Ne": -2}}, {"text": "先看别人怎么做，再决定", "scores": {"Ne": -1}}]}, {"id": 7, "fn": "Si", "text": "做一件以前做过的事（比如去某地、用某软件），你：", "options": [{"text": "自动调出上次的经验细节——怎么走最快、哪里是坑", "scores": {"Si": 3}}, {"text": "记得大概，边走边想", "scores": {"Si": 1}}, {"text": "每次都像第一次，凭当下感觉来", "scores": {"Si": -2}}, {"text": "看有没有更新更好的方式再说", "scores": {"Si": -1}}]}, {"id": 8, "fn": "Se", "text": "在陌生的现场环境（新城市/新场合），你：", "options": [{"text": "瞬间进入状态——眼睛耳朵全开，抓住眼前的一切", "scores": {"Se": 3}}, {"text": "先观察熟悉一下，再放开", "scores": {"Se": 1}}, {"text": "不太关注环境，想自己的事", "scores": {"Se": -2}}, {"text": "有点不安，需要先找熟悉感", "scores": {"Se": -1}}]}], "funcs": {"Fi": {"name": "内向情感", "emoji": "💖", "power": "价值雷达·0.3秒情感检测——瞬间知道\"这事对不对我的真心\"", "side": "太把感受当证据·容易内耗", "trigger": "当一件事违背我的价值观时", "blind": "回避逻辑交锋·把\"不喜欢\"说成\"不合适\"", "motto": "我宁愿慢，也不愿假", "case": "大提琴老师转行卖馒头（D21-B12·9分）·\"敢在应该和想要之间选后者\""}, "Fe": {"name": "外向情感", "emoji": "🤝", "power": "气氛雷达·0.3秒读懂全场情绪——知道谁需要被接住", "side": "过度迎合·把别人情绪背在自己身上", "trigger": "当一群人需要被照顾时", "blind": "压抑自己的需求·讨好到枯竭", "motto": "我在意我们，不只是我", "case": "四个儿子争着养95岁老母亲（D21-B8·8.9分）·\"被争着养，从来不是钱的问题\""}, "Ti": {"name": "内向思考", "emoji": "🧩", "power": "逻辑解剖刀·把任何混乱拆成干净的结构", "side": "过度分析·陷入\"为什么\"循环", "trigger": "当遇到逻辑矛盾时", "blind": "忽略情绪因素·把人都当变量", "motto": "先搞懂，再行动", "case": "取消实体按键是昂贵的极简主义（D20-B8·8.8分）·\"Ti系统从一开始就知道答案\""}, "Te": {"name": "外向思考", "emoji": "📊", "power": "效率裁判·0.3秒判断\"这事值不值得\"·执行力引擎", "side": "目标导向到忽略人·把关系KPI化", "trigger": "当目标不清晰时立刻建立秩序", "blind": "难以理解\"没有用的热爱\"", "motto": "结果说话", "case": "车企逃离发布会（D21-B7·9分）·\"真正的对手不在你盯着的那张名单上\""}, "Ni": {"name": "内向直觉", "emoji": "🔮", "power": "模式识别·0.3秒看穿表象背后的真相", "side": "过度笃定自己的判断·无视反证", "trigger": "当现象与本质脱钩时", "blind": "很难解释\"我就是知道\"", "motto": "表象都是障眼法", "case": "韩国冰奶在韩国查无此物（D21-B6·9分）·\"我们抢的不是那杯奶\""}, "Ne": {"name": "外向直觉", "emoji": "🎲", "power": "可能性穷举·一个点炸出一片可能性·好奇心引擎", "side": "三分钟热度·选择困难", "trigger": "当遇到新信息时自动联想", "blind": "难以落地·不擅收尾", "motto": "世界是一盒没拆完的巧克力", "case": "河南钻石把英伟达馋哭（D21-B10·8.8分）·\"拆出真正让人好奇的暗线\""}, "Si": {"name": "内向实感", "emoji": "🗂️", "power": "经验数据库·规则手册·稳定可靠·细节记忆王", "side": "路径依赖·抗拒变化", "trigger": "当环境与熟悉模式不同时", "blind": "对新事物本能怀疑", "motto": "稳定就是力量", "case": "ISFJ第三次犯错的\"全息录像\"（D17-B2·8.8分）·\"Si系统自动调出前两次摔坑的记录\""}, "Se": {"name": "外向实感", "emoji": "⚡", "power": "现场雷达·0.3秒捕捉当下一切·行动反应快", "side": "冲动·难以忍受无聊", "trigger": "当眼前有刺激或机会时", "blind": "难以延迟满足", "motto": "先做了再说", "case": "SP象限叙事（待画像数据·ESC-08-17-1）·\"感官现场优先\""}}, "disclaimer": "诚实标注：本卡为荣格认知功能理论框架的娱乐化解读（8题·每功能1题），结合内容池旗舰叙事。不等同于个体心理测量结果，不构成人格诊断。SP 象限部分叙事待画像数据补足（ESC-08-17-1）。"};
const QS = DATA.questions, FUNCS = DATA.funcs;
const FKEYS = Object.keys(FUNCS);
let answers = new Array(QS.length).fill(-1);
let qi = 0;

function switchTab(t) {
  document.getElementById('tabA').classList.toggle('active', t==='A');
  document.getElementById('tabB').classList.toggle('active', t==='B');
  document.getElementById('panelA').classList.toggle('active', t==='A');
  document.getElementById('panelB').classList.toggle('active', t==='B');
}

function renderQ() {
  const q = QS[qi];
  document.getElementById('qProgress').textContent = '第 '+(qi+1)+'/'+QS.length+' 题 · 约 2 分钟';
  const body = document.getElementById('qBody');
  body.innerHTML = '<div class="qt">'+(qi+1)+'. '+q.text+'</div>';
  q.options.forEach((o, oi) => {
    const b = document.createElement('button');
    b.className = 'opt' + (answers[qi]===oi ? ' sel' : '');
    b.textContent = o.text;
    b.onclick = () => {
      answers[qi] = oi;
      body.querySelectorAll('.opt').forEach(x => x.classList.remove('sel'));
      b.classList.add('sel');
      document.getElementById('nextBtn').disabled = false;
    };
    body.appendChild(b);
  });
  document.getElementById('nextBtn').disabled = answers[qi] < 0;
  document.getElementById('nextBtn').textContent = qi === QS.length-1 ? '✨ 查看我的记分卡' : '下一题';
}
document.getElementById('nextBtn').onclick = () => {
  if (qi < QS.length-1) { qi++; renderQ(); } else { calc(); }
};

function calc() {
  const raw = {}; FKEYS.forEach(k => raw[k]=0);
  QS.forEach((q, i) => {
    const opt = q.options[answers[i]];
    for (const [k, s] of Object.entries(opt.scores)) raw[k]+=s;
  });
  const norm = {}; FKEYS.forEach(k => norm[k] = Math.max(1, Math.min(99, Math.round((raw[k]+3)/6*100))));
  const ranked = [...FKEYS].sort((a,b)=>norm[b]-norm[a]);
  const list = document.getElementById('rankList');
  list.innerHTML = '';
  ranked.forEach((k, i) => {
    const row = document.createElement('div');
    row.className = 'rank-row';
    row.innerHTML = '<div class="rank-no">'+(i+1)+'</div><div class="rank-fn">'+FUNCS[k].emoji+' '+FUNCS[k].name+'</div><div class="rank-bar"><i style="width:'+norm[k]+'%"></i></div><div class="rank-score">'+norm[k]+'</div>';
    list.appendChild(row);
  });
  const main = ranked[0], blind = ranked[ranked.length-1];
  document.getElementById('mainFn').innerHTML = '主功能：<span class="big">'+FUNCS[main].emoji+' '+FUNCS[main].name+'</span> · 盲区功能：'+FUNCS[blind].emoji+' '+FUNCS[blind].name;
  document.getElementById('mPower').textContent = FUNCS[main].power;
  document.getElementById('mSide').textContent = FUNCS[main].side;
  document.getElementById('mBlind').textContent = FUNCS[blind].name + '：' + FUNCS[blind].blind;
  document.getElementById('mCase').textContent = FUNCS[main].case;
  document.getElementById('rDisclaimer').textContent = DATA.disclaimer;
  document.getElementById('quizCard').style.display = 'none';
  document.getElementById('resultCard').style.display = 'block';
  window.scrollTo({top:0, behavior:'smooth'});
}
function retry() {
  answers = new Array(QS.length).fill(-1); qi = 0;
  document.getElementById('quizCard').style.display = 'block';
  document.getElementById('resultCard').style.display = 'none';
  renderQ();
}

function renderStd() {
  const g = document.getElementById('stdGrid');
  g.innerHTML = '';
  FKEYS.forEach((k, i) => {
    const f = FUNCS[k];
    const c = document.createElement('div');
    c.className = 'std-card' + (i===0 ? ' active' : '');
    c.id = 'std'+k;
    c.innerHTML = '<div class="emo">'+f.emoji+'</div><div class="fk">'+k+'</div><div class="fn">'+f.name+'</div>';
    c.onclick = () => showStd(k);
    g.appendChild(c);
  });
}
let selectedStd = 'Fi';
function showStd(k) {
  selectedStd = k;
  document.querySelectorAll('.std-card').forEach(x => x.classList.remove('active'));
  document.getElementById('std'+k).classList.add('active');
  const f = FUNCS[k];
  alert('💖 '+f.name+'（'+k+'）\n\n⚡ 超能力：'+f.power+'\n⚠️ 副作用：'+f.side+'\n🔍 触发：'+f.trigger+'\n🚫 盲区：'+f.blind+'\n📌 座右铭：「'+f.motto+'」\n\n案例：'+f.case);
}
renderStd();
renderQ();
</script>
</body>
</html>
