<title>产品池 · 实时数据</title>
<style>
:root{--bg:#080b11;--surface:#111620;--surface2:#161b26;--border:#212836;--fg:#e1e4eb;--muted:#6e7687;--accent:#6366f1;--accent2:#8b5cf6;--green:#22c55e;--yellow:#eab308;--red:#ef4444;--orange:#f97316;--cyan:#06b6d4;--blue:#60a5fa}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:14px/1.5 system-ui,-apple-system,sans-serif;padding:16px;max-width:1600px;margin:0 auto}
a{color:var(--accent)}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px}
.top h1{font-size:16px;display:flex;align-items:center;gap:8px}
.top .sub{font-size:11px;color:var(--muted)}
.top .live{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--green)}
.live .dot{width:8px;height:8px;background:var(--green);border-radius:50%;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.banner{background:#3a1d1d;border:1px solid #5c2a2a;border-radius:8px;padding:10px 14px;font-size:12px;margin-bottom:12px;color:#fca5a5;white-space:pre-wrap}
.banner.warn{background:#3a2a1d;border-color:#5c4a2a;color:#fcd34d}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px;text-align:center}
.stat .val{font-size:20px;font-weight:700;line-height:1.2}
.stat .lbl{font-size:10px;color:var(--muted);margin-top:2px}
.stat.crit .val{color:var(--red)}
.stat.ok .val{color:var(--green)}
.stat.warn .val{color:var(--yellow)}
.tabs{display:flex;gap:8px;margin-bottom:14px;border-bottom:1px solid var(--border)}
.tab{background:none;border:none;border-bottom:2px solid transparent;color:var(--muted);padding:10px 16px;font-size:13px;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:6px}
.tab:hover{color:var(--fg)}
.tab.active{color:var(--fg);border-bottom-color:var(--accent);font-weight:600}
.tab .tcount{font-size:10px;background:var(--surface2);color:var(--muted);border-radius:10px;padding:1px 8px}
.tab.active .tcount{background:var(--accent);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px;cursor:pointer;transition:all .15s;display:flex;flex-direction:column;gap:10px}
.card:hover{border-color:var(--accent);transform:translateY(-1px)}
.card .pkey{font-size:10px;color:var(--muted);font-family:ui-monospace,monospace}
.card .name{font-size:15px;font-weight:700;line-height:1.4}
.card .price{font-size:20px;font-weight:700;color:var(--accent)}
.card .price .reg{font-size:12px;color:var(--muted);font-weight:400;text-decoration:line-through;margin-left:6px}
.badges{display:flex;flex-wrap:wrap;gap:4px}
.badge{font-size:9px;padding:2px 7px;border-radius:10px;border:1px solid var(--border);color:var(--muted);white-space:nowrap}
.badge.active{background:#0d2b16;color:var(--green);border-color:var(--green)}
.badge.dev{background:#3a2a1d;color:var(--orange);border-color:var(--orange)}
.badge.concept{background:#1a1f2e;color:var(--blue);border-color:var(--blue)}
.badge.blocked{background:#3a1d1d;color:var(--red);border-color:var(--red)}
.badge.p1{background:#3a1d1d;color:var(--red);border-color:var(--red)}
.badge.p2{background:#3a2a1d;color:var(--orange);border-color:var(--orange)}
.kv{display:flex;flex-wrap:wrap;gap:8px;font-size:10px;color:var(--muted)}
.kv b{color:var(--fg);font-weight:600}
.kv .cell{background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:4px 8px}
.progress{height:6px;background:var(--surface2);border-radius:3px;overflow:hidden}
.progress .bar{height:100%;background:linear-gradient(90deg,var(--orange),var(--accent));border-radius:3px}
.blocklist{font-size:10px;color:var(--red);line-height:1.5}
.empty{grid-column:1/-1;background:var(--surface);border:1px dashed var(--border);border-radius:10px;padding:40px;text-align:center;color:var(--muted)}
.empty .icon{font-size:40px;margin-bottom:8px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-start;justify-content:center;z-index:100;padding:30px;overflow-y:auto}
.modal-bg.open{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:12px;max-width:720px;width:100%;padding:20px;margin:auto}
.modal h2{font-size:15px;margin-bottom:10px;line-height:1.5}
.modal .field{margin-bottom:10px;font-size:12px}
.modal .field .k{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.5px;margin-bottom:2px}
.modal .field .v{white-space:pre-wrap;line-height:1.6}
.modal .close{float:right;background:var(--surface2);border:1px solid var(--border);color:var(--fg);border-radius:6px;padding:4px 10px;cursor:pointer;font-size:12px}
table.mini{width:100%;border-collapse:collapse;font-size:11px}
table.mini th{color:var(--muted);text-align:left;padding:4px 8px;border-bottom:1px solid var(--border);font-weight:500}
table.mini td{padding:4px 8px;border-bottom:1px solid var(--border)}
.sec-title{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:14px 0 8px}
</style>
</head>

  document.getElementById('directions-count').textContent = '('+directions.length+' 个)';
  const frozen = rd.frozen_bucket!=null?('¥'+nf(rd.frozen_bucket)):'—';
  const stagnant = ps.stagnant_hours!=null?fmtHrs(ps.stagnant_hours):'—';
  document.getElementById('stats').innerHTML = `
    <div class="stat"><div class="val">${total}</div><div class="lbl">产品总数</div></div>
    <div class="stat ok"><div class="val">${finished.length}</div><div class="lbl">成品产品</div></div>
    <div class="stat warn"><div class="val">${directions.length}</div><div class="lbl">产品方向</div></div>
    <div class="stat crit"><div class="val">${frozen}</div><div class="lbl">产研桶冻结（${rd.frozen_days!=null?rd.frozen_days+'天':'—'}）</div></div>
    <div class="stat crit"><div class="val">${stagnant}</div><div class="lbl">支付停滞</div></div>
    <div class="stat"><div class="val" style="font-size:14px">${esc(nf(d.batch))}</div><div class="lbl">最新批次</div></div>
    <div class="stat"><div class="val">${esc(nf(hi.d21_health!=null?hi.d21_health:hi.d18_health))}</div><div class="lbl">今日健康分</div></div>
    <div class="stat"><div class="val" style="font-size:12px">¥${nf(ps.confirmed_revenue)}</div><div class="lbl">确认营收</div></div>
  `;
  document.getElementById('live-info').textContent = total+' 个产品 · '+(d.batch||'');
  const b = document.getElementById('banner');
  const parts=[];
  if(ps.stagnant_hours) parts.push('🔴 支付停滞 '+fmtHrs(ps.stagnant_hours)+' · '+(ps.thresholds_breached?.length||0)+' 个阈值已破 · 不可逆防线 8/27 23:00 倒计时');
  if(ps.plan_c_delayed_hours) parts.push('🔴 Plan C 裁决已出 ~'+fmtHrs(ps.plan_c_delayed_hours)+' 但执行零 · ¥500 未释放');
  if(rd.frozen_bucket) parts.push('🟠 产研桶 ¥'+rd.frozen_bucket+' 冻结 '+rd.frozen_days+' 天');
  if(hi.key_risk) parts.push('⚠️ '+hi.key_risk.slice(0,200));
  if(parts.length){
    b.innerHTML = '<div class="banner">'+parts.map(esc).join('\n')+'</div>';
  } else {
    b.innerHTML = '';
  }
}

function renderFinished(list){
  const grid = document.getElementById('finished-grid');
  document.getElementById('finished-empty').style.display = list.length?'none':'block';
  if(!list.length){grid.innerHTML='';return}
  grid.innerHTML = list.map(p=>{
    const cvr = p.overall_cvr_estimated;
    const refund = p.refund_rate;
    const share = p.personality_revenue_share||{};
    const topShare = Object.entries(share).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([k,v])=>k+' '+(v*100).toFixed(0)+'%').join(' · ');
    return `<div class="card" onclick="openModal('${esc(p.key)}')">
      <div class="pkey">${esc(p.key)} · ${esc(p.status||'')} · 收入贡献 ${fmtPct(p.revenue_contribution_pct)}</div>
      <div class="name">${esc(p.name)}</div>
      <div class="price">¥${esc(p.price)}</div>
      <div class="badges">${lifecycleBadge(p)}<span class="badge active">在售</span></div>
      <div class="kv">
        <span class="cell">整体CVR <b>${fmtPct(cvr)}</b></span>
        <span class="cell">退款率 <b>${fmtPct(refund)}</b></span>
      </div>
      ${topShare?'<div class="kv"><span class="cell">收入主力 <b>'+esc(topShare)+'</b></span></div>':''}
    </div>`;
  }).join('');
}

function renderDirections(list){
  const grid = document.getElementById('directions-grid');
  document.getElementById('directions-empty').style.display = list.length?'none':'block';
  if(!list.length){grid.innerHTML='';return}
  grid.innerHTML = list.map(p=>{
    const lc = p.lifecycle||'';
    const price = p.price!=null?('¥'+p.price):(p.price_range?('¥'+p.price_range[0]+'–'+p.price_range[1]):'—');
    const reg = p.regular_price?('<span class="reg">¥'+p.regular_price+'</span>'):'';
    const pr = p.priority?('<span class="badge '+(p.priority==='P1'?'p1':'p2')+'">'+esc(p.priority)+'</span>'):'';
    const targets = (p.target_personalities||[]).map(t=>'<span class="cell">'+esc(t)+'</span>').join('');
    const blocked = p.blocked_by || (p.activation_blocked_by||[]);
    let blockedHtml='';
    if(typeof blocked==='string' && blocked){blockedHtml='<div class="blocklist">🔒 '+esc(blocked)+'</div>';}
    else if(Array.isArray(blocked) && blocked.length){blockedHtml='<div class="blocklist">🔒 '+blocked.map(esc).join(' · ')+'</div>';}
    const pct = p.completion_pct;
    const progress = (pct!=null)?('<div class="progress"><div class="bar" style="width:'+pct+'%"></div></div>'):'';
    return `<div class="card" onclick="openModal('${esc(p.key)}')">
      <div class="pkey">${esc(p.key)} · ${esc(p.status||'')}</div>
      <div class="name">${esc(p.name)}</div>
      <div class="price">${price}${reg}</div>
      <div class="badges">${lifecycleBadge(p)}${pr}${pct!=null?'<span class="badge dev">完成度 '+pct+'%</span>':''}</div>
      ${progress}
      ${targets?'<div class="kv">'+targets+'</div>':''}
      ${blockedHtml}
    </div>`;
  }).join('');
}

function field(k,v){return '<div class="field"><div class="k">'+esc(k)+'</div><div class="v">'+esc(v)+'</div></div>'}
function table(rows){return '<table class="mini">'+rows.map(r=>'<tr>'+r.map(c=>'<td>'+esc(c)+'</td>').join('')+'</tr>').join('')+'</table>'}

function openModal(key){
  const p = (DATA.finished||[]).concat(DATA.directions||[]).find(x=>x.key===key);
  if(!p) return;
  document.getElementById('modal-bg').classList.add('open');
  document.getElementById('m-title').textContent = (p.key||'')+' · '+(p.name||'');
  document.getElementById('m-badges').innerHTML = lifecycleBadge(p)+
    (p.priority?'<span class="badge '+(p.priority==='P1'?'p1':'p2')+'">'+esc(p.priority)+'</span>':'')+
    (p.price!=null?'<span class="badge">¥'+esc(p.price)+'</span>':'');
  const rows=[];
  if(p.regular_price) rows.push(['原价','¥'+p.regular_price]);
  if(p.price_range) rows.push(['价格区间','¥'+p.price_range[0]+' – ¥'+p.price_range[1]]);
  if(p.status) rows.push(['状态',p.status]);
  if(p.lifecycle) rows.push(['生命周期',p.lifecycle]);
  if(p.completion_pct!=null) rows.push(['完成度',p.completion_pct+'%']);
  if(p.overall_cvr_estimated!=null) rows.push(['整体 CVR',fmtPct(p.overall_cvr_estimated)]);
  if(p.revenue_contribution_pct!=null) rows.push(['收入贡献',fmtPct(p.revenue_contribution_pct)]);
  if(p.refund_rate!=null) rows.push(['退款率',fmtPct(p.refund_rate)+(p.refund_rate_status?'（'+p.refund_rate_status+'）':'')]);
  if(p.expected_upgrade_rate!=null) rows.push(['预期升级率',fmtPct(p.expected_upgrade_rate)]);
  if(p.cumulative_internal_upgrades!=null) rows.push(['内部升级累计',p.cumulative_internal_upgrades+' 单 / ¥'+(p.cumulative_internal_revenue||0)]);
  if(p.target_market!=null) rows.push(['目标市场',p.target_market]);
  if(p.expected_arpu!=null) rows.push(['预期 ARPU','¥'+p.expected_arpu]);
  if(p.required_plan_c_release!=null) rows.push(['Plan C 需释放','¥'+p.required_plan_c_release]);
  if(p.batch_evaluation!=null) rows.push(['批次评估','第 '+p.batch_evaluation+' 批']);

  let html = rows.map(r=>field(r[0],r[1])).join('');

  if(p.personality_cvr){
    html += '<div class="sec-title">分人格 CVR</div>';
    html += table([['人格','CVR'],...Object.entries(p.personality_cvr).map(([k,v])=>[k,fmtPct(v)])]);
  }
  if(p.personality_revenue_share){
    html += '<div class="sec-title">分人格收入占比</div>';
    html += table([['人格','占比'],...Object.entries(p.personality_revenue_share).map(([k,v])=>[k,fmtPct(v)])]);
  }
  if(p.upgrade_by_personality_expected){
    html += '<div class="sec-title">分人格预期升级率</div>';
    html += table([['人格','预期'],...Object.entries(p.upgrade_by_personality_expected).map(([k,v])=>[k,fmtPct(v)])]);
  }
  if(p.top_refund_reasons && p.top_refund_reasons.length){
    html += '<div class="sec-title">Top 退款原因</div>';
    html += table([['原因','占比'],...p.top_refund_reasons.map(r=>[r.reason,fmtPct(r.pct)])]);
  }
  if(p.target_personalities && p.target_personalities.length){
    html += '<div class="sec-title">目标人格</div><div class="v">'+esc(p.target_personalities.join(' · '))+'</div>';
  }
  const blocked = p.blocked_by || p.activation_blocked_by;
  if(blocked){
    const bl = Array.isArray(blocked)?blocked:[blocked];
    html += '<div class="sec-title">卡点 / 阻塞</div>'+bl.map(x=>'<div class="field"><div class="v" style="color:var(--red)">🔒 '+esc(x)+'</div></div>').join('');
  }
  if(p.purchase_page_status) html += field('购买页状态', p.purchase_page_status);
  if(!rows.length && !p.personality_cvr) html += '<div class="field"><div class="v">（无额外字段）</div></div>';
  document.getElementById('m-body').innerHTML = html;
}

function closeModal(){document.getElementById('modal-bg').classList.remove('open')}
function switchTab(tab){
  document.getElementById('tab-finished').classList.toggle('active', tab==='finished');
  document.getElementById('tab-directions').classList.toggle('active', tab==='directions');
  document.getElementById('panel-finished').style.display = tab==='finished'?'':'none';
  document.getElementById('panel-directions').style.display = tab==='directions'?'':'none';
}
document.getElementById('modal-bg').addEventListener('click',e=>{if(e.target.id==='modal-bg')closeModal()});
document.getElementById('tab-finished').addEventListener('click', ()=>switchTab('finished'));
document.getElementById('tab-directions').addEventListener('click', ()=>switchTab('directions'));
load();
</script>
</body>
</html>
